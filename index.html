<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudos Oracle SQL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7; --surface:#ffffff; --ink:#14243a; --muted:#5b6b82; --line:#d3dbe6;
  --navy:#0f2f5c; --navy-ink:#ffffff; --amber:#e39a00; --amber-ink:#975a00; --amber-soft:#fff3d6;
  --err:#b3261e; --err-soft:#fbe9e7; --ok:#1f6f43; --ok-soft:#e5f3ea;
  --code-bg:#f3f6fa; --front:#e7eef8;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1622; --surface:#16212f; --ink:#e3e9f2; --muted:#9aa9bd; --line:#2a3a4f;
    --navy:#24508f; --navy-ink:#ffffff; --amber:#f2b33d; --amber-ink:#f2b33d; --amber-soft:#3a2e12;
    --err:#ff8a80; --err-soft:#3b1d1b; --ok:#7fd3a2; --ok-soft:#173326;
    --code-bg:#0f1824; --front:#1c2b3e; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0e1622; --surface:#16212f; --ink:#e3e9f2; --muted:#9aa9bd; --line:#2a3a4f;
    --navy:#24508f; --navy-ink:#ffffff; --amber:#f2b33d; --amber-ink:#f2b33d; --amber-soft:#3a2e12;
    --err:#ff8a80; --err-soft:#3b1d1b; --ok:#7fd3a2; --ok-soft:#173326;
    --code-bg:#0f1824; --front:#1c2b3e; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
code,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink);padding:12px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.2px}
header.top p{margin:0;font-size:.85rem;opacity:.75}
.layout{display:grid;grid-template-columns:270px 1fr;gap:0;max-width:1240px;margin:0 auto}
nav.mods{padding:20px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 60px)}
nav.mods h2{font-size:.85rem;color:var(--muted);font-weight:600;margin:0 6px 10px}
.modbtn{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 10px;color:var(--ink);margin-bottom:4px}
.modbtn:hover{background:var(--front)}
.modbtn[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--amber)}
.modbtn .mid{font-weight:700;color:var(--navy)}
:root[data-theme="dark"] .modbtn .mid{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modbtn .mid{color:var(--amber)}}
.modbtn .mt{display:block;font-size:.9rem}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .o{background:var(--ok)} .bar .e{background:var(--err)}
.modbtn .stat{font-size:.75rem;color:var(--muted);margin-top:3px}
main{padding:22px 26px 60px;min-width:0}
.mhead h2{margin:0 0 4px;font-size:1.55rem;line-height:1.2}
.mhead .sub{color:var(--muted);font-size:.92rem;margin:0 0 16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:7px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.mapwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;padding:10px}
.mapsvg{display:block;width:100%;min-width:960px;height:auto}
.hint{color:var(--muted);font-size:.9rem;margin:10px 2px}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.filters label{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.filters select{font:inherit;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
details.ref{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px}
details.ref summary{cursor:pointer;font-weight:600;font-size:.92rem}
details.ref pre{margin:8px 0 2px}
.deck{max-width:820px}
.counter{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.88rem;margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.front{background:var(--front);padding:20px 22px;cursor:pointer;min-height:120px}
.front .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:.8rem;color:var(--muted)}
.cid{background:var(--navy);color:var(--navy-ink);border-radius:5px;padding:1px 7px;font-weight:700;font-size:.78rem}
.mark{border-radius:5px;padding:1px 7px;font-weight:600;font-size:.78rem}
.mark.e{background:var(--err-soft);color:var(--err)} .mark.o{background:var(--ok-soft);color:var(--ok)}
.term{font-size:1.45rem;font-weight:700;color:var(--navy);line-height:1.25}
:root[data-theme="dark"] .term{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .term{color:var(--ink)}}
.q{font-size:1.12rem;font-weight:600}
.tapflip{margin-top:14px;font-size:.85rem;color:var(--muted)}
.back{padding:18px 22px 6px;border-top:2px dashed var(--line);display:none}
.card.flipped .back{display:block}
.card.flipped .tapflip{display:none}
.lab{font-size:.78rem;font-weight:700;color:var(--muted);margin:12px 0 3px}
.lab:first-child{margin-top:0}
.lab.t{color:var(--err)}
.trap{color:var(--err)}
.pt{font-weight:700;color:var(--amber-ink);font-size:1.1rem}
.res{font-weight:700;font-size:1.2rem;color:var(--navy)}
:root[data-theme="dark"] .res{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .res{color:var(--amber)}}
pre{background:var(--code-bg);border-left:3px solid var(--navy);padding:9px 12px;margin:4px 0 0;font-size:.86rem;line-height:1.45;overflow-x:auto;white-space:pre;border-radius:0 6px 6px 0}
.front pre{background:var(--surface);font-size:.92rem}
code{background:var(--code-bg);padding:0 3px;border-radius:3px;font-size:.92em}
.tag{display:inline-block;margin-top:12px;font-size:.82rem;font-weight:600;padding:3px 8px;border-radius:6px}
.tag.w{background:var(--err-soft);color:var(--err)} .tag.x{background:var(--ok-soft);color:var(--ok)}
.rel{font-size:.88rem;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:10px;padding:14px 22px 18px;flex-wrap:wrap}
.actions button{border-radius:9px;padding:10px 16px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.actions .flip{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);flex:1}
.actions .bad{background:var(--err-soft);color:var(--err);border-color:transparent;flex:1}
.actions .good{background:var(--ok-soft);color:var(--ok);border-color:transparent;flex:1}
.navrow{display:flex;justify-content:space-between;margin-top:10px}
.navrow button,.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;color:var(--muted)}
.keys{font-size:.8rem;color:var(--muted);margin-top:14px}
.reset{margin-top:28px;font-size:.85rem}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.mods{min-height:0;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px}
  nav.mods h2{display:none}
  .modbtn{min-width:210px;margin:0;background:var(--surface)}
  main{padding:18px 14px 50px}
  .front,.back{padding-left:16px;padding-right:16px}
  .actions{padding:12px 16px 16px}
}
@media (prefers-reduced-motion: no-preference){ .card.flipped .back{animation:open .18s ease-out} @keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1}} }
</style>
<style>
:root{--p-title:#002b5c;--p-badge:#002b5c;--p-front:#eaf0f8;--p-card:#ffffff;--p-line:#c8d0dc;--p-dash:#9aa8bd;--p-lab:#5b6b82;--p-orange:#b06d00;--p-amberline:#f0a500;--p-err:#b3261e;--p-trap:#7a1d17;--p-ok:#1f6f43;--p-code:#f5f7fa;--p-code2:#e8edf5;--p-rel:#666666;--p-ink:#1d2433}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--p-title:#cfe0ff;--p-badge:#24508f;--p-front:#1c2b3e;--p-card:#16212f;--p-line:#2a3a4f;--p-dash:#4a5d78;--p-lab:#9aa9bd;--p-orange:#f2b33d;--p-amberline:#f0a500;--p-err:#ff8a80;--p-trap:#ffb4ab;--p-ok:#7fd3a2;--p-code:#0f1824;--p-code2:#22324a;--p-rel:#9aa9bd;--p-ink:#e3e9f2}}
:root[data-theme="dark"]{--p-title:#cfe0ff;--p-badge:#24508f;--p-front:#1c2b3e;--p-card:#16212f;--p-line:#2a3a4f;--p-dash:#4a5d78;--p-lab:#9aa9bd;--p-orange:#f2b33d;--p-amberline:#f0a500;--p-err:#ff8a80;--p-trap:#ffb4ab;--p-ok:#7fd3a2;--p-code:#0f1824;--p-code2:#22324a;--p-rel:#9aa9bd;--p-ink:#e3e9f2}
.deck,.legend{font-family:"DejaVu Sans",Verdana,Geneva,sans-serif;font-size:15px;color:var(--p-ink)}
.deck{max-width:860px}
.card{background:var(--p-card);border:1px solid var(--p-line);border-radius:5px;margin-bottom:10px}
.card .front{background:var(--p-front);padding:9px 13px;min-height:0;border-bottom:2px dashed var(--p-dash);cursor:pointer}
.card .back{padding:9px 13px 11px;line-height:1.42;border-top:0}
.card .meta{margin-bottom:6px}
.card .meta:empty{display:none}
.num{display:inline-block;font-size:.78rem;color:#fff;background:var(--p-badge);border-radius:3px;padding:1px 6px;margin-right:8px;font-weight:700;vertical-align:2px}
.en{font-size:1.3rem;font-weight:700;color:var(--p-title)}
.q{font-weight:700;font-size:1rem}
.txt{margin-top:1px}
.pt{font-weight:700;color:var(--p-orange);font-size:1.08rem;margin-bottom:2px}
.lab{font-size:.72rem;font-weight:700;color:var(--p-lab);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 1px}
.lab.t{color:var(--p-err)}
.trap{color:var(--p-trap)}
.rel{font-size:.86rem;color:var(--p-rel);font-style:italic;margin-top:5px}
.card pre,.refbox pre{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:.84rem;background:var(--p-code);border-left:3px solid var(--p-dash);padding:6px 9px;margin:4px 0 0;white-space:pre-wrap;border-radius:0;color:var(--p-ink)}
.card .front pre{background:var(--p-card);margin-top:7px}
.card code{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:.88em;background:var(--p-code2);padding:0 2px}
.tag{display:inline-block;margin:0 0 0 6px;font-size:.8rem;font-weight:700;background:none !important;padding:0}
.tag.w{color:var(--p-err)} .tag.x{color:var(--p-ok)}
.res{font-weight:700;color:var(--p-title);font-size:1.1rem}
.tapflip{margin-top:8px;font-size:.8rem}
.sech{color:var(--p-title);font-size:1.15rem;border-bottom:2px solid var(--p-amberline);padding-bottom:3px;margin:22px 0 10px}
.sech:first-child{margin-top:4px}
.sech span{font-size:.8rem;color:var(--p-rel);font-weight:400}
.subh{color:var(--p-orange);font-size:1rem;margin:16px 0 7px}
.legend{font-size:.85rem;color:var(--muted);margin:0 0 12px;max-width:860px;line-height:1.45}
.legend b.w{color:var(--p-err)} .legend b.x{color:var(--p-ok)}
.refbox{margin:0 0 12px;font-size:.92rem}
.actions{border-top:1px solid var(--p-line)}

.mmtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;max-width:1000px}
.mmbtns{display:flex;gap:8px}
.mmcenter{background:var(--p-badge);color:#fff;border-radius:10px;padding:14px 18px;text-align:center;margin-bottom:14px;max-width:1000px;font-family:"DejaVu Sans",Verdana,sans-serif}
.mmct{font-size:1.3rem;font-weight:700} .mmcs{font-size:.92rem;opacity:.9;margin-top:2px}
.mmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start;max-width:1000px;font-family:"DejaVu Sans",Verdana,sans-serif}
.mmb{background:var(--p-card);border:1px solid var(--p-line);border-radius:6px;overflow:hidden}
.mmh{display:grid;grid-template-columns:1fr auto;width:100%;border:0;color:#fff;text-align:left;padding:10px 12px;cursor:pointer}
.mmt{font-weight:700;font-size:1.02rem;grid-column:1} .mmc{font-size:.8rem;opacity:.92;grid-column:1}
.mmi{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:1.1rem;transition:transform .15s}
.mmb.open .mmi{transform:rotate(180deg)}
.mml{margin:0;padding:10px 14px 12px 30px;font-size:.93rem;line-height:1.5;color:var(--p-ink)}
.mml li{margin:3px 0}
.mmb:not(.open) .mml{display:none}
@media (max-width:820px){.mmgrid{grid-template-columns:1fr}}
</style>

<header class="top"><h1>Estudos Oracle SQL</h1><p>Curso DBAOCM · material de uso pessoal</p></header>

<script id="data" type="application/json">[{"id": "M01", "title": "Selecionando, restringindo e ordenando dados", "ref": "Tabela de referência CARROS", "reftxt": " ID  MARCA      MODELO  ANO   PRECO   COR\n --  ---------  ------  ----  ------  --------\n  1  Ford       Ka      2019   45000  Preto\n  2  Ford       Ranger  2021  180000  Azul\n  3  Fiat       Uno     2018   30000  Branco\n  4  Fiat       Toro    2021  120000  Preto\n  5  VW         Gol     2019   45000  (null)\n  6  VW         Polo    (null) 85000  Azul\n  7  Chevrolet  Onix    2020   45000  Preto\n  8  Fiat       Mobi    2022  (null)  Vermelho", "cards": [{"id": "V01", "k": "v", "f": "Schema", "pt": "Esquema", "d": "Coleção de objetos lógicos que pertence a um usuário e tem o mesmo nome dele. Criar o usuário cria o schema; cada usuário tem exatamente um.", "ex": "SELECT * FROM hr.employees;   -- hr = schema", "rel": "user / owner"}, {"id": "V02", "k": "v", "f": "Schema object", "pt": "Objeto de esquema", "d": "Objeto que pertence a um schema: TABLE, VIEW, INDEX, SEQUENCE, SYNONYM, PROCEDURE.", "ex": "SELECT owner, object_type FROM dba_objects WHERE object_name = 'EMPLOYEES';", "rel": "Non-schema object"}, {"id": "V03", "k": "v", "f": "Non-schema object", "pt": "Objeto fora de esquema", "d": "Objeto global do banco, sem dono: DIRECTORY, PROFILE, ROLE, TABLESPACE, USER.", "ex": "CREATE DIRECTORY dp_dir AS '/u01/dump';  -- não tem schema", "rel": "Schema object"}, {"id": "V04", "k": "v", "f": "Select list", "pt": "Lista de seleção", "d": "Expressões entre SELECT e FROM. Define as colunas do resultado e é a referência do DISTINCT e do ORDER BY por posição.", "ex": "SELECT marca, preco*1.1   -- select list\nFROM carros;", "rel": "Projection"}, {"id": "V05", "k": "v", "f": "Expression / Condition", "pt": "Expressão / Condição", "d": "Expressão devolve um valor (preco*2). Condição devolve TRUE, FALSE ou UNKNOWN (preco > 100). Operadores formam expressões; condições usam comparação e lógica.", "ex": "preco * 1.1          -- expressão\npreco * 1.1 > 50000  -- condição", "rel": "Operator"}, {"id": "V06", "k": "v", "f": "Operator precedence", "pt": "Precedência de operadores", "d": "Ordem em que o Oracle avalia operadores diferentes na mesma expressão. Mesmo nível: esquerda para direita.", "ex": "SELECT 2 + 3 * 4 FROM dual;  -- 14", "rel": "Associativity"}, {"id": "V07", "k": "v", "f": "Unary / Binary operator", "pt": "Operador unário / binário", "d": "Unário atua sobre 1 operando (-preco). Binário atua sobre 2 (preco - desconto). O + e o - unários estão no topo da precedência.", "ex": "SELECT -5 * 2, 10 - 3 FROM dual;", "rel": ""}, {"id": "V08", "k": "v", "f": "Three-valued logic", "pt": "Lógica de três valores", "d": "No SQL uma condição pode ser TRUE, FALSE ou UNKNOWN. Qualquer comparação com NULL dá UNKNOWN. O WHERE só devolve linhas TRUE.", "ex": "WHERE cor = NULL     -- sempre UNKNOWN\nWHERE cor IS NULL    -- correto", "rel": "NULL"}, {"id": "V09", "k": "v", "f": "Row limiting clause", "pt": "Cláusula de limitação de linhas", "d": "OFFSET n ROWS FETCH {FIRST|NEXT} n ROWS {ONLY|WITH TIES}. Disponível desde o 12c. Equivale ao LIMIT do MySQL, que não existe no Oracle.", "ex": "ORDER BY preco DESC\nFETCH FIRST 5 ROWS ONLY;", "rel": "Top-N query"}, {"id": "V10", "k": "v", "f": "Top-N query", "pt": "Consulta Top-N", "d": "Consulta que devolve as N primeiras linhas segundo uma ordenação: os 5 carros mais caros, os 10 maiores segmentos.", "ex": "SELECT segment_name, bytes FROM dba_segments\nORDER BY bytes DESC FETCH FIRST 10 ROWS ONLY;", "rel": "Pagination"}, {"id": "V11", "k": "v", "f": "Pagination", "pt": "Paginação", "d": "Devolver o resultado em páginas de tamanho fixo. Página p de tamanho t: OFFSET (p-1)*t ROWS FETCH NEXT t ROWS ONLY.", "ex": "-- página 3, 20 por página\nORDER BY id OFFSET 40 ROWS FETCH NEXT 20 ROWS ONLY;", "rel": "Offset"}, {"id": "V12", "k": "v", "f": "Ties (WITH TIES)", "pt": "Empates", "d": "Linhas com o mesmo valor de ordenação da última linha do limite. WITH TIES inclui todas elas.", "ex": "ORDER BY preco FETCH FIRST 1 ROW WITH TIES;", "rel": "ONLY"}, {"id": "V13", "k": "v", "f": "Pseudocolumn", "pt": "Pseudocoluna", "d": "Valor gerado pelo Oracle que se comporta como coluna, mas não está gravado na tabela: ROWNUM, ROWID, LEVEL, CURRVAL, NEXTVAL.", "ex": "SELECT ROWNUM, ROWID, marca FROM carros;", "rel": "ROWNUM"}, {"id": "V14", "k": "v", "f": "Inline view", "pt": "Visão em linha", "d": "Subquery no FROM, tratada como uma tabela temporária da consulta. Usada para ordenar antes de aplicar ROWNUM.", "ex": "SELECT * FROM (SELECT * FROM carros ORDER BY preco DESC)\nWHERE ROWNUM <= 3;", "rel": "Subquery"}, {"id": "V15", "k": "v", "f": "Wildcard character", "pt": "Caractere curinga", "d": "No LIKE: _ casa exatamente 1 caractere; % casa zero ou mais caracteres.", "ex": "WHERE modelo LIKE 'G_l'   -- Gol, Gel\nWHERE modelo LIKE 'G%'    -- G, Gol, Golf", "rel": "Pattern matching"}, {"id": "V16", "k": "v", "f": "Escape character", "pt": "Caractere de escape", "d": "Caractere definido no ESCAPE que faz o próximo _ ou % ser lido literalmente.", "ex": "WHERE codigo LIKE 'SYS\\_%' ESCAPE '\\'", "rel": "LIKE"}, {"id": "V17", "k": "v", "f": "Substitution variable", "pt": "Variável de substituição", "d": "Marcador &var ou &&var resolvido pelo cliente (SQL*Plus, SQLcl, SQL Developer) ANTES de mandar o texto ao banco. O banco nunca vê o &.", "ex": "SELECT * FROM carros WHERE marca = '&marca';", "rel": "Bind variable (:var) é outra coisa"}, {"id": "V18", "k": "v", "f": "Column alias", "pt": "Apelido de coluna", "d": "Nome alternativo de uma expressão na lista de seleção: expr [AS] alias. Sem aspas vira maiúsculo; com aspas duplas preserva caixa, espaços e caracteres especiais.", "ex": "SELECT preco*1.1 AS \"Preço c/ Reajuste\" FROM carros;", "rel": "c_alias"}, {"id": "V19", "k": "v", "f": "Implicit conversion", "pt": "Conversão implícita", "d": "Oracle converte tipos sozinho quando os operandos não batem. Pode falhar (ORA-01722) ou impedir uso de índice.", "ex": "SELECT '10' + 5 FROM dual;   -- 15, converte '10'\nSELECT 'A' + 5 FROM dual;    -- ORA-01722", "rel": "TO_NUMBER / TO_DATE"}, {"id": "V20", "k": "v", "f": "Hierarchical query", "pt": "Consulta hierárquica", "d": "Consulta com START WITH / CONNECT BY que percorre pai e filho. É onde se usa ORDER SIBLINGS BY, PRIOR e CONNECT_BY_ROOT.", "ex": "SELECT LEVEL, last_name FROM hr.employees\nSTART WITH manager_id IS NULL\nCONNECT BY PRIOR employee_id = manager_id\nORDER SIBLINGS BY last_name;", "rel": "SIBLINGS"}, {"id": "C01", "k": "c", "sec": "Precedência de operadores e condições", "f": "Qual a ordem completa de precedência, da maior para a menor?", "a": "<b>Operadores<\/b> (avaliados primeiro):<br>1) + e - unários, PRIOR, CONNECT_BY_ROOT, COLLATE<br>2) * e /<br>3) + e - binários, || (concatenação)<br><b>Condições<\/b> (depois dos operadores):<br>4) =, !=, &lt;, &gt;, &lt;=, &gt;=<br>5) IS [NOT] NULL, LIKE, [NOT] BETWEEN, [NOT] IN, EXISTS<br>6) NOT &nbsp;7) AND &nbsp;8) OR", "why": "O Oracle primeiro calcula valores (aritmética e concatenação), depois compara, e por último combina os resultados lógicos.", "ex": "WHERE preco * 1.1 > 50000 AND cor = 'Preto' OR ano = 2022\n-- lido como:\nWHERE ((preco * 1.1) > 50000 AND cor = 'Preto') OR ano = 2022", "trap": "Decore a sequência NOT, AND, OR. É a base de metade das questões de WHERE.", "tag": ""}, {"id": "C02", "k": "c", "sec": "Precedência de operadores e condições", "f": "Operadores com a mesma precedência são avaliados em que ordem?", "a": "Da esquerda para a direita.", "why": "", "ex": "SELECT 20 / 2 * 5 FROM dual;   -- (20/2)*5 = 50, não 20/(2*5)=2\nSELECT 10 - 4 + 2 FROM dual;   -- (10-4)+2 = 8", "trap": "A prova coloca * e / juntos esperando que você resolva * primeiro. Não existe essa prioridade: é esquerda para direita.", "tag": ""}, {"id": "C03", "k": "c", "sec": "Precedência de operadores e condições", "f": "O || (concatenação) é avaliado antes do + binário?", "a": "Não. ||, + e - binários estão no MESMO nível. Vale a regra da esquerda para a direita.", "why": "Em <code>'Valor: ' || 5 + 1<\/code> o Oracle faz primeiro <code>'Valor: ' || 5<\/code> = 'Valor: 5', depois tenta <code>'Valor: 5' + 1<\/code>. Converter 'Valor: 5' para número falha.", "ex": "SELECT 'Valor: ' || 5 + 1 FROM dual;     -- ORA-01722: invalid number\nSELECT 'Valor: ' || (5 + 1) FROM dual;   -- Valor: 6", "trap": "Resultado esperado pela banca: erro, não 'Valor: 51' nem 'Valor: 6'.", "tag": ""}, {"id": "C04", "k": "c", "sec": "Precedência de operadores e condições", "f": "Como o Oracle lê <code>WHERE a OR b AND c<\/code>?", "a": "<code>a OR (b AND c)<\/code>. AND tem precedência sobre OR.", "why": "", "ex": "WHERE marca = 'Ford' OR marca = 'Fiat' AND preco > 50000\n-- = todos os Ford + Fiat acima de 50000\n\nWHERE (marca = 'Ford' OR marca = 'Fiat') AND preco > 50000\n-- = Ford ou Fiat, ambos acima de 50000", "trap": "Na prática de DBA, esse erro em DELETE/UPDATE apaga muito mais linhas do que o pretendido. Sempre use parênteses quando misturar AND e OR.", "tag": ""}, {"id": "C05", "k": "c", "sec": "Precedência de operadores e condições", "f": "Como o Oracle lê <code>WHERE NOT a AND b<\/code>?", "a": "<code>(NOT a) AND b<\/code>. NOT tem precedência sobre AND, e só nega a condição imediatamente à direita.", "why": "", "ex": "WHERE NOT cor = 'Azul' AND ano = 2021\n-- = (cor <> 'Azul') AND ano = 2021", "trap": "Para negar tudo: <code>NOT (cor = 'Azul' AND ano = 2021)<\/code>.", "tag": ""}, {"id": "C06", "k": "c", "sec": "Precedência de operadores e condições", "f": "Quais operadores significam \"diferente\" no Oracle?", "a": "!=, &lt;&gt; e ^= são equivalentes.", "why": "", "ex": "WHERE cor != 'Azul'\nWHERE cor <> 'Azul'\nWHERE cor ^= 'Azul'", "trap": "Nenhum deles retorna linhas onde cor é NULL.", "tag": "complemento"}, {"id": "C07", "k": "c", "sec": "Schema, DESCRIBE e estrutura do SELECT", "f": "Como o Oracle resolve <code>SELECT * FROM carros<\/code> sem schema?", "a": "Procura nesta ordem: objeto no schema do usuário conectado (ou CURRENT_SCHEMA), depois sinônimo privado, depois sinônimo público. Se não achar: ORA-00942.", "why": "", "ex": "ALTER SESSION SET CURRENT_SCHEMA = HR;\nSELECT * FROM employees;   -- resolve HR.EMPLOYEES", "trap": "ORA-00942 \"table or view does not exist\" também aparece quando a tabela existe mas você não tem privilégio.", "tag": "complemento"}, {"id": "C08", "k": "c", "sec": "Schema, DESCRIBE e estrutura do SELECT", "f": "O que o DESCRIBE mostra e qual sua natureza?", "a": "Nome da coluna, se é NOT NULL (coluna Null?) e tipo com tamanho/precisão. Sintaxe: DESC[RIBE] [schema.]objeto.", "why": "É comando do SQL*Plus/SQLcl, não SQL. Por isso não precisa de ponto e vírgula e não funciona dentro de PL/SQL.", "ex": "SQL> DESC hr.employees\n Name           Null?    Type\n -------------- -------- ------------\n EMPLOYEE_ID    NOT NULL NUMBER(6)\n FIRST_NAME              VARCHAR2(20)", "trap": "DESC não mostra PK, FK, CHECK nem default. Só NOT NULL.", "tag": ""}, {"id": "C09", "k": "c", "sec": "Schema, DESCRIBE e estrutura do SELECT", "f": "Qual a ordem LÓGICA de execução das cláusulas do SELECT?", "a": "FROM → WHERE → GROUP BY → HAVING → SELECT (lista + alias) → DISTINCT → ORDER BY → OFFSET/FETCH", "why": "Explica várias regras de uma vez: alias não existe no WHERE (vem antes do SELECT); ORDER BY enxerga alias (vem depois); ROWNUM é gerado no WHERE (antes do ORDER BY); FETCH age sobre o resultado já ordenado.", "ex": "SELECT marca, preco*1.1 novo   -- 5\nFROM carros                     -- 1\nWHERE ano > 2019                -- 2\nORDER BY novo DESC              -- 7 (alias ok)\nFETCH FIRST 3 ROWS ONLY;        -- 8", "trap": "Não é a ordem em que você escreve.", "tag": "complemento"}, {"id": "C10", "k": "c", "sec": "DISTINCT | UNIQUE | ALL", "f": "DISTINCT, UNIQUE e ALL: diferença?", "a": "DISTINCT e UNIQUE são sinônimos: devolvem uma única cópia de cada linha duplicada. ALL devolve tudo, inclusive duplicatas, e é o padrão.", "why": "", "ex": "SELECT ALL marca FROM carros;       -- 8 linhas (= sem nada)\nSELECT DISTINCT marca FROM carros;  -- 4 linhas\nSELECT UNIQUE marca FROM carros;    -- 4 linhas", "trap": "UNIQUE aqui não tem relação com constraint UNIQUE nem índice único.", "tag": ""}, {"id": "C11", "k": "c", "sec": "DISTINCT | UNIQUE | ALL", "f": "Onde o DISTINCT pode aparecer?", "a": "Uma única vez, logo após SELECT (ou após o hint), antes da primeira expressão. Vale para a linha inteira.", "why": "", "ex": "SELECT DISTINCT marca, cor FROM carros;   -- ok\nSELECT marca, DISTINCT cor FROM carros;   -- ORA-00936: missing expression", "trap": "Exceção: dentro de função de agregação, COUNT(DISTINCT cor), que é outra coisa.", "tag": ""}, {"id": "C12", "k": "c", "sec": "DISTINCT | UNIQUE | ALL", "f": "O que é \"linha duplicada\" para o DISTINCT?", "a": "Linha com valores iguais em TODAS as expressões da lista de seleção.", "why": "", "ex": "SELECT DISTINCT marca FROM carros;       -- uma por marca\nSELECT DISTINCT marca, cor FROM carros;  -- uma por par (marca, cor)", "trap": "Adicionar uma coluna ao DISTINCT quase sempre AUMENTA o número de linhas.", "tag": ""}, {"id": "C13", "k": "c", "sec": "DISTINCT | UNIQUE | ALL", "f": "Como o DISTINCT trata NULL?", "a": "Considera todos os NULLs iguais entre si: devolve um único NULL.", "why": "É uma exceção à lógica de três valores: no WHERE, NULL = NULL é UNKNOWN; no DISTINCT (e no GROUP BY), NULLs formam um só grupo.", "ex": "-- preco: 45000, 45000, NULL, NULL, 30000\nSELECT DISTINCT preco FROM t;   -- 45000, NULL, 30000 (3 linhas)", "trap": "", "tag": "complemento"}, {"id": "C14", "k": "c", "sec": "DISTINCT | UNIQUE | ALL", "f": "Que restrição o DISTINCT impõe ao ORDER BY?", "a": "O ORDER BY só pode usar expressões que estejam na lista de seleção.", "why": "Depois do DISTINCT, várias linhas originais viraram uma. Se ordenasse por uma coluna fora da lista, o Oracle não saberia qual valor usar.", "ex": "SELECT DISTINCT marca FROM carros ORDER BY modelo;\n-- ORA-01791: not a SELECTed expression\nSELECT DISTINCT marca FROM carros ORDER BY marca;   -- ok\nSELECT DISTINCT marca FROM carros ORDER BY 1;       -- ok", "trap": "", "tag": ""}, {"id": "C15", "k": "c", "sec": "WHERE, alias e comparações", "f": "O que acontece se a cláusula WHERE for omitida?", "a": "Retorna todas as linhas das tabelas, views ou materialized views do FROM.", "why": "", "ex": "SELECT * FROM carros;   -- todas as linhas", "trap": "Em DELETE e UPDATE, omitir o WHERE afeta a tabela inteira.", "tag": ""}, {"id": "C16", "k": "c", "sec": "WHERE, alias e comparações", "f": "Alias de coluna pode ser usado no WHERE?", "a": "Não. Gera ORA-00904: invalid identifier.", "why": "O WHERE é avaliado antes da lista de seleção, onde o alias nasce.", "ex": "SELECT preco*1.1 novo FROM carros WHERE novo > 50000;\n-- ORA-00904: \"NOVO\": invalid identifier\n\nSELECT preco*1.1 novo FROM carros WHERE preco*1.1 > 50000;  -- ok\nSELECT * FROM (SELECT preco*1.1 novo FROM carros) WHERE novo > 50000;  -- ok", "trap": "", "tag": "complemento"}, {"id": "C17", "k": "c", "sec": "WHERE, alias e comparações", "f": "Regras de alias de coluna?", "a": "AS é opcional. Sem aspas o alias vira MAIÚSCULO e não pode ter espaço. Com aspas duplas preserva caixa, espaços e caracteres especiais. Pode ser usado no ORDER BY. Em GROUP BY e HAVING, só a partir da 23ai.", "why": "", "ex": "SELECT first_name nome                FROM hr.employees;  -- cabeçalho NOME\nSELECT first_name AS \"Primeiro Nome\"  FROM hr.employees;  -- preserva\nSELECT first_name AS Primeiro Nome    FROM hr.employees;  -- erro", "trap": "Alias usa aspas DUPLAS. Literal de texto usa aspas SIMPLES. Trocar as duas é pegadinha clássica.", "tag": ""}, {"id": "C18", "k": "c", "sec": "WHERE, alias e comparações", "f": "Comparação de texto e data no WHERE: cuidados?", "a": "Texto e data vão entre aspas simples. Comparação de texto é case-sensitive. Para data, use TO_DATE com máscara explícita.", "why": "", "ex": "WHERE cor = 'preto'    -- não acha 'Preto'\nWHERE UPPER(cor) = 'PRETO'\nWHERE dt_contrat >= TO_DATE('2021-01-01','YYYY-MM-DD')", "trap": "Comparar data com string sem TO_DATE depende do NLS_DATE_FORMAT da sessão: funciona em uma máquina e quebra na outra.", "tag": ""}, {"id": "C19", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "BETWEEN: inclusivo? A ordem importa?", "a": "Inclusivo nos dois lados: <code>x BETWEEN a AND b<\/code> = <code>x &gt;= a AND x &lt;= b<\/code>. A ordem importa: menor primeiro.", "why": "", "ex": "WHERE preco BETWEEN 45000 AND 120000   -- inclui 45000 e 120000\nWHERE preco BETWEEN 120000 AND 45000   -- 0 linhas, sem erro", "trap": "Limites invertidos não dão erro. Dão resultado vazio.", "tag": ""}, {"id": "C20", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "Qual o risco de BETWEEN com DATE?", "a": "DATE tem hora. <code>TO_DATE('2021-12-01','YYYY-MM-DD')<\/code> é 01/12/2021 00:00:00. Qualquer registro de 01/12 depois da meia-noite fica de fora.", "why": "", "ex": "-- exclui 01/12/2021 14:30\nWHERE dt BETWEEN DATE '2021-01-01' AND DATE '2021-12-01'\n\n-- forma segura (intervalo semiaberto)\nWHERE dt >= DATE '2021-01-01' AND dt < DATE '2022-01-01'", "trap": "O exemplo do slide (até 2021-12-01) também deixa todo o resto de dezembro de fora.", "tag": "complemento"}, {"id": "C21", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "Como IN e NOT IN se comportam com NULL na lista?", "a": "<b>IN<\/b> funciona: o NULL só não casa com nada. <b>NOT IN<\/b> com NULL na lista retorna ZERO linhas.", "why": "<code>ano NOT IN (2019, NULL)<\/code> = <code>ano != 2019 AND ano != NULL<\/code>. A segunda parte é sempre UNKNOWN, então o AND nunca é TRUE.", "ex": "WHERE ano IN (2019, NULL)       -- linhas de 2019\nWHERE ano NOT IN (2019, NULL)   -- 0 linhas", "trap": "O mesmo vale para NOT IN (subquery) quando a subquery devolve algum NULL. Use NOT EXISTS.", "tag": "complemento"}, {"id": "C22", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "Por que <code>WHERE cor = NULL<\/code> não retorna nada?", "a": "Qualquer comparação com NULL resulta em UNKNOWN, e o WHERE só devolve TRUE. Use IS NULL / IS NOT NULL.", "why": "", "ex": "WHERE cor = NULL       -- 0 linhas, sem erro\nWHERE cor IS NULL      -- correto\nWHERE cor != 'Azul'    -- também exclui as linhas com cor NULL", "trap": "Não dá erro. A consulta roda e devolve vazio, que é pior.", "tag": ""}, {"id": "C23", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "Tabela da lógica de três valores: NOT, AND, OR com UNKNOWN?", "a": "NOT UNKNOWN = UNKNOWN<br>TRUE AND UNKNOWN = UNKNOWN<br>FALSE AND UNKNOWN = FALSE<br>TRUE OR UNKNOWN = TRUE<br>FALSE OR UNKNOWN = UNKNOWN", "why": "Isso explica por que <code>NOT cor = 'Azul'<\/code> não traz cor NULL: NOT de UNKNOWN continua UNKNOWN.", "ex": "WHERE NOT (cor = 'Azul')               -- exclui NULL\nWHERE cor != 'Azul' OR cor IS NULL     -- inclui NULL", "trap": "", "tag": "complemento"}, {"id": "C24", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "ANY e ALL com lista de valores: equivalências?", "a": "&gt; ANY (lista) = maior que o MÍNIMO<br>&gt; ALL (lista) = maior que o MÁXIMO<br>&lt; ANY = menor que o máximo<br>&lt; ALL = menor que o mínimo<br>= ANY = IN<br>!= ALL = NOT IN<br>SOME é sinônimo de ANY.", "why": "", "ex": "WHERE ano > ANY (2019, 2021)   -- ano > 2019\nWHERE ano > ALL (2019, 2021)   -- ano > 2021", "trap": "ANY/ALL sempre precisam de um operador de comparação antes. <code>WHERE ano ANY (2019)<\/code> é erro de sintaxe.", "tag": ""}, {"id": "C25", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "ANY e ALL com subquery que não retorna linhas?", "a": "&gt; ALL (vazio) = TRUE para todas as linhas. &gt; ANY (vazio) = FALSE para todas.", "why": "\"Maior que todos de um conjunto vazio\" é verdade por vacuidade; \"maior que algum\" exige que exista algum.", "ex": "SELECT * FROM carros WHERE preco > ALL (SELECT preco FROM carros WHERE 1=0);\n-- devolve TODAS as linhas", "trap": "", "tag": "complemento"}, {"id": "C26", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "LIKE: curingas e comportamento?", "a": "_ = exatamente 1 caractere. % = zero ou mais caracteres. É case-sensitive. % não casa com NULL: coluna NULL nunca passa no LIKE, nem em LIKE '%'.", "why": "", "ex": "WHERE nome LIKE 'A%a'    -- Ana, Andrea, Aa\nWHERE nome LIKE 'A_a'    -- Ana, Ava (3 letras exatas)\nWHERE nome LIKE '%'      -- todas, exceto NULL\nWHERE UPPER(nome) LIKE 'AN%'  -- ignora caixa", "trap": "LIKE '%x%' com % no início impede uso normal de índice B-tree: full scan.", "tag": ""}, {"id": "C27", "k": "c", "sec": "BETWEEN, IN, NULL, ANY/ALL e LIKE", "f": "Como buscar _ ou % literalmente com LIKE?", "a": "Definir um caractere de escape com a cláusula ESCAPE.", "why": "", "ex": "-- objetos que começam com SYS_\nSELECT object_name FROM dba_objects\nWHERE object_name LIKE 'SYS\\_%' ESCAPE '\\';", "trap": "Sem ESCAPE, 'SYS_%' casa SYSA, SYSB... porque _ é curinga.", "tag": "complemento"}, {"id": "C28", "k": "c", "sec": "Row limiting: OFFSET e FETCH", "f": "Sintaxe e posição da row_limiting_clause?", "a": "Vem DEPOIS do ORDER BY:<br><code>[ORDER BY ...] [OFFSET n {ROW|ROWS}] [FETCH {FIRST|NEXT} [n | n PERCENT] {ROW|ROWS} {ONLY|WITH TIES}]<\/code><br>Disponível desde o 12c.", "why": "Ela age sobre o resultado já ordenado. É por isso que resolve o problema do ROWNUM.", "ex": "SELECT marca, preco FROM carros\nORDER BY preco DESC\nOFFSET 0 ROWS FETCH FIRST 3 ROWS ONLY;", "trap": "FIRST = NEXT e ROW = ROWS. São só para leitura natural. Combinações como FETCH NEXT 1 ROW ONLY são válidas.", "tag": ""}, {"id": "C29", "k": "c", "sec": "Row limiting: OFFSET e FETCH", "f": "OFFSET: regras para valores especiais?", "a": "Negativo → tratado como 0.<br>NULL → 0 linhas retornadas.<br>&ge; total de linhas → 0 linhas.<br>Fracionário → parte fracionária truncada.<br>Omitido → 0 (começa na 1ª linha).", "why": "", "ex": "OFFSET -5 ROWS     -- igual a OFFSET 0\nOFFSET 2.9 ROWS    -- igual a OFFSET 2 (começa na 3ª)\nOFFSET 50 ROWS     -- 0 linhas se a tabela tem 20", "trap": "Nenhum desses casos gera erro.", "tag": ""}, {"id": "C30", "k": "c", "sec": "Row limiting: OFFSET e FETCH", "f": "FETCH: regras de rowcount?", "a": "Sem rowcount nem PERCENT → 1 linha.<br>Fracionário → truncado.<br>Maior que o disponível → devolve o que existe.<br>Sem cláusula FETCH → todas as linhas a partir de offset + 1.", "why": "", "ex": "FETCH FIRST ROWS ONLY      -- 1 linha\nFETCH FIRST 2.7 ROWS ONLY  -- 2 linhas\nFETCH FIRST 100 ROWS ONLY  -- 8 linhas numa tabela de 8", "trap": "\"FETCH FIRST ROWS ONLY\" parece inválido sem número, mas é aceito e devolve 1.", "tag": ""}, {"id": "C31", "k": "c", "sec": "Row limiting: OFFSET e FETCH", "f": "FETCH ... PERCENT: como funciona?", "a": "Devolve a porcentagem do total de linhas selecionadas. O Oracle precisa contar o total antes, o que custa mais que um FETCH por quantidade.", "why": "", "ex": "-- 8 linhas na tabela\nORDER BY preco FETCH FIRST 25 PERCENT ROWS ONLY   -- 2 linhas", "trap": "Com empate no corte e ONLY, qual linha empatada entra é indeterminado. Use WITH TIES ou desempate no ORDER BY.", "tag": ""}, {"id": "C32", "k": "c", "sec": "Row limiting: OFFSET e FETCH", "f": "ONLY vs WITH TIES?", "a": "ONLY: exatamente n linhas (ou n%). WITH TIES: devolve também as linhas empatadas com a última, segundo o ORDER BY. WITH TIES exige ORDER BY; sem ele nenhuma linha extra é retornada.", "why": "", "ex": "-- precos: 30000, 45000, 45000, 45000, 85000\nORDER BY preco FETCH FIRST 2 ROWS ONLY       -- 30000, 45000\nORDER BY preco FETCH FIRST 2 ROWS WITH TIES  -- 30000, 45000, 45000, 45000", "trap": "WITH TIES sem ORDER BY não dá erro: só se comporta como ONLY.", "tag": ""}, {"id": "C33", "k": "c", "sec": "Row limiting: OFFSET e FETCH", "f": "Como paginar com OFFSET/FETCH?", "a": "Página p, tamanho t: <code>OFFSET (p-1)*t ROWS FETCH NEXT t ROWS ONLY<\/code>. O ORDER BY precisa ser determinístico (ter uma chave única no final).", "why": "", "ex": "-- página 2, 3 por página\nSELECT id, modelo FROM carros\nORDER BY preco DESC, id\nOFFSET 3 ROWS FETCH NEXT 3 ROWS ONLY;", "trap": "Sem a coluna de desempate (id), uma linha pode aparecer em duas páginas ou em nenhuma.", "tag": ""}, {"id": "C34", "k": "c", "sec": "Row limiting: OFFSET e FETCH", "f": "Restrições da row_limiting_clause?", "a": "Não pode ser usada com FOR UPDATE. A lista de seleção não pode conter CURRVAL ou NEXTVAL de sequence.", "why": "", "ex": "SELECT * FROM carros FETCH FIRST 5 ROWS ONLY FOR UPDATE;   -- erro", "trap": "", "tag": "complemento"}, {"id": "C35", "k": "c", "sec": "Row limiting: OFFSET e FETCH", "f": "Como o FETCH aparece no plano de execução?", "a": "O Oracle reescreve internamente com função analítica ROW_NUMBER (ou RANK para WITH TIES). No plano surgem operações como WINDOW SORT PUSHED RANK e VIEW com filtro no número da linha.", "why": "Para o DBA: Top-N com índice na coluna do ORDER BY pode parar cedo (WINDOW NOSORT STOPKEY), sem ordenar a tabela inteira.", "ex": "EXPLAIN PLAN FOR\nSELECT * FROM carros ORDER BY preco FETCH FIRST 3 ROWS ONLY;\nSELECT * FROM TABLE(DBMS_XPLAN.DISPLAY);", "trap": "", "tag": "complemento"}, {"id": "C36", "k": "c", "sec": "ROWNUM", "f": "Por que <code>WHERE ROWNUM &lt;= 10 ORDER BY 1<\/code> não é um Top-10?", "a": "ROWNUM é atribuído enquanto as linhas são lidas, na fase do WHERE, ANTES do ORDER BY. A consulta pega 10 linhas quaisquer e só depois ordena essas 10.", "why": "", "ex": "SELECT marca, preco FROM carros\nWHERE ROWNUM <= 3 ORDER BY preco DESC;\n-- 3 carros quaisquer, ordenados. Não são os 3 mais caros.", "trap": "O resultado sai ordenado e parece certo. É um bug silencioso.", "tag": ""}, {"id": "C37", "k": "c", "sec": "ROWNUM", "f": "Como fazer Top-N corretamente com ROWNUM?", "a": "Ordenar numa inline view e aplicar ROWNUM na consulta externa.", "why": "", "ex": "SELECT marca, preco\nFROM (SELECT marca, preco FROM carros ORDER BY preco DESC)\nWHERE ROWNUM <= 3;", "trap": "Funciona em qualquer versão, inclusive anteriores ao 12c. A partir do 12c prefira FETCH FIRST.", "tag": ""}, {"id": "C38", "k": "c", "sec": "ROWNUM", "f": "O que retorna <code>WHERE ROWNUM = 2<\/code> ou <code>ROWNUM &gt; 1<\/code>?", "a": "Zero linhas.", "why": "A 1ª linha candidata recebe ROWNUM 1, falha no teste e é descartada. A próxima recebe ROWNUM 1 de novo, também falha. Nenhuma linha chega a ter ROWNUM 2.", "ex": "WHERE ROWNUM = 1     -- 1 linha\nWHERE ROWNUM <= 5    -- 5 linhas\nWHERE ROWNUM = 2     -- 0 linhas\nWHERE ROWNUM > 1     -- 0 linhas", "trap": "", "tag": "complemento"}, {"id": "C39", "k": "c", "sec": "ROWNUM", "f": "Como paginar com ROWNUM (versões antigas)?", "a": "Dois níveis: o interno materializa ROWNUM com alias; o externo filtra pelo alias.", "why": "", "ex": "SELECT * FROM (\n  SELECT t.*, ROWNUM rn\n  FROM (SELECT * FROM carros ORDER BY preco DESC) t\n  WHERE ROWNUM <= 6)\nWHERE rn > 3;   -- linhas 4 a 6", "trap": "Funciona porque rn é uma coluna \"normal\" no nível externo.", "tag": "complemento"}, {"id": "C40", "k": "c", "sec": "Variáveis de substituição, DEFINE e VERIFY", "f": "Quem resolve a variável de substituição: o cliente ou o banco?", "a": "O cliente (SQL*Plus, SQLcl, SQL Developer). Ele troca o texto e só então envia o comando ao banco.", "why": "Por isso &var pode substituir qualquer pedaço do comando: valor, coluna, tabela, até um WHERE inteiro.", "ex": "SELECT &coluna FROM &tabela WHERE &condicao;\n-- coluna=marca, tabela=carros, condicao=ano>2020", "trap": "Não confundir com bind variable (:var), que é resolvida pelo banco.", "tag": ""}, {"id": "C41", "k": "c", "sec": "Variáveis de substituição, DEFINE e VERIFY", "f": "& com variável indefinida: comportamento?", "a": "Pede o valor, substitui e descarta. Se a mesma variável aparecer 2 vezes, pede 2 vezes, e os valores podem ser diferentes.", "why": "", "ex": "SELECT &col, &col FROM carros;\nEnter value for col: marca\nEnter value for col: preco\n-- vira: SELECT marca, preco FROM carros", "trap": "", "tag": ""}, {"id": "C42", "k": "c", "sec": "Variáveis de substituição, DEFINE e VERIFY", "f": "&& com variável indefinida: comportamento?", "a": "Pede o valor uma vez e DEFINE a variável. Qualquer referência seguinte, com & ou &&, reutiliza o valor sem perguntar até UNDEFINE ou fim da sessão.", "why": "", "ex": "SELECT &&col FROM carros ORDER BY &col;\nEnter value for col: marca     -- só pergunta 1 vez\n\nSELECT &col FROM carros;        -- não pergunta, usa marca\nUNDEFINE col", "trap": "Num script reexecutado na mesma sessão, o && \"lembra\" o valor da execução anterior.", "tag": ""}, {"id": "C43", "k": "c", "sec": "Variáveis de substituição, DEFINE e VERIFY", "f": "Onde a variável de substituição NÃO pode ser usada?", "a": "Como a primeira palavra do comando.", "why": "", "ex": "&cmd * FROM carros;   -- não funciona\nSELECT * FROM &tab;   -- ok", "trap": "", "tag": ""}, {"id": "C44", "k": "c", "sec": "Variáveis de substituição, DEFINE e VERIFY", "f": "Texto ou data com variável de substituição no WHERE?", "a": "Ponha aspas simples em volta do &var no comando. Se não puser, quem digita precisa incluir as aspas no prompt.", "why": "", "ex": "WHERE marca = '&marca'   -- digita: Ford\nWHERE marca = &marca     -- digita: 'Ford'\n-- se digitar Ford sem aspas: marca = Ford\n-- ORA-00904: \"FORD\": invalid identifier", "trap": "O erro é ORA-00904, porque o Oracle interpreta Ford como nome de coluna.", "tag": ""}, {"id": "C45", "k": "c", "sec": "Variáveis de substituição, DEFINE e VERIFY", "f": "SET VERIFY: o que faz e qual o padrão?", "a": "SET VER[IFY] {ON|OFF}. ON (padrão) mostra a linha antes (old) e depois (new) da substituição. OFF suprime. No SQL Developer, use Executar Script (F5) para ver.", "why": "", "ex": "SQL> SELECT * FROM carros WHERE ano = &ano;\nEnter value for ano: 2021\nold   1: SELECT * FROM carros WHERE ano = &ano\nnew   1: SELECT * FROM carros WHERE ano = 2021", "trap": "VERIFY não muda o resultado, só a exibição.", "tag": ""}, {"id": "C46", "k": "c", "sec": "Variáveis de substituição, DEFINE e VERIFY", "f": "DEFINE: sintaxes e efeitos?", "a": "DEF[INE] var = texto → cria variável do tipo CHAR.<br>DEFINE var → mostra valor e tipo dela.<br>DEFINE → lista todas, inclusive as predefinidas (_DATE, _USER, _CONNECT_IDENTIFIER...).<br>Vale até UNDEFINE ou fim da sessão.", "why": "", "ex": "DEFINE ano = 2021\nDEFINE ano\n-- DEFINE ANO = \"2021\" (CHAR)\nSELECT * FROM carros WHERE ano = &ano;   -- não pergunta", "trap": "Mesmo com valor numérico, o tipo é CHAR. A conversão acontece no SQL.", "tag": ""}, {"id": "C47", "k": "c", "sec": "Variáveis de substituição, DEFINE e VERIFY", "f": "Como desligar ou trocar o caractere de substituição?", "a": "SET DEFINE OFF desliga. SET DEFINE ON religa. SET DEFINE 'x' troca o caractere.", "why": "", "ex": "SET DEFINE OFF\nINSERT INTO setores VALUES ('P&D');   -- grava P&D literal\nSET DEFINE ON", "trap": "Scripts de DBA com & em texto (senhas, nomes) travam pedindo valor se você esquecer o SET DEFINE OFF.", "tag": "complemento"}, {"id": "C48", "k": "c", "sec": "ORDER BY", "f": "Sem ORDER BY, em que ordem vêm as linhas?", "a": "Ordem não garantida. Pode mudar entre execuções por causa de plano, paralelismo, reorganização ou índice.", "why": "", "ex": "SELECT * FROM carros;   -- ordem arbitrária", "trap": "Ordem de inserção NÃO é garantida.", "tag": "complemento"}, {"id": "C49", "k": "c", "sec": "ORDER BY", "f": "Formas de referenciar a ordenação?", "a": "<b>expr<\/b>: coluna ou expressão, inclusive fora da lista de seleção (se não houver DISTINCT).<br><b>position<\/b>: inteiro com a posição na lista de seleção.<br><b>c_alias<\/b>: apelido de coluna.", "why": "", "ex": "SELECT marca, modelo, ano FROM carros ORDER BY ano;\nSELECT marca, modelo, ano FROM carros ORDER BY 3;\nSELECT marca, preco*1.1 novo FROM carros ORDER BY novo;\nSELECT marca FROM carros ORDER BY preco;   -- ok, preco fora da lista", "trap": "Posição maior que o número de colunas: ORA-01785.", "tag": ""}, {"id": "C50", "k": "c", "sec": "ORDER BY", "f": "Em <code>ORDER BY marca, preco DESC<\/code>, o DESC vale para quem?", "a": "Só para preco. marca usa o padrão ASC. ASC/DESC e NULLS FIRST/LAST são por expressão.", "why": "", "ex": "ORDER BY marca, preco DESC       -- marca ASC, preco DESC\nORDER BY marca DESC, preco DESC  -- ambos DESC", "trap": "Pegadinha clássica de leitura.", "tag": ""}, {"id": "C51", "k": "c", "sec": "ORDER BY", "f": "Padrões de NULL na ordenação?", "a": "ASC: NULLS LAST. DESC: NULLS FIRST.", "why": "O Oracle trata NULL como maior que qualquer valor.", "ex": "ORDER BY preco DESC              -- NULLs primeiro\nORDER BY preco DESC NULLS LAST   -- NULLs no fim\nORDER BY preco NULLS FIRST       -- ASC com NULLs no início", "trap": "Top-N com DESC traz NULL no topo: \"o carro mais caro\" sai com preço NULL.", "tag": ""}, {"id": "C52", "k": "c", "sec": "ORDER BY", "f": "Restrições do ORDER BY?", "a": "Máximo de 255 expressões.<br>Não ordena por LOB (CLOB, BLOB), LONG, LONG RAW, nested table ou varray.<br>Com DISTINCT: só expressões da lista de seleção.", "why": "", "ex": "ORDER BY observacao_clob   -- ORA-00932: inconsistent datatypes", "trap": "", "tag": ""}, {"id": "C53", "k": "c", "sec": "ORDER BY", "f": "ORDER BY com GROUP BY aceita quais expressões?", "a": "Constantes; funções de agregação; funções analíticas; USER, UID e SYSDATE; expressões idênticas às do GROUP BY; e combinações dessas.", "why": "Depois do GROUP BY, cada linha é um grupo. Só faz sentido ordenar por algo que tenha um único valor por grupo.", "ex": "SELECT marca, COUNT(*) FROM carros GROUP BY marca ORDER BY marca;      -- ok\nSELECT marca, COUNT(*) FROM carros GROUP BY marca ORDER BY COUNT(*);   -- ok\nSELECT marca, COUNT(*) FROM carros GROUP BY marca ORDER BY modelo;\n-- ORA-00979: not a GROUP BY expression", "trap": "", "tag": "correção do material: o slide lista só constantes, agregações e analíticas"}, {"id": "C54", "k": "c", "sec": "ORDER BY", "f": "Para que serve ORDER SIBLINGS BY?", "a": "Em consultas hierárquicas (CONNECT BY), ordena os irmãos de cada nível sem quebrar a árvore. Um ORDER BY comum destruiria a hierarquia.", "why": "", "ex": "SELECT LPAD(' ', LEVEL*2) || last_name\nFROM hr.employees\nSTART WITH manager_id IS NULL\nCONNECT BY PRIOR employee_id = manager_id\nORDER SIBLINGS BY last_name;", "trap": "SIBLINGS só é válido com CONNECT BY.", "tag": "complemento"}, {"id": "S01", "k": "s", "f": "SELECT 10 + 2 * 3 FROM dual;", "res": "16", "d": "Multiplicação antes da adição."}, {"id": "S02", "k": "s", "f": "SELECT 20 / 2 * 5 FROM dual;", "res": "50", "d": "* e / no mesmo nível: esquerda para direita, (20/2)*5."}, {"id": "S03", "k": "s", "f": "SELECT 'Valor: ' || 5 + 1 FROM dual;", "res": "ORA-01722: invalid number", "d": "|| e + no mesmo nível. Faz 'Valor: 5' e tenta somar 1 a texto."}, {"id": "S04", "k": "s", "f": "SELECT modelo FROM carros\nWHERE marca='Ford' OR marca='Fiat' AND preco > 50000;", "res": "Ka, Ranger, Toro (3)", "d": "Lido como Ford OR (Fiat AND >50000). Ka entra mesmo custando 45000. Mobi (preço NULL) e Uno (30000) ficam fora."}, {"id": "S05", "k": "s", "f": "SELECT modelo FROM carros\nWHERE (marca='Ford' OR marca='Fiat') AND preco > 50000;", "res": "Ranger, Toro (2)", "d": "Parênteses mudam o resultado."}, {"id": "S06", "k": "s", "f": "SELECT modelo FROM carros WHERE NOT cor = 'Azul';", "res": "Ka, Uno, Toro, Onix, Mobi (5)", "d": "Gol tem cor NULL: NOT UNKNOWN = UNKNOWN, fica fora."}, {"id": "S07", "k": "s", "f": "SELECT modelo FROM carros WHERE cor = NULL;", "res": "0 linhas", "d": "Comparação com NULL é UNKNOWN. Com IS NULL viria Gol."}, {"id": "S08", "k": "s", "f": "SELECT DISTINCT marca FROM carros;", "res": "4 linhas", "d": "Ford, Fiat, VW, Chevrolet."}, {"id": "S09", "k": "s", "f": "SELECT DISTINCT preco FROM carros;", "res": "6 linhas", "d": "30000, 45000, 85000, 120000, 180000 e um único NULL. 45000 aparece 3x na tabela, 1x no resultado."}, {"id": "S10", "k": "s", "f": "SELECT marca, DISTINCT cor FROM carros;", "res": "ORA-00936: missing expression", "d": "DISTINCT só logo após SELECT."}, {"id": "S11", "k": "s", "f": "SELECT DISTINCT marca FROM carros ORDER BY modelo;", "res": "ORA-01791: not a SELECTed expression", "d": "Com DISTINCT, o ORDER BY só usa colunas da lista."}, {"id": "S12", "k": "s", "f": "SELECT preco*1.1 novo FROM carros WHERE novo > 50000;", "res": "ORA-00904: \"NOVO\": invalid identifier", "d": "WHERE é avaliado antes do alias existir."}, {"id": "S13", "k": "s", "f": "SELECT marca, COUNT(*) FROM carros\nGROUP BY marca ORDER BY modelo;", "res": "ORA-00979: not a GROUP BY expression", "d": "modelo não tem valor único por grupo."}, {"id": "S14", "k": "s", "f": "SELECT marca, modelo FROM carros ORDER BY 7;", "res": "ORA-01785", "d": "Só existem 2 posições na lista de seleção."}, {"id": "S15", "k": "s", "f": "SELECT modelo, preco FROM carros\nORDER BY preco DESC FETCH FIRST 2 ROWS ONLY;", "res": "Mobi (NULL), Ranger (180000)", "d": "Em DESC o padrão é NULLS FIRST. O \"mais caro\" saiu com preço NULL."}, {"id": "S16", "k": "s", "f": "SELECT modelo, preco FROM carros\nORDER BY preco FETCH FIRST 2 ROWS WITH TIES;", "res": "Uno, Ka, Gol, Onix (4)", "d": "A 2ª linha vale 45000 e há três carros a 45000: todos entram."}, {"id": "S17", "k": "s", "f": "SELECT modelo FROM carros\nORDER BY preco FETCH FIRST 2 ROWS ONLY;", "res": "Uno + um dos três de 45000", "d": "Qual dos empatados entra é indeterminado. Para ser previsível, desempate: ORDER BY preco, id."}, {"id": "S18", "k": "s", "f": "SELECT modelo FROM carros FETCH FIRST ROWS ONLY;", "res": "1 linha qualquer", "d": "Sem número = 1 linha. Sem ORDER BY = qualquer uma."}, {"id": "S19", "k": "s", "f": "SELECT id FROM carros\nORDER BY id OFFSET 2.9 ROWS FETCH NEXT 2 ROWS ONLY;", "res": "3, 4", "d": "2.9 truncado para 2: pula 2 e devolve as 2 seguintes."}, {"id": "S20", "k": "s", "f": "SELECT id FROM carros\nORDER BY id OFFSET -5 ROWS FETCH FIRST 3 ROWS ONLY;", "res": "1, 2, 3", "d": "Offset negativo = 0."}, {"id": "S21", "k": "s", "f": "SELECT id FROM carros ORDER BY id OFFSET 50 ROWS;", "res": "0 linhas, sem erro", "d": "Offset maior que o total de linhas."}, {"id": "S22", "k": "s", "f": "SELECT id FROM carros WHERE ROWNUM = 2;", "res": "0 linhas", "d": "Nenhuma linha consegue receber ROWNUM 2."}, {"id": "S23", "k": "s", "f": "SELECT modelo, preco FROM carros\nWHERE ROWNUM <= 3 ORDER BY preco DESC;", "res": "3 carros quaisquer, ordenados", "d": "ROWNUM antes do ORDER BY. Não são os 3 mais caros."}, {"id": "S24", "k": "s", "f": "SELECT modelo FROM carros\nWHERE preco BETWEEN 45000 AND 120000;", "res": "Ka, Toro, Gol, Polo, Onix (5)", "d": "BETWEEN inclusivo: 45000 e 120000 entram."}, {"id": "S25", "k": "s", "f": "SELECT modelo FROM carros\nWHERE preco BETWEEN 120000 AND 45000;", "res": "0 linhas, sem erro", "d": "Limites invertidos."}, {"id": "S26", "k": "s", "f": "SELECT modelo FROM carros WHERE ano IN (2019, NULL);", "res": "Ka, Gol (2)", "d": "IN ignora o NULL da lista."}, {"id": "S27", "k": "s", "f": "SELECT modelo FROM carros WHERE ano NOT IN (2019, NULL);", "res": "0 linhas", "d": "ano != NULL é sempre UNKNOWN; o AND nunca fica TRUE."}, {"id": "S28", "k": "s", "f": "SELECT modelo FROM carros WHERE ano > ANY (2019, 2021);", "res": "Ranger, Toro, Onix, Mobi (4)", "d": "= ano > 2019. Polo (ano NULL) fica fora."}, {"id": "S29", "k": "s", "f": "SELECT modelo FROM carros WHERE ano > ALL (2019, 2021);", "res": "Mobi (1)", "d": "= ano > 2021."}, {"id": "S30", "k": "s", "f": "SELECT modelo FROM carros WHERE modelo LIKE '_o%';", "res": "Toro, Gol, Polo, Mobi (4)", "d": "2ª letra precisa ser 'o' minúsculo."}, {"id": "S31", "k": "s", "f": "SELECT modelo FROM carros WHERE modelo LIKE 'o%';", "res": "0 linhas", "d": "LIKE é case-sensitive. Onix começa com O maiúsculo."}, {"id": "S32", "k": "s", "f": "SELECT modelo FROM carros ORDER BY ano;", "res": "... Mobi (2022), Polo (NULL) por último", "d": "ASC = NULLS LAST."}, {"id": "S33", "k": "s", "f": "SELECT marca, modelo, preco FROM carros\nORDER BY marca, preco DESC;", "res": "Chevrolet Onix | Fiat Mobi, Toro, Uno | Ford Ranger, Ka | VW Polo, Gol", "d": "marca ASC; preco DESC dentro de cada marca; Mobi (NULL) primeiro na Fiat."}, {"id": "S34", "k": "s", "f": "WHERE marca = &marca   -- usuário digita Ford", "res": "ORA-00904: \"FORD\": invalid identifier", "d": "Vira marca = Ford. Faltaram aspas simples."}, {"id": "S35", "k": "s", "f": "SELECT &col, &col FROM carros;", "res": "Pede o valor 2 vezes", "d": "& não guarda o valor."}, {"id": "S36", "k": "s", "f": "SELECT &&col FROM carros;\n-- depois, na mesma sessão:\nSELECT &col FROM carros;", "res": "O 2º não pergunta", "d": "&& definiu col. Limpar com UNDEFINE col."}, {"id": "S37", "k": "s", "f": "WHERE dt_contrat BETWEEN DATE '2021-01-01'\n                     AND DATE '2021-12-01'\n-- contratado em 01/12/2021 14:30", "res": "Fica de fora", "d": "O limite superior é 01/12 00:00:00."}], "mm": {"ct": "SELECT", "cs": "selecionar · restringir · ordenar", "branches": [{"t": "Fundamentos", "cards": "C07–C09 · C15–C18", "col": "#2f6db5", "leaves": ["Schema = objetos do usuário (mesmo nome)", "Fora de schema: DIRECTORY, ROLE, PROFILE", "DESC: coluna, NOT NULL, tipo (SQL*Plus)", "Ordem lógica: FROM → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → FETCH", "Alias: AS opcional · \"aspas duplas\"", "Alias: WHERE não · ORDER BY sim · GROUP BY 23ai"]}, {"t": "Precedência", "cards": "C01–C06", "col": "#7b4bb0", "leaves": ["Unários + - › * / › + - ||", "Mesmo nível: esquerda → direita", "'A' || 5 + 1 → ORA-01722", "Comparação › IS NULL, LIKE, BETWEEN, IN", "NOT › AND › OR", "Na dúvida: parênteses"]}, {"t": "WHERE (restringir)", "cards": "C15–C27", "col": "#c0392b", "leaves": ["Sem WHERE = todas as linhas", "Só devolve TRUE (lógica de 3 valores)", "= NULL nunca é TRUE → use IS NULL", "BETWEEN inclusivo, menor primeiro", "BETWEEN com DATE: cuidado com a hora", "NOT IN com NULL na lista → 0 linhas", "> ANY = > mínimo · > ALL = > máximo", "LIKE: _ = 1 char · % = 0+ · case-sensitive", "ESCAPE para _ e % literais"]}, {"t": "Variáveis de substituição", "cards": "C40–C47 · SQL*Plus", "col": "#b06d00", "leaves": ["&  pede sempre e descarta", "&& pede 1 vez e DEFINE", "DEFINE var = valor (tipo CHAR)", "UNDEFINE ou fim da sessão limpa", "VERIFY ON (padrão): mostra old / new", "Texto e data: '&var' entre aspas", "Não pode ser a 1ª palavra", "SET DEFINE OFF: & literal"]}, {"t": "DISTINCT | UNIQUE | ALL", "cards": "C10–C14", "col": "#1f7a55", "leaves": ["DISTINCT = UNIQUE · ALL é o padrão", "Só logo após SELECT", "Compara a linha inteira", "Todos os NULL viram 1 grupo", "ORDER BY só com colunas da lista (senão ORA-01791)"]}, {"t": "ORDER BY (ordenar)", "cards": "C48–C54", "col": "#00838f", "leaves": ["Sem ORDER BY = ordem não garantida", "Por expressão, posição ou alias", "ASC padrão · DESC vale por coluna", "ASC → NULLS LAST · DESC → NULLS FIRST", "Máx. 255 expr · não ordena LOB / LONG", "Com GROUP BY: agregação, constante, expressão do GROUP BY (senão ORA-00979)", "SIBLINGS: hierarquia (CONNECT BY)"]}, {"t": "Limitar linhas", "cards": "C28–C39", "col": "#5d6d7e", "leaves": ["LIMIT não existe no Oracle", "OFFSET / FETCH (12c+) depois do ORDER BY", "OFFSET: negativo → 0 · fração trunca", "OFFSET ≥ total ou NULL → 0 linhas", "FETCH sem número = 1 linha", "ONLY exato · WITH TIES exige ORDER BY", "ROWNUM nasce antes do ORDER BY", "ROWNUM = 2 → 0 linhas", "Top-N com ROWNUM: inline view"]}]}}, {"id": "M02", "title": "Single-Row Functions: string, número e data", "ref": "Referência para os cenários: considere SYSDATE = 15/10/2026 10:30:00 e o schema HR de exemplo", "reftxt": "HR.EMPLOYEES (colunas usadas na aula)\n FIRST_NAME  LAST_NAME  EMAIL   SALARY  HIRE_DATE   JOB_ID\n ----------  ---------  ------  ------  ----------  ------\n Steven      King       SKING    24000  17/06/2003  AD_PRES\n Neena       Kochhar    NKOCHHAR 17000  21/09/2005  AD_VP\n ...\n Obs.: no HR o EMAIL não tem '@' nem domínio.", "cards": [{"id": "V01", "k": "v", "f": "Single-row function", "pt": "Função de linha única", "d": "Recebe os valores de UMA linha e devolve UM valor por linha. 10 linhas entram, 10 saem.", "ex": "SELECT UPPER(first_name) FROM hr.employees;", "rel": "Multiple-row function"}, {"id": "V02", "k": "v", "f": "Multiple-row / Aggregate function", "pt": "Função de grupo / agregação", "d": "Recebe várias linhas e devolve um valor para o grupo: SUM, COUNT, AVG, MAX, MIN. É o contrário da single-row.", "ex": "SELECT COUNT(*) FROM hr.employees;   -- N linhas → 1", "rel": "GROUP BY"}, {"id": "V03", "k": "v", "f": "Character function", "pt": "Função de caractere", "d": "Função que recebe texto: UPPER, LOWER, INITCAP, LENGTH, SUBSTR, INSTR, REPLACE, TRIM.", "ex": "SELECT LENGTH(email) FROM hr.employees;", "rel": "String"}, {"id": "V04", "k": "v", "f": "Case conversion", "pt": "Conversão de caixa", "d": "Trocar maiúsculas e minúsculas: UPPER (tudo maiúsculo), LOWER (tudo minúsculo), INITCAP (primeira letra de cada palavra).", "ex": "SELECT INITCAP('JOÃO DA SILVA') FROM dual;  -- João Da Silva", "rel": "Case-sensitive"}, {"id": "V05", "k": "v", "f": "Substring", "pt": "Subcadeia / trecho de texto", "d": "Parte de uma string, extraída com SUBSTR a partir de uma posição.", "ex": "SELECT SUBSTR('ORACLE', 1, 3) FROM dual;   -- ORA", "rel": "SUBSTR"}, {"id": "V06", "k": "v", "f": "Occurrence", "pt": "Ocorrência", "d": "Qual aparição do trecho procurar. No INSTR, o 4º argumento: 2 = segunda vez que aparece.", "ex": "SELECT INSTR('BANANA', 'A', 1, 2) FROM dual;   -- 4", "rel": "INSTR"}, {"id": "V07", "k": "v", "f": "Leading / Trailing / Both", "pt": "À esquerda / À direita / Ambos", "d": "Lado de onde o TRIM remove o caractere. Padrão: BOTH.", "ex": "SELECT TRIM(LEADING '0' FROM '00120') FROM dual;   -- 120", "rel": "TRIM"}, {"id": "V08", "k": "v", "f": "Rounding / Truncation", "pt": "Arredondamento / Truncamento", "d": "ROUND arredonda pela regra matemática. TRUNC corta, sem arredondar.", "ex": "SELECT ROUND(7.25,1), TRUNC(7.25,1) FROM dual;   -- 7.3 | 7.2", "rel": "ROUND / TRUNC"}, {"id": "V09", "k": "v", "f": "Remainder (modulo)", "pt": "Resto da divisão", "d": "O que sobra da divisão inteira. MOD(10,3) = 1.", "ex": "SELECT MOD(employee_id, 2) FROM hr.employees;   -- 0 par, 1 ímpar", "rel": "MOD"}, {"id": "V10", "k": "v", "f": "Date arithmetic", "pt": "Aritmética de datas", "d": "DATE ± número soma ou subtrai DIAS. DATE - DATE devolve número de dias.", "ex": "SELECT SYSDATE + 7, SYSDATE - hire_date FROM hr.employees;", "rel": "SYSDATE"}, {"id": "V11", "k": "v", "f": "Nesting", "pt": "Aninhamento", "d": "Uma função dentro da outra. O Oracle avalia de dentro para fora.", "ex": "SELECT UPPER(SUBSTR('oracle',1,3)) FROM dual;   -- ORA", "rel": "Composição"}, {"id": "V12", "k": "v", "f": "DUAL", "pt": "DUAL", "d": "Tabela de 1 linha e 1 coluna do Oracle, usada para testar funções e expressões sem tocar em tabela real.", "ex": "SELECT SYSDATE FROM dual;", "rel": "Teste rápido"}, {"id": "V13", "k": "v", "f": "Function-based index", "pt": "Índice baseado em função", "d": "Índice criado sobre o resultado de uma função, para o WHERE com essa função conseguir usar índice.", "ex": "CREATE INDEX emp_upper_ln_ix ON hr.employees (UPPER(last_name));", "rel": "Sargable"}, {"id": "C01", "k": "c", "sec": "Conceito de single-row function", "f": "O que é uma single-row function?", "a": "Função que age linha a linha: cada linha de entrada gera exatamente um resultado. Não agrupa dados.", "why": "É o oposto da função de grupo (SUM, COUNT, AVG), que transforma várias linhas em um valor só.", "ex": "SELECT first_name, UPPER(first_name) FROM hr.employees;   -- 107 linhas → 107 linhas\nSELECT COUNT(*) FROM hr.employees;                         -- 107 linhas → 1", "trap": "Na prova, \"retorna um resultado por linha\" = single-row. \"Retorna um resultado por grupo\" = aggregate.", "tag": ""}, {"id": "C02", "k": "c", "sec": "Conceito de single-row function", "f": "Em quais cláusulas posso usar single-row functions?", "a": "SELECT e WHERE (os dois vistos na aula), e também ORDER BY, GROUP BY e HAVING.", "why": "", "ex": "SELECT INITCAP(last_name) FROM hr.employees\nWHERE UPPER(job_id) LIKE '%MAN%'\nORDER BY LENGTH(last_name);", "trap": "", "tag": "complemento: ORDER BY, GROUP BY e HAVING não estão nos slides"}, {"id": "C03", "k": "c", "sec": "Conceito de single-row function", "f": "Como o Oracle avalia funções aninhadas?", "a": "De dentro para fora. O resultado da função interna vira o argumento da externa.", "why": "", "ex": "INITCAP(first_name || ' ' || last_name)\n-- 1º concatena: 'steven KING'\n-- 2º INITCAP:   'Steven King'", "trap": "Conte os parênteses. Questões de prova aninham 3 ou 4 funções para você errar a ordem.", "tag": ""}, {"id": "C04", "k": "c", "sec": "Conceito de single-row function", "f": "O que a maioria das funções devolve quando recebe NULL?", "a": "NULL. Exceções importantes: o operador || trata NULL como texto vazio; REPLACE e NVL/COALESCE também têm tratamento próprio.", "why": "", "ex": "SELECT UPPER(NULL), LENGTH(NULL) FROM dual;   -- NULL | NULL\nSELECT 'Ana' || NULL || 'Lima' FROM dual;     -- AnaLima", "trap": "", "tag": "complemento"}, {"id": "C05", "k": "c", "sec": "String: caixa e tamanho", "f": "UPPER, LOWER e INITCAP: o que cada uma faz?", "a": "UPPER: tudo maiúsculo. LOWER: tudo minúsculo. INITCAP: primeira letra de cada palavra maiúscula e o RESTO minúsculo. Palavra = sequência separada por espaço ou caractere não alfanumérico.", "why": "", "ex": "SELECT UPPER('Oracle'), LOWER('Oracle'), INITCAP('joão da SILVA') FROM dual;\n-- ORACLE | oracle | João Da Silva", "trap": "INITCAP não só sobe a primeira letra: ele também DESCE as demais. 'SILVA' vira 'Silva', 'McDonald' vira 'Mcdonald'.", "tag": ""}, {"id": "C06", "k": "c", "sec": "String: caixa e tamanho", "f": "Para que serve UPPER/LOWER no WHERE?", "a": "Fazer busca sem diferenciar maiúscula de minúscula, já que comparação de texto no Oracle é case-sensitive.", "why": "", "ex": "WHERE UPPER(last_name) = 'KING'      -- acha King, KING, king\nWHERE UPPER(job_id) LIKE '%MAN%'     -- exemplo da aula", "trap": "No HR o JOB_ID já é gravado em maiúsculo, então o UPPER do exemplo da aula não muda o resultado. Só custa desempenho.", "tag": ""}, {"id": "C07", "k": "c", "sec": "String: caixa e tamanho", "f": "LENGTH: o que conta e como trata vazio?", "a": "Conta caracteres, incluindo espaços. No Oracle, string vazia ('') É NULL, então LENGTH('') = NULL, não 0.", "why": "", "ex": "SELECT LENGTH(' ab ') FROM dual;   -- 4\nSELECT LENGTH('') FROM dual;       -- NULL", "trap": "Quem vem de SQL Server ou PostgreSQL espera 0. No Oracle é NULL.", "tag": "complemento: string vazia = NULL"}, {"id": "C08", "k": "c", "sec": "String: extrair", "f": "SUBSTR: sintaxe e regras?", "a": "SUBSTR(texto, posição [, tamanho])<br>Posição começa em 1. Posição 0 é tratada como 1. Posição negativa conta do FIM para o início. Sem tamanho: vai até o final.", "why": "", "ex": "SUBSTR('ORACLE', 2, 3)   -- RAC\nSUBSTR('ORACLE', -3)     -- CLE\nSUBSTR('ORACLE', 0, 2)   -- OR\nSUBSTR(email, 1, 5)      -- exemplo da aula: 5 primeiros", "trap": "Tamanho menor que 1 devolve NULL.", "tag": ""}, {"id": "C09", "k": "c", "sec": "String: extrair", "f": "INSTR: sintaxe e retorno?", "a": "INSTR(texto, procurado [, posição_inicial [, ocorrência]])<br>Devolve a POSIÇÃO (número) onde o trecho aparece. Não achou: 0. Posição inicial negativa busca de trás para frente.", "why": "", "ex": "INSTR('BANANA', 'A')         -- 2\nINSTR('BANANA', 'A', 1, 2)   -- 4 (2ª ocorrência)\nINSTR('BANANA', 'X')         -- 0", "trap": "INSTR devolve número, não texto. E retorna 0, não NULL, quando não encontra.", "tag": ""}, {"id": "C10", "k": "c", "sec": "String: extrair", "f": "Como extrair o usuário de um e-mail (antes do @)?", "a": "Combinar SUBSTR com INSTR: corta da posição 1 até uma antes do @.", "why": "", "ex": "SELECT SUBSTR('caio@wisedb.com.br', 1, INSTR('caio@wisedb.com.br','@') - 1) FROM dual;\n-- caio", "trap": "No HR o EMAIL é 'SKING', sem @. INSTR dá 0, o tamanho vira -1 e o SUBSTR devolve NULL. Teste com o dado real, não com o que você imagina.", "tag": ""}, {"id": "C11", "k": "c", "sec": "String: limpar e montar", "f": "REPLACE: sintaxe e comportamento?", "a": "REPLACE(texto, procurado [, substituto]). Troca TODAS as ocorrências. Sem o 3º argumento, remove o trecho.", "why": "", "ex": "REPLACE('A-B-C', '-', '/')    -- A/B/C\nREPLACE('2026-10-15', '-')     -- 20261015", "trap": "É case-sensitive: REPLACE('Oracle','oracle','X') não troca nada.", "tag": ""}, {"id": "C12", "k": "c", "sec": "String: limpar e montar", "f": "TRIM: sintaxe e restrições?", "a": "TRIM([LEADING | TRAILING | BOTH] [caractere FROM] texto). Padrão: BOTH e espaço. O caractere de corte precisa ser UM único caractere.", "why": "", "ex": "TRIM('  ab  ')                  -- 'ab'\nTRIM('0' FROM '00120')          -- '12'\nTRIM(LEADING '0' FROM '00120')  -- '120'\nTRIM('ab' FROM 'abcab')         -- ORA-30001", "trap": "Para remover um conjunto de caracteres use LTRIM/RTRIM: LTRIM('xyxab','xy') = 'ab'.", "tag": "complemento: LTRIM/RTRIM"}, {"id": "C13", "k": "c", "sec": "String: limpar e montar", "f": "|| versus CONCAT?", "a": "|| aceita quantos pedaços quiser. CONCAT aceita só 2 argumentos. Os dois tratam NULL como vazio.", "why": "", "ex": "first_name || ' ' || last_name\nCONCAT(CONCAT(first_name, ' '), last_name)   -- mesma coisa", "trap": "CONCAT(a, b, c) dá ORA-00909: invalid number of arguments.", "tag": "complemento"}, {"id": "C14", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "ROUND(n, d): como arredonda?", "a": "Arredonda n para d casas decimais. d omitido = 0. Parte descartada ≥ 0,5 sobe; menor que 0,5 desce. Em NUMBER, o meio (0,5) arredonda para longe do zero.", "why": "", "ex": "ROUND(10.49, 0)   -- 10\nROUND(10.50, 0)   -- 11\nROUND(7.25, 1)    -- 7.3", "trap": "Os exemplos 10.49 e 10.50 vêm do scripts.txt da aula. Rode e confira.", "tag": ""}, {"id": "C15", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "TRUNC(n, d): como trunca?", "a": "Corta n em d casas decimais, sem arredondar. d omitido = 0. Corta sempre em direção ao zero.", "why": "", "ex": "TRUNC(10.49, 0)   -- 10\nTRUNC(10.50, 0)   -- 10\nTRUNC(7.29, 1)    -- 7.2", "trap": "", "tag": ""}, {"id": "C16", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "Quando ROUND e TRUNC dão resultados diferentes?", "a": "Só quando a parte descartada vale meia unidade ou mais (≥ 0,5 da última casa mantida). Ter decimais não basta.", "why": "ROUND(10.49) e TRUNC(10.49) dão 10 os dois, mesmo com decimais. E com d negativo há diferença mesmo em número inteiro: ROUND(1250,-2)=1300, TRUNC(1250,-2)=1200.", "ex": "ROUND(10.49,0), TRUNC(10.49,0)   -- 10 | 10   (tem decimal, mesmo resultado)\nROUND(10.50,0), TRUNC(10.50,0)   -- 11 | 10", "trap": "", "tag": "correção do material: o slide diz que a diferença aparece quando há decimais"}, {"id": "C17", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "O que faz o d negativo em ROUND/TRUNC?", "a": "Arredonda ou corta à ESQUERDA da vírgula: -1 = dezenas, -2 = centenas, -3 = milhares.", "why": "", "ex": "ROUND(1250, -2)   -- 1300\nTRUNC(1250, -2)   -- 1200\nROUND(1249, -2)   -- 1200", "trap": "Clássico de prova: ROUND(salary, -3) para arredondar salário em milhares.", "tag": "complemento"}, {"id": "C18", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "ROUND e TRUNC com número negativo?", "a": "ROUND afasta do zero no meio; TRUNC aproxima do zero.", "why": "", "ex": "ROUND(-2.5)   -- -3\nTRUNC(-2.7)   -- -2   (não -3)", "trap": "", "tag": "complemento"}, {"id": "C19", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "MOD(m, n): o que devolve?", "a": "O resto da divisão de m por n. Usos da aula: par ou ímpar, ciclos, regras condicionais. MOD(m, 0) devolve m. O sinal do resultado segue o dividendo (m).", "why": "", "ex": "MOD(10, 3)    -- 1\nMOD(10, 0)    -- 10 (não dá erro de divisão por zero)\nMOD(-7, 3)    -- -1\nWHERE MOD(employee_id, 2) = 0   -- só IDs pares", "trap": "MOD(x, 0) não gera ORA-01476 (divisor igual a zero). Já x/0 gera.", "tag": ""}, {"id": "C20", "k": "c", "sec": "Datas", "f": "O que o tipo DATE armazena?", "a": "Data E hora: século, ano, mês, dia, hora, minuto e segundo. Não tem fração de segundo (para isso existe TIMESTAMP).", "why": "É por isso que SYSDATE - hire_date dá número quebrado: a hora entra na conta.", "ex": "SELECT TO_CHAR(SYSDATE, 'DD/MM/YYYY HH24:MI:SS') FROM dual;", "trap": "O formato que aparece na tela (NLS_DATE_FORMAT) pode esconder a hora. Ela continua lá.", "tag": "complemento: TIMESTAMP"}, {"id": "C21", "k": "c", "sec": "Datas", "f": "SYSDATE: o que devolve?", "a": "Data e hora atuais do sistema operacional do SERVIDOR do banco. Não leva parênteses.", "why": "", "ex": "SELECT SYSDATE FROM dual;     -- ok\nSELECT SYSDATE() FROM dual;   -- erro", "trap": "CURRENT_DATE devolve a data no fuso da SESSÃO. Num cliente em outro fuso, SYSDATE e CURRENT_DATE diferem.", "tag": "complemento: CURRENT_DATE"}, {"id": "C22", "k": "c", "sec": "Datas", "f": "Quais operações aritméticas valem com DATE?", "a": "DATE + n → DATE (soma n dias)<br>DATE - n → DATE<br>DATE - DATE → NUMBER (dias)<br>DATE + n/24 → soma horas<br>DATE + DATE → ERRO", "why": "", "ex": "SYSDATE + 7                -- daqui a 7 dias\nSYSDATE + 2/24             -- daqui a 2 horas\nSYSDATE - hire_date        -- dias de empresa (exemplo da aula)\nSYSDATE + hire_date        -- ORA-00975", "trap": "O resultado de DATE - DATE é em DIAS, não em meses nem anos.", "tag": ""}, {"id": "C23", "k": "c", "sec": "Datas", "f": "Por que SYSDATE - hire_date dá número com fração?", "a": "SYSDATE tem hora; hire_date normalmente é meia-noite. A diferença de horas vira fração do dia.", "why": "", "ex": "-- SYSDATE = 15/10/2026 10:30\nSYSDATE - DATE '2026-10-14'          -- 1.4375\nTRUNC(SYSDATE) - DATE '2026-10-14'   -- 1\nTRUNC(SYSDATE - hire_date)           -- dias inteiros", "trap": "", "tag": ""}, {"id": "C24", "k": "c", "sec": "Datas", "f": "ADD_MONTHS(d, n): regras?", "a": "Soma n meses à data (n negativo subtrai). Se d é o último dia do mês, ou se o mês de destino tem menos dias, o resultado é o ÚLTIMO dia do mês de destino.", "why": "", "ex": "ADD_MONTHS(DATE '2026-01-15', 6)    -- 15/07/2026\nADD_MONTHS(DATE '2024-01-31', 1)    -- 29/02/2024\nADD_MONTHS(DATE '2024-04-30', 1)    -- 31/05/2024 (último → último)\nADD_MONTHS(SYSDATE, -60)            -- 5 anos atrás", "trap": "30/04 + 1 mês não é 30/05: é 31/05, porque 30/04 é o último dia de abril.", "tag": ""}, {"id": "C25", "k": "c", "sec": "Datas", "f": "MONTHS_BETWEEN(d1, d2): regras?", "a": "Meses entre d1 e d2. Positivo se d1 for posterior; negativo se anterior. Dá inteiro quando os dias do mês coincidem (ou ambos são último dia). Fora isso, a fração considera mês de 31 dias.", "why": "", "ex": "MONTHS_BETWEEN(DATE '2026-03-15', DATE '2026-01-15')   -- 2\nMONTHS_BETWEEN(DATE '2026-01-15', DATE '2026-03-15')   -- -2", "trap": "A ordem dos argumentos importa. Inverter dá número negativo e o filtro > 60 nunca é verdade.", "tag": ""}, {"id": "C26", "k": "c", "sec": "Datas", "f": "TRUNC e ROUND em datas?", "a": "TRUNC(data) zera a hora (meia-noite). Com formato: 'MM' = 1º dia do mês, 'YYYY' = 1º dia do ano. ROUND(data) arredonda para o dia mais próximo (meio-dia vira o dia seguinte).", "why": "", "ex": "TRUNC(SYSDATE)          -- 15/10/2026 00:00:00\nTRUNC(SYSDATE, 'MM')    -- 01/10/2026\nTRUNC(SYSDATE, 'YYYY')  -- 01/01/2026", "trap": "", "tag": "complemento: formatos e ROUND(data)"}, {"id": "C27", "k": "c", "sec": "Datas", "f": "O que significa \"datas não são texto\"?", "a": "Compare DATE com DATE. Use literal DATE 'AAAA-MM-DD' ou TO_DATE com máscara. Comparar com string depende do NLS_DATE_FORMAT da sessão.", "why": "", "ex": "WHERE hire_date >= DATE '2020-01-01'                  -- certo\nWHERE hire_date >= TO_DATE('01/01/2020','DD/MM/YYYY') -- certo\nWHERE hire_date >= '01/01/2020'                       -- depende da sessão", "trap": "Funciona no seu SQL Developer e quebra no job do cliente com outro NLS.", "tag": ""}, {"id": "C28", "k": "c", "sec": "Datas", "f": "Como calcular tempo de empresa em anos?", "a": "TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date) / 12, 1): meses entre as datas, divididos por 12, cortados com 1 casa.", "why": "É melhor que (SYSDATE - hire_date)/365, que erra por causa dos anos bissextos.", "ex": "SELECT hire_date,\n       TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1) AS anos_empresa\nFROM hr.employees;", "trap": "TRUNC aqui é o TRUNC numérico (o argumento já é número), não o de data.", "tag": ""}, {"id": "C29", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "Qual o impacto de função sobre coluna no WHERE?", "a": "Aplicar função na COLUNA impede o uso normal de um índice B-tree nela. O Oracle tende a fazer full table scan.", "why": "O índice guarda o valor original da coluna, não o resultado da função.", "ex": "WHERE TRUNC(hire_date) = DATE '2020-01-15'           -- não usa índice em hire_date\nWHERE hire_date >= DATE '2020-01-15'\n  AND hire_date <  DATE '2020-01-16'                  -- usa", "trap": "Regra prática: deixe a coluna \"limpa\" e aplique a função do lado do valor.", "tag": ""}, {"id": "C30", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "O que é índice baseado em função?", "a": "Índice criado sobre a expressão, não sobre a coluna. O WHERE com a mesma expressão passa a poder usar o índice.", "why": "", "ex": "CREATE INDEX emp_upper_ln_ix ON hr.employees (UPPER(last_name));\nSELECT * FROM hr.employees WHERE UPPER(last_name) = 'KING';   -- pode usar o índice", "trap": "A expressão no WHERE precisa ser idêntica à do índice.", "tag": "complemento"}, {"id": "C31", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "Como reescrever o filtro do desafio para usar índice em hire_date?", "a": "Trocar <code>MONTHS_BETWEEN(SYSDATE, hire_date) &gt; 60<\/code> por <code>hire_date &lt; ADD_MONTHS(SYSDATE, -60)<\/code>. A função passa para o lado do valor e a coluna fica limpa.", "why": "", "ex": "WHERE hire_date < ADD_MONTHS(SYSDATE, -60)", "trap": "Na tabela HR (107 linhas) não faz diferença. Numa tabela de milhões de linhas de cliente, faz.", "tag": "complemento: visão de DBA"}, {"id": "C32", "k": "c", "sec": "Projeto RH (desafio da aula)", "f": "Qual função atende cada requisito do relatório de RH?", "a": "Nome formatado → INITCAP(first_name || ' ' || last_name)<br>E-mail resumido → SUBSTR(email, 1, 5) || '...'<br>Salário sem decimais → ROUND(salary, 0)<br>Anos de empresa com 1 casa → TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1)<br>Mais de 5 anos → WHERE MONTHS_BETWEEN(SYSDATE, hire_date) &gt; 60", "why": "", "ex": "SELECT INITCAP(first_name || ' ' || last_name)              AS nome,\n       SUBSTR(email, 1, 5) || '...'                        AS email_resumido,\n       ROUND(salary, 0)                                    AS salario,\n       TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date) / 12, 1)   AS anos_empresa\nFROM hr.employees\nWHERE MONTHS_BETWEEN(SYSDATE, hire_date) > 60;", "trap": "", "tag": ""}, {"id": "C33", "k": "c", "sec": "Projeto RH (desafio da aula)", "f": "Por que o desafio repete o MONTHS_BETWEEN no WHERE em vez de usar anos_empresa?", "a": "Alias criado no SELECT não existe no WHERE: ORA-00904. O WHERE é avaliado antes da lista de seleção (Módulo 01).", "why": "", "ex": "WHERE anos_empresa > 5   -- ORA-00904: \"ANOS_EMPRESA\": invalid identifier", "trap": "Questão que junta os dois módulos.", "tag": ""}, {"id": "S01", "k": "s", "f": "SELECT ROUND(10.49,0), TRUNC(10.49,0) FROM dual;", "res": "10 | 10", "d": "Parte descartada 0,49 é menor que 0,5: os dois dão 10."}, {"id": "S02", "k": "s", "f": "SELECT ROUND(10.50,0), TRUNC(10.50,0) FROM dual;", "res": "11 | 10", "d": "0,50 sobe no ROUND; TRUNC só corta."}, {"id": "S03", "k": "s", "f": "SELECT ROUND(7.25,1), TRUNC(7.25,1) FROM dual;", "res": "7.3 | 7.2", "d": "1 casa decimal."}, {"id": "S04", "k": "s", "f": "SELECT ROUND(1250,-2), TRUNC(1250,-2) FROM dual;", "res": "1300 | 1200", "d": "d negativo age nas centenas."}, {"id": "S05", "k": "s", "f": "SELECT ROUND(-2.5), TRUNC(-2.7) FROM dual;", "res": "-3 | -2", "d": "ROUND afasta do zero; TRUNC aproxima."}, {"id": "S06", "k": "s", "f": "SELECT MOD(10,3), MOD(10,0), MOD(-7,3) FROM dual;", "res": "1 | 10 | -1", "d": "MOD por zero devolve o dividendo; sinal segue o dividendo."}, {"id": "S07", "k": "s", "f": "SELECT SUBSTR('ORACLE',2,3) FROM dual;", "res": "RAC", "d": "Da posição 2, 3 caracteres."}, {"id": "S08", "k": "s", "f": "SELECT SUBSTR('ORACLE',-3) FROM dual;", "res": "CLE", "d": "Negativo conta do fim; sem tamanho vai até o final."}, {"id": "S09", "k": "s", "f": "SELECT SUBSTR('ORACLE',0,2) FROM dual;", "res": "OR", "d": "Posição 0 é tratada como 1."}, {"id": "S10", "k": "s", "f": "SELECT INSTR('BANANA','A',1,2), INSTR('BANANA','X') FROM dual;", "res": "4 | 0", "d": "2ª ocorrência de A está na posição 4. Não achou = 0."}, {"id": "S11", "k": "s", "f": "SELECT INITCAP('joão da SILVA') FROM dual;", "res": "João Da Silva", "d": "Sobe a 1ª letra e desce o resto de cada palavra."}, {"id": "S12", "k": "s", "f": "SELECT LENGTH(' ab '), LENGTH('') FROM dual;", "res": "4 | NULL", "d": "Espaços contam. String vazia é NULL no Oracle."}, {"id": "S13", "k": "s", "f": "SELECT 'Ana' || NULL || 'Lima' FROM dual;", "res": "AnaLima", "d": "|| trata NULL como vazio."}, {"id": "S14", "k": "s", "f": "SELECT REPLACE('2026-10-15','-') FROM dual;", "res": "20261015", "d": "Sem 3º argumento, remove."}, {"id": "S15", "k": "s", "f": "SELECT TRIM('0' FROM '00120') FROM dual;", "res": "12", "d": "BOTH é o padrão: tira zeros dos dois lados."}, {"id": "S16", "k": "s", "f": "SELECT TRIM('ab' FROM 'abcab') FROM dual;", "res": "ORA-30001", "d": "TRIM só aceita um caractere de corte."}, {"id": "S17", "k": "s", "f": "SELECT SUBSTR('SKING',1,INSTR('SKING','@')-1) FROM dual;", "res": "NULL", "d": "INSTR = 0 → tamanho -1 → NULL. E-mail do HR não tem
