Entre YEAR TO MONTH e DAY TO SECOND: erro.", "why": "", "ex": "INTERVAL '1' DAY - INTERVAL '1' SECOND     -- +00 23:59:59\nINTERVAL '1' YEAR - INTERVAL '1' MONTH     -- +00-11\nINTERVAL '1' YEAR - INTERVAL '1' SECOND    -- ORA-30081", "trap": "", "tag": ""}, {"id": "C22", "k": "c", "sec": "Prática Hotéis Aconchego", "f": "Q1: o filtro do \"mês passado\" está seguro?", "a": "Usa BETWEEN ADD_MONTHS(TRUNC(SYSDATE,'MM'),-1) AND LAST_DAY(ADD_MONTHS(SYSDATE,-1)). O LAST_DAY mantém a HORA atual: entradas no último dia depois desse horário ficam de fora. E como os dados vão só até 12/2023, hoje a consulta volta vazia.", "why": "", "ex": "WHERE data_entrada >= ADD_MONTHS(TRUNC(SYSDATE, 'MM'), -1)\n  AND data_entrada <  TRUNC(SYSDATE, 'MM')", "trap": "Intervalo semiaberto (>= início e < início do próximo) é a forma segura com datas.", "tag": "complemento: ajuste na prática resolvida"}, {"id": "C23", "k": "c", "sec": "Prática Hotéis Aconchego", "f": "Q2: a 3ª versão (TO_CHAR por MM/YYYY) funciona?", "a": "Não. Agrupa por TO_CHAR(data_reserva, 'MM/YYYY') mas ordena por data_reserva, que não está no GROUP BY: ORA-00979 (Módulo 05).", "why": "", "ex": "GROUP BY TO_CHAR(data_reserva, 'MM/YYYY')\nORDER BY MIN(data_reserva) DESC   -- ordena pelo mês, válido", "trap": "", "tag": "correção do material: ORA-00979 na prática resolvida"}, {"id": "C24", "k": "c", "sec": "Prática Hotéis Aconchego", "f": "Q4 e Q6: o que acontece se rodar o script resolvido inteiro?", "a": "Cada questão tem DOIS UPDATEs iguais (o segundo com subquery). Rodando os dois, a alteração é aplicada duas vezes: Anna entra 2 dias depois, e Richard vai para o sábado da semana seguinte (29/07 em vez de 22/07). O 1º UPDATE da Q6 também esquece de gravar noites_estadia = 6.", "why": "", "ex": "-- Richard: entrada 15/07/2023 já é sábado\nNEXT_DAY(15/07/2023, 'SÁBADO') = 22/07/2023\nNEXT_DAY(22/07/2023, 'SÁBADO') = 29/07/2023", "trap": "Rode só um UPDATE por questão e confira com SELECT antes do COMMIT.", "tag": "correção do material: UPDATE duplicado"}, {"id": "C25", "k": "c", "sec": "Prática Hotéis Aconchego", "f": "No UPDATE, o SET enxerga o valor antigo ou o novo?", "a": "O antigo. Todas as expressões do SET usam os valores da linha ANTES da alteração. Por isso data_saida = data_entrada + noites + 1 dá certo mesmo com data_entrada sendo alterada no mesmo comando.", "why": "", "ex": "UPDATE reservas\nSET data_entrada = data_entrada + 1,\n    data_saida   = data_entrada + noites_estadia + 1   -- usa a entrada antiga\nWHERE id_reserva = 35;", "trap": "", "tag": "complemento"}, {"id": "C26", "k": "c", "sec": "Prática Hotéis Aconchego", "f": "Os dados da prática são consistentes?", "a": "Não. Em 41 das 80 reservas, a data de saída é anterior à de entrada (ex.: Benjamin Lee entra em 28/07/2022 e sai em 13/10/2020). As questões usam noites_estadia, por isso não percebem.", "why": "", "ex": "SELECT COUNT(*) FROM reservas WHERE data_saida < data_entrada;   -- 41", "trap": "Qualquer cálculo com data_saida - data_entrada nessa tabela dá número negativo.", "tag": "complemento"}, {"id": "S01", "k": "s", "f": "SELECT NEXT_DAY(SYSDATE, 'SEGUNDA') FROM dual;", "res": "19/10/2026 10:30", "d": "Próxima segunda, mantendo a hora."}, {"id": "S02", "k": "s", "f": "SELECT NEXT_DAY(SYSDATE, 'MONDAY') FROM dual;\n-- sessão em português", "res": "ORA-01846", "d": "Nome do dia no idioma errado."}, {"id": "S03", "k": "s", "f": "SELECT TO_DATE('10-SEP-2014', 'DD-MON-YYYY') FROM dual;\n-- sessão em português", "res": "ORA-01843", "d": "Em português o mês é 'SET'."}, {"id": "S04", "k": "s", "f": "-- sessão em inglês\nNEXT_DAY(TO_DATE('15-JAN-2024 15:12','DD-MON-YYYY HH24:MI'), 'SUNDAY')", "res": "21-JAN-2024 15:12", "d": "15/01/2024 é segunda."}, {"id": "S05", "k": "s", "f": "SELECT LAST_DAY(TO_DATE('18-02-24', 'DD-MM-RR')) FROM dual;", "res": "29/02/2024", "d": "2024 é bissexto."}, {"id": "S06", "k": "s", "f": "SELECT ADD_MONTHS(TO_DATE('25/12/23', 'DD/MM/RR'), 12) FROM dual;", "res": "25/12/2024", "d": ""}, {"id": "S07", "k": "s", "f": "SELECT ADD_MONTHS(DATE '2023-01-31', 1) FROM dual;", "res": "28/02/2023", "d": "Ajusta para o fim do mês."}, {"id": "S08", "k": "s", "f": "SELECT DATE '2023-01-31' + INTERVAL '1' MONTH FROM dual;", "res": "ORA-01839", "d": "31/02 não existe."}, {"id": "S09", "k": "s", "f": "SELECT TO_DATE('01/01/95','DD/MM/YY'), TO_DATE('01/01/95','DD/MM/RR') FROM dual;", "res": "01/01/2095 | 01/01/1995", "d": ""}, {"id": "S10", "k": "s", "f": "SELECT EXTRACT(YEAR FROM SYSDATE) FROM dual;", "res": "2026", "d": ""}, {"id": "S11", "k": "s", "f": "SELECT EXTRACT(HOUR FROM SYSDATE) FROM dual;", "res": "ORA-30076", "d": "HOUR só de TIMESTAMP."}, {"id": "S12", "k": "s", "f": "SELECT TRUNC(SYSDATE,'MM'), TRUNC(SYSDATE,'YY') FROM dual;", "res": "01/10/2026 | 01/01/2026", "d": ""}, {"id": "S13", "k": "s", "f": "SELECT TRUNC(SYSDATE, 'DAY') FROM dual;", "res": "11/10/2026", "d": "Domingo anterior (território Brasil)."}, {"id": "S14", "k": "s", "f": "SELECT ROUND(SYSDATE,'MM'), ROUND(SYSDATE,'YY') FROM dual;", "res": "01/10/2026 | 01/01/2027", "d": "Dia 15 não sobe o mês; outubro sobe o ano."}, {"id": "S15", "k": "s", "f": "SELECT SYSDATE + 1.5 FROM dual;", "res": "17/10/2026 22:30", "d": "1 dia e 12 horas."}, {"id": "S16", "k": "s", "f": "SELECT TO_DATE('01/01/2023','DD/MM/YYYY') + 1/24 FROM dual;", "res": "01/01/2023 01:00", "d": ""}, {"id": "S17", "k": "s", "f": "SELECT TO_DATE('01/01/2023','DD/MM/YYYY') + INTERVAL '2-2' YEAR TO MONTH FROM dual;", "res": "01/03/2025", "d": "2 anos e 2 meses."}, {"id": "S18", "k": "s", "f": "SELECT TO_DATE('01/01/2023','DD/MM/YYYY') + INTERVAL '1' MONTH\n       + INTERVAL '1' DAY - INTERVAL '3' SECOND FROM dual;", "res": "01/02/2023 23:59:57", "d": "01/02 + 1 dia = 02/02 00:00, menos 3 segundos."}, {"id": "S19", "k": "s", "f": "SELECT INTERVAL '1' DAY - INTERVAL '1' SECOND FROM dual;", "res": "+00 23:59:59", "d": ""}, {"id": "S20", "k": "s", "f": "SELECT INTERVAL '1' YEAR - INTERVAL '1' MONTH FROM dual;", "res": "+00-11", "d": "11 meses."}, {"id": "S21", "k": "s", "f": "SELECT INTERVAL '1' YEAR - INTERVAL '1' SECOND FROM dual;", "res": "ORA-30081", "d": "Tipos de intervalo diferentes."}, {"id": "S22", "k": "s", "f": "INSERT em coluna INTERVAL YEAR TO MONTH:\nINTERVAL '120-6' YEAR(3) TO MONTH", "res": "ORA-01873", "d": "A coluna tem precisão 2 (até 99 anos)."}, {"id": "S23", "k": "s", "f": "SELECT INTERVAL '03:70' HOUR TO MINUTE FROM dual;", "res": "Erro (minuto inválido)", "d": "Campo à direita fora da faixa 0 a 59."}, {"id": "S24", "k": "s", "f": "SELECT DATE '2026-10-15' - DATE '2026-10-01' FROM dual;", "res": "14", "d": "DATE - DATE = número de dias."}, {"id": "S25", "k": "s", "f": "Prática Q1 executada hoje (2026)", "res": "0 linhas", "d": "Os dados vão só até 12/2023."}, {"id": "S26", "k": "s", "f": "Prática Q2, 3ª versão:\nGROUP BY TO_CHAR(data_reserva,'MM/YYYY') ORDER BY data_reserva DESC", "res": "ORA-00979", "d": "data_reserva não está no GROUP BY."}, {"id": "S27", "k": "s", "f": "Prática Q4: Anna depois de rodar os DOIS UPDATEs", "res": "Entrada 21/07/2023 · saída 27/07/2023", "d": "Deveria ser 20/07 e 26/07."}, {"id": "S28", "k": "s", "f": "Prática Q6: Richard depois do 1º UPDATE", "res": "Entrada 22/07/2023 · noites 4", "d": "Entrada certa, mas noites não foi alterado."}, {"id": "S29", "k": "s", "f": "Prática Q6: Richard depois dos DOIS UPDATEs", "res": "Entrada 29/07/2023 · saída 04/08/2023", "d": "Pulou mais uma semana."}, {"id": "E01", "k": "e", "f": "SELECT SYSDATE, EXTRAC(YEAR FROM SYSDATE) AS ano\nFROM dual;", "res": "Nome digitado errado (ORA-00907)", "fix": "SELECT SYSDATE, EXTRACT(YEAR FROM SYSDATE) AS ano\nFROM dual;", "d": "Faltou o T. Sem reconhecer EXTRACT, o Oracle estranha o FROM dentro do parêntese."}, {"id": "E02", "k": "e", "f": "SELECT MONTHS_BETWEEN(SYSDATE AND TO_DATE('03/01/2026'))\nFROM dual;", "res": "AND no lugar da vírgula (ORA-00909)", "fix": "SELECT MONTHS_BETWEEN(SYSDATE, TO_DATE('03/01/2026', 'DD/MM/YYYY'))\nFROM dual;", "d": "Função usa vírgula. E informe sempre a máscara no TO_DATE."}, {"id": "E03", "k": "e", "f": "SELECT EXTRACT(YEAR, SYSDATE) FROM dual;", "res": "Vírgula no lugar do FROM", "fix": "SELECT EXTRACT(YEAR FROM SYSDATE) FROM dual;", "d": "EXTRACT é das funções que usam palavra-chave (FROM) e não vírgula."}, {"id": "E04", "k": "e", "f": "SELECT EXTRACT(HOUR FROM SYSDATE) FROM dual;", "res": "HOUR de DATE (ORA-30076)", "fix": "SELECT EXTRACT(HOUR FROM SYSTIMESTAMP) FROM dual;", "d": "HOUR, MINUTE e SECOND só de TIMESTAMP."}, {"id": "E05", "k": "e", "f": "SELECT DATE '03/01/2026' FROM dual;", "res": "Literal DATE fora do formato (ORA-01861)", "fix": "SELECT DATE '2026-01-03' FROM dual;", "d": "O literal DATE só aceita AAAA-MM-DD."}, {"id": "E06", "k": "e", "f": "SELECT TO_DATE('03/01/2026') FROM dual;", "res": "Sem máscara: depende da sessão", "fix": "SELECT TO_DATE('03/01/2026', 'DD/MM/YYYY') FROM dual;", "d": "Sem máscara pode virar 1º de março ou dar ORA-01843 / ORA-01861."}, {"id": "E07", "k": "e", "f": "SELECT SYSDATE + INTERVAL 1 DAY FROM dual;", "res": "Número do INTERVAL sem aspas", "fix": "SELECT SYSDATE + INTERVAL '1' DAY FROM dual;", "d": "O valor do INTERVAL vai entre aspas simples."}, {"id": "E08", "k": "e", "f": "SELECT NEXT_DAY(SYSDATE, 'MONDAY') FROM dual;\n-- sessão em português", "res": "Dia no idioma errado (ORA-01846)", "fix": "SELECT NEXT_DAY(SYSDATE, 'SEGUNDA') FROM dual;", "d": "O nome do dia segue o NLS_DATE_LANGUAGE."}, {"id": "E09", "k": "e", "f": "WHERE data_pedido BETWEEN DATE '2026-01-01'\n                      AND DATE '2026-01-31'", "res": "Sem erro, mas perde o dia 31 depois da meia-noite", "fix": "WHERE data_pedido >= DATE '2026-01-01'\n  AND data_pedido <  DATE '2026-02-01'", "d": "DATE '2026-01-31' é 31/01 às 00:00."}], "mm": {"ct": "Datas e Horas", "cs": "NLS · tipos · funções · intervalos", "branches": [{"t": "Parâmetros NLS", "cards": "C01–C03", "col": "#002b5c", "leaves": ["NLS_DATABASE / NLS_SESSION_PARAMETERS", "Vale o da sessão (ALTER SESSION)", "NLS_DATE_  "Para hora de um DATE, use TO_CHAR ou converta para TIMESTAMP."], ["SYSDATE x CURRENT_DATE", "ALTER SESSION SET NLS_DATE_FORMAT = 'DD/MM/YYYY HH24:MI:SS';\nALTER SESSION SET TIME_ZONE = '-8:00';\nSELECT SYSDATE, CURRENT_DATE FROM dual;", "As duas colunas mostram horas diferentes.", "SYSDATE é a hora do servidor; CURRENT_DATE é a do fuso da sessão."], ["O idioma da sessão muda o NEXT_DAY", "ALTER SESSION SET NLS_DATE_LANGUAGE = 'ENGLISH';\nSELECT NEXT_DAY(SYSDATE, 'MONDAY') FROM dual;\nALTER SESSION SET NLS_DATE_LANGUAGE = 'BRAZILIAN PORTUGUESE';\nSELECT NEXT_DAY(SYSDATE, 'MONDAY') FROM dual;\nSELECT NEXT_DAY(SYSDATE, 'SEGUNDA') FROM dual;", "'MONDAY' funciona em inglês e dá ORA-01846 em português, onde vale 'SEGUNDA'.", "Nomes de dia e mês seguem o NLS_DATE_LANGUAGE."], ["ADD_MONTHS x somar INTERVAL", "SELECT ADD_MONTHS(DATE '2023-01-31', 1) FROM dual;\nSELECT DATE '2023-01-31' + INTERVAL '1' MONTH FROM dual;", "ADD_MONTHS devolve 28/02/2023. A soma com INTERVAL dá ORA-01839.", "Para somar meses, prefira ADD_MONTHS."]]}]</script>
<script>
(function(){
const MODS = JSON.parse(document.getElementById('data').textContent);
const KEY='estudos-oracle:v1';
let st={marks:{},mod:MODS[0].id,view:'map',kind:'all',show:'all',shuffle:false};
try{const s=localStorage.getItem(KEY); if(s) st=Object.assign(st,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pre=s=>s?`<pre>${esc(s)}</pre>`:'';
let deck=[], pos=0;
function mod(){return MODS.find(m=>m.id===st.mod)||MODS[0];}
function mk(m,c){return st.marks[m.id+':'+c.id];}
function statsOf(m){let o=0,e=0;m.cards.forEach(c=>{const k=mk(m,c);if(k==='o')o++;else if(k==='e')e++;});return{o,e,t:m.cards.length};}
function renderNav(){
  const el=document.getElementById('modlist');
  el.innerHTML=MODS.map(m=>{const s=statsOf(m);
    return `<button class="modbtn" data-m="${m.id}" aria-current="${m.id===st.mod}">
      <span class="mid">${m.id.replace('M','Módulo ')}</span><span class="mt">${esc(m.title)}</span>
      <span class="bar"><i class="o" style="width:${s.o/s.t*100}%"></i><i class="e" style="width:${s.e/s.t*100}%"></i></span>
      <span class="stat mono" style="font-family:inherit">${s.o} acertos, ${s.e} erros de ${s.t} cards</span></button>`;}).join('');
  el.querySelectorAll('.modbtn').forEach(b=>b.onclick=()=>{st.mod=b.dataset.m;pos=0;save();render();window.scrollTo(0,0);});
}
function buildDeck(){
  const m=mod();
  deck=m.cards.filter(c=>(st.kind==='all'||c.k===st.kind)&&(st.show==='all'||(st.show==='err'&&mk(m,c)==='e')||(st.show==='new'&&!mk(m,c))));
  if(st.shuffle){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}
  if(pos>=deck.length)pos=0;
}
function tagHtml(c){ return c.tag?`<span class="tag ${c.tag.startsWith('correção')?'w':'x'}">${esc(c.tag)}</span>`:''; }
function front(c){
  if(c.k==='v')return `<span class="num">${c.id}</span><span class="en">${esc(c.f)}</span>`;
  if(c.k==='c')return `<span class="num">${c.id}</span><span class="q">${c.f}</span>${tagHtml(c)}`;
  if(c.k==='e')return `<span class="num">${c.id}</span><span class="q">O que está errado?</span>${pre(c.f)}`;
  return `<span class="num">${c.id}</span>${pre(c.f)}`;
}
function back(c){
  if(c.k==='v')return `<div class="pt">${esc(c.pt)}</div><div class="txt">${esc(c.d)}</div><div class="lab">Exemplo</div>${pre(c.ex)}${c.rel?`<div class="rel">Relacionado: ${esc(c.rel)}</div>`:''}`;
  if(c.k==='c'){let h=`<div class="lab">Resposta</div><div class="txt">${c.a}</div>`;
    if(c.why)h+=`<div class="lab">Por quê</div><div class="txt">${c.why}</div>`;
    if(c.ex)h+=`<div class="lab">Exemplo</div>${pre(c.ex)}`;
    if(c.trap)h+=`<div class="lab t">Pegadinha</div><div class="txt trap">${c.trap}</div>`;
    return h;}
  if(c.k==='e')return `<div class="res">${esc(c.res)}</div><div class="lab">Correto</div>${pre(c.fix)}<div class="txt" style="margin-top:6px">${esc(c.d)}</div>`;
  return `<div class="res">${esc(c.res)}</div><div class="txt">${esc(c.d)}</div>`;
}
const LEG=`<div class="legend">Frente na faixa azul, verso abaixo da linha tracejada. Cada conceito traz Resposta, Por quê, Exemplo e Pegadinha. <b class="w">Vermelho</b> = correção do material. <b class="x">Verde</b> = complemento fora dos slides, cobrado em prova ou relevante na rotina de DBA.</div>`;
const KN={v:'Vocabulário',c:'Conceito',s:'Cenário',e:'Ache o erro'};
function renderStudy(m){
  buildDeck();
  const filters=`<div class="filters">
    <label>Tipo <select id="fk"><option value="all">Todos</option><option value="v">Vocabulário</option><option value="c">Conceitos</option><option value="s">Cenários</option><option value="e">Ache o erro</option></select></label>
    <label>Mostrar <select id="fs"><option value="all">Todos os cards</option><option value="err">Só os que errei</option><option value="new">Só os que não vi</option></select></label>
    <label><input type="checkbox" id="fsh"> Embaralhar</label></div>`;
  const ref=(st.kind==='s'||st.kind==='all')?`<details class="ref"><summary>${esc(m.ref)}</summary>${pre(m.reftxt)}</details>`:'';
  let body;
  if(!deck.length){
    body=`<div class="empty">${st.show==='err'?'Nenhum card marcado como errado neste filtro. Volte para "Todos os cards" ou escolha outro módulo.':st.show==='new'?'Você já passou por todos os cards deste filtro. Use "Só os que errei" para revisar.':'Nenhum card neste filtro.'}</div>`;
  } else {
    const c=deck[pos], k=mk(m,c);
    body=`<div class="counter"><span>Card ${pos+1} de ${deck.length}</span><span>${KN[c.k]}${c.sec?': '+esc(c.sec):''}</span></div>
    <article class="card" id="card">
      <div class="front" id="fr" role="button" tabindex="0" aria-label="Virar card">
        <div class="meta">${k?`<span class="mark ${k}">${k==='e'?'Você errou da última vez':'Você acertou da última vez'}</span>`:''}</div>
        ${front(c)}<div class="tapflip">Toque no card ou em Virar para ver a resposta</div></div>
      <div class="back">${back(c)}</div>
      <div class="actions" id="act"><button class="flip" id="bflip">Virar</button></div>
    </article>
    <div class="navrow"><button id="bprev">Anterior</button><button id="bnext">Próximo</button></div>
    <div class="keys">Atalhos: espaço vira, 1 errei, 2 acertei, setas navegam.</div>`;
  }
  return LEG+filters+ref+`<div class="deck">${body}</div><div class="reset"><button class="ghost" id="breset">Zerar progresso deste módulo</button></div>`;
}
function renderList(m){
  const want=k=>st.kind==='all'||st.kind===k;
  const card=c=>{const k=mk(m,c);return `<article class="card flipped"><div class="front" style="cursor:default">${front(c)}${k?` <span class="mark ${k}">${k==='e'?'Errou':'Acertou'}</span>`:''}</div><div class="back">${back(c)}</div></article>`;};
  let h='';
  if(want('v'))h+=`<h3 class="sech">A. Vocabulário <span>EN → PT · definição · exemplo</span></h3>`+m.cards.filter(c=>c.k==='v').map(card).join('');
  if(want('c')){h+=`<h3 class="sech">B. Conceitos <span>resposta · por quê · exemplo · pegadinha</span></h3>`;let last='';
    m.cards.filter(c=>c.k==='c').forEach(c=>{if(c.sec!==last){h+=`<h4 class="subh">${esc(c.sec)}</h4>`;last=c.sec;}h+=card(c);});}
  if(want('s'))h+=`<h3 class="sech">C. Cenários <span>preveja o resultado antes de ler o verso</span></h3><div class="refbox"><b>${esc(m.ref)}</b>${pre(m.reftxt)}</div>`+m.cards.filter(c=>c.k==='s').map(card).join('');
  if(want('e'))h+=`<h3 class="sech">D. Ache o erro <span>descubra o problema antes de ler o verso</span></h3>`+m.cards.filter(c=>c.k==='e').map(card).join('');
  const f=`<div class="filters"><label>Tipo <select id="fk"><option value="all">Todos</option><option value="v">Vocabulário</option><option value="c">Conceitos</option><option value="s">Cenários</option><option value="e">Ache o erro</option></select></label></div>`;
  return LEG+f+`<div class="deck">${h}</div>`;
}
function renderMap(m){
  const mm=m.mm;
  return `<div class="mmtop"><p class="hint" style="margin:0">Explique cada ramo em voz alta antes de abrir. Onde travar, revise os flashcards indicados.</p><div class="mmbtns"><button class="ghost" id="mmall">Abrir todos</button><button class="ghost" id="mmnone">Fechar todos</button></div></div>
  <div class="mmcenter"><div class="mmct">${esc(mm.ct)}</div><div class="mmcs">${esc(mm.cs)}</div></div>
  <div class="mmgrid" id="mmg">${mm.branches.map(b=>`<div class="mmb"><button class="mmh" aria-expanded="false" style="background:${b.col}"><span class="mmt">${esc(b.t)}</span><span class="mmc">Flashcards ${esc(b.cards)}</span><span class="mmi" aria-hidden="true">▾</span></button><ul class="mml">${b.leaves.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')}</div>`;
}
function renderLab(m){
  const L=m.lab||[];
  return `<div class="deck"><div class="legend">Experimentos para rodar no SQL*Plus ou SQL Developer. Digite os comandos (não copie), veja o resultado e só depois toque no botão para conferir o que observar e a lição. Os que criam tabela apagam no final.</div>`+
  L.map((x,i)=>`<article class="card labc"><div class="front" style="cursor:default"><span class="num">L${String(i+1).padStart(2,'0')}</span><span class="q">${esc(x[0])}</span><div class="lab" style="margin-top:8px">Digite</div>${pre(x[1])}<button class="labbtn" onclick="this.closest('.card').classList.toggle('flipped')">Rodei, mostrar o que observar</button></div><div class="back"><div class="lab">O que observar</div><div class="txt">${esc(x[2])}</div><div class="lab">Lição</div><div class="txt res" style="font-size:1rem">${esc(x[3])}</div></div></article>`).join('')+`</div>`;
}
function renderSyntax(m,qv){
  const q=(qv||'').trim().toLowerCase();
  const row=(s,mid)=>`<div class="synrow">${mid?`<span class="synmod">${mid.replace('M','Mód. ')}</span>`:''}<div class="synname">${esc(s[0])}</div><div class="lab">Como escrever</div><pre>${esc(s[1])}</pre><div class="lab">Exemplo</div><pre>${esc(s[2])}</pre></div>`;
  if(!q){
    return `<p class="hint">Forma correta de escrever cada comando do módulo. Use a busca para procurar em todos os módulos.</p>`+(m.syn||[]).map(s=>row(s)).join('');
  }
  let out=[];
  MODS.forEach(mm=>(mm.syn||[]).forEach(s=>{ if((s[0]+' '+s[1]+' '+s[2]).toLowerCase().includes(q)) out.push(row(s,mm.id)); }));
  return out.length?`<p class="hint">${out.length} resultado(s) para "${esc(qv.trim())}".</p>`+out.join(''):`<div class="empty">Nada encontrado para "${esc(qv.trim())}". Tente parte do nome, como "month" ou "trim".</div>`;
}
function flip(){
  const card=document.getElementById('card'); if(!card||card.classList.contains('flipped'))return;
  card.classList.add('flipped');
  document.getElementById('act').innerHTML=`<button class="bad" id="bbad">Errei</button><button class="good" id="bgood">Acertei</button>`;
  document.getElementById('bbad').onclick=()=>markIt('e'); document.getElementById('bgood').onclick=()=>markIt('o');
  document.getElementById('bbad').focus();
}
function markIt(v){
  const m=mod(), c=deck[pos]; st.marks[m.id+':'+c.id]=v; save();
  if(st.show==='all') pos=(pos+1)%deck.length;
  else if(st.show==='err' && v==='e') pos=(pos+1)%deck.length;
  render(true);
}
function go(d){ if(!deck.length)return; pos=(pos+d+deck.length)%deck.length; render(true); }
function render(keepDeck){
  renderNav();
  const m=mod(), s=statsOf(m);
  const main=document.getElementById('main');
  const head=`<div class="mhead"><h2>${esc(m.title)}</h2><p class="sub">${m.id.replace('M','Módulo ')} · ${s.t} cards · ${s.o} acertos · ${s.e} para revisar</p></div>
  <div class="seg" role="group" aria-label="Modo"><button data-v="map" aria-pressed="${st.view==='map'}">Mapa mental</button><button data-v="study" aria-pressed="${st.view==='study'}">Flashcards</button><button data-v="list" aria-pressed="${st.view==='list'}">Lista completa</button><button data-v="syn" aria-pressed="${st.view==='syn'}">Sintaxe</button><button data-v="lab" aria-pressed="${st.view==='lab'}">Laboratório</button></div>`;
  if(st.view==='map'){
    main.innerHTML=head+renderMap(m);
    const mg=document.getElementById('mmg');
    mg.querySelectorAll('.mmh').forEach(h=>h.onclick=()=>{const o=h.parentElement.classList.toggle('open');h.setAttribute('aria-expanded',o);});
    const setAll=o=>mg.querySelectorAll('.mmb').forEach(c=>{c.classList.toggle('open',o);c.querySelector('.mmh').setAttribute('aria-expanded',o);});
    document.getElementById('mmall').onclick=()=>setAll(true);
    document.getElementById('mmnone').onclick=()=>setAll(false);
  } else if(st.view==='lab'){
    main.innerHTML=head+renderLab(m);
  } else if(st.view==='syn'){
    main.innerHTML=head+`<div class="synwrap"><input id="synq" type="search" placeholder="Buscar função ou comando em todos os módulos (ex.: extract, months, trim)" aria-label="Buscar sintaxe"><div id="synres"></div></div>`;
    const q=document.getElementById('synq'); q.value=st.synq||'';
    const draw=()=>{st.synq=q.value;save();document.getElementById('synres').innerHTML=renderSyntax(m,q.value);};
    q.oninput=draw; draw();
  } else if(st.view==='list'){
    main.innerHTML=head+renderList(m);
    const fk=document.getElementById('fk'); fk.value=st.kind; fk.onchange=()=>{st.kind=fk.value;save();render();};
  } else {
    if(!keepDeck)pos=0;
    const sv=pos; main.innerHTML=head+renderStudy(m); pos=sv;
    const fk=document.getElementById('fk'),fs=document.getElementById('fs'),fsh=document.getElementById('fsh');
    fk.value=st.kind; fs.value=st.show; fsh.checked=st.shuffle;
    fk.onchange=()=>{st.kind=fk.value;pos=0;save();render();};
    fs.onchange=()=>{st.show=fs.value;pos=0;save();render();};
    fsh.onchange=()=>{st.shuffle=fsh.checked;pos=0;save();render();};
    const fr=document.getElementById('fr'); if(fr){fr.onclick=flip; fr.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip();}};}
    const bf=document.getElementById('bflip'); if(bf)bf.onclick=flip;
    const bp=document.getElementById('bprev'); if(bp)bp.onclick=()=>go(-1);
    const bn=document.getElementById('bnext'); if(bn)bn.onclick=()=>go(1);
    document.getElementById('breset').onclick=()=>{ if(confirm('Zerar acertos e erros de '+m.id.replace('M','Módulo ')+'?')){Object.keys(st.marks).forEach(k=>{if(k.startsWith(m.id+':'))delete st.marks[k];});save();pos=0;render();}};
  }
  main.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;save();render();});
}
document.addEventListener('keydown',e=>{
  if(st.view!=='study'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const card=document.getElementById('card'); if(!card)return;
  if(e.key===' '){e.preventDefault();flip();}
  else if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1);
  else if(card.classList.contains('flipped')&&e.key==='1')markIt('e');
  else if(card.classList.contains('flipped')&&e.key==='2')markIt('o');
});
render();
})();
</script>
</body>
</html>
