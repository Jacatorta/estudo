s GROUP BY department_id;\n-- aparece uma linha com department_id NULL (Grant, sem departamento)", "trap": "", "tag": "complemento"}, {"id": "C07", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "O que caracteriza uma função de agregação?", "a": "Devolve UMA linha para um grupo de linhas. Com GROUP BY, uma por grupo. Sem GROUP BY, a função age sobre todas as linhas da consulta.", "why": "", "ex": "SELECT AVG(salary) FROM hr.employees;                              -- 1 linha\nSELECT AVG(salary) FROM hr.employees GROUP BY department_id;       -- 1 por depto", "trap": "", "tag": ""}, {"id": "C08", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "Quais as principais funções de agregação da aula?", "a": "AVG, COUNT, MIN, MAX, SUM e LISTAGG.", "why": "", "ex": "SELECT COUNT(*), SUM(salary), AVG(salary), MIN(salary), MAX(salary)\nFROM hr.employees;", "trap": "", "tag": ""}, {"id": "C09", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "DISTINCT, UNIQUE e ALL dentro da função?", "a": "DISTINCT e UNIQUE são iguais: a função considera só valores diferentes. ALL considera todos, inclusive duplicatas, e é o padrão.", "why": "", "ex": "-- T1: 1, 1, 1, 3\nSELECT AVG(c1) FROM t1;            -- 1.5  (6/4)\nSELECT AVG(DISTINCT c1) FROM t1;   -- 2    ((1+3)/2)", "trap": "", "tag": ""}, {"id": "C10", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "Como as funções de agregação tratam NULL?", "a": "Ignoram. A única exceção é COUNT(*), que conta linhas. Para considerar os nulos, troque o NULL por um valor com NVL.", "why": "", "ex": "-- T2.c1: 1, 1, NULL, 3\nSUM(c1) = 5 · AVG(c1) = 1.67 (5/3) · COUNT(c1) = 3\nAVG(NVL(c1,0)) = 1.25 (5/4)", "trap": "AVG ignora o NULL tanto na soma quanto na divisão. Por isso o resultado muda com NVL.", "tag": "complemento: AVG com NVL"}, {"id": "C11", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "Agregação sobre conjunto vazio ou só de NULLs?", "a": "COUNT devolve 0. SUM, AVG, MIN e MAX devolvem NULL.", "why": "", "ex": "SELECT COUNT(*), SUM(salary) FROM hr.employees WHERE 1 = 0;   -- 0 | NULL", "trap": "Relatório que soma valores pode mostrar vazio em vez de 0. Use NVL(SUM(x), 0).", "tag": "complemento"}, {"id": "C12", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "Posso usar função de agregação no WHERE?", "a": "Não. O WHERE filtra linhas antes do agrupamento. Erro ORA-00934. Filtro sobre agregação vai no HAVING.", "why": "", "ex": "SELECT produto FROM vendas_frutas WHERE SUM(quantidade) > 15 GROUP BY produto;\n-- ORA-00934: group function is not allowed here", "trap": "", "tag": "complemento"}, {"id": "C13", "k": "c", "sec": "COUNT", "f": "COUNT(*) x COUNT(coluna) x COUNT(DISTINCT coluna)?", "a": "COUNT(*): conta LINHAS, inclusive linhas com NULL em todas as colunas.<br>COUNT(coluna): conta valores NÃO nulos.<br>COUNT(DISTINCT coluna): conta valores não nulos e diferentes.", "why": "", "ex": "-- T2.c1: 1, 1, NULL, 3\nCOUNT(*)          -- 4\nCOUNT(c1)         -- 3\nCOUNT(DISTINCT c1)-- 2", "trap": "O slide diz que COUNT(*) conta linhas \"que contenham algum valor em qualquer coluna\". Errado: conta todas as linhas, mesmo as totalmente nulas.", "tag": "correção do material: COUNT(*)"}, {"id": "C14", "k": "c", "sec": "COUNT", "f": "Como fazer o COUNT contar os NULL?", "a": "Usar NVL para trocar o NULL por um valor, ou simplesmente COUNT(*).", "why": "", "ex": "COUNT(NVL(c1, 0))            -- 4\nCOUNT(DISTINCT NVL(c1, 0))   -- 3 (0, 1, 3)", "trap": "COUNT(DISTINCT NVL(c1,0)) passa a tratar o NULL como mais um valor distinto.", "tag": ""}, {"id": "C15", "k": "c", "sec": "AVG, SUM, MIN e MAX", "f": "Quais tipos de dado AVG e SUM aceitam?", "a": "Numérico, ou tipo que o Oracle consiga converter implicitamente para número.", "why": "", "ex": "SELECT AVG(salary), SUM(salary) FROM hr.employees;", "trap": "AVG/SUM em coluna de texto com valor não numérico: ORA-01722.", "tag": ""}, {"id": "C16", "k": "c", "sec": "AVG, SUM, MIN e MAX", "f": "MIN e MAX funcionam com quais tipos?", "a": "Número, texto e data. Texto compara em ordem alfabética (binária); data compara cronologicamente.", "why": "", "ex": "SELECT MIN(produto), MAX(produto) FROM vendas_frutas;   -- Banana | Maçã\nSELECT MIN(data_venda) FROM vendas;                      -- 01/01/2023", "trap": "Em texto, maiúscula vem antes de minúscula na ordem binária: 'Zebra' < 'abacaxi'.", "tag": ""}, {"id": "C17", "k": "c", "sec": "AVG, SUM, MIN e MAX", "f": "Posso aplicar expressão dentro da agregação?", "a": "Sim. A expressão é calculada linha a linha e depois agregada.", "why": "", "ex": "SELECT MIN(salary - 1000), MAX(salary + 500) FROM hr.employees;", "trap": "", "tag": ""}, {"id": "C18", "k": "c", "sec": "LISTAGG", "f": "Sintaxe e uso do LISTAGG?", "a": "LISTAGG(coluna, 'separador') WITHIN GROUP (ORDER BY expr). Junta os valores de cada grupo numa string, na ordem definida.", "why": "", "ex": "SELECT department_id \"DEPT\",\n       LISTAGG(last_name, '; ') WITHIN GROUP (ORDER BY salary) \"FUNCIONARIOS\"\nFROM hr.employees\nGROUP BY department_id\nORDER BY department_id;", "trap": "O ORDER BY de dentro (WITHIN GROUP) ordena os nomes na lista. O de fora ordena as linhas.", "tag": ""}, {"id": "C19", "k": "c", "sec": "LISTAGG", "f": "Qual o limite do LISTAGG?", "a": "O resultado é VARCHAR2: até 4000 bytes (ou 32767 com MAX_STRING_SIZE=EXTENDED). Passou: ORA-01489. Desde o 12.2 existe ON OVERFLOW TRUNCATE. Desde o 19c, LISTAGG(DISTINCT ...).", "why": "", "ex": "LISTAGG(last_name, ', ' ON OVERFLOW TRUNCATE '...' WITH COUNT)\n  WITHIN GROUP (ORDER BY last_name)", "trap": "Visão de DBA: relatório que funciona em homologação e quebra em produção com ORA-01489 quando o grupo cresce.", "tag": "complemento"}, {"id": "C20", "k": "c", "sec": "Aninhamento", "f": "Quantos níveis de agregação posso aninhar?", "a": "No máximo 2. O aninhamento exige GROUP BY: a função interna calcula por grupo e a externa agrega os resultados dos grupos.", "why": "", "ex": "SELECT AVG(MIN(salary)) FROM hr.employees GROUP BY department_id;   -- ok\nSELECT MAX(AVG(MIN(salary))) FROM hr.employees GROUP BY department_id;\n-- ORA-00935: group function is nested too deeply", "trap": "Com 2 níveis o resultado é UMA linha: não dá para pôr department_id no SELECT.", "tag": ""}, {"id": "C21", "k": "c", "sec": "Aninhamento", "f": "Aninhamento sem GROUP BY?", "a": "Erro. Sem GROUP BY não há grupos para a função interna, e o Oracle devolve ORA-00978.", "why": "", "ex": "SELECT AVG(MIN(salary)) FROM hr.employees;\n-- ORA-00978: nested group function without GROUP BY", "trap": "", "tag": "complemento"}, {"id": "C22", "k": "c", "sec": "HAVING", "f": "Para que serve o HAVING?", "a": "Filtrar GRUPOS, normalmente pelo resultado de uma função de agregação.", "why": "", "ex": "SELECT produto, SUM(quantidade) FROM vendas_frutas\nWHERE quantidade > 11\nGROUP BY produto\nHAVING SUM(quantidade) > 15;", "trap": "", "tag": ""}, {"id": "C23", "k": "c", "sec": "HAVING", "f": "WHERE x HAVING?", "a": "WHERE filtra LINHAS antes de agrupar e não aceita agregação. HAVING filtra GRUPOS depois de agrupar.", "why": "Ordem lógica: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY (Módulo 01).", "ex": "-- 1. WHERE quantidade > 11 tira a Maçã de 10\n-- 2. GROUP BY: Banana 32, Laranja 18, Maçã 15\n-- 3. HAVING SUM > 15: Banana 32, Laranja 18", "trap": "Filtro que não depende de agregação rende mais no WHERE: menos linhas para agrupar.", "tag": ""}, {"id": "C24", "k": "c", "sec": "HAVING", "f": "Ordem das cláusulas e alias no GROUP BY/HAVING?", "a": "WHERE vem antes do GROUP BY e do HAVING. Alias de coluna NÃO pode ser usado no GROUP BY nem no HAVING antes da 23ai.", "why": "", "ex": "SELECT produto, SUM(quantidade) FROM vendas_frutas GROUP BY produto WHERE quantidade > 11;\n-- erro: WHERE fora de lugar (ORA-00933)\n\nSELECT produto, SUM(quantidade) total FROM vendas_frutas\nGROUP BY produto HAVING total > 15;   -- erro antes da 23ai", "trap": "O primeiro comando está no script da aula de propósito.", "tag": ""}, {"id": "C25", "k": "c", "sec": "HAVING", "f": "Posso usar HAVING sem GROUP BY?", "a": "Sim. A tabela inteira vira um grupo; se a condição for falsa, o resultado é vazio.", "why": "", "ex": "SELECT COUNT(*) FROM livros HAVING COUNT(*) > 100;   -- 0 linhas", "trap": "", "tag": "complemento"}, {"id": "C26", "k": "c", "sec": "Prática da livraria", "f": "Q2: por que usar AVG(NVL(preco, 0)) para \"levar em conta os nulos\"?", "a": "Porque AVG ignora NULL. Com NVL, o livro sem preço entra como 0 na soma E na quantidade, puxando a média para baixo.", "why": "", "ex": "-- Ficcao: 6 preços somam 54,17; 2 são NULL\nAVG(preco)          -- 54,17 / 6 = 9,03\nAVG(NVL(preco, 0))  -- 54,17 / 8 = 6,77", "trap": "Harper Lee e Ray Bradbury: AVG(preco) = NULL; AVG(NVL(preco,0)) = 0.", "tag": ""}, {"id": "C27", "k": "c", "sec": "Prática da livraria", "f": "Q7: qual o risco do FETCH FIRST 1 ROWS ONLY para achar o autor com mais livros?", "a": "Se dois autores empatarem no topo, um some do resultado sem aviso. Com WITH TIES todos os empatados aparecem.", "why": "", "ex": "SELECT autor, COUNT(*) FROM livros\nGROUP BY autor\nORDER BY COUNT(*) DESC\nFETCH FIRST 1 ROWS WITH TIES;", "trap": "Com os dados atuais funciona (Rowling tem 3, ninguém empata). Basta cadastrar mais um livro de Orwell e Tolkien para quebrar.", "tag": "complemento: ajuste na prática resolvida"}, {"id": "S01", "k": "s", "f": "SELECT COUNT(*), COUNT(c1), COUNT(DISTINCT c1) FROM t2;", "res": "4 | 3 | 2", "d": "COUNT(*) conta linhas; COUNT(c1) ignora o NULL; DISTINCT fica com 1 e 3."}, {"id": "S02", "k": "s", "f": "SELECT COUNT(NVL(c1,0)), COUNT(DISTINCT NVL(c1,0)) FROM t2;", "res": "4 | 3", "d": "O NULL vira 0 e passa a ser contado (0, 1, 3)."}, {"id": "S03", "k": "s", "f": "SELECT SUM(c1), AVG(c1), MIN(c1), MAX(c1) FROM t2;", "res": "5 | 1,67 | 1 | 3", "d": "Todas ignoram o NULL: AVG = 5/3."}, {"id": "S04", "k": "s", "f": "SELECT AVG(c1), AVG(DISTINCT c1) FROM t1;", "res": "1,5 | 2", "d": "Todos: 6/4. Distintos: (1+3)/2."}, {"id": "S05", "k": "s", "f": "SELECT MIN(produto), MAX(produto) FROM vendas_frutas;", "res": "Banana | Maçã", "d": "Ordem alfabética: Banana < Laranja < Maçã."}, {"id": "S06", "k": "s", "f": "Script da aula: 6 INSERTs em vendas_frutas.\nSELECT COUNT(*) FROM vendas_frutas;", "res": "5", "d": "O 6º INSERT repete VendaID 4: ORA-00001. A linha Laranja 11 do slide não existe na tabela."}, {"id": "S07", "k": "s", "f": "SELECT produto, SUM(quantidade) FROM vendas_frutas\nWHERE quantidade > 11 GROUP BY produto;", "res": "Banana 32 · Laranja 18 · Maçã 15", "d": "WHERE tira a Maçã de 10 antes de agrupar."}, {"id": "S08", "k": "s", "f": "... WHERE quantidade > 11 GROUP BY produto\nHAVING SUM(quantidade) > 15;", "res": "Banana 32 · Laranja 18", "d": "HAVING tira o grupo Maçã (15)."}, {"id": "S09", "k": "s", "f": "SELECT produto, SUM(quantidade) FROM vendas_frutas\nGROUP BY produto WHERE quantidade > 11;", "res": "Erro de sintaxe (ORA-00933)", "d": "WHERE precisa vir antes do GROUP BY."}, {"id": "S10", "k": "s", "f": "SELECT produto FROM vendas_frutas\nWHERE SUM(quantidade) > 15 GROUP BY produto;", "res": "ORA-00934", "d": "Agregação não é permitida no WHERE."}, {"id": "S11", "k": "s", "f": "SELECT produto, loja, SUM(quantidade) FROM vendas_frutas\nGROUP BY produto;", "res": "ORA-00979", "d": "loja não está no GROUP BY nem agregada."}, {"id": "S12", "k": "s", "f": "SELECT department_id, AVG(salary) FROM hr.employees;", "res": "ORA-00937", "d": "Coluna comum + agregação exige GROUP BY."}, {"id": "S13", "k": "s", "f": "SELECT AVG(MIN(salary)) FROM hr.employees GROUP BY department_id;", "res": "1 linha", "d": "Média dos menores salários de cada departamento."}, {"id": "S14", "k": "s", "f": "SELECT MAX(AVG(MIN(salary))) FROM hr.employees\nGROUP BY department_id;", "res": "ORA-00935", "d": "3 níveis de aninhamento."}, {"id": "S15", "k": "s", "f": "SELECT AVG(MIN(salary)) FROM hr.employees;", "res": "ORA-00978", "d": "Aninhamento exige GROUP BY."}, {"id": "S16", "k": "s", "f": "Script da aula (tabela VENDAS):\nSELECT categoria, SUM(preco) FROM vendas GROUP BY categoria;", "res": "Maquiagem 114 · Cuidado com a pele 97 · Fragrância 90 · Cabelo 34 · Corpo 13", "d": "Os dados do slide (Fragrância 210, Corpo 113...) são outros: o script cria uma tabela diferente da mostrada."}, {"id": "S17", "k": "s", "f": "SELECT COUNT(*), SUM(preco) FROM livros WHERE 1 = 0;", "res": "0 | NULL", "d": "Conjunto vazio: COUNT dá 0, SUM dá NULL."}, {"id": "S18", "k": "s", "f": "Prática Q1: SELECT COUNT(*) FROM livros;", "res": "20", "d": ""}, {"id": "S19", "k": "s", "f": "Prática Q3: livros por gênero?", "res": "Ficcao 8 · Fantasia 6 · Classico 5 · Nao-ficcao 1", "d": ""}, {"id": "S20", "k": "s", "f": "Prática Q4: MAX e MIN do gênero Ficcao?", "res": "9,99 | 7,99", "d": "MAX e MIN já ignoram os 2 preços NULL."}, {"id": "S21", "k": "s", "f": "Prática Q5: autores com mais de 1 livro?", "res": "3: Rowling (3), Orwell (2), Tolkien (2)", "d": "HAVING COUNT(*) > 1."}, {"id": "S22", "k": "s", "f": "Prática Q6: gêneros com mais de 5 livros?", "res": "Ficcao (8) e Fantasia (6)", "d": "Classico tem 5: não é > 5."}, {"id": "S23", "k": "s", "f": "Prática Q7: autor com mais livros?", "res": "J.K. Rowling · 3", "d": ""}, {"id": "S24", "k": "s", "f": "Prática Q8: autores com média de preço > 10?", "res": "9 autores", "d": "Tolkien, Rowling, Cervantes, Melville, Dostoevsky, Hugo, Austen, Rothfuss, Musashi. Harper Lee e Bradbury têm média NULL e ficam fora."}, {"id": "S25", "k": "s", "f": "Prática Q9: SUM(preco) do gênero Ficcao?", "res": "54,17", "d": "Os 2 NULL são ignorados."}, {"id": "S26", "k": "s", "f": "Prática Q2: AVG(NVL(preco,0)) de Harper Lee? E AVG(preco)?", "res": "0 | NULL", "d": "Único livro dela não tem preço."}, {"id": "S27", "k": "s", "f": "Prática Q10: primeiro e último título da lista de Ficcao (ORDER BY preco)?", "res": "O Grande Gatsby ... os 2 sem preço no fim", "d": "ASC deixa NULL por último; entre os dois nulos a ordem não é garantida."}, {"id": "E01", "k": "e", "f": "SELECT produto, SUM(quantidade) FROM vendas_frutas\nGROUP BY produto WHERE quantidade > 11;", "res": "WHERE depois do GROUP BY (ORA-00933)", "fix": "SELECT produto, SUM(quantidade) FROM vendas_frutas\nWHERE quantidade > 11 GROUP BY produto;", "d": "WHERE vem antes do GROUP BY."}, {"id": "E02", "k": "e", "f": "SELECT produto FROM vendas_frutas\nWHERE SUM(quantidade) > 15 GROUP BY produto;", "res": "Agregação no WHERE (ORA-00934)", "fix": "SELECT produto FROM vendas_frutas\nGROUP BY produto HAVING SUM(quantidade) > 15;", "d": "Filtro com agregação vai no HAVING."}, {"id": "E03", "k": "e", "f": "SELECT produto, loja, SUM(quantidade)\nFROM vendas_frutas GROUP BY produto;", "res": "Coluna fora do GROUP BY (ORA-00979)", "fix": "SELECT produto, loja, SUM(quantidade)\nFROM vendas_frutas GROUP BY produto, loja;", "d": "Toda coluna sem agregação precisa estar no GROUP BY."}, {"id": "E04", "k": "e", "f": "SELECT department_id, AVG(salary) FROM hr.employees;", "res": "Faltou GROUP BY (ORA-00937)", "fix": "SELECT department_id, AVG(salary) FROM hr.employees\nGROUP BY department_id;", "d": "Coluna comum + agregação exige GROUP BY."}, {"id": "E05", "k": "e", "f": "SELECT LISTAGG(last_name, ', ') ORDER BY last_name\nFROM hr.employees;", "res": "Faltou WITHIN GROUP", "fix": "SELECT LISTAGG(last_name, ', ') WITHIN GROUP (ORDER BY last_name)\nFROM hr.employees;", "d": "A ordem da lista vai dentro de WITHIN GROUP (...)."}, {"id": "E06", "k": "e", "f": "SELECT COUNT(DISTINCT *) FROM livros;", "res": "DISTINCT com asterisco (ORA-00936)", "fix": "SELECT COUNT(DISTINCT autor) FROM livros;", "d": "DISTINCT precisa de uma coluna ou expressão."}, {"id": "E07", "k": "e", "f": "SELECT produto, SUM(quantidade) total FROM vendas_frutas\nGROUP BY produto HAVING total > 15;", "res": "Alias no HAVING antes da 23ai (ORA-00904)", "fix": "SELECT produto, SUM(quantidade) total FROM vendas_frutas\nGROUP BY produto HAVING SUM(quantidade) > 15;", "d": "Repita a expressão no HAVING."}, {"id": "E08", "k": "e", "f": "SELECT AVG(MIN(salary)) FROM hr.employees;", "res": "Aninhamento sem GROUP BY (ORA-00978)", "fix": "SELECT AVG(MIN(salary)) FROM hr.employees\nGROUP BY department_id;", "d": "Agregação aninhada exige GROUP BY."}], "mm": {"ct": "GROUP BY", "cs": "agrupar · agregar · filtrar grupos", "branches": [{"t": "GROUP BY", "cards": "C01–C06", "col": "#002b5c", "leaves": ["Cada grupo vira 1 linha no resultado", "Coluna fora de agregação → no GROUP BY", "Senão ORA-00979", "Agregação + coluna sem GROUP BY → ORA-00937", "Pode agrupar por várias colunas", "Não garante ordem: use ORDER BY", "NULLs formam 1 grupo"]}, {"t": "Regras gerais da agregação", "cards": "C07–C12", "col": "#2f6db5", "leaves": ["N linhas → 1 resultado por grupo", "Sem GROUP BY: a tabela toda é 1 grupo", "DISTINCT = UNIQUE · ALL é o padrão", "Ignoram NULL (exceto COUNT(*))", "Vazio: COUNT 0 · SUM/AVG/MIN/MAX NULL", "Agregação no WHERE → ORA-00934"]}, {"t": "COUNT", "cards": "C13–C14", "col": "#7b4bb0", "leaves": ["COUNT(*) conta linhas, até as nulas", "COUNT(col) conta valores não nulos", "COUNT(DISTINCT col): não nulos e diferentes", "Contar nulos: NVL(col, 0)", "T2: 4 | 3 | 2"]}, {"t": "AVG, SUM, MIN, MAX", "cards": "C15–C17", "col": "#1f7a55", "leaves": ["AVG/SUM: número ou conversível", "AVG ignora NULL na soma e na divisão", "AVG(NVL(x,0)) muda a média", "MIN/MAX: número, texto e data", "Aceitam expressão: MIN(salary - 1000)"]}, {"t": "LISTAGG", "cards": "C18–C19", "col": "#b06d00", "leaves": ["LISTAGG(col, 'sep')", "WITHIN GROUP (ORDER BY ...) ordena a lista", "Limite VARCHAR2 → ORA-01489", "12.2: ON OVERFLOW TRUNCATE", "19c: LISTAGG(DISTINCT ...)"]}, {"t": "Aninhamento", "cards": "C20–C21", "col": "#5d6d7e", "leaves": ["Máximo 2 níveis: AVG(MIN(x))", "3 níveis → ORA-00935", "Exige GROUP BY (senão ORA-00978)", "Resultado: 1 linha só"]}, {"t": "HAVING", "cards": "C22–C25", "col": "#c0392b", "leaves": ["Filtra GRUPOS, depois de agrupar", "WHERE filtra LINHAS, antes de agrupar", "Ordem: WHERE → GROUP BY → HAVING", "Alias no GROUP BY/HAVING só na 23ai", "HAVING sem GROUP BY: tabela = 1 grupo"]}, {"t": "Prática livraria", "cards": "C26–C27", "col": "#00838f", "leaves": ["AVG(NVL(preco,0)) considera os nulos", "MAX/MIN já ignoram nulos", "HAVING COUNT(*) > 1 / > 5", "Top autor: WITH TIES evita perder empate", "LISTAGG por gênero ordenado por preço"]}]}, "syn": [["Ordem das cláusulas", "SELECT ... FROM ... [WHERE] [GROUP BY] [HAVING] [ORDER BY]", "SELECT produto, SUM(qtd) FROM vendas WHERE qtd > 11 GROUP BY produto HAVING SUM(qtd) > 15 ORDER BY 2;"], ["GROUP BY", "GROUP BY col1 [, col2]", "SELECT categoria, SUM(preco) FROM vendas GROUP BY categoria;"], ["HAVING", "HAVING condição_com_agregação", "HAVING COUNT(*) > 1"], ["COUNT", "COUNT(*)  ·  COUNT(col)  ·  COUNT(DISTINCT col)", "SELECT COUNT(DISTINCT autor) FROM livros;"], ["SUM / AVG / MIN / MAX", "FUNÇÃO([DISTINCT | ALL] expressão)", "SELECT AVG(NVL(preco, 0)) FROM livros;"], ["LISTAGG", "LISTAGG(col, 'separador') WITHIN GROUP (ORDER BY expr)", "LISTAGG(last_name, '; ') WITHIN GROUP (ORDER BY salary)"], ["Aninhamento", "FUNÇÃO_EXTERNA(FUNÇÃO_INTERNA(col)) ... GROUP BY col   -- máximo 2 níveis", "SELECT AVG(MIN(salary)) FROM hr.employees GROUP BY department_id;"]], "lab": [["Três jeitos de contar, três resultados", "SELECT COUNT(*), COUNT(commission_pct), COUNT(DISTINCT commission_pct)\nFROM hr.employees;", "Os três números são diferentes: todas as linhas (107), só quem tem comissão (35) e quantos valores de comissão diferentes existem.", "COUNT(*) conta linhas; COUNT(coluna) ignora NULL; DISTINCT tira repetidos."], ["AVG ignora quem não tem valor", "SELECT AVG(commission_pct), AVG(NVL(commission_pct, 0)) FROM hr.employees;", "A média com NVL é bem menor: os 72 sem comissão passam a contar como zero.", "Decida se NULL deve contar. Se sim, NVL dentro da agregação."], ["NULL forma um grupo próprio", "SELECT department_id, COUNT(*) FROM hr.employees\nGROUP BY department_id ORDER BY department_id NULLS FIRST;", "A primeira linha tem departamento vazio e contagem 1 (a funcionária Grant).", "No GROUP BY, todos os NULL ficam juntos num grupo."], ["Soma de nada é vazio, não zero", "SELECT COUNT(*), SUM(salary), NVL(SUM(salary), 0) FROM hr.employees WHERE 1 = 0;", "COUNT dá 0, SUM aparece vazio e só o NVL mostra 0.", "Em relatório, proteja o SUM com NVL."], ["Provoque o ORA-00979 de propósito", "SELECT department_id, job_id, COUNT(*) FROM hr.employees GROUP BY department_id;\nSELECT department_id, job_id, COUNT(*) FROM hr.employees GROUP BY department_id, job_id;", "A primeira dá ORA-00979. A segunda funciona.", "Toda coluna fora de agregação vai no GROUP BY."]]}, {"id": "M06", "title": "Manipulando texto", "ref": "Referência para os cenários: tabelas dos scripts da aula e da prática ElecShop", "reftxt": "TEXTO (COLCHAR CHAR(2), COLVARCHAR2 VARCHAR2(5))\n 'A'  'TESTE'     -- CHAR guarda 'A ' (completa com espaço)\n 'AA' 'TESTE'\n 'AB' 'TEST'\n\nElecShop (prática):\n CLIENTES: 20 linhas · PrimeiroNome com espaços (' Lucas', ' Joao ', 'Carla ')\n           e-mails terminando em .con (gmail 7 · yahoo 7 · outlook 6)\n PRODUTOS: 20 linhas · preços de 100 a 5200\n FORNECEDORES: 15 linhas (Nome, Telefone)", "cards": [{"id": "V01", "k": "v", "f": "CHAR", "pt": "Caractere de tamanho fixo", "d": "Guarda sempre o tamanho definido, completando com espaços à direita. Máximo 2000 bytes por valor.", "ex": "colchar CHAR(2)   -- 'A' é gravado como 'A '", "rel": "VARCHAR2"}, {"id": "V02", "k": "v", "f": "VARCHAR2", "pt": "Caractere de tamanho variável", "d": "Guarda só o que foi informado, até o máximo definido. 4000 bytes (MAX_STRING_SIZE = STANDARD) ou 32767 (EXTENDED).", "ex": "colvarchar2 VARCHAR2(5)", "rel": "MAX_STRING_SIZE"}, {"id": "V03", "k": "v", "f": "Blank-padding", "pt": "Preenchimento com brancos", "d": "Espaços que o CHAR acrescenta à direita para completar o tamanho fixo.", "ex": "SELECT LENGTH(colchar) FROM texto;   -- 2, mesmo para 'A'", "rel": "CHAR"}, {"id": "V04", "k": "v", "f": "Concatenation operator", "pt": "Operador de concatenação", "d": "|| junta textos e valores de colunas numa string só.", "ex": "SELECT 'O produto ' || produto || ' custa R$' || preco FROM vendas;", "rel": "CONCAT"}, {"id": "V05", "k": "v", "f": "Text literal", "pt": "Literal de texto", "d": "Texto fixo escrito no comando, entre aspas simples.", "ex": "'DBAOCM Education'", "rel": "Aspas"}, {"id": "V06", "k": "v", "f": "Alternative quoting mechanism", "pt": "Mecanismo de citação alternativo", "d": "q'<delim> texto <delim>': permite escrever aspas simples dentro do texto sem duplicá-las.", "ex": "SELECT q'[It's finished]' FROM dual;", "rel": "q-quote"}, {"id": "V07", "k": "v", "f": "Delimiter", "pt": "Delimitador", "d": "Caractere que abre e fecha o texto no q-quote. Qualquer um, menos espaço, tab ou enter. [ { < ( fecham com ] } > ).", "ex": "q'!...!'  q'<...>'  q'{...}'", "rel": "Alternative quoting"}, {"id": "V08", "k": "v", "f": "Padding (LPAD / RPAD)", "pt": "Preenchimento", "d": "Completar uma string até um tamanho, à esquerda (LPAD) ou à direita (RPAD).", "ex": "SELECT LPAD('7', 3, '0') FROM dual;   -- 007", "rel": "Truncar"}, {"id": "V09", "k": "v", "f": "Trim set", "pt": "Conjunto de corte", "d": "Lista de caracteres que LTRIM/RTRIM removem, em qualquer ordem e quantidade.", "ex": "SELECT RTRIM('abc==><', '><=') FROM dual;   -- abc", "rel": "TRIM"}, {"id": "V10", "k": "v", "f": "Occurrence / Position", "pt": "Ocorrência / Posição", "d": "No INSTR: de onde começar a busca (negativo = de trás para frente) e qual aparição procurar.", "ex": "INSTR('CORPORATE FLOOR', 'OR', 3, 2)   -- 14", "rel": "INSTR"}, {"id": "V11", "k": "v", "f": "Byte / Char semantics", "pt": "Semântica de byte / caractere", "d": "VARCHAR2(5) por padrão são 5 BYTES. Em AL32UTF8, acento ocupa 2 bytes. VARCHAR2(5 CHAR) são 5 caracteres.", "ex": "nome VARCHAR2(50 CHAR)", "rel": "NLS_LENGTH_SEMANTICS"}, {"id": "C01", "k": "c", "sec": "Tipos de dado texto: CHAR e VARCHAR2", "f": "Qual a diferença entre CHAR e VARCHAR2?", "a": "<b>CHAR(n):<\/b> tamanho fixo. Valor menor é completado com espaços à direita. Máximo 2000 bytes.<br><b>VARCHAR2(n):<\/b> tamanho variável, guarda só o que foi informado. Máximo 4000 bytes com MAX_STRING_SIZE = STANDARD, ou 32767 com EXTENDED.", "why": "", "ex": "CREATE TABLE texto (colchar CHAR(2), colvarchar2 VARCHAR2(5));\nINSERT INTO texto VALUES ('A', 'TEST');\nSELECT LENGTH(colchar), LENGTH(colvarchar2) FROM texto;   -- 2 | 4", "trap": "O slide fala em \"2000 bytes por linha\". O limite é por VALOR da coluna, não por linha.", "tag": "correção do material: limite por valor, não por linha"}, {"id": "C02", "k": "c", "sec": "Tipos de dado texto: CHAR e VARCHAR2", "f": "O que acontece ao inserir texto maior que a coluna?", "a": "Erro ORA-12899: value too large for column. O Oracle não corta o texto sozinho.", "why": "", "ex": "INSERT INTO texto VALUES ('ABC', 'X');      -- ORA-12899 (CHAR(2))\nINSERT INTO texto VALUES ('A', 'TESTES');   -- ORA-12899 (VARCHAR2(5))", "trap": "", "tag": "complemento"}, {"id": "C03", "k": "c", "sec": "Tipos de dado texto: CHAR e VARCHAR2", "f": "VARCHAR2(5) cabe 5 caracteres?", "a": "Depende. Por padrão (NLS_LENGTH_SEMANTICS = BYTE) são 5 BYTES. Em banco AL32UTF8, letra acentuada ocupa 2 bytes. Para garantir caracteres, declare VARCHAR2(5 CHAR).", "why": "", "ex": "-- AL32UTF8, VARCHAR2(5):\nINSERT ... 'AÇÃO'   -- 4 caracteres, 6 bytes → ORA-12899\n-- VARCHAR2(5 CHAR): cabe", "trap": "Visão de DBA: migração de base WE8ISO8859P1 para AL32UTF8 quebra cargas por isso.", "tag": "complemento: visão de DBA"}, {"id": "C04", "k": "c", "sec": "Tipos de dado texto: CHAR e VARCHAR2", "f": "Comparação de CHAR com espaços?", "a": "CHAR com literal usa comparação com preenchimento: 'A ' e 'A' são considerados iguais. Entre VARCHAR2 os espaços contam.", "why": "", "ex": "SELECT * FROM texto WHERE colchar = 'A';   -- acha a linha gravada como 'A '", "trap": "Comparar CHAR com variável VARCHAR2 em PL/SQL pode não achar a linha. Por isso CHAR é pouco usado.", "tag": "complemento"}, {"id": "C05", "k": "c", "sec": "Concatenação", "f": "Como concatenar textos e colunas?", "a": "Com o operador ||, juntando literais (entre aspas simples) e colunas, em quantos pedaços quiser.", "why": "", "ex": "SELECT modelo || ' e um modelo da marca ' || marca FROM carros;", "trap": "", "tag": ""}, {"id": "C06", "k": "c", "sec": "Concatenação", "f": "Concatenar número ou NULL?", "a": "Número é convertido implicitamente para texto. NULL é tratado como texto vazio.", "why": "", "ex": "SELECT 'custa R$' || 10.5 FROM dual;    -- custa R$10.5\nSELECT 'A' || NULL || 'B' FROM dual;    -- AB", "trap": "Para formatar o número (casas, separador) use TO_CHAR: TO_CHAR(preco, 'FM999G990D00').", "tag": "complemento: TO_CHAR"}, {"id": "C07", "k": "c", "sec": "Concatenação", "f": "CONCAT x ||?", "a": "CONCAT aceita exatamente 2 argumentos. Para mais, é preciso aninhar. O || aceita quantos pedaços quiser.", "why": "", "ex": "SELECT CONCAT(CONCAT(modelo, ' e um modelo da marca '), marca) FROM carros;\nSELECT CONCAT(modelo, ' - ', marca) FROM carros;   -- ORA-00909", "trap": "", "tag": ""}, {"id": "C08", "k": "c", "sec": "Literais e mecanismo de citação alternativo", "f": "Como escrever aspas simples dentro de um texto?", "a": "Duas formas: duplicar a aspa ('It''s') ou usar o mecanismo alternativo q'[It's]'.", "why": "", "ex": "SELECT 'It''s finished' FROM dual;\nSELECT q'[It's finished]' FROM dual;", "trap": "Duplicar a aspa não está no slide, mas é a forma mais cobrada em prova.", "tag": "complemento: aspa duplicada"}, {"id": "C09", "k": "c", "sec": "Literais e mecanismo de citação alternativo", "f": "Sintaxe e regras do q-quote?", "a": "q'&lt;delim&gt; texto &lt;delim&gt;'. O delimitador pode ser qualquer caractere, exceto espaço, tab ou enter. Se abrir com [ { &lt; (, fecha com ] } &gt; ).", "why": "", "ex": "SELECT q'!name LIKE '%DBMS_%%'!' FROM dual;\nSELECT q'<'So,' she said, 'It's finished.'>' FROM dual;\nSELECT q'{SELECT * FROM employees WHERE last_name = 'Smith';}' FROM dual;", "trap": "O delimitador não pode aparecer dentro do texto logo antes da aspa final.", "tag": ""}, {"id": "C10", "k": "c", "sec": "Literais e mecanismo de citação alternativo", "f": "% e * precisam de q-quote?", "a": "Não. Dentro de um literal, % e * são texto comum. O problema é só a aspa simples. % e _ só têm significado especial no LIKE (aí se usa ESCAPE, Módulo 01).", "why": "", "ex": "SELECT '100% * 2' FROM dual;   -- funciona sem nada especial", "trap": "O slide diz que asterisco e porcentagem exigem o mecanismo alternativo. Não exigem.", "tag": "correção do material: só aspa simples exige"}, {"id": "C11", "k": "c", "sec": "Caixa e tamanho", "f": "Onde podem ser usadas e quantos níveis de aninhamento?", "a": "Single-row functions aparecem no SELECT, WHERE, HAVING e ORDER BY. Podem ser aninhadas em vários níveis, ao contrário das agregações (máximo 2, Módulo 05).", "why": "", "ex": "SELECT UPPER(TRIM(SUBSTR(nome, 1, 10))) FROM produtos;", "trap": "", "tag": ""}, {"id": "C12", "k": "c", "sec": "Caixa e tamanho", "f": "UPPER, LOWER e INITCAP?", "a": "UPPER: tudo maiúsculo. LOWER: tudo minúsculo. INITCAP: primeira letra de cada palavra maiúscula e o resto minúsculo (Módulo 02).", "why": "", "ex": "SELECT INITCAP(modelo || ' e um modelo de veículo') FROM carros;\n-- 'ka e um...' → 'Ka E Um Modelo De Veículo'", "trap": "INITCAP sobe a inicial até de palavras como 'e' e 'de'.", "tag": ""}, {"id": "C13", "k": "c", "sec": "Caixa e tamanho", "f": "LENGTH com CHAR e com espaços?", "a": "LENGTH conta caracteres, inclusive espaços. Em CHAR, conta os espaços de preenchimento.", "why": "", "ex": "SELECT LENGTH('TEXTO') FROM dual;          -- 5\nSELECT LENGTH(colchar) FROM texto;         -- 2 (até 'A ')\nSELECT LENGTH(RPAD('DBAOCM', 10)) FROM dual;   -- 10", "trap": "", "tag": ""}, {"id": "C14", "k": "c", "sec": "Extrair e localizar", "f": "SUBSTR: como funciona?", "a": "SUBSTR(texto, início [, tamanho]). Sem tamanho, vai até o fim. Início negativo conta do fim (Módulo 02).", "why": "", "ex": "SUBSTR('DBAOCM Education', 8)      -- Education\nSUBSTR('DBAOCM Education', 1, 6)   -- DBAOCM", "trap": "", "tag": ""}, {"id": "C15", "k": "c", "sec": "Extrair e localizar", "f": "INSTR: como funciona com posição e ocorrência?", "a": "INSTR(texto, busca [, início [, ocorrência]]). Devolve a posição; 0 se não achar. Início negativo conta do fim e busca de trás para frente.", "why": "", "ex": "INSTR('CORPORATE FLOOR', 'OR')          -- 2\nINSTR('CORPORATE FLOOR', 'OR', 3, 2)    -- 14\nINSTR('CORPORATE FLOOR', 'OR', -3, 2)   -- 2", "trap": "Com início negativo a posição devolvida continua contada do INÍCIO da string.", "tag": ""}, {"id": "C16", "k": "c", "sec": "Extrair e localizar", "f": "Como extrair o domínio de um e-mail?", "a": "SUBSTR a partir da posição seguinte ao @, localizado com INSTR.", "why": "", "ex": "SELECT SUBSTR(email, INSTR(email, '@') + 1) AS dominio, COUNT(*)\nFROM clientes\nGROUP BY SUBSTR(email, INSTR(email, '@') + 1);", "trap": "No GROUP BY (antes da 23ai) é preciso repetir a expressão: o alias dominio não vale.", "tag": ""}, {"id": "C17", "k": "c", "sec": "Substituir e limpar", "f": "REPLACE: comportamento?", "a": "Troca TODAS as ocorrências do trecho, diferenciando maiúsculas de minúsculas. Sem o 3º argumento, remove.", "why": "", "ex": "REPLACE('JACK and JUE', 'J', 'BL')   -- BLACK and BLUE", "trap": "Troca em qualquer posição do texto, não só no fim (ver prática Q2).", "tag": ""}, {"id": "C18", "k": "c", "sec": "Substituir e limpar", "f": "TRIM: opções e restrição?", "a": "TRIM([LEADING | TRAILING | BOTH] 'c' FROM texto). Padrão: BOTH e espaço. Corta só UM caractere de corte.", "why": "", "ex": "TRIM(LEADING  'x' FROM 'xxDBAOCM Educationxx')   -- DBAOCM Educationxx\nTRIM(TRAILING 'x' FROM 'xxDBAOCM Educationxx')   -- xxDBAOCM Education\nTRIM('x' FROM 'xxDBAOCM Educationxx')            -- DBAOCM Education\nTRIM(' x' FROM ' xxDBAOCM Educationxx')          -- ORA-30001", "trap": "O último comando está no script da aula: é o motivo de existirem LTRIM e RTRIM.", "tag": ""}, {"id": "C19", "k": "c", "sec": "Substituir e limpar", "f": "LTRIM e RTRIM: o que muda em relação ao TRIM?", "a": "Recebem um CONJUNTO de caracteres e removem qualquer combinação deles, só de um lado: LTRIM da esquerda, RTRIM da direita.", "why": "", "ex": "RTRIM(' xxDBAOCM Educationxx ', ' x')   -- ' xxDBAOCM Education'\nLTRIM(' xxDBAOCM Educationxx ', ' x')   -- 'DBAOCM Educationxx '\nRTRIM('<==>DBAOCM<==>', '><=')         -- '<==>DBAOCM'\nRTRIM(LTRIM(txt, ' x'), ' x')           -- os dois lados", "trap": "A ordem dos caracteres no conjunto não importa: '><=' remove >, < e = em qualquer sequência.", "tag": ""}, {"id": "C20", "k": "c", "sec": "Preencher: LPAD e RPAD", "f": "RPAD e LPAD: sintaxe e padrão?", "a": "RPAD(texto, tamanho [, caractere]) completa à direita; LPAD, à esquerda. Sem o caractere, usa espaço.", "why": "", "ex": "RPAD('DBAOCM', 10, '*')   -- DBAOCM****\nLPAD('DBAOCM', 10, '*')   -- ****DBAOCM\nLPAD('7', 3, '0')         -- 007", "trap": "", "tag": ""}, {"id": "C21", "k": "c", "sec": "Preencher: LPAD e RPAD", "f": "E se o tamanho for menor que o texto?", "a": "O texto é cortado e ficam os PRIMEIROS caracteres, tanto no RPAD quanto no LPAD.", "why": "", "ex": "RPAD('DBAOCM', 3)   -- DBA\nLPAD('DBAOCM', 3)   -- DBA (não 'OCM')", "trap": "Muita gente espera 'OCM' no LPAD. O slide diz \"cortada da direita para a esquerda\": quer dizer que sai o final do texto, nos dois casos.", "tag": ""}, {"id": "C22", "k": "c", "sec": "Preencher: LPAD e RPAD", "f": "E se o tamanho tiver casa decimal?", "a": "A parte decimal é truncada: RPAD('x', 3.9, '*') usa tamanho 3.", "why": "", "ex": "RPAD(' ', 2500/1000 + 2, '*')   -- tamanho 4.5 → 4 → ' ***'", "trap": "A prática resolvida (Q7) depende exatamente desse truncamento.", "tag": "complemento"}, {"id": "C23", "k": "c", "sec": "Prática ElecShop", "f": "Q2: qual o risco do UPDATE ... SET email = REPLACE(email, '.con', '.com')?", "a": "O REPLACE troca '.con' em QUALQUER posição. Um e-mail como joao.conrado@gmail.con viraria joao.comrado@gmail.com. E sem WHERE, o UPDATE regrava todas as linhas, inclusive as corretas.", "why": "", "ex": "UPDATE clientes\nSET email = SUBSTR(email, 1, LENGTH(email) - 4) || '.com'\nWHERE email LIKE '%.con';", "trap": "Com os dados da prática funciona. Em base real de cliente, é assim que se corrompe dado em massa.", "tag": "complemento: ajuste na prática resolvida"}, {"id": "C24", "k": "c", "sec": "Prática ElecShop", "f": "Q4 e Q6: por que a ordem dos passos importa?", "a": "A Q4 (nomes em caixa alta) roda ANTES da Q6 (TRIM nos nomes). Sem TRIM, a lista sai com espaço no início e espaço duplo: ' JOAO  BARBOSA'. Além disso, a Q6 não faz COMMIT.", "why": "", "ex": "SELECT UPPER(TRIM(primeironome) || ' ' || TRIM(ultimonome))\n       || ' Email: <' || email || '>'\nFROM clientes;", "trap": "Use TRIM na consulta, independentemente de o dado já ter sido limpo.", "tag": "complemento: ajuste na prática resolvida"}, {"id": "C25", "k": "c", "sec": "Prática ElecShop", "f": "Q7: como funciona o RPAD(' ', PRECO/1000 + 2, '*')?", "a": "Monta uma string com 1 espaço e completa com * até o tamanho PRECO/1000 + 2, que é truncado. Para 2500: 4,5 → 4 → ' ***' = 3 estrelas.", "why": "", "ex": "-- forma mais legível, limitada a 6 estrelas:\nRPAD('*', LEAST(TRUNC(preco/1000) + 1, 6), '*')", "trap": "Funciona por causa do truncamento implícito. Preço de 7000 daria 8 estrelas, acima das 6 da tabela.", "tag": "complemento"}, {"id": "S01", "k": "s", "f": "SELECT LENGTH(colchar), LENGTH(colvarchar2) FROM texto;\n-- linha ('A', 'TESTE')", "res": "2 | 5", "d": "CHAR(2) completa 'A' com espaço."}, {"id": "S02", "k": "s", "f": "INSERT INTO texto VALUES ('ABC', 'X');", "res": "ORA-12899", "d": "3 caracteres em CHAR(2)."}, {"id": "S03", "k": "s", "f": "SELECT * FROM texto WHERE colchar = 'A';", "res": "Acha a linha 'A '", "d": "Comparação de CHAR com preenchimento."}, {"id": "S04", "k": "s", "f": "SELECT 'A' || NULL || 'B' FROM dual;", "res": "AB", "d": "NULL vira vazio na concatenação."}, {"id": "S05", "k": "s", "f": "SELECT CONCAT('a', 'b', 'c') FROM dual;", "res": "ORA-00909", "d": "CONCAT só aceita 2 argumentos."}, {"id": "S06", "k": "s", "f": "SELECT 'It''s ok' FROM dual;", "res": "It's ok", "d": "Duas aspas viram uma."}, {"id": "S07", "k": "s", "f": "SELECT q'<'So,' she said, 'It's finished.'>' FROM dual;", "res": "'So,' she said, 'It's finished.'", "d": "< fecha com >."}, {"id": "S08", "k": "s", "f": "SELECT q'!name LIKE '%DBMS_%%'!' FROM dual;", "res": "name LIKE '%DBMS_%%'", "d": "! abre e fecha."}, {"id": "S09", "k": "s", "f": "SELECT SUBSTR('DBAOCM Education', 8) FROM dual;", "res": "Education", "d": "Da posição 8 até o fim."}, {"id": "S10", "k": "s", "f": "SELECT INSTR('CORPORATE FLOOR','OR', 3, 2) FROM dual;", "res": "14", "d": "A partir da 3ª posição, 2ª ocorrência."}, {"id": "S11", "k": "s", "f": "SELECT INSTR('CORPORATE FLOOR','OR', -3, 2) FROM dual;", "res": "2", "d": "De trás para frente, a partir da antepenúltima: 2ª ocorrência fica na posição 2."}, {"id": "S12", "k": "s", "f": "SELECT REPLACE('JACK and JUE','J','BL') FROM dual;", "res": "BLACK and BLUE", "d": "Todas as ocorrências."}, {"id": "S13", "k": "s", "f": "SELECT TRIM(LEADING 'x' FROM 'xxDBAOCM Educationxx') FROM dual;", "res": "DBAOCM Educationxx", "d": "Só da esquerda."}, {"id": "S14", "k": "s", "f": "SELECT TRIM(' x' FROM ' xxDBAOCM Educationxx') FROM dual;", "res": "ORA-30001", "d": "TRIM aceita só 1 caractere de corte."}, {"id": "S15", "k": "s", "f": "SELECT LTRIM(' xxDBAOCM Educationxx ', ' x') FROM dual;", "res": "'DBAOCM Educationxx '", "d": "Remove espaços e x só da esquerda."}, {"id": "S16", "k": "s", "f": "SELECT RTRIM('<==========>DBAOCM Education<==========>', '><=') FROM dual;", "res": "<==========>DBAOCM Education", "d": "Conjunto removido só da direita."}, {"id": "S17", "k": "s", "f": "SELECT RPAD('DBAOCM', 10, '*'), LPAD('DBAOCM', 10, '*') FROM dual;", "res": "DBAOCM**** | ****DBAOCM", "d": ""}, {"id": "S18", "k": "s", "f": "SELECT RPAD('DBAOCM', 3), LPAD('DBAOCM', 3) FROM dual;", "res": "DBA | DBA", "d": "Corta e mantém o início nos dois."}, {"id": "S19", "k": "s", "f": "SELECT LENGTH(RPAD('DBAOCM', 10)) FROM dual;", "res": "10", "d": "Completou com 4 espaços."}, {"id": "S20", "k": "s", "f": "SELECT UPPER(TRIM(SUBSTR('  oracle db  ', 1, 9))) FROM dual;", "res": "ORACLE", "d": "De dentro para fora: '  oracle ' → 'oracle' → 'ORACLE'."}, {"id": "S21", "k": "s", "f": "Prática Q1: formato da 1ª linha?", "res": "FORNECEDOR: Eletronicos Silva TELEFONE: 11-3245-6789", "d": "Concatenação com ||."}, {"id": "S22", "k": "s", "f": "Prática Q3: SELECT AVG(LENGTH(nome)) FROM produtos;", "res": "18,35", "d": "Média dos 20 nomes."}, {"id": "S23", "k": "s", "f": "Prática Q5 (depois da Q2): e-mails por domínio?", "res": "gmail.com 7 · yahoo.com 7 · outlook.com 6", "d": ""}, {"id": "S24", "k": "s", "f": "Prática Q4 rodada antes da Q6: nome do cliente 3?", "res": "' JOAO  BARBOSA'", "d": "PrimeiroNome é ' Joao ': sobra espaço no início e fica espaço duplo."}, {"id": "S25", "k": "s", "f": "Prática Q7: estrelas do 'Notebook Basic 15' (2500)?", "res": "*** (3)", "d": "2500/1000 + 2 = 4,5 → 4 → espaço + 3 asteriscos."}, {"id": "S26", "k": "s", "f": "Prática Q7: estrelas do 'Smartphone Pro Max' (5200)?", "res": "****** (6)", "d": "5,2 + 2 = 7,2 → 7 → espaço + 6."}, {"id": "S27", "k": "s", "f": "Prática Q7: estrelas do 'Drone with Camera' (3500)?", "res": "**** (4)", "d": "3,5 + 2 = 5,5 → 5 → espaço + 4."}, {"id": "E01", "k": "e", "f": "SELECT 'It's ok' FROM dual;", "res": "Aspa simples dentro do texto (ORA-01756)", "fix": "SELECT 'It''s ok' FROM dual;", "d": "Duplique a aspa ou use q'[It's ok]'."}, {"id": "E02", "k": "e", "f": "SELECT q'[It's ok)' FROM dual;", "res": "Delimitador não fecha (ORA-01756)", "fix": "SELECT q'[It's ok]' FROM dual;", "d": "[ fecha com ], ( com ), < com >, { com }."}, {"id": "E03", "k": "e", "f": "SELECT \"Texto\" FROM dual;", "res": "Aspas duplas em texto (ORA-00904)", "fix": "SELECT 'Texto' FROM dual;", "d": "Aspas duplas são nome de coluna."}, {"id": "E04", "k": "e", "f": "SELECT 'Total: ' + 10 FROM dual;", "res": "+ não concatena (ORA-01722)", "fix": "SELECT 'Total: ' || 10 FROM dual;", "d": "Concatenação no Oracle é ||."}, {"id": "E05", "k": "e", "f": "SELECT CONCAT('a', 'b', 'c') FROM dual;", "res": "CONCAT com 3 argumentos (ORA-00909)", "fix": "SELECT 'a' || 'b' || 'c' FROM dual;", "d": "CONCAT aceita só 2."}, {"id": "E06", "k": "e", "f": "SELECT SUBSTR('DBAOCM', 1 6) FROM dual;", "res": "Faltou vírgula (ORA-00907)", "fix": "SELECT SUBSTR('DBAOCM', 1, 6) FROM dual;", "d": "Argumentos separados por vírgula."}, {"id": "E07", "k": "e", "f": "SELECT LTRIM('xxabc' FROM 'x') FROM dual;", "res": "Sintaxe do TRIM usada no LTRIM", "fix": "SELECT LTRIM('xxabc', 'x') FROM dual;", "d": "Só o TRIM usa FROM. LTRIM e RTRIM usam vírgula."}, {"id": "E08", "k": "e", "f": "SELECT TRIM(' x' FROM ' xxabc') FROM dual;", "res": "TRIM com 2 caracteres (ORA-30001)", "fix": "SELECT LTRIM(' xxabc', ' x') FROM dual;", "d": "TRIM corta 1 caractere; conjunto é com LTRIM/RTRIM."}], "mm": {"ct": "Manipulando Texto", "cs": "CHAR · VARCHAR2 · funções de texto", "branches": [{"t": "CHAR x VARCHAR2", "cards": "C01–C04", "col": "#002b5c", "leaves": ["CHAR: fixo, completa com espaço, até 2000 bytes", "VARCHAR2: variável, 4000 (STANDARD) ou 32767 bytes (EXTENDED)", "Limite é por valor, não por linha", "Maior que a coluna → ORA-12899", "VARCHAR2(5) = 5 bytes · use 5 CHAR", "CHAR 'A ' = 'A' na comparação"]}, {"t": "Concatenação", "cards": "C05–C07", "col": "#2f6db5", "leaves": ["|| junta literais e colunas", "Número vira texto sozinho", "NULL vira vazio", "CONCAT: só 2 argumentos (ORA-00909)", "Formatar número: TO_CHAR"]}, {"t": "Literais e q-quote", "cards": "C08–C10", "col": "#7b4bb0", "leaves": ["Literal entre aspas simples", "Aspa dentro: 'It''s' ou q'[It's]'", "q'<delim> texto <delim>'", "[ { < ( fecham com ] } > )", "Não pode: espaço, tab, enter", "% e * não exigem q-quote"]}, {"t": "Caixa e tamanho", "cards": "C11–C13", "col": "#1f7a55", "leaves": ["UPPER · LOWER · INITCAP", "INITCAP desce o resto da palavra", "Aninhamento sem limite prático", "LENGTH conta espaços", "LENGTH de CHAR conta o preenchimento"]}, {"t": "Extrair e localizar", "cards": "C14–C16", "col": "#b06d00", "leaves": ["SUBSTR(txt, início [, tam])", "INSTR(txt, busca, início, ocorrência)", "INSTR devolve 0 se não achar", "Início negativo: busca de trás", "Domínio: SUBSTR(email, INSTR(email,'@')+1)"]}, {"t": "Substituir e limpar", "cards": "C17–C19", "col": "#c0392b", "leaves": ["REPLACE troca todas, case-sensitive", "TRIM LEADING / TRAILING / BOTH", "TRIM só 1 caractere (ORA-30001)", "LTRIM / RTRIM: conjunto de caracteres", "Dois lados: RTRIM(LTRIM(...))"]}, {"t": "LPAD e RPAD", "cards": "C20–C22", "col": "#5d6d7e", "leaves": ["RPAD completa à direita, LPAD à esquerda", "Sem caractere: espaço", "Tamanho menor: fica o início (DBA)", "LPAD('DBAOCM',3) = DBA, não OCM", "Tamanho decimal é truncado"]}, {"t": "Prática ElecShop", "cards": "C23–C25", "col": "#00838f", "leaves": ["Q2: REPLACE troca .con no meio também → filtre com LIKE '%.con'", "Q4 antes da Q6: use TRIM no SELECT", "Q6 sem COMMIT", "Q7: RPAD com tamanho truncado"]}]}, "syn": [["Concatenação", "texto1 || texto2 || ...", "SELECT modelo || ' da marca ' || marca FROM carros;"], ["CONCAT", "CONCAT(texto1, texto2)", "CONCAT(CONCAT(modelo, ' - '), marca)"], ["Aspa dentro do texto", "'It''s'  ·  q'[It's]'  ·  q'<...>'  q'{...}'  q'!...!'", "SELECT q'[It's finished]' FROM dual;"], ["UPPER / LOWER / INITCAP", "UPPER(texto)  ·  LOWER(texto)  ·  INITCAP(texto)", "INITCAP(modelo)"], ["LENGTH", "LENGTH(texto)", "LENGTH('TEXTO')"], ["SUBSTR", "SUBSTR(texto, início [, tamanho])", "SUBSTR('DBAOCM Education', 1, 6)"], ["INSTR", "INSTR(texto, busca [, início [, ocorrência]])", "INSTR('CORPORATE FLOOR', 'OR', 3, 2)"], ["REPLACE", "REPLACE(texto, busca [, novo])", "REPLACE('JACK and JUE', 'J', 'BL')"], ["TRIM", "TRIM([LEADING | TRAILING | BOTH] ['c' FROM] texto)", "TRIM(BOTH 'x' FROM 'xxDBAOCMxx')"], ["LTRIM / RTRIM", "LTRIM(texto, 'conjunto')  ·  RTRIM(texto, 'conjunto')", "RTRIM('abc==><', '><=')"], ["LPAD / RPAD", "LPAD(texto, tamanho [, 'c'])  ·  RPAD(texto, tamanho [, 'c'])", "LPAD('7', 3, '0')"], ["Domínio do e-mail", "SUBSTR(email, INSTR(email, '@') + 1)", "SELECT SUBSTR(email, INSTR(email, '@') + 1) FROM clientes;"]], "lab": [["CHAR completa com espaços", "SELECT '[' || CAST('A' AS CHAR(5)) || ']' AS chr,\n       '[' || CAST('A' AS VARCHAR2(5)) || ']' AS vch FROM dual;", "O CHAR mostra [A    ] com 4 espaços; o VARCHAR2 mostra [A].", "CHAR sempre ocupa o tamanho total. Por isso LENGTH de CHAR conta os espaços."], ["Texto vazio é NULL", "SELECT NVL('', 'é nulo'), LENGTH('') FROM dual;", "Aparece 'é nulo', e o LENGTH sai vazio (não 0).", "No Oracle, '' é igual a NULL."], ["Acento ocupa mais de um byte", "SELECT LENGTH('AÇÃO'), LENGTHB('AÇÃO') FROM dual;", "Num banco AL32UTF8: 4 caracteres e 6 bytes. Se der 4 e 4, o banco usa um conjunto de 1 byte.", "VARCHAR2(5) são 5 bytes por padrão: 'AÇÃO' pode não caber. Use VARCHAR2(5 CHAR)."], ["LPAD também corta pelo começo", "SELECT LPAD('DBAOCM', 3), RPAD('DBAOCM', 3), LPAD('7', 3, '0') FROM dual;", "Os dois primeiros dão DBA. O último dá 007.", "Tamanho menor que o texto: fica o início, nos dois PADs."], ["REPLACE troca em qualquer posição", "SELECT REPLACE('joao.conrado@gmail.con', '.con', '.com') FROM dual;", "Sai joao.comrado@gmail.com: o nome também foi alterado.", "Para trocar só o final, filtre com LIKE '%.con' e troque a ponta."]]}, {"id": "M07", "title": "Manipulando números e nulos", "ref": "Referência para os cenários: tabela PRODUTOS da prática Lojas XYZ", "reftxt": "PRODUTOS (ProdutoID INT PK, Nome VARCHAR2(100), Preco FLOAT, Estoque INT)\n 40 produtos · IDs 1 a 40 · preços de 15,99 a 3899,00\n 9 produtos com Estoque NULL (Tênis Nike, Jaqueta North Face, PlayStation 5...)\n 34 produtos com preço <= 500\n Exemplos: Notebook Dell 1200,00 / 15 un · Apple Watch 399,99 / 25 un\n           Livro \"O Poder do Hábito\" 15,99 / 100 un · Câmera Canon 3899,00 / 10 un", "cards": [{"id": "V01", "k": "v", "f": "NUMBER(p, s)", "pt": "Número com precisão e escala", "d": "p = total de dígitos significativos (até 38). s = dígitos à direita da vírgula (negativo: à esquerda). Ocupa de 1 a 22 bytes.", "ex": "salario NUMBER(10,2)   -- até 99.999.999,99", "rel": "Precision / Scale"}, {"id": "V02", "k": "v", "f": "Precision", "pt": "Precisão", "d": "Quantidade máxima de dígitos significativos do número.", "ex": "123,89 em NUMBER(5,2) → cabe (5 dígitos)", "rel": "Scale"}, {"id": "V03", "k": "v", "f": "Scale", "pt": "Escala", "d": "Dígitos depois da vírgula. Positiva arredonda casas decimais; negativa arredonda à esquerda (dezenas, centenas).", "ex": "123,89 em NUMBER(6,-2) → 100", "rel": "ROUND"}, {"id": "V04", "k": "v", "f": "FLOAT / BINARY_FLOAT / BINARY_DOUBLE", "pt": "Ponto flutuante", "d": "FLOAT é subtipo de NUMBER com precisão binária. BINARY_FLOAT (32 bits) e BINARY_DOUBLE (64 bits) seguem o padrão IEEE e aceitam infinito e NaN.", "ex": "preco FLOAT", "rel": "NaN"}, {"id": "V05", "k": "v", "f": "NaN (Not a Number)", "pt": "Não é um número", "d": "Resultado indefinido de uma operação em BINARY_FLOAT/DOUBLE, como 0/0.", "ex": "SELECT 0/0F FROM dual;   -- Nan", "rel": "BINARY_FLOAT"}, {"id": "V06", "k": "v", "f": "FLOOR / CEIL", "pt": "Piso / Teto", "d": "FLOOR: maior inteiro menor ou igual. CEIL: menor inteiro maior ou igual.", "ex": "FLOOR(15.7) = 15 · CEIL(15.7) = 16", "rel": "TRUNC"}, {"id": "V07", "k": "v", "f": "NULL", "pt": "Nulo", "d": "Ausência de valor: desconhecido ou não aplicável. Não é zero nem texto vazio (embora o Oracle trate '' como NULL).", "ex": "WHERE commission_pct IS NULL", "rel": "UNKNOWN"}, {"id": "V08", "k": "v", "f": "NVL / NVL2", "pt": "Substituição de nulo", "d": "NVL(x, y): se x é NULL devolve y. NVL2(x, y, z): se x NÃO é NULL devolve y, senão z.", "ex": "NVL2(estoque, 'Em Estoque', 'Sem Estoque')", "rel": "COALESCE"}, {"id": "V09", "k": "v", "f": "COALESCE", "pt": "Primeiro não nulo", "d": "Devolve o primeiro argumento não nulo da lista. Pelo menos 2 argumentos.", "ex": "COALESCE(celular, telefone, 'sem contato')", "rel": "NVL"}, {"id": "V10", "k": "v", "f": "NULLIF", "pt": "Anular se igual", "d": "NULLIF(a, b): devolve NULL se a = b; senão devolve a.", "ex": "NULLIF(j.job_id, e.job_id)", "rel": "CASE"}, {"id": "C01", "k": "c", "sec": "Tipos numéricos", "f": "Quais são os tipos numéricos do Oracle?", "a": "NUMBER, FLOAT, BINARY_FLOAT e BINARY_DOUBLE. Armazenam números fixos e de ponto flutuante, positivos e negativos, zero, infinito e NaN (os dois últimos só nos BINARY_*).", "why": "", "ex": "CREATE TABLE t (n NUMBER(10,2), f FLOAT, bf BINARY_FLOAT, bd BINARY_DOUBLE);", "trap": "", "tag": ""}, {"id": "C02", "k": "c", "sec": "Tipos numéricos", "f": "Qual a faixa e o tamanho do NUMBER?", "a": "Positivos de 1.0 x 10^-130 até (sem incluir) 1.0 x 10^126, o mesmo para negativos, e o zero. Cada valor ocupa de 1 a 22 bytes. Fora da faixa: erro.", "why": "", "ex": "NUMBER(precisão, escala) · NUMBER(precisão) · NUMBER", "trap": "NUMBER(p) sem escala = escala 0: arredonda para inteiro.", "tag": ""}, {"id": "C03", "k": "c", "sec": "Tipos numéricos", "f": "O que são precisão e escala?", "a": "<b>Precisão:<\/b> quantidade máxima de dígitos significativos.<br><b>Escala positiva:<\/b> dígitos à direita da vírgula.<br><b>Escala negativa:<\/b> arredonda à esquerda da vírgula (dezenas, centenas...).", "why": "", "ex": "123,89 em NUMBER      → 123,89\n123,89 em NUMBER(3)   → 124\n123,89 em NUMBER(5,2) → 123,89\n123,89 em NUMBER(6,1) → 123,9\n123,89 em NUMBER(6,-2)→ 100", "trap": "Casas decimais a mais são ARREDONDADAS. Dígitos inteiros a mais dão ERRO.", "tag": ""}, {"id": "C04", "k": "c", "sec": "Tipos numéricos", "f": "Quando o valor \"excede a precisão\"?", "a": "Quando a parte inteira tem mais dígitos que precisão menos escala. Erro ORA-01438.", "why": "", "ex": "123,89 em NUMBER(3,2)   -- só cabe 1 dígito inteiro → ORA-01438\n123,89 em NUMBER(4,2)   -- só cabem 2 dígitos inteiros → ORA-01438", "trap": "", "tag": ""}, {"id": "C05", "k": "c", "sec": "Tipos numéricos", "f": "Escala maior que a precisão: NUMBER(4,5)?", "a": "É válido para números menores que 1. A escala 5 dá 5 casas decimais, e a precisão 4 limita os dígitos significativos (os zeros logo após a vírgula não contam).", "why": "", "ex": "0,01234  em NUMBER(4,5) → 0,01234\n0,00012  em NUMBER(4,5) → 0,00012\n0,000127 em NUMBER(4,5) → 0,00013", "trap": "", "tag": ""}, {"id": "C06", "k": "c", "sec": "Tipos numéricos", "f": "Por que a prática usa FLOAT e isso importa?", "a": "FLOAT não tem escala fixa: não arredonda para 2 casas. Depois do reajuste de 15%, 399,99 vira 459,9885. Com NUMBER(10,2) seria gravado 459,99.", "why": "", "ex": "UPDATE produtos SET preco = preco * 1.15 WHERE preco <= 500;\n-- Apple Watch: 399,99 → 459,9885", "trap": "Valor monetário: use NUMBER(p,2).", "tag": "complemento"}, {"id": "C07", "k": "c", "sec": "Aritmética e NULL", "f": "Expressão aritmética com NULL?", "a": "Qualquer operação aritmética com NULL resulta em NULL.", "why": "", "ex": "SELECT 1 + NULL FROM dual;   -- NULL\nSELECT NULL * 5 FROM dual;   -- NULL\nSELECT salary * commission_pct FROM hr.employees;   -- NULL para quem não tem comissão", "trap": "Por isso o NVL aparece em quase todo cálculo com coluna opcional.", "tag": ""}, {"id": "C08", "k": "c", "sec": "Funções numéricas", "f": "FLOOR e CEIL?", "a": "FLOOR(n): o maior inteiro menor ou igual a n. CEIL(n): o MENOR inteiro MAIOR ou igual a n.", "why": "", "ex": "FLOOR(15.7) = 15 · FLOOR(2.1) = 2\nCEIL(15.7)  = 16 · CEIL(2.1)  = 3", "trap": "O slide define CEIL como \"o maior inteiro igual ou menor\". Isso é o FLOOR. CEIL arredonda para CIMA.", "tag": "correção do material: definição do CEIL"}, {"id": "C09", "k": "c", "sec": "Funções numéricas", "f": "FLOOR x TRUNC com número negativo?", "a": "FLOOR vai para baixo (mais negativo). TRUNC corta em direção ao zero.", "why": "", "ex": "FLOOR(-2.5) = -3 · TRUNC(-2.5) = -2 · CEIL(-2.5) = -2", "trap": "Com positivos FLOOR e TRUNC dão o mesmo resultado. Com negativos, não.", "tag": "complemento"}, {"id": "C10", "k": "c", "sec": "Funções numéricas", "f": "MOD?", "a": "Resto da divisão do 1º pelo 2º argumento. Se o 2º for zero, devolve o 1º. O sinal segue o 1º argumento.", "why": "", "ex": "MOD(5, 2) = 1 · MOD(5, 0) = 5 · MOD(-7, 3) = -1\nWHERE MOD(produtoid, 2) != 0   -- IDs ímpares", "trap": "MOD(x, 0) não dá erro de divisão por zero.", "tag": ""}, {"id": "C11", "k": "c", "sec": "Funções numéricas", "f": "ROUND e TRUNC com número?", "a": "ROUND arredonda e TRUNC corta, para o número de casas do 2º argumento (padrão 0). Valor negativo age à esquerda da vírgula (Módulo 02).", "why": "", "ex": "ROUND(15.193,1) = 15.2 · ROUND(15.193) = 15 · ROUND(1652,-3) = 2000\nTRUNC(15.193,1) = 15.1 · TRUNC(15.193) = 15 · TRUNC(1652,-3) = 1000", "trap": "", "tag": ""}, {"id": "C12", "k": "c", "sec": "Conceito de NULL", "f": "O que é NULL e onde pode aparecer?", "a": "Ausência de valor: desconhecido ou não aplicável. Pode aparecer em coluna de qualquer tipo que não tenha NOT NULL ou PRIMARY KEY.", "why": "", "ex": "SELECT last_name FROM hr.employees WHERE commission_pct IS NULL;", "trap": "", "tag": ""}, {"id": "C13", "k": "c", "sec": "Conceito de NULL", "f": "NULL é igual a zero? E a texto vazio?", "a": "Zero: não. NULL e 0 são diferentes. Texto vazio: no Oracle, '' É tratado como NULL.", "why": "", "ex": "SELECT CASE WHEN '' IS NULL THEN 'nulo' END FROM dual;   -- nulo\nSELECT LENGTH('') FROM dual;                              -- NULL", "trap": "Usar NULL para representar zero distorce somas e médias (Módulo 05).", "tag": ""}, {"id": "C14", "k": "c", "sec": "Conceito de NULL", "f": "Como testar NULL?", "a": "Só com IS NULL e IS NOT NULL. Qualquer outra comparação com NULL dá UNKNOWN e a linha não volta.", "why": "", "ex": "WHERE last_name LIKE 'T%' AND commission_pct = NULL    -- 0 linhas\nWHERE last_name LIKE 'T%' AND commission_pct IS NULL   -- certo", "trap": "NULL não é igual nem diferente de nada, nem de outro NULL.", "tag": ""}, {"id": "C15", "k": "c", "sec": "Funções para tratar NULL", "f": "NVL: regras?", "a": "NVL(expr1, expr2): se expr1 é NULL, devolve expr2; senão expr1. Tipos diferentes: o Oracle converte o 2º para o tipo do 1º. Se não der, erro.", "why": "", "ex": "SELECT last_name, NVL(TO_CHAR(commission_pct), 'Not Applicable') FROM hr.employees;\n-- sem TO_CHAR: NVL(commission_pct, 'Not Applicable') → ORA-01722", "trap": "O slide diz que NVL substitui o nulo \"por uma string\". Pode ser qualquer tipo; o que manda é o tipo do 1º argumento.", "tag": ""}, {"id": "C16", "k": "c", "sec": "Funções para tratar NULL", "f": "NVL2: regras?", "a": "NVL2(expr1, expr2, expr3): se expr1 NÃO é NULL, devolve expr2; se é NULL, devolve expr3. expr2 e expr3 não podem ser LONG.", "why": "", "ex": "SELECT last_name, NVL2(commission_pct, salary + salary * commission_pct, salary) income\nFROM hr.employees;", "trap": "A ordem confunde: o 2º argumento é para o caso NÃO nulo.", "tag": ""}, {"id": "C17", "k": "c", "sec": "Funções para tratar NULL", "f": "COALESCE: regras?", "a": "Devolve o primeiro argumento não nulo. Exige pelo menos 2 argumentos. Se todos forem NULL, devolve NULL. Para de avaliar no primeiro não nulo.", "why": "", "ex": "SELECT last_name, COALESCE(salary + salary * commission_pct, salary, 2000) income\nFROM hr.employees;", "trap": "Os argumentos precisam ser do mesmo grupo de tipo: COALESCE(numero, 'texto') dá erro.", "tag": ""}, {"id": "C18", "k": "c", "sec": "Funções para tratar NULL", "f": "NULLIF: regras?", "a": "NULLIF(expr1, expr2): devolve NULL se forem iguais; senão devolve expr1. Não se pode passar o literal NULL como 1º argumento.", "why": "", "ex": "SELECT e.last_name, NULLIF(j.job_id, e.job_id) \"Old Job ID\"\nFROM hr.employees e, hr.job_history j\nWHERE e.employee_id = j.employee_id;\n-- NULL quando o cargo antigo é igual ao atual", "trap": "Uso clássico: evitar divisão por zero com x / NULLIF(y, 0).", "tag": "complemento: divisão por zero"}, {"id": "C19", "k": "c", "sec": "Funções para tratar NULL", "f": "NVL x NVL2 x COALESCE x NULLIF em uma linha?", "a": "NVL: troca o nulo por um valor.<br>NVL2: escolhe entre dois valores conforme for nulo ou não.<br>COALESCE: primeiro não nulo de uma lista.<br>NULLIF: transforma em nulo quando dois valores são iguais.", "why": "", "ex": "NVL(NULL, 0) = 0\nNVL2(NULL, 'a', 'b') = 'b'\nCOALESCE(NULL, NULL, 3) = 3\nNULLIF(10, 10) = NULL", "trap": "", "tag": ""}, {"id": "C20", "k": "c", "sec": "Prática Lojas XYZ", "f": "Q4: \"arredondando o preço pela centena\" com TRUNC(preco, -2)?", "a": "A prática resolvida usa TRUNC, que corta e não arredonda: 999,99 cai na faixa 900. Com ROUND(preco, -2), 999,99 vai para 1000. Os grupos mudam bastante.", "why": "", "ex": "SELECT TRUNC(preco, -2) centena, COUNT(*) FROM produtos GROUP BY TRUNC(preco, -2);\n-- faixa 0: 15 produtos\nSELECT ROUND(preco, -2) centena, COUNT(*) FROM produtos GROUP BY ROUND(preco, -2);\n-- faixa 0: 6 produtos", "trap": "Confira o exemplo do slide da prática para ver qual dos dois o enunciado espera.", "tag": "correção do material: TRUNC não arredonda"}, {"id": "C21", "k": "c", "sec": "Prática Lojas XYZ", "f": "Q7: caixas fechadas de 15 e unidades avulsas?", "a": "FLOOR(estoque / 15) dá as caixas fechadas; MOD(estoque, 15) dá as unidades que sobram.", "why": "", "ex": "SELECT nome, estoque, FLOOR(estoque/15) caixas, MOD(estoque, 15) avulsas\nFROM produtos WHERE estoque != 0;\n-- Livro: 100 → 6 caixas e 10 avulsas", "trap": "TRUNC(estoque/15) daria o mesmo, porque o estoque é positivo.", "tag": ""}, {"id": "S01", "k": "s", "f": "123,89 em NUMBER(3)", "res": "124", "d": "Escala 0: arredonda."}, {"id": "S02", "k": "s", "f": "123,89 em NUMBER(6,1)", "res": "123,9", "d": "1 casa decimal."}, {"id": "S03", "k": "s", "f": "123,89 em NUMBER(6,-2)", "res": "100", "d": "Escala -2: arredonda nas centenas."}, {"id": "S04", "k": "s", "f": "123,89 em NUMBER(4,2)", "res": "ORA-01438", "d": "Só 2 dígitos inteiros cabem."}, {"id": "S05", "k": "s", "f": "0,000127 em NUMBER(4,5)", "res": "0,00013", "d": "5 casas decimais."}, {"id": "S06", "k": "s", "f": "SELECT 1 + NULL, NULL * 5 FROM dual;", "res": "NULL | NULL", "d": ""}, {"id": "S07", "k": "s", "f": "SELECT FLOOR(15.7), CEIL(15.7) FROM dual;", "res": "15 | 16", "d": ""}, {"id": "S08", "k": "s", "f": "SELECT FLOOR(-2.5), CEIL(-2.5), TRUNC(-2.5) FROM dual;", "res": "-3 | -2 | -2", "d": ""}, {"id": "S09", "k": "s", "f": "SELECT MOD(5,2), MOD(5,0) FROM dual;", "res": "1 | 5", "d": "MOD por zero devolve o 1º argumento."}, {"id": "S10", "k": "s", "f": "SELECT ROUND(15.193,1), ROUND(15.193), ROUND(1652,-3) FROM dual;", "res": "15,2 | 15 | 2000", "d": ""}, {"id": "S11", "k": "s", "f": "SELECT TRUNC(15.193,1), TRUNC(15.193), TRUNC(1652,-3) FROM dual;", "res": "15,1 | 15 | 1000", "d": ""}, {"id": "S12", "k": "s", "f": "SELECT COUNT(*) FROM hr.employees\nWHERE commission_pct = NULL;", "res": "0", "d": "Use IS NULL."}, {"id": "S13", "k": "s", "f": "SELECT NVL(commission_pct, 'Not Applicable') FROM hr.employees;", "res": "ORA-01722", "d": "1º argumento é número: 'Not Applicable' não converte."}, {"id": "S14", "k": "s", "f": "SELECT NVL2(NULL,'a','b'), NVL2(5,'a','b') FROM dual;", "res": "b | a", "d": "2º argumento = não nulo."}, {"id": "S15", "k": "s", "f": "SELECT COALESCE(NULL, NULL, 3, 4), COALESCE(NULL, NULL) FROM dual;", "res": "3 | NULL", "d": ""}, {"id": "S16", "k": "s", "f": "SELECT NULLIF(10,10), NULLIF(10,20) FROM dual;", "res": "NULL | 10", "d": ""}, {"id": "S17", "k": "s", "f": "SELECT 100 / NULLIF(0, 0) FROM dual;", "res": "NULL", "d": "Sem erro de divisão por zero."}, {"id": "S18", "k": "s", "f": "Prática Q1: valor em estoque do Notebook Dell (1200 x 15)?", "res": "18000", "d": ""}, {"id": "S19", "k": "s", "f": "Prática Q2: quantos produtos com ID ímpar?", "res": "20", "d": "IDs 1 a 40."}, {"id": "S20", "k": "s", "f": "Prática Q3: quantos \"Sem Estoque\"?", "res": "9", "d": "Estoque NULL."}, {"id": "S21", "k": "s", "f": "Prática Q4 com TRUNC(preco,-2): produtos na faixa 0?", "res": "15", "d": "Com ROUND seriam 6."}, {"id": "S22", "k": "s", "f": "Prática Q5: quantas linhas o UPDATE reajusta?", "res": "34", "d": "Preço <= 500."}, {"id": "S23", "k": "s", "f": "Prática Q5: preço do Apple Watch depois do reajuste?", "res": "459,9885", "d": "FLOAT não arredonda para 2 casas."}, {"id": "S24", "k": "s", "f": "Prática Q7: Livro com 100 unidades?", "res": "6 caixas · 10 avulsas", "d": ""}, {"id": "S25", "k": "s", "f": "Prática Q7: Câmera Canon com 10 unidades?", "res": "0 caixas · 10 avulsas", "d": ""}, {"id": "E01", "k": "e", "f": "SELECT * FROM hr.employees WHERE commission_pct = NULL;", "res": "Não dá erro, mas volta 0 linhas", "fix": "SELECT * FROM hr.employees WHERE commission_pct IS NULL;", "d": "NULL só se testa com IS NULL."}, {"id": "E02", "k": "e", "f": "SELECT * FROM hr.employees\nWHERE commission_pct IS NOT = NULL;", "res": "Mistura de IS NOT com = (erro de sintaxe)", "fix": "SELECT * FROM hr.employees\nWHERE commission_pct IS NOT NULL;", "d": "A forma é IS NOT NULL, sem sinal de igual."}, {"id": "E03", "k": "e", "f": "SELECT NVL(commission_pct, 'N/A') FROM hr.employees;", "res": "Tipos diferentes (ORA-01722)", "fix": "SELECT NVL(TO_CHAR(commission_pct), 'N/A') FROM hr.employees;", "d": "O 2º argumento precisa caber no tipo do 1º."}, {"id": "E04", "k": "e", "f": "SELECT NVL2(commission_pct, 'Sim') FROM hr.employees;", "res": "NVL2 com 2 argumentos (ORA-00909)", "fix": "SELECT NVL2(commission_pct, 'Sim', 'Não') FROM hr.employees;", "d": "NVL2 exige 3 argumentos."}, {"id": "E05", "k": "e", "f": "SELECT COALESCE(commission_pct) FROM hr.employees;", "res": "COALESCE com 1 argumento (ORA-00938)", "fix": "SELECT COALESCE(commission_pct, 0) FROM hr.employees;", "d": "COALESCE exige pelo menos 2."}, {"id": "E06", "k": "e", "f": "SELECT FLOOR(15.7, 0) FROM dual;", "res": "FLOOR com 2 argumentos (ORA-00909)", "fix": "SELECT FLOOR(15.7) FROM dual;", "d": "FLOOR e CEIL recebem só o número."}, {"id": "E07", "k": "e", "f": "SELECT MOD(10 / 3) FROM dual;", "res": "Divisão no lugar da vírgula (ORA-00909)", "fix": "SELECT MOD(10, 3) FROM dual;", "d": "MOD recebe dois argumentos separados por vírgula."}], "mm": {"ct": "Números e Nulos", "cs": "NUMBER · funções · NVL", "branches": [{"t": "Tipos numéricos", "cards": "C01–C06", "col": "#002b5c", "leaves": ["NUMBER · FLOAT · BINARY_FLOAT · BINARY_DOUBLE", "NUMBER: 1 a 22 bytes, até 38 dígitos", "NUMBER(p, s): precisão e escala", "Decimal a mais: arredonda", "Inteiro a mais: ORA-01438", "Escala negativa: arredonda à esquerda", "FLOAT não fixa 2 casas"]}, {"t": "Aritmética e NULL", "cards": "C07", "col": "#2f6db5", "leaves": ["Qualquer conta com NULL = NULL", "1 + NULL = NULL", "Use NVL em coluna opcional"]}, {"t": "Funções numéricas", "cards": "C08–C11", "col": "#7b4bb0", "leaves": ["FLOOR: inteiro para baixo", "CEIL: inteiro para cima", "Negativo: FLOOR(-2.5) = -3, TRUNC = -2", "MOD(x, 0) = x · sinal do dividendo", "ROUND arredonda · TRUNC corta"]}, {"t": "Conceito de NULL", "cards": "C12–C14", "col": "#1f7a55", "leaves": ["Valor ausente ou desconhecido", "Proibido com NOT NULL e PK", "NULL ≠ 0 · '' = NULL no Oracle", "Só IS NULL / IS NOT NULL", "= NULL → UNKNOWN → 0 linhas"]}, {"t": "Funções de NULL", "cards": "C15–C19", "col": "#b06d00", "leaves": ["NVL(x, y): y se x nulo tipo do resultado = tipo de x", "NVL2(x, se não nulo, se nulo)", "COALESCE: 1º não nulo da lista", "NULLIF(a, b): NULL se a = b", "x / NULLIF(y, 0) evita divisão por zero"]}, {"t": "Prática Lojas XYZ", "cards": "C20–C21", "col": "#c0392b", "leaves": ["Q4: TRUNC(preco,-2) corta, não arredonda", "Q5: FLOAT guarda 459,9885", "Q7: FLOOR(estoque/15) caixas MOD(estoque, 15) avulsas"]}]}, "syn": [["NUMBER", "NUMBER  ·  NUMBER(precisão)  ·  NUMBER(precisão, escala)", "salario NUMBER(10, 2)"], ["FLOOR / CEIL", "FLOOR(número)  ·  CEIL(número)   -- 1 argumento", "CEIL(15.7)"], ["MOD", "MOD(dividendo, divisor)", "MOD(estoque, 15)"], ["ROUND / TRUNC", "ROUND(número [, casas])  ·  TRUNC(número [, casas])", "ROUND(1652, -3)"], ["Teste de nulo", "coluna IS NULL  ·  coluna IS NOT NULL", "WHERE commission_pct IS NULL"], ["NVL", "NVL(expressão, valor_se_nulo)", "NVL(estoque, 0)"], ["NVL2", "NVL2(expressão, valor_se_NÃO_nulo, valor_se_nulo)", "NVL2(estoque, 'Em Estoque', 'Sem Estoque')"], ["COALESCE", "COALESCE(expr1, expr2 [, expr3 ...])   -- mínimo 2", "COALESCE(celular, telefone, 'sem contato')"], ["NULLIF", "NULLIF(expr1, expr2)", "x / NULLIF(y, 0)"]], "lab": [["NULL contamina a conta", "SELECT last_name, salary, commission_pct,\n       salary * commission_pct AS so_comissao,\n       salary * NVL(commission_pct, 0) AS com_nvl\nFROM hr.employees WHERE employee_id IN (100, 145);", "O King (100) não tem comissão: a coluna so_comissao fica vazia. O Russell (145) tem as duas preenchidas.", "Qualquer conta com NULL dá NULL. Use NVL na coluna opcional."], ["FLOOR, CEIL e TRUNC com negativo", "SELECT FLOOR(-2.5), CEIL(-2.5), TRUNC(-2.5), FLOOR(2.5), TRUNC(2.5) FROM dual;", "Com 2,5 o FLOOR e o TRUNC dão 2. Com -2,5 o FLOOR dá -3 e o TRUNC dá -2.", "FLOOR vai para baixo; TRUNC vai em direção ao zero."], ["Precisão e escala na prática", "SELECT CAST(123.89 AS NUMBER(3)), CAST(123.89 AS NUMBER(6,1)),\n       CAST(123.89 AS NUMBER(6,-2)) FROM dual;\nSELECT CAST(123.89 AS NUMBER(4,2)) FROM dual;", "A primeira consulta mostra 124, 123,9 e 100. A segunda dá ORA-01438.", "Decimal a mais arredonda; inteiro a mais é erro."], ["MOD por zero não dá erro", "SELECT MOD(5, 0) FROM dual;\nSELECT 5 / 0 FROM dual;", "O MOD devolve 5. A divisão dá ORA-01476.", "Para dividir sem risco: x / NULLIF(y, 0)."], ["NVL respeita o tipo do 1º argumento", "SELECT NVL(commission_pct, 'N/A') FROM hr.employees;\nSELECT NVL(TO_CHAR(commission_pct), 'N/A') FROM hr.employees;", "A primeira dá ORA-01722. A segunda funciona.", "Para trocar número nulo por texto, converta antes com TO_CHAR."]]}, {"id": "M08", "title": "Manipulando datas e horas", "ref": "Referência para os cenários: SYSDATE = 15/10/2026 10:30 (quinta-feira), sessão em português do Brasil", "reftxt": "Considere nos cenários:\n SYSDATE = 15/10/2026 10:30:00 (quinta-feira)\n NLS_DATE_LANGUAGE = BRAZILIAN PORTUGUESE · NLS_TERRITORY = BRAZIL (semana começa no domingo)\n\nRESERVAS (prática Hotéis Aconchego): 80 linhas, datas de 2020 a 2023\n 35 Anna Ivanova     entrada 19/07/2023  saída 25/07/2023  6 noites\n 58 Richard Thompson entrada 15/07/2023 (sábado)  saída 19/07/2023  4 noites", "cards": [{"id": "V01", "k": "v", "f": "NLS (National Language Support)", "pt": "Suporte a idioma nacional", "d": "Parâmetros que definem como datas, números e textos são apresentados, ordenados e comparados por idioma e região.", "ex": "SELECT * FROM nls_session_parameters;", "rel": "ALTER SESSION"}, {"id": "V02", "k": "v", "f": "NLS_DATE_FORMAT", "pt": "Formato de data padrão", "d": "Formato usado para mostrar DATE e para converter texto em data quando não se informa máscara.", "ex": "ALTER SESSION SET nls_date_format = 'DD/MM/YYYY HH24:MI:SS';", "rel": "TO_DATE"}, {"id": "V03", "k": "v", "f": "NLS_DATE_LANGUAGE", "pt": "Idioma das datas", "d": "Idioma dos nomes de meses e dias (JAN/FEV, MONDAY/SEGUNDA). Se não definido, segue o NLS_LANGUAGE.", "ex": "NEXT_DAY(SYSDATE, 'SEGUNDA')   -- sessão em português", "rel": "NEXT_DAY"}, {"id": "V04", "k": "v", "f": "TIMESTAMP", "pt": "Carimbo de tempo", "d": "Extensão do DATE com frações de segundo (padrão 6 dígitos).", "ex": "TO_TIMESTAMP('10-09-2014 10:10:10.123', 'DD-MM-YYYY HH24:MI:SS.FF')", "rel": "DATE"}, {"id": "V05", "k": "v", "f": "TIMESTAMP WITH TIME ZONE", "pt": "Com fuso horário", "d": "TIMESTAMP que guarda também o fuso (offset como -03:00 ou nome da região).", "ex": "TO_TIMESTAMP_TZ('1999-12-01 11:00:00 -8:00', 'YYYY-MM-DD HH:MI:SS TZH:TZM')", "rel": "TZH:TZM"}, {"id": "V06", "k": "v", "f": "TIMESTAMP WITH LOCAL TIME ZONE", "pt": "Com fuso local", "d": "Normaliza o valor para o fuso do banco ao gravar e mostra no fuso da sessão de quem consulta.", "ex": "col_tswltz TIMESTAMP WITH LOCAL TIME ZONE", "rel": "DBTIMEZONE"}, {"id": "V07", "k": "v", "f": "Time zone (DBTIMEZONE / SESSIONTIMEZONE)", "pt": "Fuso horário do banco / da sessão", "d": "DBTIMEZONE: fuso do banco. SESSIONTIMEZONE: fuso da sessão, alterável com ALTER SESSION SET TIME_ZONE.", "ex": "ALTER SESSION SET time_zone = '-3:0';", "rel": "CURRENT_DATE"}, {"id": "V08", "k": "v", "f": "INTERVAL YEAR TO MONTH", "pt": "Intervalo em anos e meses", "d": "Período em anos e meses. Precisão do ano padrão 2 (até 99 anos).", "ex": "INTERVAL '23-4' YEAR TO MONTH   -- 23 anos e 4 meses", "rel": "INTERVAL DAY TO SECOND"}, {"id": "V09", "k": "v", "f": "INTERVAL DAY TO SECOND", "pt": "Intervalo em dias a segundos", "d": "Período em dias, horas, minutos e segundos. Precisão de dias padrão 2; fração de segundo padrão 6.", "ex": "INTERVAL '2 3:04:11.333' DAY TO SECOND(3)", "rel": "INTERVAL YEAR TO MONTH"}, {"id": "V10", "k": "v", "f": "RR / YY (format element)", "pt": "Ano com 2 dígitos", "d": "YY usa sempre o século atual. RR escolhe o século pela regra de 50 anos: '95' vira 1995, '24' vira 2024.", "ex": "TO_DATE('25/12/23', 'DD/MM/RR')", "rel": "TO_DATE"}, {"id": "V11", "k": "v", "f": "Datetime field", "pt": "Campo de data/hora", "d": "Parte de uma data ou intervalo: YEAR, MONTH, DAY, HOUR, MINUTE, SECOND. É o que o EXTRACT devolve.", "ex": "EXTRACT(MONTH FROM data_reserva)", "rel": "EXTRACT"}, {"id": "C01", "k": "c", "sec": "Parâmetros NLS", "f": "Onde ver os parâmetros NLS e qual vale?", "a": "NLS_DATABASE_PARAMETERS mostra os do banco; NLS_SESSION_PARAMETERS mostra os da sessão atual. O que vale para a sua consulta é o da SESSÃO, que pode ser trocado com ALTER SESSION.", "why": "", "ex": "SELECT * FROM nls_database_parameters;\nSELECT * FROM nls_session_parameters;\nALTER SESSION SET nls_date_format = 'DD/MM/YYYY HH24:MI:SS';", "trap": "O cliente (SQL Developer, variável NLS_LANG do sistema) define os valores da sessão. Por isso o mesmo SQL mostra datas diferentes em máquinas diferentes.", "tag": ""}, {"id": "C02", "k": "c", "sec": "Parâmetros NLS", "f": "Quais são os parâmetros NLS de data?", "a": "NLS_DATE_FORMAT (formato padrão do DATE), NLS_DATE_LANGUAGE (idioma de meses e dias; se vazio, usa NLS_LANGUAGE), NLS_TIMESTAMP_FORMAT e NLS_TIMESTAMP_TZ_FORMAT.", "why": "", "ex": "ALTER SESSION SET nls_date_language = 'BRAZILIAN PORTUGUESE';", "trap": "", "tag": ""}, {"id": "C03", "k": "c", "sec": "Parâmetros NLS", "f": "Por que o idioma da sessão quebra comandos de data?", "a": "Nomes de mês e dia escritos no comando precisam estar no idioma da sessão. 'SEP' (inglês) não existe em português ('SET'); 'MONDAY' não é aceito numa sessão em português.", "why": "", "ex": "-- sessão em português:\nTO_DATE('10-SEP-2014', 'DD-MON-YYYY')   -- ORA-01843: not a valid month\nNEXT_DAY(SYSDATE, 'MONDAY')             -- ORA-01846: not a valid day of the week", "trap": "O script da aula traz 'MONDAY' e 'SEGUNDA' lado a lado: um dos dois sempre falha, conforme o idioma.", "tag": "complemento"}, {"id": "C04", "k": "c", "sec": "Tipos de data e conversão", "f": "Quais os tipos de data e hora?", "a": "<b>DATE:<\/b> data e hora até o segundo.<br><b>TIMESTAMP:<\/b> DATE + frações de segundo.<br><b>TIMESTAMP WITH TIME ZONE:<\/b> + fuso (offset ou região).<br><b>TIMESTAMP WITH LOCAL TIME ZONE:<\/b> normalizado para o fuso do banco e exibido no fuso da sessão.", "why": "", "ex": "CREATE TABLE datas (\n  col_data   DATE,\n  col_ts     TIMESTAMP,\n  col_tswtz  TIMESTAMP WITH TIME ZONE,\n  col_tswltz TIMESTAMP WITH LOCAL TIME ZONE);", "trap": "", "tag": ""}, {"id": "C05", "k": "c", "sec": "Tipos de data e conversão", "f": "Quais funções convertem texto em data?", "a": "TO_DATE para DATE. TO_TIMESTAMP para TIMESTAMP. TO_TIMESTAMP_TZ para TIMESTAMP WITH TIME ZONE e WITH LOCAL TIME ZONE. Sempre informe a máscara.", "why": "", "ex": "TO_DATE('02/11/2023 13:53:27', 'DD/MM/YYYY HH24:MI:SS')\nTO_TIMESTAMP_TZ('1999-12-01 11:00:00 -8:00', 'YYYY-MM-DD HH:MI:SS TZH:TZM')", "trap": "HH é relógio de 12 horas; HH24, de 24. '13:00' com HH dá erro.", "tag": ""}, {"id": "C06", "k": "c", "sec": "Tipos de data e conversão", "f": "RR x YY com ano de 2 dígitos?", "a": "YY põe sempre o século atual. RR usa a regra de 50 anos: com o ano atual entre 00 e 49, valores 00 a 49 ficam no século atual e 50 a 99 no anterior.", "why": "", "ex": "TO_DATE('01/01/95', 'DD/MM/YY')   -- 01/01/2095\nTO_DATE('01/01/95', 'DD/MM/RR')   -- 01/01/1995", "trap": "Clássico de prova e de bug em carga de dados antigos.", "tag": "complemento"}, {"id": "C07", "k": "c", "sec": "Tipos de data e conversão", "f": "DATE - DATE x TIMESTAMP - TIMESTAMP?", "a": "DATE - DATE devolve NÚMERO de dias (com fração). TIMESTAMP - TIMESTAMP devolve INTERVAL DAY TO SECOND.", "why": "", "ex": "DATE '2026-10-15' - DATE '2026-10-01'                 -- 14\nTIMESTAMP '2026-10-15 00:00:00' - TIMESTAMP '2026-10-01 00:00:00'\n                                                       -- +14 00:00:00.000000", "trap": "", "tag": "complemento"}, {"id": "C08", "k": "c", "sec": "Data e hora atuais", "f": "SYSDATE x CURRENT_DATE?", "a": "SYSDATE: data e hora do sistema operacional do SERVIDOR do banco, tipo DATE. CURRENT_DATE: data e hora no fuso da SESSÃO, também DATE.", "why": "", "ex": "ALTER SESSION SET time_zone = '-5:0';\nSELECT SYSDATE, CURRENT_DATE FROM dual;   -- podem diferir em horas", "trap": "Job agendado com SYSDATE usa a hora do servidor. Num DB System na OCI o servidor costuma estar em UTC.", "tag": ""}, {"id": "C09", "k": "c", "sec": "Data e hora atuais", "f": "CURRENT_TIMESTAMP, LOCALTIMESTAMP e SYSTIMESTAMP?", "a": "CURRENT_TIMESTAMP: hora da sessão, tipo TIMESTAMP WITH TIME ZONE. LOCALTIMESTAMP: hora da sessão, tipo TIMESTAMP (sem fuso). SYSTIMESTAMP: hora do servidor, com fuso.", "why": "", "ex": "SELECT CURRENT_TIMESTAMP, LOCALTIMESTAMP, SYSTIMESTAMP FROM dual;", "trap": "Os slides citam os dois primeiros; SYSTIMESTAMP é o par do SYSDATE com frações de segundo.", "tag": "complemento: SYSTIMESTAMP"}, {"id": "C10", "k": "c", "sec": "Data e hora atuais", "f": "DBTIMEZONE x SESSIONTIMEZONE?", "a": "DBTIMEZONE: fuso do banco (usado no TIMESTAMP WITH LOCAL TIME ZONE). SESSIONTIMEZONE: fuso da sessão, alterável por ALTER SESSION SET TIME_ZONE.", "why": "", "ex": "SELECT DBTIMEZONE, SESSIONTIMEZONE FROM dual;", "trap": "", "tag": ""}, {"id": "C11", "k": "c", "sec": "Funções de calendário", "f": "NEXT_DAY: regras?", "a": "Devolve a próxima data, ESTRITAMENTE posterior, que cai no dia da semana informado. O nome do dia segue o idioma da sessão. A hora da data original é mantida.", "why": "", "ex": "-- 15/01/2024 15:12 é segunda-feira (sessão em inglês)\nNEXT_DAY(TO_DATE('15-JAN-2024 15:12','DD-MON-YYYY HH24:MI'), 'SUNDAY')\n-- 21-JAN-2024 15:12", "trap": "Se a data já é sábado, NEXT_DAY(data, 'SÁBADO') pula para o sábado da semana seguinte.", "tag": ""}, {"id": "C12", "k": "c", "sec": "Funções de calendário", "f": "LAST_DAY e ADD_MONTHS?", "a": "LAST_DAY: último dia do mês da data, mantendo a hora. ADD_MONTHS: soma meses; se a data é último dia do mês ou o mês de destino é menor, devolve o último dia do mês de destino (Módulo 02).", "why": "", "ex": "LAST_DAY(TO_DATE('18-02-24', 'DD-MM-RR'))             -- 29/02/2024\nADD_MONTHS(TO_DATE('25/12/23', 'DD/MM/RR'), 12)       -- 25/12/2024", "trap": "LAST_DAY(SYSDATE) traz a HORA atual. Usado como limite de BETWEEN, perde registros do último dia (ver prática Q1).", "tag": ""}, {"id": "C13", "k": "c", "sec": "Funções de calendário", "f": "ADD_MONTHS x somar INTERVAL de mês?", "a": "ADD_MONTHS ajusta para o fim do mês. Somar INTERVAL '1' MONTH não ajusta: se o dia não existir no mês de destino, dá erro.", "why": "", "ex": "ADD_MONTHS(DATE '2023-01-31', 1)        -- 28/02/2023\nDATE '2023-01-31' + INTERVAL '1' MONTH   -- ORA-01839: date not valid for month specified", "trap": "", "tag": "complemento"}, {"id": "C14", "k": "c", "sec": "Funções de calendário", "f": "MONTHS_BETWEEN: sinal?", "a": "Positivo se o 1º argumento for a data maior; negativo se for a menor.", "why": "", "ex": "MONTHS_BETWEEN(TO_DATE('22/02/2024','DD/MM/YYYY'), SYSDATE)   -- negativo\nMONTHS_BETWEEN(SYSDATE, TO_DATE('22/02/2024','DD/MM/YYYY'))   -- positivo", "trap": "", "tag": ""}, {"id": "C15", "k": "c", "sec": "Funções de calendário", "f": "EXTRACT: o que extrai de DATE e de TIMESTAMP?", "a": "De DATE: YEAR, MONTH e DAY. HOUR, MINUTE e SECOND só de TIMESTAMP ou INTERVAL.", "why": "", "ex": "EXTRACT(YEAR FROM SYSDATE)        -- 2026\nEXTRACT(HOUR FROM SYSDATE)        -- ORA-30076\nEXTRACT(HOUR FROM SYSTIMESTAMP)   -- ok", "trap": "Pegadinha clássica: DATE tem hora, mas o EXTRACT não deixa tirar.", "tag": "complemento"}, {"id": "C16", "k": "c", "sec": "Funções de calendário", "f": "TRUNC e ROUND de data com formato?", "a": "TRUNC corta na unidade: 'MM' 1º dia do mês, 'YY' 1º dia do ano, 'HH' hora cheia, 'DAY' 1º dia da semana (conforme NLS_TERRITORY). ROUND arredonda: 'MM' sobe a partir do dia 16; 'YY' a partir de 1º de julho.", "why": "", "ex": "-- SYSDATE = 15/10/2026 10:30\nTRUNC(SYSDATE, 'MM')   -- 01/10/2026\nTRUNC(SYSDATE, 'DAY')  -- 11/10/2026 (domingo, Brasil)\nROUND(SYSDATE, 'MM')   -- 01/10/2026 (dia 15 < 16)\nROUND(SYSDATE, 'YY')   -- 01/01/2027", "trap": "'DAY' depende do território: no Brasil e nos EUA a semana começa no domingo; em boa parte da Europa, na segunda.", "tag": ""}, {"id": "C17", "k": "c", "sec": "Intervalos", "f": "INTERVAL YEAR TO MONTH: sintaxe e precisão?", "a": "INTERVAL YEAR [(precisão)] TO MONTH. A precisão é o número de dígitos do ano: padrão 2, máximo 9. Com campo inicial YEAR, o mês vai de 0 a 11.", "why": "", "ex": "INTERVAL '23-4' YEAR TO MONTH        -- 23 anos e 4 meses\nINTERVAL '120-6' YEAR(3) TO MONTH    -- precisa de (3)\nINTERVAL '10000' MONTH(5)\nINTERVAL '1-13' YEAR TO MONTH        -- erro: mês 13", "trap": "Coluna INTERVAL YEAR TO MONTH (precisão 2) não aceita 120 anos: ORA-01873.", "tag": ""}, {"id": "C18", "k": "c", "sec": "Intervalos", "f": "INTERVAL DAY TO SECOND: sintaxe e precisão?", "a": "INTERVAL DAY [(precisão dias)] TO SECOND [(precisão fração)]. Dias: 0 a 9, padrão 2. Fração de segundo: 0 a 9, padrão 6. O campo à direita precisa estar na faixa normal (minuto 0 a 59).", "why": "", "ex": "INTERVAL '2 3:04:11.333' DAY TO SECOND(3)\nINTERVAL '40' HOUR · INTERVAL '70' MINUTE\nINTERVAL '03:70' HOUR TO MINUTE   -- erro: minuto 70", "trap": "O slide descreve INTERVAL '2 3:04' DAY TO MINUTE como \"... 11 segundos e 333 milésimos\". Erro de cópia: é só 2 dias, 3 horas e 4 minutos.", "tag": "correção do material: exemplo DAY TO MINUTE"}, {"id": "C19", "k": "c", "sec": "Aritmética com datas", "f": "Que operações valem com datas?", "a": "DATE ± número (dias, fração = horas). DATE ± INTERVAL. DATE - DATE = número. Não existe multiplicação nem divisão de datas. Timestamp + número vira DATE (perde a fração de segundo).", "why": "", "ex": "SYSDATE + 1         -- amanhã\nSYSDATE + 1/24      -- daqui a 1 hora\nSYSDATE + 1.5       -- daqui a 1 dia e 12 horas\nTO_DATE('01/01/2023','DD/MM/YYYY') + INTERVAL '2-2' YEAR TO MONTH   -- 01/03/2025", "trap": "", "tag": ""}, {"id": "C20", "k": "c", "sec": "Aritmética com datas", "f": "Número com INTERVAL?", "a": "Somar ou subtrair número de INTERVAL não é permitido. Multiplicar ou dividir INTERVAL por número é permitido.", "why": "", "ex": "INTERVAL '1' DAY * 2     -- +02 00:00:00\nINTERVAL '1' DAY + 1     -- erro", "trap": "O slide diz que constantes numéricas não podem ser usadas com intervalo. Vale para soma e subtração, não para multiplicação.", "tag": "complemento"}, {"id": "C21", "k": "c", "sec": "Aritmética com datas", "f": "Operações entre intervalos?", "a": "Entre intervalos do MESMO tipo: permitido.
