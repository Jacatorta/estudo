ze=\"9.00\" fill=\"white\">flashcards C10–C14<\/text>\n<text text-anchor=\"start\" x=\"138.32\" y=\"-176.6\" font-family=\"DejaVu Sans\" font-size=\"10.00\">DISTINCT = UNIQUE · ALL é o padrão<\/text>\n<text text-anchor=\"start\" x=\"138.32\" y=\"-159.6\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Só logo após SELECT<\/text>\n<text text-anchor=\"start\" x=\"138.32\" y=\"-142.6\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Compara a linha inteira<\/text>\n<text text-anchor=\"start\" x=\"138.32\" y=\"-125.6\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Todos os NULL viram 1 grupo<\/text>\n<text text-anchor=\"start\" x=\"138.32\" y=\"-108.6\" font-family=\"DejaVu Sans\" font-size=\"10.00\">ORDER BY só com colunas da lista<\/text>\n<text text-anchor=\"start\" x=\"138.32\" y=\"-91.6\" font-family=\"DejaVu Sans\" font-size=\"10.00\">   (senão ORA&#45;01791)<\/text>\n<path fill=\"none\" stroke=\"#1f7a55\" d=\"M145.82,-84.6C145.82,-84.6 310.82,-84.6 310.82,-84.6 316.82,-84.6 322.82,-90.6 322.82,-96.6 322.82,-96.6 322.82,-212.6 322.82,-212.6 322.82,-218.6 316.82,-224.6 310.82,-224.6 310.82,-224.6 145.82,-224.6 145.82,-224.6 139.82,-224.6 133.82,-218.6 133.82,-212.6 133.82,-212.6 133.82,-96.6 133.82,-96.6 133.82,-90.6 139.82,-84.6 145.82,-84.6\"/>\n<\/g>\n\n<g id=\"edge5\" class=\"edge\">\n<title>c&#45;&gt;b4<\/title>\n<path fill=\"none\" stroke=\"#1f7a55\" stroke-width=\"3.2\" d=\"M422.48,-398.89C340.37,-298.68 308.31,-259.41 281.27,-224.61\"/>\n<\/g>\n\n<g id=\"node7\" class=\"node\">\n<title>b5<\/title>\n<path fill=\"white\" stroke=\"transparent\" d=\"M419.5,0C419.5,0 629.5,0 629.5,0 635.5,0 641.5,-6 641.5,-12 641.5,-12 641.5,-162 641.5,-162 641.5,-168 635.5,-174 629.5,-174 629.5,-174 419.5,-174 419.5,-174 413.5,-174 407.5,-168 407.5,-162 407.5,-162 407.5,-12 407.5,-12 407.5,-6 413.5,0 419.5,0\"/>\n<polygon fill=\"#00838f\" stroke=\"transparent\" points=\"408.5,-153 408.5,-173 640.5,-173 640.5,-153 408.5,-153\"/>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-160.6\" font-family=\"DejaVu Sans\" font-weight=\"bold\" font-size=\"13.00\" fill=\"white\">ORDER BY (ordenar)<\/text>\n<polygon fill=\"#00838f\" stroke=\"transparent\" points=\"408.5,-137 408.5,-153 640.5,-153 640.5,-137 408.5,-137\"/>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-142.8\" font-family=\"DejaVu Sans\" font-size=\"9.00\" fill=\"white\">flashcards C48–C54<\/text>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-126\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Sem ORDER BY = ordem não garantida<\/text>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-109\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Por expressão, posição ou alias<\/text>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-92\" font-family=\"DejaVu Sans\" font-size=\"10.00\">ASC padrão · DESC vale por coluna<\/text>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-75\" font-family=\"DejaVu Sans\" font-size=\"10.00\">ASC → NULLS LAST · DESC → NULLS FIRST<\/text>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-58\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Máx. 255 expr · não ordena LOB / LONG<\/text>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-41\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Com GROUP BY: agregação, constante,<\/text>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-24\" font-family=\"DejaVu Sans\" font-size=\"10.00\">   expressão do GROUP BY (senão ORA&#45;00979)<\/text>\n<text text-anchor=\"start\" x=\"411.5\" y=\"-7\" font-family=\"DejaVu Sans\" font-size=\"10.00\">SIBLINGS: hierarquia (CONNECT BY)<\/text>\n<path fill=\"none\" stroke=\"#00838f\" d=\"M419.5,0C419.5,0 629.5,0 629.5,0 635.5,0 641.5,-6 641.5,-12 641.5,-12 641.5,-162 641.5,-162 641.5,-168 635.5,-174 629.5,-174 629.5,-174 419.5,-174 419.5,-174 413.5,-174 407.5,-168 407.5,-162 407.5,-162 407.5,-12 407.5,-12 407.5,-6 413.5,0 419.5,0\"/>\n<\/g>\n\n<g id=\"edge6\" class=\"edge\">\n<title>c&#45;&gt;b5<\/title>\n<path fill=\"none\" stroke=\"#00838f\" stroke-width=\"3.2\" d=\"M453.19,-399.12C482.62,-268.67 494.15,-217.63 504.16,-174.22\"/>\n<\/g>\n\n<g id=\"node8\" class=\"node\">\n<title>b6<\/title>\n<path fill=\"white\" stroke=\"transparent\" d=\"M661.53,-180.92C661.53,-180.92 862.53,-180.92 862.53,-180.92 868.53,-180.92 874.53,-186.92 874.53,-192.92 874.53,-192.92 874.53,-359.92 874.53,-359.92 874.53,-365.92 868.53,-371.92 862.53,-371.92 862.53,-371.92 661.53,-371.92 661.53,-371.92 655.53,-371.92 649.53,-365.92 649.53,-359.92 649.53,-359.92 649.53,-192.92 649.53,-192.92 649.53,-186.92 655.53,-180.92 661.53,-180.92\"/>\n<polygon fill=\"#5d6d7e\" stroke=\"transparent\" points=\"651.03,-350.42 651.03,-370.42 874.03,-370.42 874.03,-350.42 651.03,-350.42\"/>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-358.02\" font-family=\"DejaVu Sans\" font-weight=\"bold\" font-size=\"13.00\" fill=\"white\">Limitar linhas<\/text>\n<polygon fill=\"#5d6d7e\" stroke=\"transparent\" points=\"651.03,-334.42 651.03,-350.42 874.03,-350.42 874.03,-334.42 651.03,-334.42\"/>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-340.22\" font-family=\"DejaVu Sans\" font-size=\"9.00\" fill=\"white\">flashcards C28–C39<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-323.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">LIMIT não existe no Oracle<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-306.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">OFFSET / FETCH (12c+) depois do ORDER BY<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-289.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">OFFSET: negativo → 0 · fração trunca<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-272.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">OFFSET ≥ total ou NULL → 0 linhas<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-255.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">FETCH sem número = 1 linha<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-238.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">ONLY exato · WITH TIES exige ORDER BY<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-221.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">ROWNUM nasce antes do ORDER BY<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-204.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">ROWNUM = 2 → 0 linhas<\/text>\n<text text-anchor=\"start\" x=\"654.03\" y=\"-187.42\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Top&#45;N com ROWNUM: inline view<\/text>\n<path fill=\"none\" stroke=\"#5d6d7e\" d=\"M661.53,-180.92C661.53,-180.92 862.53,-180.92 862.53,-180.92 868.53,-180.92 874.53,-186.92 874.53,-192.92 874.53,-192.92 874.53,-359.92 874.53,-359.92 874.53,-365.92 868.53,-371.92 862.53,-371.92 862.53,-371.92 661.53,-371.92 661.53,-371.92 655.53,-371.92 649.53,-365.92 649.53,-359.92 649.53,-359.92 649.53,-192.92 649.53,-192.92 649.53,-186.92 655.53,-180.92 661.53,-180.92\"/>\n<\/g>\n\n<g id=\"edge7\" class=\"edge\">\n<title>c&#45;&gt;b6<\/title>\n<path fill=\"none\" stroke=\"#5d6d7e\" stroke-width=\"3.2\" d=\"M508.72,-399.2C577.48,-366.95 618.42,-347.69 649.32,-332.83\"/>\n<\/g>\n<\/g>\n<\/svg>\n"}, {"id": "M02", "title": "Single-Row Functions: string, número e data", "ref": "Referência para os cenários: considere SYSDATE = 15/10/2026 10:30:00 e o schema HR de exemplo", "reftxt": "HR.EMPLOYEES (colunas usadas na aula)\n FIRST_NAME  LAST_NAME  EMAIL   SALARY  HIRE_DATE   JOB_ID\n ----------  ---------  ------  ------  ----------  ------\n Steven      King       SKING    24000  17/06/2003  AD_PRES\n Neena       Kochhar    NKOCHHAR 17000  21/09/2005  AD_VP\n ...\n Obs.: no HR o EMAIL não tem '@' nem domínio.", "cards": [{"id": "V01", "k": "v", "f": "Single-row function", "pt": "Função de linha única", "d": "Recebe os valores de UMA linha e devolve UM valor por linha. 10 linhas entram, 10 saem.", "ex": "SELECT UPPER(first_name) FROM hr.employees;", "rel": "Multiple-row function"}, {"id": "V02", "k": "v", "f": "Multiple-row / Aggregate function", "pt": "Função de grupo / agregação", "d": "Recebe várias linhas e devolve um valor para o grupo: SUM, COUNT, AVG, MAX, MIN. É o contrário da single-row.", "ex": "SELECT COUNT(*) FROM hr.employees;   -- N linhas → 1", "rel": "GROUP BY"}, {"id": "V03", "k": "v", "f": "Character function", "pt": "Função de caractere", "d": "Função que recebe texto: UPPER, LOWER, INITCAP, LENGTH, SUBSTR, INSTR, REPLACE, TRIM.", "ex": "SELECT LENGTH(email) FROM hr.employees;", "rel": "String"}, {"id": "V04", "k": "v", "f": "Case conversion", "pt": "Conversão de caixa", "d": "Trocar maiúsculas e minúsculas: UPPER (tudo maiúsculo), LOWER (tudo minúsculo), INITCAP (primeira letra de cada palavra).", "ex": "SELECT INITCAP('JOÃO DA SILVA') FROM dual;  -- João Da Silva", "rel": "Case-sensitive"}, {"id": "V05", "k": "v", "f": "Substring", "pt": "Subcadeia / trecho de texto", "d": "Parte de uma string, extraída com SUBSTR a partir de uma posição.", "ex": "SELECT SUBSTR('ORACLE', 1, 3) FROM dual;   -- ORA", "rel": "SUBSTR"}, {"id": "V06", "k": "v", "f": "Occurrence", "pt": "Ocorrência", "d": "Qual aparição do trecho procurar. No INSTR, o 4º argumento: 2 = segunda vez que aparece.", "ex": "SELECT INSTR('BANANA', 'A', 1, 2) FROM dual;   -- 4", "rel": "INSTR"}, {"id": "V07", "k": "v", "f": "Leading / Trailing / Both", "pt": "À esquerda / À direita / Ambos", "d": "Lado de onde o TRIM remove o caractere. Padrão: BOTH.", "ex": "SELECT TRIM(LEADING '0' FROM '00120') FROM dual;   -- 120", "rel": "TRIM"}, {"id": "V08", "k": "v", "f": "Rounding / Truncation", "pt": "Arredondamento / Truncamento", "d": "ROUND arredonda pela regra matemática. TRUNC corta, sem arredondar.", "ex": "SELECT ROUND(7.25,1), TRUNC(7.25,1) FROM dual;   -- 7.3 | 7.2", "rel": "ROUND / TRUNC"}, {"id": "V09", "k": "v", "f": "Remainder (modulo)", "pt": "Resto da divisão", "d": "O que sobra da divisão inteira. MOD(10,3) = 1.", "ex": "SELECT MOD(employee_id, 2) FROM hr.employees;   -- 0 par, 1 ímpar", "rel": "MOD"}, {"id": "V10", "k": "v", "f": "Date arithmetic", "pt": "Aritmética de datas", "d": "DATE ± número soma ou subtrai DIAS. DATE - DATE devolve número de dias.", "ex": "SELECT SYSDATE + 7, SYSDATE - hire_date FROM hr.employees;", "rel": "SYSDATE"}, {"id": "V11", "k": "v", "f": "Nesting", "pt": "Aninhamento", "d": "Uma função dentro da outra. O Oracle avalia de dentro para fora.", "ex": "SELECT UPPER(SUBSTR('oracle',1,3)) FROM dual;   -- ORA", "rel": "Composição"}, {"id": "V12", "k": "v", "f": "DUAL", "pt": "DUAL", "d": "Tabela de 1 linha e 1 coluna do Oracle, usada para testar funções e expressões sem tocar em tabela real.", "ex": "SELECT SYSDATE FROM dual;", "rel": "Teste rápido"}, {"id": "V13", "k": "v", "f": "Function-based index", "pt": "Índice baseado em função", "d": "Índice criado sobre o resultado de uma função, para o WHERE com essa função conseguir usar índice.", "ex": "CREATE INDEX emp_upper_ln_ix ON hr.employees (UPPER(last_name));", "rel": "Sargable"}, {"id": "C01", "k": "c", "sec": "Conceito de single-row function", "f": "O que é uma single-row function?", "a": "Função que age linha a linha: cada linha de entrada gera exatamente um resultado. Não agrupa dados.", "why": "É o oposto da função de grupo (SUM, COUNT, AVG), que transforma várias linhas em um valor só.", "ex": "SELECT first_name, UPPER(first_name) FROM hr.employees;   -- 107 linhas → 107 linhas\nSELECT COUNT(*) FROM hr.employees;                         -- 107 linhas → 1", "trap": "Na prova, \"retorna um resultado por linha\" = single-row. \"Retorna um resultado por grupo\" = aggregate.", "tag": ""}, {"id": "C02", "k": "c", "sec": "Conceito de single-row function", "f": "Em quais cláusulas posso usar single-row functions?", "a": "SELECT e WHERE (os dois vistos na aula), e também ORDER BY, GROUP BY e HAVING.", "why": "", "ex": "SELECT INITCAP(last_name) FROM hr.employees\nWHERE UPPER(job_id) LIKE '%MAN%'\nORDER BY LENGTH(last_name);", "trap": "", "tag": "complemento: ORDER BY, GROUP BY e HAVING não estão nos slides"}, {"id": "C03", "k": "c", "sec": "Conceito de single-row function", "f": "Como o Oracle avalia funções aninhadas?", "a": "De dentro para fora. O resultado da função interna vira o argumento da externa.", "why": "", "ex": "INITCAP(first_name || ' ' || last_name)\n-- 1º concatena: 'steven KING'\n-- 2º INITCAP:   'Steven King'", "trap": "Conte os parênteses. Questões de prova aninham 3 ou 4 funções para você errar a ordem.", "tag": ""}, {"id": "C04", "k": "c", "sec": "Conceito de single-row function", "f": "O que a maioria das funções devolve quando recebe NULL?", "a": "NULL. Exceções importantes: o operador || trata NULL como texto vazio; REPLACE e NVL/COALESCE também têm tratamento próprio.", "why": "", "ex": "SELECT UPPER(NULL), LENGTH(NULL) FROM dual;   -- NULL | NULL\nSELECT 'Ana' || NULL || 'Lima' FROM dual;     -- AnaLima", "trap": "", "tag": "complemento"}, {"id": "C05", "k": "c", "sec": "String: caixa e tamanho", "f": "UPPER, LOWER e INITCAP: o que cada uma faz?", "a": "UPPER: tudo maiúsculo. LOWER: tudo minúsculo. INITCAP: primeira letra de cada palavra maiúscula e o RESTO minúsculo. Palavra = sequência separada por espaço ou caractere não alfanumérico.", "why": "", "ex": "SELECT UPPER('Oracle'), LOWER('Oracle'), INITCAP('joão da SILVA') FROM dual;\n-- ORACLE | oracle | João Da Silva", "trap": "INITCAP não só sobe a primeira letra: ele também DESCE as demais. 'SILVA' vira 'Silva', 'McDonald' vira 'Mcdonald'.", "tag": ""}, {"id": "C06", "k": "c", "sec": "String: caixa e tamanho", "f": "Para que serve UPPER/LOWER no WHERE?", "a": "Fazer busca sem diferenciar maiúscula de minúscula, já que comparação de texto no Oracle é case-sensitive.", "why": "", "ex": "WHERE UPPER(last_name) = 'KING'      -- acha King, KING, king\nWHERE UPPER(job_id) LIKE '%MAN%'     -- exemplo da aula", "trap": "No HR o JOB_ID já é gravado em maiúsculo, então o UPPER do exemplo da aula não muda o resultado. Só custa desempenho.", "tag": ""}, {"id": "C07", "k": "c", "sec": "String: caixa e tamanho", "f": "LENGTH: o que conta e como trata vazio?", "a": "Conta caracteres, incluindo espaços. No Oracle, string vazia ('') É NULL, então LENGTH('') = NULL, não 0.", "why": "", "ex": "SELECT LENGTH(' ab ') FROM dual;   -- 4\nSELECT LENGTH('') FROM dual;       -- NULL", "trap": "Quem vem de SQL Server ou PostgreSQL espera 0. No Oracle é NULL.", "tag": "complemento: string vazia = NULL"}, {"id": "C08", "k": "c", "sec": "String: extrair", "f": "SUBSTR: sintaxe e regras?", "a": "SUBSTR(texto, posição [, tamanho])<br>Posição começa em 1. Posição 0 é tratada como 1. Posição negativa conta do FIM para o início. Sem tamanho: vai até o final.", "why": "", "ex": "SUBSTR('ORACLE', 2, 3)   -- RAC\nSUBSTR('ORACLE', -3)     -- CLE\nSUBSTR('ORACLE', 0, 2)   -- OR\nSUBSTR(email, 1, 5)      -- exemplo da aula: 5 primeiros", "trap": "Tamanho menor que 1 devolve NULL.", "tag": ""}, {"id": "C09", "k": "c", "sec": "String: extrair", "f": "INSTR: sintaxe e retorno?", "a": "INSTR(texto, procurado [, posição_inicial [, ocorrência]])<br>Devolve a POSIÇÃO (número) onde o trecho aparece. Não achou: 0. Posição inicial negativa busca de trás para frente.", "why": "", "ex": "INSTR('BANANA', 'A')         -- 2\nINSTR('BANANA', 'A', 1, 2)   -- 4 (2ª ocorrência)\nINSTR('BANANA', 'X')         -- 0", "trap": "INSTR devolve número, não texto. E retorna 0, não NULL, quando não encontra.", "tag": ""}, {"id": "C10", "k": "c", "sec": "String: extrair", "f": "Como extrair o usuário de um e-mail (antes do @)?", "a": "Combinar SUBSTR com INSTR: corta da posição 1 até uma antes do @.", "why": "", "ex": "SELECT SUBSTR('caio@wisedb.com.br', 1, INSTR('caio@wisedb.com.br','@') - 1) FROM dual;\n-- caio", "trap": "No HR o EMAIL é 'SKING', sem @. INSTR dá 0, o tamanho vira -1 e o SUBSTR devolve NULL. Teste com o dado real, não com o que você imagina.", "tag": ""}, {"id": "C11", "k": "c", "sec": "String: limpar e montar", "f": "REPLACE: sintaxe e comportamento?", "a": "REPLACE(texto, procurado [, substituto]). Troca TODAS as ocorrências. Sem o 3º argumento, remove o trecho.", "why": "", "ex": "REPLACE('A-B-C', '-', '/')    -- A/B/C\nREPLACE('2026-10-15', '-')     -- 20261015", "trap": "É case-sensitive: REPLACE('Oracle','oracle','X') não troca nada.", "tag": ""}, {"id": "C12", "k": "c", "sec": "String: limpar e montar", "f": "TRIM: sintaxe e restrições?", "a": "TRIM([LEADING | TRAILING | BOTH] [caractere FROM] texto). Padrão: BOTH e espaço. O caractere de corte precisa ser UM único caractere.", "why": "", "ex": "TRIM('  ab  ')                  -- 'ab'\nTRIM('0' FROM '00120')          -- '12'\nTRIM(LEADING '0' FROM '00120')  -- '120'\nTRIM('ab' FROM 'abcab')         -- ORA-30001", "trap": "Para remover um conjunto de caracteres use LTRIM/RTRIM: LTRIM('xyxab','xy') = 'ab'.", "tag": "complemento: LTRIM/RTRIM"}, {"id": "C13", "k": "c", "sec": "String: limpar e montar", "f": "|| versus CONCAT?", "a": "|| aceita quantos pedaços quiser. CONCAT aceita só 2 argumentos. Os dois tratam NULL como vazio.", "why": "", "ex": "first_name || ' ' || last_name\nCONCAT(CONCAT(first_name, ' '), last_name)   -- mesma coisa", "trap": "CONCAT(a, b, c) dá ORA-00909: invalid number of arguments.", "tag": "complemento"}, {"id": "C14", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "ROUND(n, d): como arredonda?", "a": "Arredonda n para d casas decimais. d omitido = 0. Parte descartada ≥ 0,5 sobe; menor que 0,5 desce. Em NUMBER, o meio (0,5) arredonda para longe do zero.", "why": "", "ex": "ROUND(10.49, 0)   -- 10\nROUND(10.50, 0)   -- 11\nROUND(7.25, 1)    -- 7.3", "trap": "Os exemplos 10.49 e 10.50 vêm do scripts.txt da aula. Rode e confira.", "tag": ""}, {"id": "C15", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "TRUNC(n, d): como trunca?", "a": "Corta n em d casas decimais, sem arredondar. d omitido = 0. Corta sempre em direção ao zero.", "why": "", "ex": "TRUNC(10.49, 0)   -- 10\nTRUNC(10.50, 0)   -- 10\nTRUNC(7.29, 1)    -- 7.2", "trap": "", "tag": ""}, {"id": "C16", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "Quando ROUND e TRUNC dão resultados diferentes?", "a": "Só quando a parte descartada vale meia unidade ou mais (≥ 0,5 da última casa mantida). Ter decimais não basta.", "why": "ROUND(10.49) e TRUNC(10.49) dão 10 os dois, mesmo com decimais. E com d negativo há diferença mesmo em número inteiro: ROUND(1250,-2)=1300, TRUNC(1250,-2)=1200.", "ex": "ROUND(10.49,0), TRUNC(10.49,0)   -- 10 | 10   (tem decimal, mesmo resultado)\nROUND(10.50,0), TRUNC(10.50,0)   -- 11 | 10", "trap": "", "tag": "correção do material: o slide diz que a diferença aparece quando há decimais"}, {"id": "C17", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "O que faz o d negativo em ROUND/TRUNC?", "a": "Arredonda ou corta à ESQUERDA da vírgula: -1 = dezenas, -2 = centenas, -3 = milhares.", "why": "", "ex": "ROUND(1250, -2)   -- 1300\nTRUNC(1250, -2)   -- 1200\nROUND(1249, -2)   -- 1200", "trap": "Clássico de prova: ROUND(salary, -3) para arredondar salário em milhares.", "tag": "complemento"}, {"id": "C18", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "ROUND e TRUNC com número negativo?", "a": "ROUND afasta do zero no meio; TRUNC aproxima do zero.", "why": "", "ex": "ROUND(-2.5)   -- -3\nTRUNC(-2.7)   -- -2   (não -3)", "trap": "", "tag": "complemento"}, {"id": "C19", "k": "c", "sec": "Números: ROUND, TRUNC, MOD", "f": "MOD(m, n): o que devolve?", "a": "O resto da divisão de m por n. Usos da aula: par ou ímpar, ciclos, regras condicionais. MOD(m, 0) devolve m. O sinal do resultado segue o dividendo (m).", "why": "", "ex": "MOD(10, 3)    -- 1\nMOD(10, 0)    -- 10 (não dá erro de divisão por zero)\nMOD(-7, 3)    -- -1\nWHERE MOD(employee_id, 2) = 0   -- só IDs pares", "trap": "MOD(x, 0) não gera ORA-01476 (divisor igual a zero). Já x/0 gera.", "tag": ""}, {"id": "C20", "k": "c", "sec": "Datas", "f": "O que o tipo DATE armazena?", "a": "Data E hora: século, ano, mês, dia, hora, minuto e segundo. Não tem fração de segundo (para isso existe TIMESTAMP).", "why": "É por isso que SYSDATE - hire_date dá número quebrado: a hora entra na conta.", "ex": "SELECT TO_CHAR(SYSDATE, 'DD/MM/YYYY HH24:MI:SS') FROM dual;", "trap": "O formato que aparece na tela (NLS_DATE_FORMAT) pode esconder a hora. Ela continua lá.", "tag": "complemento: TIMESTAMP"}, {"id": "C21", "k": "c", "sec": "Datas", "f": "SYSDATE: o que devolve?", "a": "Data e hora atuais do sistema operacional do SERVIDOR do banco. Não leva parênteses.", "why": "", "ex": "SELECT SYSDATE FROM dual;     -- ok\nSELECT SYSDATE() FROM dual;   -- erro", "trap": "CURRENT_DATE devolve a data no fuso da SESSÃO. Num cliente em outro fuso, SYSDATE e CURRENT_DATE diferem.", "tag": "complemento: CURRENT_DATE"}, {"id": "C22", "k": "c", "sec": "Datas", "f": "Quais operações aritméticas valem com DATE?", "a": "DATE + n → DATE (soma n dias)<br>DATE - n → DATE<br>DATE - DATE → NUMBER (dias)<br>DATE + n/24 → soma horas<br>DATE + DATE → ERRO", "why": "", "ex": "SYSDATE + 7                -- daqui a 7 dias\nSYSDATE + 2/24             -- daqui a 2 horas\nSYSDATE - hire_date        -- dias de empresa (exemplo da aula)\nSYSDATE + hire_date        -- ORA-00975", "trap": "O resultado de DATE - DATE é em DIAS, não em meses nem anos.", "tag": ""}, {"id": "C23", "k": "c", "sec": "Datas", "f": "Por que SYSDATE - hire_date dá número com fração?", "a": "SYSDATE tem hora; hire_date normalmente é meia-noite. A diferença de horas vira fração do dia.", "why": "", "ex": "-- SYSDATE = 15/10/2026 10:30\nSYSDATE - DATE '2026-10-14'          -- 1.4375\nTRUNC(SYSDATE) - DATE '2026-10-14'   -- 1\nTRUNC(SYSDATE - hire_date)           -- dias inteiros", "trap": "", "tag": ""}, {"id": "C24", "k": "c", "sec": "Datas", "f": "ADD_MONTHS(d, n): regras?", "a": "Soma n meses à data (n negativo subtrai). Se d é o último dia do mês, ou se o mês de destino tem menos dias, o resultado é o ÚLTIMO dia do mês de destino.", "why": "", "ex": "ADD_MONTHS(DATE '2026-01-15', 6)    -- 15/07/2026\nADD_MONTHS(DATE '2024-01-31', 1)    -- 29/02/2024\nADD_MONTHS(DATE '2024-04-30', 1)    -- 31/05/2024 (último → último)\nADD_MONTHS(SYSDATE, -60)            -- 5 anos atrás", "trap": "30/04 + 1 mês não é 30/05: é 31/05, porque 30/04 é o último dia de abril.", "tag": ""}, {"id": "C25", "k": "c", "sec": "Datas", "f": "MONTHS_BETWEEN(d1, d2): regras?", "a": "Meses entre d1 e d2. Positivo se d1 for posterior; negativo se anterior. Dá inteiro quando os dias do mês coincidem (ou ambos são último dia). Fora isso, a fração considera mês de 31 dias.", "why": "", "ex": "MONTHS_BETWEEN(DATE '2026-03-15', DATE '2026-01-15')   -- 2\nMONTHS_BETWEEN(DATE '2026-01-15', DATE '2026-03-15')   -- -2", "trap": "A ordem dos argumentos importa. Inverter dá número negativo e o filtro > 60 nunca é verdade.", "tag": ""}, {"id": "C26", "k": "c", "sec": "Datas", "f": "TRUNC e ROUND em datas?", "a": "TRUNC(data) zera a hora (meia-noite). Com formato: 'MM' = 1º dia do mês, 'YYYY' = 1º dia do ano. ROUND(data) arredonda para o dia mais próximo (meio-dia vira o dia seguinte).", "why": "", "ex": "TRUNC(SYSDATE)          -- 15/10/2026 00:00:00\nTRUNC(SYSDATE, 'MM')    -- 01/10/2026\nTRUNC(SYSDATE, 'YYYY')  -- 01/01/2026", "trap": "", "tag": "complemento: formatos e ROUND(data)"}, {"id": "C27", "k": "c", "sec": "Datas", "f": "O que significa \"datas não são texto\"?", "a": "Compare DATE com DATE. Use literal DATE 'AAAA-MM-DD' ou TO_DATE com máscara. Comparar com string depende do NLS_DATE_FORMAT da sessão.", "why": "", "ex": "WHERE hire_date >= DATE '2020-01-01'                  -- certo\nWHERE hire_date >= TO_DATE('01/01/2020','DD/MM/YYYY') -- certo\nWHERE hire_date >= '01/01/2020'                       -- depende da sessão", "trap": "Funciona no seu SQL Developer e quebra no job do cliente com outro NLS.", "tag": ""}, {"id": "C28", "k": "c", "sec": "Datas", "f": "Como calcular tempo de empresa em anos?", "a": "TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date) / 12, 1): meses entre as datas, divididos por 12, cortados com 1 casa.", "why": "É melhor que (SYSDATE - hire_date)/365, que erra por causa dos anos bissextos.", "ex": "SELECT hire_date,\n       TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1) AS anos_empresa\nFROM hr.employees;", "trap": "TRUNC aqui é o TRUNC numérico (o argumento já é número), não o de data.", "tag": ""}, {"id": "C29", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "Qual o impacto de função sobre coluna no WHERE?", "a": "Aplicar função na COLUNA impede o uso normal de um índice B-tree nela. O Oracle tende a fazer full table scan.", "why": "O índice guarda o valor original da coluna, não o resultado da função.", "ex": "WHERE TRUNC(hire_date) = DATE '2020-01-15'           -- não usa índice em hire_date\nWHERE hire_date >= DATE '2020-01-15'\n  AND hire_date <  DATE '2020-01-16'                  -- usa", "trap": "Regra prática: deixe a coluna \"limpa\" e aplique a função do lado do valor.", "tag": ""}, {"id": "C30", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "O que é índice baseado em função?", "a": "Índice criado sobre a expressão, não sobre a coluna. O WHERE com a mesma expressão passa a poder usar o índice.", "why": "", "ex": "CREATE INDEX emp_upper_ln_ix ON hr.employees (UPPER(last_name));\nSELECT * FROM hr.employees WHERE UPPER(last_name) = 'KING';   -- pode usar o índice", "trap": "A expressão no WHERE precisa ser idêntica à do índice.", "tag": "complemento"}, {"id": "C31", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "Como reescrever o filtro do desafio para usar índice em hire_date?", "a": "Trocar <code>MONTHS_BETWEEN(SYSDATE, hire_date) &gt; 60<\/code> por <code>hire_date &lt; ADD_MONTHS(SYSDATE, -60)<\/code>. A função passa para o lado do valor e a coluna fica limpa.", "why": "", "ex": "WHERE hire_date < ADD_MONTHS(SYSDATE, -60)", "trap": "Na tabela HR (107 linhas) não faz diferença. Numa tabela de milhões de linhas de cliente, faz.", "tag": "complemento: visão de DBA"}, {"id": "C32", "k": "c", "sec": "Projeto RH (desafio da aula)", "f": "Qual função atende cada requisito do relatório de RH?", "a": "Nome formatado → INITCAP(first_name || ' ' || last_name)<br>E-mail resumido → SUBSTR(email, 1, 5) || '...'<br>Salário sem decimais → ROUND(salary, 0)<br>Anos de empresa com 1 casa → TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1)<br>Mais de 5 anos → WHERE MONTHS_BETWEEN(SYSDATE, hire_date) &gt; 60", "why": "", "ex": "SELECT INITCAP(first_name || ' ' || last_name)              AS nome,\n       SUBSTR(email, 1, 5) || '...'                        AS email_resumido,\n       ROUND(salary, 0)                                    AS salario,\n       TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date) / 12, 1)   AS anos_empresa\nFROM hr.employees\nWHERE MONTHS_BETWEEN(SYSDATE, hire_date) > 60;", "trap": "", "tag": ""}, {"id": "C33", "k": "c", "sec": "Projeto RH (desafio da aula)", "f": "Por que o desafio repete o MONTHS_BETWEEN no WHERE em vez de usar anos_empresa?", "a": "Alias criado no SELECT não existe no WHERE: ORA-00904. O WHERE é avaliado antes da lista de seleção (Módulo 01).", "why": "", "ex": "WHERE anos_empresa > 5   -- ORA-00904: \"ANOS_EMPRESA\": invalid identifier", "trap": "Questão que junta os dois módulos.", "tag": ""}, {"id": "S01", "k": "s", "f": "SELECT ROUND(10.49,0), TRUNC(10.49,0) FROM dual;", "res": "10 | 10", "d": "Parte descartada 0,49 é menor que 0,5: os dois dão 10."}, {"id": "S02", "k": "s", "f": "SELECT ROUND(10.50,0), TRUNC(10.50,0) FROM dual;", "res": "11 | 10", "d": "0,50 sobe no ROUND; TRUNC só corta."}, {"id": "S03", "k": "s", "f": "SELECT ROUND(7.25,1), TRUNC(7.25,1) FROM dual;", "res": "7.3 | 7.2", "d": "1 casa decimal."}, {"id": "S04", "k": "s", "f": "SELECT ROUND(1250,-2), TRUNC(1250,-2) FROM dual;", "res": "1300 | 1200", "d": "d negativo age nas centenas."}, {"id": "S05", "k": "s", "f": "SELECT ROUND(-2.5), TRUNC(-2.7) FROM dual;", "res": "-3 | -2", "d": "ROUND afasta do zero; TRUNC aproxima."}, {"id": "S06", "k": "s", "f": "SELECT MOD(10,3), MOD(10,0), MOD(-7,3) FROM dual;", "res": "1 | 10 | -1", "d": "MOD por zero devolve o dividendo; sinal segue o dividendo."}, {"id": "S07", "k": "s", "f": "SELECT SUBSTR('ORACLE',2,3) FROM dual;", "res": "RAC", "d": "Da posição 2, 3 caracteres."}, {"id": "S08", "k": "s", "f": "SELECT SUBSTR('ORACLE',-3) FROM dual;", "res": "CLE", "d": "Negativo conta do fim; sem tamanho vai até o final."}, {"id": "S09", "k": "s", "f": "SELECT SUBSTR('ORACLE',0,2) FROM dual;", "res": "OR", "d": "Posição 0 é tratada como 1."}, {"id": "S10", "k": "s", "f": "SELECT INSTR('BANANA','A',1,2), INSTR('BANANA','X') FROM dual;", "res": "4 | 0", "d": "2ª ocorrência de A está na posição 4. Não achou = 0."}, {"id": "S11", "k": "s", "f": "SELECT INITCAP('joão da SILVA') FROM dual;", "res": "João Da Silva", "d": "Sobe a 1ª letra e desce o resto de cada palavra."}, {"id": "S12", "k": "s", "f": "SELECT LENGTH(' ab '), LENGTH('') FROM dual;", "res": "4 | NULL", "d": "Espaços contam. String vazia é NULL no Oracle."}, {"id": "S13", "k": "s", "f": "SELECT 'Ana' || NULL || 'Lima' FROM dual;", "res": "AnaLima", "d": "|| trata NULL como vazio."}, {"id": "S14", "k": "s", "f": "SELECT REPLACE('2026-10-15','-') FROM dual;", "res": "20261015", "d": "Sem 3º argumento, remove."}, {"id": "S15", "k": "s", "f": "SELECT TRIM('0' FROM '00120') FROM dual;", "res": "12", "d": "BOTH é o padrão: tira zeros dos dois lados."}, {"id": "S16", "k": "s", "f": "SELECT TRIM('ab' FROM 'abcab') FROM dual;", "res": "ORA-30001", "d": "TRIM só aceita um caractere de corte."}, {"id": "S17", "k": "s", "f": "SELECT SUBSTR('SKING',1,INSTR('SKING','@')-1) FROM dual;", "res": "NULL", "d": "INSTR = 0 → tamanho -1 → NULL. E-mail do HR não tem @."}, {"id": "S18", "k": "s", "f": "SELECT UPPER(SUBSTR('oracle',1,3)) FROM dual;", "res": "ORA", "d": "De dentro para fora: 'ora' → 'ORA'."}, {"id": "S19", "k": "s", "f": "SELECT DATE '2026-10-15' - DATE '2026-10-01' FROM dual;", "res": "14", "d": "DATE - DATE = dias."}, {"id": "S20", "k": "s", "f": "SELECT SYSDATE - DATE '2026-10-14' FROM dual;", "res": "1.4375", "d": "1 dia + 10h30 (10,5/24 = 0,4375)."}, {"id": "S21", "k": "s", "f": "SELECT SYSDATE + SYSDATE FROM dual;", "res": "ORA-00975", "d": "Não existe soma de duas datas."}, {"id": "S22", "k": "s", "f": "SELECT ADD_MONTHS(DATE '2024-01-31',1) FROM dual;", "res": "29/02/2024", "d": "Fevereiro de 2024 não tem dia 31: vai para o último dia."}, {"id": "S23", "k": "s", "f": "SELECT ADD_MONTHS(DATE '2024-04-30',1) FROM dual;", "res": "31/05/2024", "d": "30/04 é último dia do mês: o resultado também é último dia."}, {"id": "S24", "k": "s", "f": "SELECT MONTHS_BETWEEN(DATE '2026-03-15', DATE '2026-01-15'),\n       MONTHS_BETWEEN(DATE '2026-01-15', DATE '2026-03-15') FROM dual;", "res": "2 | -2", "d": "A ordem dos argumentos define o sinal."}, {"id": "S25", "k": "s", "f": "SELECT TRUNC(SYSDATE), TRUNC(SYSDATE,'MM') FROM dual;", "res": "15/10/2026 00:00 | 01/10/2026", "d": "TRUNC de data zera a hora; 'MM' vai ao 1º dia do mês."}, {"id": "S26", "k": "s", "f": "Funcionário contratado em 15/04/2020.\nTRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1) = ?\nEntra no WHERE ... > 60?", "res": "6.5 · entra", "d": "78 meses (mesmo dia do mês → inteiro) / 12 = 6,5. 78 > 60."}, {"id": "S27", "k": "s", "f": "Funcionário contratado em 15/11/2021.\nEntra no filtro do desafio (MONTHS_BETWEEN > 60)?", "res": "Não entra", "d": "59 meses."}, {"id": "S28", "k": "s", "f": "SELECT job_id FROM hr.employees\nWHERE UPPER(job_id) LIKE '%MAN%';\n-- quais cargos de gerente aparecem?", "res": "SA_MAN, PU_MAN, ST_MAN, MK_MAN", "d": "FI_MGR e AC_MGR também são gerentes, mas usam MGR e ficam de fora. O filtro da aula não pega todos os gerentes."}], "svg": "<svg class=\"mapsvg\"\n viewBox=\"0.00 0.00 857.25 815.75\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n<g id=\"graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(14.4 801.35)\">\n<title>G<\/title>\n<polygon fill=\"white\" stroke=\"transparent\" points=\"-14.4,14.4 -14.4,-801.35 842.85,-801.35 842.85,14.4 -14.4,14.4\"/>\n\n<g id=\"node1\" class=\"node\">\n<title>c<\/title>\n<path fill=\"# 4 648.93,-40 648.93,-46 648.93,-46 648.93,-145 648.93,-145 648.93,-151 642.93,-157 636.93,-157 636.93,-157 451.93,-157 451.93,-157 445.93,-157 439.93,-151 439.93,-145 439.93,-145 439.93,-46 439.93,-46 439.93,-40 445.93,-34 451.93,-34\"/>\n<polygon fill=\"#5d6d7e\" stroke=\"transparent\" points=\"441.43,-135.5 441.43,-155.5 648.43,-155.5 648.43,-135.5 441.43,-135.5\"/>\n<text text-anchor=\"start\" x=\"444.43\" y=\"-143.1\" font-family=\"DejaVu Sans\" font-weight=\"bold\" font-size=\"13.00\" fill=\"white\">WHERE e desempenho<\/text>\n<polygon fill=\"#5d6d7e\" stroke=\"transparent\" points=\"441.43,-119.5 441.43,-135.5 648.43,-135.5 648.43,-119.5 441.43,-119.5\"/>\n<text text-anchor=\"start\" x=\"444.43\" y=\"-125.3\" font-family=\"DejaVu Sans\" font-size=\"9.00\" fill=\"white\">flashcards C29–C31<\/text>\n<text text-anchor=\"start\" x=\"444.43\" y=\"-108.5\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Função na coluna → sem índice B&#45;tree<\/text>\n<text text-anchor=\"start\" x=\"444.43\" y=\"-91.5\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Deixe a coluna limpa, função no valor<\/text>\n<text text-anchor=\"start\" x=\"444.43\" y=\"-74.5\" font-family=\"DejaVu Sans\" font-size=\"10.00\">TRUNC(dt) = X → dt &gt;= X AND dt &lt; X+1<\/text>\n<text text-anchor=\"start\" x=\"444.43\" y=\"-57.5\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Índice baseado em função<\/text>\n<text text-anchor=\"start\" x=\"444.43\" y=\"-40.5\" font-family=\"DejaVu Sans\" font-size=\"10.00\">hire_date &lt; ADD_MONTHS(SYSDATE,&#45;60)<\/text>\n<path fill=\"none\" stroke=\"#5d6d7e\" d=\"M451.93,-34C451.93,-34 636.93,-34 636.93,-34 642.93,-34 648.93,-40 648.93,-46 648.93,-46 648.93,-145 648.93,-145 648.93,-151 642.93,-157 636.93,-157 636.93,-157 451.93,-157 451.93,-157 445.93,-157 439.93,-151 439.93,-145 439.93,-145 439.93,-46 439.93,-46 439.93,-40 445.93,-34 451.93,-34\"/>\n<\/g>\n\n<g id=\"edge7\" class=\"edge\">\n<title>c&#45;&gt;b6<\/title>\n<path fill=\"none\" stroke=\"#5d6d7e 00\">Alias não vale no WHERE (Mód. 01)<\/text>\n<path fill=\"none\" stroke=\"#00838f\" d=\"M636.45,-207.52C636.45,-207.52 816.45,-207.52 816.45,-207.52 822.45,-207.52 828.45,-213.52 828.45,-219.52 828.45,-219.52 828.45,-335.52 828.45,-335.52 828.45,-341.52 822.45,-347.52 816.45,-347.52 816.45,-347.52 636.45,-347.52 636.45,-347.52 630.45,-347.52 624.45,-341.52 624.45,-335.52 624.45,-335.52 624.45,-219.52 624.45,-219.52 624.45,-213.52 630.45,-207.52 636.45,-207.52\"/>\n<\/g>\n\n<g id=\"edge8\" class=\"edge\">\n<title>c&#45;&gt;b7<\/title>\n<path fill=\"none\" stroke=\"#00838f\" stroke-width=\"3.2\" d=\"M490.25,-377.19C556.52,-351.33 594.87,-336.2 624.41,-323.86\"/>\n<\/g>\n<\/g>\n<\/svg>\n"}, {"id": "M03", "title": "Manipulando tabelas", "ref": "Referência para os cenários: tabela VENDAS da aula e tabela FORNECEDORES da prática", "reftxt": "CREATE TABLE vendas (           CREATE TABLE fornecedores (\n  data_venda DATE,                 id_fornecedor NUMBER PRIMARY KEY,\n  id_produto NUMBER,               nome          VARCHAR2(100) NOT NULL,\n  quantidade NUMBER                ... cidade, estado, cep, telefone,\n);                                 min_pedido    NUMBER(10,2)\n                                 );", "cards": [{"id": "V01", "k": "v", "f": "Heap-organized table", "pt": "Tabela organizada em heap", "d": "Tipo padrão. As linhas ficam onde houver espaço livre, sem ordem definida.", "ex": "CREATE TABLE t (id NUMBER) ORGANIZATION HEAP;   -- = sem a cláusula", "rel": "IOT"}, {"id": "V02", "k": "v", "f": "Index-organized table (IOT)", "pt": "Tabela organizada por índice", "d": "As linhas ficam DENTRO de um índice B-tree, ordenadas pela chave primária. Exige PK.", "ex": "CREATE TABLE t (id NUMBER PRIMARY KEY, d VARCHAR2(30))\nORGANIZATION INDEX;", "rel": "Primary key"}, {"id": "V03", "k": "v", "f": "Tablespace / Default tablespace", "pt": "Tablespace / Tablespace padrão", "d": "Área lógica onde os segmentos são gravados. Sem a cláusula TABLESPACE, a tabela vai para a tablespace padrão do usuário.", "ex": "SELECT default_tablespace FROM dba_users WHERE username = 'DBAOCM';", "rel": "Data file"}, {"id": "V04", "k": "v", "f": "CTAS (Create Table As Select)", "pt": "Criar tabela a partir de consulta", "d": "Cria a tabela e já carrega as linhas da consulta. Copia nomes, tipos e NOT NULL; não copia PK, FK, índices nem triggers.", "ex": "CREATE TABLE my_table AS SELECT table_name, status FROM user_tables;", "rel": "Constraints"}, {"id": "V05", "k": "v", "f": "Global temporary table (GTT)", "pt": "Tabela temporária global", "d": "Definição visível para todas as sessões e permanente; dados privados de cada sessão, gravados na tablespace temporária.", "ex": "CREATE GLOBAL TEMPORARY TABLE gtt (id NUMBER) ON COMMIT PRESERVE ROWS;", "rel": "PTT"}, {"id": "V06", "k": "v", "f": "Private temporary table (PTT)", "pt": "Tabela temporária privada", "d": "Definição E dados visíveis só para a sessão que criou; fica apenas em memória. Nome precisa do prefixo ORA$PTT_. Desde o 18c.", "ex": "CREATE PRIVATE TEMPORARY TABLE ora$ptt_x (id NUMBER)\nON COMMIT DROP DEFINITION;", "rel": "GTT"}, {"id": "V07", "k": "v", "f": "Transaction-specific / Session-specific", "pt": "Específica da transação / da sessão", "d": "Até quando a temporária guarda os dados: até o COMMIT (transação) ou até o fim da sessão.", "ex": "ON COMMIT DELETE ROWS       -- GTT, transação\nON COMMIT PRESERVE ROWS     -- GTT, sessão", "rel": "ON COMMIT"}, {"id": "V08", "k": "v", "f": "Unused column", "pt": "Coluna não utilizada", "d": "Coluna marcada com SET UNUSED: some para os usuários na hora, mas o espaço só é liberado no DROP UNUSED COLUMNS.", "ex": "ALTER TABLE vendas SET UNUSED (quantidade);", "rel": "DROP COLUMN"}, {"id": "V09", "k": "v", "f": "Recycle bin", "pt": "Lixeira", "d": "Para onde vai a tabela após DROP sem PURGE. Permite FLASHBACK TABLE ... TO BEFORE DROP.", "ex": "SELECT object_name, original_name FROM user_recyclebin;", "rel": "PURGE"}, {"id": "V10", "k": "v", "f": "Purge", "pt": "Expurgar", "d": "Apagar definitivamente, sem passar pela lixeira.", "ex": "DROP TABLE vendas PURGE;", "rel": "Recycle bin"}, {"id": "V11", "k": "v", "f": "Truncate", "pt": "Truncar", "d": "Remove TODAS as linhas de uma vez e libera o espaço. É DDL: não tem ROLLBACK.", "ex": "TRUNCATE TABLE vendas;", "rel": "DELETE"}, {"id": "V12", "k": "v", "f": "DDL / DML", "pt": "Linguagem de definição / de manipulação", "d": "DDL muda estrutura (CREATE, ALTER, DROP, TRUNCATE) e faz COMMIT implícito. DML muda dados (INSERT, UPDATE, DELETE) e aceita ROLLBACK.", "ex": "DELETE FROM vendas;     -- DML, volta com ROLLBACK\nTRUNCATE TABLE vendas;  -- DDL, não volta", "rel": "COMMIT implícito"}, {"id": "V13", "k": "v", "f": "Cascade constraints", "pt": "Remover restrições em cascata", "d": "No DROP TABLE, remove as FKs das tabelas filhas que apontam para a tabela dropada.", "ex": "DROP TABLE clientes CASCADE CONSTRAINTS;", "rel": "Foreign key"}, {"id": "V14", "k": "v", "f": "External / Partitioned / Clustered table", "pt": "Tabela externa / particionada / em cluster", "d": "Externa: dados num arquivo fora do banco. Particionada: dividida em partes por faixa, lista ou hash. Cluster: várias tabelas que compartilham blocos por uma chave comum.", "ex": "-- tipos citados no material; detalhados em módulos próprios", "rel": "Heap"}, {"id": "C01", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "O que é uma tabela e como se cria?", "a": "Unidade básica de armazenamento do Oracle: dados em linhas e colunas. CREATE TABLE com nome e, para cada coluna, nome e tipo de dado.", "why": "", "ex": "CREATE TABLE my_table (\n  id        NUMBER PRIMARY KEY,\n  nome      VARCHAR2(50),\n  sobrenome VARCHAR2(50),\n  idade     NUMBER\n);", "trap": "", "tag": ""}, {"id": "C02", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "O que são constraints (restrições de integridade)?", "a": "Regras aplicadas às colunas. Exemplo do material: NOT NULL obriga a coluna a ter valor em toda linha. Outras: PRIMARY KEY, UNIQUE, FOREIGN KEY, CHECK.", "why": "", "ex": "nome VARCHAR2(100) NOT NULL", "trap": "", "tag": ""}, {"id": "C03", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Tabela permanente vs temporária?", "a": "Permanente: dados ficam nos data files da tablespace e qualquer usuário com privilégio acessa. Temporária: dados duram só a sessão ou a transação e só a própria sessão vê.", "why": "", "ex": "CREATE TABLE vendas (...);                        -- permanente\nCREATE GLOBAL TEMPORARY TABLE tmp (...) ...;      -- temporária", "trap": "", "tag": ""}, {"id": "C04", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Em qual tablespace a tabela é criada?", "a": "Na indicada pela cláusula TABLESPACE. Sem a cláusula, na tablespace padrão (DEFAULT_TABLESPACE) do usuário dono.", "why": "", "ex": "CREATE TABLE my_table (...) TABLESPACE tbs1;\nSELECT tablespace_name FROM dba_tables WHERE table_name = 'MY_TABLE';", "trap": "O nome da tabela no dicionário é gravado em MAIÚSCULO: WHERE table_name = 'my_table' não acha nada.", "tag": ""}, {"id": "C05", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Quais os tipos de tabela permanente citados?", "a": "Heap Organized (padrão), Index Organized (IOT), Partitioned, External, Clustered e Hybrid Partitioned.", "why": "", "ex": "SELECT table_name, iot_type, partitioned, temporary FROM user_tables;", "trap": "", "tag": ""}, {"id": "C06", "k": "c", "sec": "Heap e CTAS", "f": "Como o Oracle armazena uma tabela heap?", "a": "Sem ordem específica: cada linha vai para onde houver espaço livre. É o padrão; ORGANIZATION HEAP é opcional.", "why": "", "ex": "CREATE TABLE dbaocm_heap (id NUMBER(5,2)) ORGANIZATION HEAP;\nCREATE TABLE dbaocm_heap (id NUMBER(5,2));   -- mesma coisa", "trap": "Por isso, sem ORDER BY a ordem do resultado não é garantida (Módulo 01).", "tag": ""}, {"id": "C07", "k": "c", "sec": "Heap e CTAS", "f": "O que o CTAS copia e o que NÃO copia?", "a": "Copia: nomes de coluna, tipos, dados e as constraints NOT NULL definidas explicitamente. Não copia: PRIMARY KEY, UNIQUE, FOREIGN KEY, CHECK, índices, triggers e grants.", "why": "", "ex": "CREATE TABLE my_table AS SELECT table_name, status FROM user_tables;\n-- constraints que faltarem: ALTER TABLE ... ADD CONSTRAINT", "trap": "Clonar tabela com CTAS e esquecer de recriar PK e índices é causa clássica de lentidão depois de migração.", "tag": "complemento: índices, triggers e grants"}, {"id": "C08", "k": "c", "sec": "Heap e CTAS", "f": "Como copiar só a estrutura, sem dados?", "a": "CTAS com uma condição sempre falsa.", "why": "", "ex": "CREATE TABLE vendas_bkp AS SELECT * FROM vendas WHERE 1 = 0;", "trap": "", "tag": "complemento"}, {"id": "C09", "k": "c", "sec": "IOT (Index Organized Table)", "f": "Como funciona uma IOT?", "a": "Os dados ficam armazenados dentro de um índice B-tree, ordenados pela chave primária. Não existe segmento de tabela separado.", "why": "", "ex": "CREATE TABLE dbaocm_iot (\n  id        NUMBER PRIMARY KEY,\n  descricao VARCHAR2(30)\n) ORGANIZATION INDEX;", "trap": "B-tree é árvore BALANCEADA (balanced tree), não árvore binária. O slide traduz como \"árvore binária\".", "tag": "correção do material: B-tree ≠ árvore binária"}, {"id": "C10", "k": "c", "sec": "IOT (Index Organized Table)", "f": "O que é obrigatório para criar uma IOT?", "a": "Cláusula ORGANIZATION INDEX e uma PRIMARY KEY.", "why": "", "ex": "CREATE TABLE dbaocm_iot (id NUMBER, descricao VARCHAR2(30)) ORGANIZATION INDEX;\n-- ORA-25175: no PRIMARY KEY constraint found", "trap": "O próprio script da aula mostra esse erro de propósito.", "tag": ""}, {"id": "C11", "k": "c", "sec": "IOT (Index Organized Table)", "f": "Para que tipo de aplicação a IOT é indicada?", "a": "Segundo o Administrator's Guide: aplicações OLTP que precisam de acesso rápido pela chave primária e alta disponibilidade. Também aparece em recuperação de informação, spatial e OLAP.", "why": "", "ex": "-- caso típico: tabela de lookup consultada sempre pela PK\nSELECT descricao FROM dbaocm_iot WHERE id = :id;", "trap": "", "tag": "correção do material: a frase \"acesso rápido à PK e alta disponibilidade\" na doc é sobre OLTP, não OLAP"}, {"id": "C12", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "Para que servem tabelas temporárias?", "a": "Guardar resultados intermediários que precisam persistir durante a sessão ou a transação, por exemplo DMLs que dependem do resultado uns dos outros.", "why": "", "ex": "-- carga em etapas: tmp recebe, processa, grava na definitiva", "trap": "", "tag": ""}, {"id": "C13", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "GTT: o que é global e o que é privado?", "a": "A DEFINIÇÃO (metadados) é global: todas as sessões veem a tabela. O CONTEÚDO é privado: cada sessão só enxerga as linhas que ela mesma inseriu.", "why": "", "ex": "-- sessão A insere 3 linhas e faz COMMIT\n-- sessão B: SELECT COUNT(*) FROM admin_work_area_session;  -- 0", "trap": "", "tag": ""}, {"id": "C14", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "ON COMMIT da GTT: quais as opções?", "a": "ON COMMIT DELETE ROWS → específica da transação: COMMIT apaga as linhas. É o padrão.<br>ON COMMIT PRESERVE ROWS → específica da sessão: linhas ficam até o fim da sessão.", "why": "", "ex": "CREATE GLOBAL TEMPORARY TABLE admin_work_area_trans (...) ON COMMIT DELETE ROWS;\nCREATE GLOBAL TEMPORARY TABLE admin_work_area_session (...) ON COMMIT PRESERVE ROWS;", "trap": "Sem a cláusula ON COMMIT, a GTT é DELETE ROWS.", "tag": "complemento: padrão DELETE ROWS"}, {"id": "C15", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "PTT: regras de criação?", "a": "Definição e dados visíveis só para a sessão criadora. Nome precisa começar com o valor de PRIVATE_TEMP_TABLE_PREFIX (padrão ORA$PTT_). Não pode ser criada pelo SYS. Fica só em memória. Disponível desde o 18c.", "why": "", "ex": "SHOW PARAMETER private_temp_table_prefix\nCREATE PRIVATE TEMPORARY TABLE ora$ptt_sales (...) ON COMMIT DROP DEFINITION;", "trap": "Sem o prefixo, o Oracle não aceita o nome. Como SYS, também falha.", "tag": ""}, {"id": "C16", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "ON COMMIT da PTT: quais as opções?", "a": "ON COMMIT DROP DEFINITION → específica da transação: o COMMIT apaga dados E a tabela. É o padrão.<br>ON COMMIT PRESERVE DEFINITION → específica da sessão: tabela e dados somem no fim da sessão.", "why": "", "ex": "CREATE PRIVATE TEMPORARY TABLE ora$ptt_sales_ptt_session (\n  id_tmp NUMBER, descricao VARCHAR2(20))\nON COMMIT PRESERVE DEFINITION;", "trap": "O slide de \"PTT específica de sessão\" mostra o código de uma GTT DELETE ROWS (erro de cópia). O código certo está no .sql da aula.", "tag": "correção do material: exemplo trocado no slide"}, {"id": "C17", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "Tabela-resumo GTT x PTT?", "a": "<b>Nome:<\/b> GTT segue regra normal; PTT exige prefixo ORA$PTT_.<br><b>Definição visível:<\/b> GTT todas as sessões; PTT só a criadora.<br><b>Armazenamento:<\/b> GTT em disco (tablespace temporária); PTT só memória.<br><b>Transação:<\/b> GTT DELETE ROWS; PTT DROP DEFINITION.<br><b>Sessão:<\/b> GTT PRESERVE ROWS; PTT PRESERVE DEFINITION.", "why": "", "ex": "-- memorize os pares:\n-- GTT → ROWS        (apaga linhas)\n-- PTT → DEFINITION  (apaga a tabela)", "trap": "Questão típica troca ROWS por DEFINITION. GTT nunca usa DEFINITION; PTT nunca usa ROWS.", "tag": ""}, {"id": "C18", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como adicionar uma coluna?", "a": "ALTER TABLE ... ADD (coluna tipo). Vários de uma vez separados por vírgula dentro dos parênteses.", "why": "", "ex": "ALTER TABLE vendas ADD (descricao VARCHAR2(20));\nALTER TABLE vendas ADD (obs VARCHAR2(50), ativo CHAR(1));", "trap": "A prática resolvida usa ADD COLUMN (...). Essa forma não é a sintaxe documentada no 19c e falha. Use ADD (...).", "tag": "correção do material: Pratica_Resolvida.sql"}, {"id": "C19", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como renomear uma coluna?", "a": "ALTER TABLE ... RENAME COLUMN antigo TO novo.", "why": "", "ex": "ALTER TABLE vendas RENAME COLUMN descricao TO descr;\nALTER TABLE fornecedores RENAME COLUMN registro TO cnpj;", "trap": "Renomear tabela é outro comando: RENAME vendas TO vendas_old; ou ALTER TABLE vendas RENAME TO vendas_old;", "tag": ""}, {"id": "C20", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Quais as regras do MODIFY?", "a": "Trocar o TIPO de dado: só com a coluna vazia (todos NULL).<br>Aumentar o tamanho: sempre pode.<br>Diminuir o tamanho: só se todos os valores couberem.<br>Colocar NOT NULL: só se não houver NULL na coluna.", "why": "", "ex": "ALTER TABLE vendas MODIFY (descr VARCHAR2(200) NOT NULL);   -- ok\nALTER TABLE vendas MODIFY (descr NUMBER NOT NULL);\n-- com 'teste' gravado: ORA-01439", "trap": "O slide diz \"apenas se a coluna estiver vazia, ou seja possível uma conversão\". A regra correta para tipo é: coluna vazia.", "tag": "correção do material: frase do slide truncada"}, {"id": "C21", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como remover colunas?", "a": "DROP COLUMN para uma; DROP (c1, c2) para várias. Reescreve os blocos da tabela, pode demorar e pesar no banco.", "why": "", "ex": "ALTER TABLE vendas DROP COLUMN descr;\nALTER TABLE vendas DROP (data_venda, quantidade);", "trap": "Não dá para remover todas as colunas: ORA-12983.", "tag": ""}, {"id": "C22", "k": "c", "sec": "SET UNUSED", "f": "Por que usar SET UNUSED em vez de DROP COLUMN?", "a": "SET UNUSED só altera o dicionário: é instantâneo e a coluna some para os usuários na hora. O DROP físico (DROP UNUSED COLUMNS) fica para uma janela de baixo uso.", "why": "", "ex": "ALTER TABLE vendas SET UNUSED (quantidade);      -- horário comercial\nALTER TABLE vendas DROP UNUSED COLUMNS;          -- janela noturna", "trap": "Visão de DBA: em tabela grande de produção, DROP COLUMN direto pode travar a aplicação por muito tempo.", "tag": ""}, {"id": "C23", "k": "c", "sec": "SET UNUSED", "f": "O que acontece com uma coluna UNUSED?", "a": "Ainda ocupa espaço até o DROP. Não pode ser restaurada via SQL: a única ação possível é dropar. Índices, constraints e estatísticas dela normalmente são removidos (exceção: índices de colunas LOB).", "why": "", "ex": "SELECT * FROM user_unused_col_tabs;   -- tabelas com colunas UNUSED e quantas", "trap": "SET UNUSED é sem volta. Não existe \"SET USED\".", "tag": ""}, {"id": "C24", "k": "c", "sec": "SET UNUSED", "f": "Como dropar as colunas marcadas como UNUSED?", "a": "ALTER TABLE ... DROP UNUSED COLUMNS.", "why": "", "ex": "ALTER TABLE vendas DROP UNUSED COLUMNS;", "trap": "O slide diz \"usamos o comando ALTER TABLE ... SET UNUSED\" para dropar. O comando certo é DROP UNUSED COLUMNS (o exemplo do slide está certo).", "tag": "correção do material: texto do slide"}, {"id": "C25", "k": "c", "sec": "Eliminar tabela e dados", "f": "DROP TABLE: o que acontece com o espaço?", "a": "Não é liberado na hora: a tabela vai para a RECYCLEBIN e pode voltar com FLASHBACK TABLE ... TO BEFORE DROP. Com PURGE, vai direto, sem lixeira.", "why": "", "ex": "DROP TABLE vendas;\nFLASHBACK TABLE vendas TO BEFORE DROP;   -- volta\nDROP TABLE vendas PURGE;                 -- sem volta", "trap": "A tabela na lixeira continua ocupando espaço na tablespace.", "tag": "complemento: comando FLASHBACK"}, {"id": "C26", "k": "c", "sec": "Eliminar tabela e dados", "f": "Para que serve CASCADE CONSTRAINTS no DROP?", "a": "Se a tabela tem PK ou UNIQUE referenciada por FK de outras tabelas, o DROP falha. CASCADE CONSTRAINTS remove essas FKs das filhas e permite o drop.", "why": "", "ex": "DROP TABLE clientes;                       -- ORA-02449\nDROP TABLE clientes CASCADE CONSTRAINTS;   -- ok, FKs das filhas somem", "trap": "Remove só as constraints das filhas, não os dados delas.", "tag": ""}, {"id": "C27", "k": "c", "sec": "Eliminar tabela e dados", "f": "DELETE x TRUNCATE x DROP + CREATE?", "a": "<b>DELETE sem WHERE:<\/b> DML, linha a linha, aceita ROLLBACK, mais lento.<br><b>TRUNCATE:<\/b> DDL, rápido, libera espaço, SEM rollback.<br><b>DROP + CREATE:<\/b> perde índices, triggers, constraints e grants; objetos dependentes ficam inválidos.", "why": "", "ex": "DELETE FROM vendas;    ROLLBACK;   -- dados voltam\nTRUNCATE TABLE vendas; ROLLBACK;   -- dados NÃO voltam", "trap": "", "tag": ""}, {"id": "C28", "k": "c", "sec": "Eliminar tabela e dados", "f": "TRUNCATE errado: como recuperar?", "a": "ROLLBACK e FLASHBACK TABLE não funcionam. Opções: restore/recover (RMAN), RMAN RECOVER TABLE (12c+), Flashback Database ou restore point, Data Pump de antes.", "why": "", "ex": "-- RMAN 12c+:\nRECOVER TABLE dbaocm.vendas UNTIL TIME \"SYSDATE-1/24\"\n  AUXILIARY DESTINATION '/u01/aux';", "trap": "O slide fala em restore do banco inteiro. Desde o 12c há caminhos menos drásticos.", "tag": "complemento: visão de DBA"}, {"id": "C29", "k": "c", "sec": "Eliminar tabela e dados", "f": "O que é o COMMIT implícito do DDL?", "a": "Todo comando DDL (CREATE, ALTER, DROP, TRUNCATE) faz COMMIT antes e depois. Qualquer DML pendente na sessão é confirmado.", "why": "", "ex": "INSERT INTO log_carga VALUES (1, 'inicio');\nTRUNCATE TABLE vendas;\nROLLBACK;   -- o INSERT em log_carga JÁ foi confirmado", "trap": "", "tag": "complemento"}, {"id": "S01", "k": "s", "f": "CREATE TABLE dbaocm_iot (id NUMBER, descricao VARCHAR2(30))\nORGANIZATION INDEX;", "res": "ORA-25175: no PRIMARY KEY constraint found", "d": "IOT exige PK."}, {"id": "S02", "k": "s", "f": "CREATE TABLE t1 (id NUMBER);\n-- sem TABLESPACE. Onde fica?", "res": "Tablespace padrão do usuário", "d": "DEFAULT_TABLESPACE em DBA_USERS."}, {"id": "S03", "k": "s", "f": "Tabela origem: id PK, nome NOT NULL.\nCREATE TABLE copia AS SELECT * FROM origem;\nO que vem junto?", "res": "Dados + NOT NULL de nome", "d": "PK (e o índice dela) não vem."}, {"id": "S04", "k": "s", "f": "GTT ON COMMIT PRESERVE ROWS:\nINSERT 3 linhas; COMMIT;\nSELECT COUNT(*) na MESMA sessão? E em OUTRA sessão?", "res": "3 · 0", "d": "Linhas sobrevivem ao COMMIT, mas são da sessão."}, {"id": "S05", "k": "s", "f": "GTT ON COMMIT DELETE ROWS:\nINSERT 3 linhas; SELECT COUNT(*); COMMIT; SELECT COUNT(*);", "res": "3 · 0", "d": "COMMIT apaga as linhas."}, {"id": "S06", "k": "s", "f": "PTT ON COMMIT DROP DEFINITION:\nINSERT 3 linhas; COMMIT; SELECT * FROM ora$ptt_...;", "res": "ORA-00942: table or view does not exist", "d": "COMMIT apagou a tabela."}, {"id": "S07", "k": "s", "f": "PTT ON COMMIT PRESERVE DEFINITION:\nINSERT 3; COMMIT; SELECT COUNT(*);\nDepois desconecta e reconecta.", "res": "3 · depois a tabela não existe", "d": "Some no fim da sessão."}, {"id": "S08", "k": "s", "f": "CREATE PRIVATE TEMPORARY TABLE tmp_vendas (id NUMBER)\nON COMMIT DROP DEFINITION;", "res": "Erro: nome inválido", "d": "Falta o prefixo ORA$PTT_."}, {"id": "S09", "k": "s", "f": "Conectado como SYS:\nCREATE PRIVATE TEMPORARY TABLE ora$ptt_x (id NUMBER);", "res": "Erro", "d": "PTT não pode ser criada pelo SYS."}, {"id": "S10", "k": "s", "f": "CREATE GLOBAL TEMPORARY TABLE g (id NUMBER);\n-- sem ON COMMIT. INSERT; COMMIT; SELECT COUNT(*);", "res": "0", "d": "Padrão da GTT é DELETE ROWS."}, {"id": "S11", "k": "s", "f": "ALTER TABLE fornecedores ADD COLUMN (registro VARCHAR2(20));\n-- Oracle 19c", "res": "Erro de sintaxe", "d": "Forma documentada: ADD (registro VARCHAR2(20))."}, {"id": "S12", "k": "s", "f": "vendas.descr VARCHAR2(200) com 'teste' gravado.\nALTER TABLE vendas MODIFY (descr NUMBER NOT NULL);", "res": "ORA-01439", "d": "Trocar tipo exige coluna vazia."}, {"id": "S13", "k": "s", "f": "vendas.descr contém 'testando' (8 caracteres).\nALTER TABLE vendas MODIFY (descr VARCHAR2(5));", "res": "ORA-01441", "d": "Não dá para diminuir: um valor não cabe."}, {"id": "S14", "k": "s", "f": "fornecedores com 2 linhas e cnpj NULL.\nALTER TABLE fornecedores MODIFY (cnpj VARCHAR2(14) NOT NULL);", "res": "ORA-02296: null values found", "d": "Na prática resolvida funciona porque a tabela está vazia."}, {"id": "S15", "k": "s", "f": "ALTER TABLE vendas MODIFY (descr VARCHAR2(500));\n-- descr era VARCHAR2(200) com dados", "res": "Sucesso", "d": "Aumentar tamanho sempre pode."}, {"id": "S16", "k": "s", "f": "ALTER TABLE vendas SET UNUSED (quantidade);\nSELECT quantidade FROM vendas;", "res": "ORA-00904: invalid identifier", "d": "A coluna sumiu para os usuários."}, {"id": "S17", "k": "s", "f": "Depois do SET UNUSED, como trazer a coluna de volta?", "res": "Não tem como (via SQL)", "d": "Só resta DROP UNUSED COLUMNS. Para recuperar: backup."}, {"id": "S18", "k": "s", "f": "Script da aula, em ordem:\nALTER TABLE vendas DROP (data_venda, quantidade);\nALTER TABLE vendas SET UNUSED (quantidade);", "res": "ORA-00904 no 2º comando", "d": "quantidade já foi dropada no comando anterior."}, {"id": "S19", "k": "s", "f": "Tabela com uma única coluna.\nALTER TABLE t DROP COLUMN c1;", "res": "ORA-12983", "d": "Não dá para dropar todas as colunas."}, {"id": "S20", "k": "s", "f": "Rodar o Manipulando_Tabelas.sql do início:\nsegundo CREATE TABLE my_table sem DROP antes.", "res": "ORA-00955: name is already used", "d": "O script supõe que você drope entre os blocos."}, {"id": "S21", "k": "s", "f": "DROP TABLE vendas;\nFLASHBACK TABLE vendas TO BEFORE DROP;", "res": "Tabela volta", "d": "Estava na RECYCLEBIN."}, {"id": "S22", "k": "s", "f": "DROP TABLE vendas PURGE;\nFLASHBACK TABLE vendas TO BEFORE DROP;", "res": "ORA-38305: object not in RECYCLE BIN", "d": "PURGE pula a lixeira."}, {"id": "S23", "k": "s", "f": "DROP TABLE clientes;\n-- pedidos.id_cliente é FK para clientes", "res": "ORA-02449", "d": "PK referenciada por FK. Use CASCADE CONSTRAINTS."}, {"id": "S24", "k": "s", "f": "DELETE FROM vendas; ROLLBACK; SELECT COUNT(*) FROM vendas;", "res": "Contagem original", "d": "DELETE é DML."}, {"id": "S25", "k": "s", "f": "TRUNCATE TABLE vendas; ROLLBACK; SELECT COUNT(*) FROM vendas;", "res": "0", "d": "TRUNCATE é DDL, sem rollback."}, {"id": "S26", "k":
