 "SELECT 'It''s finished' FROM dual;\nSELECT q'[It's finished]' FROM dual;", "trap": "Duplicar a aspa não está no slide, mas é a forma mais cobrada em prova.", "tag": "complemento: aspa duplicada"}, {"id": "C09", "k": "c", "sec": "Literais e mecanismo de citação alternativo", "f": "Sintaxe e regras do q-quote?", "a": "q'&lt;delim&gt; texto &lt;delim&gt;'. O delimitador pode ser qualquer caractere, exceto espaço, tab ou enter. Se abrir com [ { &lt; (, fecha com ] } &gt; ).", "why": "", "ex": "SELECT q'!name LIKE '%DBMS_%%'!' FROM dual;\nSELECT q'<'So,' she said, 'It's finished.'>' FROM dual;\nSELECT q'{SELECT * FROM employees WHERE last_name = 'Smith';}' FROM dual;", "trap": "O delimitador não pode aparecer dentro do texto logo antes da aspa final.", "tag": ""}, {"id": "C10", "k": "c", "sec": "Literais e mecanismo de citação alternativo", "f": "% e * precisam de q-quote?", "a": "Não. Dentro de um literal, % e * são texto comum. O problema é só a aspa simples. % e _ só têm significado especial no LIKE (aí se usa ESCAPE, Módulo 01).", "why": "", "ex": "SELECT '100% * 2' FROM dual;   -- funciona sem nada especial", "trap": "O slide diz que asterisco e porcentagem exigem o mecanismo alternativo. Não exigem.", "tag": "correção do material: só aspa simples exige"}, {"id": "C11", "k": "c", "sec": "Caixa e tamanho", "f": "Onde podem ser usadas e quantos níveis de aninhamento?", "a": "Single-row functions aparecem no SELECT, WHERE, HAVING e ORDER BY. Podem ser aninhadas em vários níveis, ao contrário das agregações (máximo 2, Módulo 05).", "why": "", "ex": "SELECT UPPER(TRIM(SUBSTR(nome, 1, 10))) FROM produtos;", "trap": "", "tag": ""}, {"id": "C12", "k": "c", "sec": "Caixa e tamanho", "f": "UPPER, LOWER e INITCAP?", "a": "UPPER: tudo maiúsculo. LOWER: tudo minúsculo. INITCAP: primeira letra de cada palavra maiúscula e o resto minúsculo (Módulo 02).", "why": "", "ex": "SELECT INITCAP(modelo || ' e um modelo de veículo') FROM carros;\n-- 'ka e um...' → 'Ka E Um Modelo De Veículo'", "trap": "INITCAP sobe a inicial até de palavras como 'e' e 'de'.", "tag": ""}, {"id": "C13", "k": "c", "sec": "Caixa e tamanho", "f": "LENGTH com CHAR e com espaços?", "a": "LENGTH conta caracteres, inclusive espaços. Em CHAR, conta os espaços de preenchimento.", "why": "", "ex": "SELECT LENGTH('TEXTO') FROM dual;          -- 5\nSELECT LENGTH(colchar) FROM texto;         -- 2 (até 'A ')\nSELECT LENGTH(RPAD('DBAOCM', 10)) FROM dual;   -- 10", "trap": "", "tag": ""}, {"id": "C14", "k": "c", "sec": "Extrair e localizar", "f": "SUBSTR: como funciona?", "a": "SUBSTR(texto, início [, tamanho]). Sem tamanho, vai até o fim. Início negativo conta do fim (Módulo 02).", "why": "", "ex": "SUBSTR('DBAOCM Education', 8)      -- Education\nSUBSTR('DBAOCM Education', 1, 6)   -- DBAOCM", "trap": "", "tag": ""}, {"id": "C15", "k": "c", "sec": "Extrair e localizar", "f": "INSTR: como funciona com posição e ocorrência?", "a": "INSTR(texto, busca [, início [, ocorrência]]). Devolve a posição; 0 se não achar. Início negativo conta do fim e busca de trás para frente.", "why": "", "ex": "INSTR('CORPORATE FLOOR', 'OR')          -- 2\nINSTR('CORPORATE FLOOR', 'OR', 3, 2)    -- 14\nINSTR('CORPORATE FLOOR', 'OR', -3, 2)   -- 2", "trap": "Com início negativo a posição devolvida continua contada do INÍCIO da string.", "tag": ""}, {"id": "C16", "k": "c", "sec": "Extrair e localizar", "f": "Como extrair o domínio de um e-mail?", "a": "SUBSTR a partir da posição seguinte ao @, localizado com INSTR.", "why": "", "ex": "SELECT SUBSTR(email, INSTR(email, '@') + 1) AS dominio, COUNT(*)\nFROM clientes\nGROUP BY SUBSTR(email, INSTR(email, '@') + 1);", "trap": "No GROUP BY (antes da 23ai) é preciso repetir a expressão: o alias dominio não vale.", "tag": ""}, {"id": "C17", "k": "c", "sec": "Substituir e limpar", "f": "REPLACE: comportamento?", "a": "Troca TODAS as ocorrências do trecho, diferenciando maiúsculas de minúsculas. Sem o 3º argumento, remove.", "why": "", "ex": "REPLACE('JACK and JUE', 'J', 'BL')   -- BLACK and BLUE", "trap": "Troca em qualquer posição do texto, não só no fim (ver prática Q2).", "tag": ""}, {"id": "C18", "k": "c", "sec": "Substituir e limpar", "f": "TRIM: opções e restrição?", "a": "TRIM([LEADING | TRAILING | BOTH] 'c' FROM texto). Padrão: BOTH e espaço. Corta só UM caractere de corte.", "why": "", "ex": "TRIM(LEADING  'x' FROM 'xxDBAOCM Educationxx')   -- DBAOCM Educationxx\nTRIM(TRAILING 'x' FROM 'xxDBAOCM Educationxx')   -- xxDBAOCM Education\nTRIM('x' FROM 'xxDBAOCM Educationxx')            -- DBAOCM Education\nTRIM(' x' FROM ' xxDBAOCM Educationxx')          -- ORA-30001", "trap": "O último comando está no script da aula: é o motivo de existirem LTRIM e RTRIM.", "tag": ""}, {"id": "C19", "k": "c", "sec": "Substituir e limpar", "f": "LTRIM e RTRIM: o que muda em relação ao TRIM?", "a": "Recebem um CONJUNTO de caracteres e removem qualquer combinação deles, só de um lado: LTRIM da esquerda, RTRIM da direita.", "why": "", "ex": "RTRIM(' xxDBAOCM Educationxx ', ' x')   -- ' xxDBAOCM Education'\nLTRIM(' xxDBAOCM Educationxx ', ' x')   -- 'DBAOCM Educationxx '\nRTRIM('<==>DBAOCM<==>', '><=')         -- '<==>DBAOCM'\nRTRIM(LTRIM(txt, ' x'), ' x')           -- os dois lados", "trap": "A ordem dos caracteres no conjunto não importa: '><=' remove >, < e = em qualquer sequência.", "tag": ""}, {"id": "C20", "k": "c", "sec": "Preencher: LPAD e RPAD", "f": "RPAD e LPAD: sintaxe e padrão?", "a": "RPAD(texto, tamanho [, caractere]) completa à direita; LPAD, à esquerda. Sem o caractere, usa espaço.", "why": "", "ex": "RPAD('DBAOCM', 10, '*')   -- DBAOCM****\nLPAD('DBAOCM', 10, '*')   -- ****DBAOCM\nLPAD('7', 3, '0')         -- 007", "trap": "", "tag": ""}, {"id": "C21", "k": "c", "sec": "Preencher: LPAD e RPAD", "f": "E se o tamanho for menor que o texto?", "a": "O texto é cortado e ficam os PRIMEIROS caracteres, tanto no RPAD quanto no LPAD.", "why": "", "ex": "RPAD('DBAOCM', 3)   -- DBA\nLPAD('DBAOCM', 3)   -- DBA (não 'OCM')", "trap": "Muita gente espera 'OCM' no LPAD. O slide diz \"cortada da direita para a esquerda\": quer dizer que sai o final do texto, nos dois casos.", "tag": ""}, {"id": "C22", "k": "c", "sec": "Preencher: LPAD e RPAD", "f": "E se o tamanho tiver casa decimal?", "a": "A parte decimal é truncada: RPAD('x', 3.9, '*') usa tamanho 3.", "why": "", "ex": "RPAD(' ', 2500/1000 + 2, '*')   -- tamanho 4.5 → 4 → ' ***'", "trap": "A prática resolvida (Q7) depende exatamente desse truncamento.", "tag": "complemento"}, {"id": "C23", "k": "c", "sec": "Prática ElecShop", "f": "Q2: qual o risco do UPDATE ... SET email = REPLACE(email, '.con', '.com')?", "a": "O REPLACE troca '.con' em QUALQUER posição. Um e-mail como joao.conrado@gmail.con viraria joao.comrado@gmail.com. E sem WHERE, o UPDATE regrava todas as linhas, inclusive as corretas.", "why": "", "ex": "UPDATE clientes\nSET email = SUBSTR(email, 1, LENGTH(email) - 4) || '.com'\nWHERE email LIKE '%.con';", "trap": "Com os dados da prática funciona. Em base real de cliente, é assim que se corrompe dado em massa.", "tag": "complemento: ajuste na prática resolvida"}, {"id": "C24", "k": "c", "sec": "Prática ElecShop", "f": "Q4 e Q6: por que a ordem dos passos importa?", "a": "A Q4 (nomes em caixa alta) roda ANTES da Q6 (TRIM nos nomes). Sem TRIM, a lista sai com espaço no início e espaço duplo: ' JOAO  BARBOSA'. Além disso, a Q6 não faz COMMIT.", "why": "", "ex": "SELECT UPPER(TRIM(primeironome) || ' ' || TRIM(ultimonome))\n       || ' Email: <' || email || '>'\nFROM clientes;", "trap": "Use TRIM na consulta, independentemente de o dado já ter sido limpo.", "tag": "complemento: ajuste na prática resolvida"}, {"id": "C25", "k": "c", "sec": "Prática ElecShop", "f": "Q7: como funciona o RPAD(' ', PRECO/1000 + 2, '*')?", "a": "Monta uma string com 1 espaço e completa com * até o tamanho PRECO/1000 + 2, que é truncado. Para 2500: 4,5 → 4 → ' ***' = 3 estrelas.", "why": "", "ex": "-- forma mais legível, limitada a 6 estrelas:\nRPAD('*', LEAST(TRUNC(preco/1000) + 1, 6), '*')", "trap": "Funciona por causa do truncamento implícito. Preço de 7000 daria 8 estrelas, acima das 6 da tabela.", "tag": "complemento"}, {"id": "S01", "k": "s", "f": "SELECT LENGTH(colchar), LENGTH(colvarchar2) FROM texto;\n-- linha ('A', 'TESTE')", "res": "2 | 5", "d": "CHAR(2) completa 'A' com espaço."}, {"id": "S02", "k": "s", "f": "INSERT INTO texto VALUES ('ABC', 'X');", "res": "ORA-12899", "d": "3 caracteres em CHAR(2)."}, {"id": "S03", "k": "s", "f": "SELECT * FROM texto WHERE colchar = 'A';", "res": "Acha a linha 'A '", "d": "Comparação de CHAR com preenchimento."}, {"id": "S04", "k": "s", "f": "SELECT 'A' || NULL || 'B' FROM dual;", "res": "AB", "d": "NULL vira vazio na concatenação."}, {"id": "S05", "k": "s", "f": "SELECT CONCAT('a', 'b', 'c') FROM dual;", "res": "ORA-00909", "d": "CONCAT só aceita 2 argumentos."}, {"id": "S06", "k": "s", "f": "SELECT 'It''s ok' FROM dual;", "res": "It's ok", "d": "Duas aspas viram uma."}, {"id": "S07", "k": "s", "f": "SELECT q'<'So,' she said, 'It's finished.'>' FROM dual;", "res": "'So,' she said, 'It's finished.'", "d": "< fecha com >."}, {"id": "S08", "k": "s", "f": "SELECT q'!name LIKE '%DBMS_%%'!' FROM dual;", "res": "name LIKE '%DBMS_%%'", "d": "! abre e fecha."}, {"id": "S09", "k": "s", "f": "SELECT SUBSTR('DBAOCM Education', 8) FROM dual;", "res": "Education", "d": "Da posição 8 até o fim."}, {"id": "S10", "k": "s", "f": "SELECT INSTR('CORPORATE FLOOR','OR', 3, 2) FROM dual;", "res": "14", "d": "A partir da 3ª posição, 2ª ocorrência."}, {"id": "S11", "k": "s", "f": "SELECT INSTR('CORPORATE FLOOR','OR', -3, 2) FROM dual;", "res": "2", "d": "De trás para frente, a partir da antepenúltima: 2ª ocorrência fica na posição 2."}, {"id": "S12", "k": "s", "f": "SELECT REPLACE('JACK and JUE','J','BL') FROM dual;", "res": "BLACK and BLUE", "d": "Todas as ocorrências."}, {"id": "S13", "k": "s", "f": "SELECT TRIM(LEADING 'x' FROM 'xxDBAOCM Educationxx') FROM dual;", "res": "DBAOCM Educationxx", "d": "Só da  menor: fica o início (DBA)", "LPAD('DBAOCM',3) = DBA, não OCM", "Tamanho decimal é truncado"]}, {"t": "Prática ElecShop", "cards": "C23–C25", "col": "#00838f", "leaves": ["Q2: REPLACE troca .con no meio também → filtre com LIKE '%.con'", "Q4 antes da Q6: use TRIM no SELECT", "Q6 sem COMMIT", "Q7: RPAD com tamanho truncado"]}]}}]</script>
<script>
(function(){
const MODS = JSON.parse(document.getElementById('data').textContent);
const KEY='estudos-oracle:v1';
let st={marks:{},mod:MODS[0].id,view:'map',kind:'all',show:'all',shuffle:false};
try{const s=localStorage.getItem(KEY); if(s) st=Object.assign(st,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pre=s=>s?`<pre>${esc(s)}</pre>`:'';
let deck=[], pos=0;
function mod(){return MODS.find(m=>m.id===st.mod)||MODS[0];}
function mk(m,c){return st.marks[m.id+':'+c.id];}
function statsOf(m){let o=0,e=0;m.cards.forEach(c=>{const k=mk(m,c);if(k==='o')o++;else if(k==='e')e++;});return{o,e,t:m.cards.length};}
function renderNav(){
  const el=document.getElementById('modlist');
  el.innerHTML=MODS.map(m=>{const s=statsOf(m);
    return `<button class="modbtn" data-m="${m.id}" aria-current="${m.id===st.mod}">
      <span class="mid">${m.id.replace('M','Módulo ')}</span><span class="mt">${esc(m.title)}</span>
      <span class="bar"><i class="o" style="width:${s.o/s.t*100}%"></i><i class="e" style="width:${s.e/s.t*100}%"></i></span>
      <span class="stat mono" style="font-family:inherit">${s.o} acertos, ${s.e} erros de ${s.t} cards</span></button>`;}).join('');
  el.querySelectorAll('.modbtn').forEach(b=>b.onclick=()=>{st.mod=b.dataset.m;pos=0;save();render();window.scrollTo(0,0);});
}
function buildDeck(){
  const m=mod();
  deck=m.cards.filter(c=>(st.kind==='all'||c.k===st.kind)&&(st.show==='all'||(st.show==='err'&&mk(m,c)==='e')||(st.show==='new'&&!mk(m,c))));
  if(st.shuffle){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}
  if(pos>=deck.length)pos=0;
}
function tagHtml(c){ return c.tag?`<span class="tag ${c.tag.startsWith('correção')?'w':'x'}">${esc(c.tag)}</span>`:''; }
function front(c){
  if(c.k==='v')return `<span class="num">${c.id}</span><span class="en">${esc(c.f)}</span>`;
  if(c.k==='c')return `<span class="num">${c.id}</span><span class="q">${c.f}</span>${tagHtml(c)}`;
  return `<span class="num">${c.id}</span>${pre(c.f)}`;
}
function back(c){
  if(c.k==='v')return `<div class="pt">${esc(c.pt)}</div><div class="txt">${esc(c.d)}</div><div class="lab">Exemplo</div>${pre(c.ex)}${c.rel?`<div class="rel">Relacionado: ${esc(c.rel)}</div>`:''}`;
  if(c.k==='c'){let h=`<div class="lab">Resposta</div><div class="txt">${c.a}</div>`;
    if(c.why)h+=`<div class="lab">Por quê</div><div class="txt">${c.why}</div>`;
    if(c.ex)h+=`<div class="lab">Exemplo</div>${pre(c.ex)}`;
    if(c.trap)h+=`<div class="lab t">Pegadinha</div><div class="txt trap">${c.trap}</div>`;
    return h;}
  return `<div class="res">${esc(c.res)}</div><div class="txt">${esc(c.d)}</div>`;
}
const LEG=`<div class="legend">Frente na faixa azul, verso abaixo da linha tracejada. Cada conceito traz Resposta, Por quê, Exemplo e Pegadinha. <b class="w">Vermelho</b> = correção do material. <b class="x">Verde</b> = complemento fora dos slides, cobrado em prova ou relevante na rotina de DBA.</div>`;
const KN={v:'Vocabulário',c:'Conceito',s:'Cenário'};
function renderStudy(m){
  buildDeck();
  const filters=`<div class="filters">
    <label>Tipo <select id="fk"><option value="all">Todos</option><option value="v">Vocabulário</option><option value="c">Conceitos</option><option value="s">Cenários</option></select></label>
    <label>Mostrar <select id="fs"><option value="all">Todos os cards</option><option value="err">Só os que errei</option><option value="new">Só os que não vi</option></select></label>
    <label><input type="checkbox" id="fsh"> Embaralhar</label></div>`;
  const ref=(st.kind==='s'||st.kind==='all')?`<details class="ref"><summary>${esc(m.ref)}</summary>${pre(m.reftxt)}</details>`:'';
  let body;
  if(!deck.length){
    body=`<div class="empty">${st.show==='err'?'Nenhum card marcado como errado neste filtro. Volte para "Todos os cards" ou escolha outro módulo.':st.show==='new'?'Você já passou por todos os cards deste filtro. Use "Só os que errei" para revisar.':'Nenhum card neste filtro.'}</div>`;
  } else {
    const c=deck[pos], k=mk(m,c);
    body=`<div class="counter"><span>Card ${pos+1} de ${deck.length}</span><span>${KN[c.k]}${c.sec?': '+esc(c.sec):''}</span></div>
    <article class="card" id="card">
      <div class="front" id="fr" role="button" tabindex="0" aria-label="Virar card">
        <div class="meta">${k?`<span class="mark ${k}">${k==='e'?'Você errou da última vez':'Você acertou da última vez'}</span>`:''}</div>
        ${front(c)}<div class="tapflip">Toque no card ou em Virar para ver a resposta</div></div>
      <div class="back">${back(c)}</div>
      <div class="actions" id="act"><button class="flip" id="bflip">Virar</button></div>
    </article>
    <div class="navrow"><button id="bprev">Anterior</button><button id="bnext">Próximo</button></div>
    <div class="keys">Atalhos: espaço vira, 1 errei, 2 acertei, setas navegam.</div>`;
  }
  return LEG+filters+ref+`<div class="deck">${body}</div><div class="reset"><button class="ghost" id="breset">Zerar progresso deste módulo</button></div>`;
}
function renderList(m){
  const want=k=>st.kind==='all'||st.kind===k;
  const card=c=>{const k=mk(m,c);return `<article class="card flipped"><div class="front" style="cursor:default">${front(c)}${k?` <span class="mark ${k}">${k==='e'?'Errou':'Acertou'}</span>`:''}</div><div class="back">${back(c)}</div></article>`;};
  let h='';
  if(want('v'))h+=`<h3 class="sech">A. Vocabulário <span>EN → PT · definição · exemplo</span></h3>`+m.cards.filter(c=>c.k==='v').map(card).join('');
  if(want('c')){h+=`<h3 class="sech">B. Conceitos <span>resposta · por quê · exemplo · pegadinha</span></h3>`;let last='';
    m.cards.filter(c=>c.k==='c').forEach(c=>{if(c.sec!==last){h+=`<h4 class="subh">${esc(c.sec)}</h4>`;last=c.sec;}h+=card(c);});}
  if(want('s'))h+=`<h3 class="sech">C. Cenários <span>preveja o resultado antes de ler o verso</span></h3><div class="refbox"><b>${esc(m.ref)}</b>${pre(m.reftxt)}</div>`+m.cards.filter(c=>c.k==='s').map(card).join('');
  const f=`<div class="filters"><label>Tipo <select id="fk"><option value="all">Todos</option><option value="v">Vocabulário</option><option value="c">Conceitos</option><option value="s">Cenários</option></select></label></div>`;
  return LEG+f+`<div class="deck">${h}</div>`;
}
function renderMap(m){
  const mm=m.mm;
  return `<div class="mmtop"><p class="hint" style="margin:0">Explique cada ramo em voz alta antes de abrir. Onde travar, revise os flashcards indicados.</p><div class="mmbtns"><button class="ghost" id="mmall">Abrir todos</button><button class="ghost" id="mmnone">Fechar todos</button></div></div>
  <div class="mmcenter"><div class="mmct">${esc(mm.ct)}</div><div class="mmcs">${esc(mm.cs)}</div></div>
  <div class="mmgrid" id="mmg">${mm.branches.map(b=>`<div class="mmb"><button class="mmh" aria-expanded="false" style="background:${b.col}"><span class="mmt">${esc(b.t)}</span><span class="mmc">Flashcards ${esc(b.cards)}</span><span class="mmi" aria-hidden="true">▾</span></button><ul class="mml">${b.leaves.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')}</div>`;
}
function flip(){
  const card=document.getElementById('card'); if(!card||card.classList.contains('flipped'))return;
  card.classList.add('flipped');
  document.getElementById('act').innerHTML=`<button class="bad" id="bbad">Errei</button><button class="good" id="bgood">Acertei</button>`;
  document.getElementById('bbad').onclick=()=>markIt('e'); document.getElementById('bgood').onclick=()=>markIt('o');
  document.getElementById('bbad').focus();
}
function markIt(v){
  const m=mod(), c=deck[pos]; st.marks[m.id+':'+c.id]=v; save();
  if(st.show==='all') pos=(pos+1)%deck.length;
  else if(st.show==='err' && v==='e') pos=(pos+1)%deck.length;
  render(true);
}
function go(d){ if(!deck.length)return; pos=(pos+d+deck.length)%deck.length; render(true); }
function render(keepDeck){
  renderNav();
  const m=mod(), s=statsOf(m);
  const main=document.getElementById('main');
  const head=`<div class="mhead"><h2>${esc(m.title)}</h2><p class="sub">${m.id.replace('M','Módulo ')} · ${s.t} cards · ${s.o} acertos · ${s.e} para revisar</p></div>
  <div class="seg" role="group" aria-label="Modo"><button data-v="map" aria-pressed="${st.view==='map'}">Mapa mental</button><button data-v="study" aria-pressed="${st.view==='study'}">Flashcards</button><button data-v="list" aria-pressed="${st.view==='list'}">Lista completa</button></div>`;
  if(st.view==='map'){
    main.innerHTML=head+renderMap(m);
    const mg=document.getElementById('mmg');
    mg.querySelectorAll('.mmh').forEach(h=>h.onclick=()=>{const o=h.parentElement.classList.toggle('open');h.setAttribute('aria-expanded',o);});
    const setAll=o=>mg.querySelectorAll('.mmb').forEach(c=>{c.classList.toggle('open',o);c.querySelector('.mmh').setAttribute('aria-expanded',o);});
    document.getElementById('mmall').onclick=()=>setAll(true);
    document.getElementById('mmnone').onclick=()=>setAll(false);
  } else if(st.view==='list'){
    main.innerHTML=head+renderList(m);
    const fk=document.getElementById('fk'); fk.value=st.kind; fk.onchange=()=>{st.kind=fk.value;save();render();};
  } else {
    if(!keepDeck)pos=0;
    const sv=pos; main.innerHTML=head+renderStudy(m); pos=sv;
    const fk=document.getElementById('fk'),fs=document.getElementById('fs'),fsh=document.getElementById('fsh');
    fk.value=st.kind; fs.value=st.show; fsh.checked=st.shuffle;
    fk.onchange=()=>{st.kind=fk.value;pos=0;save();render();};
    fs.onchange=()=>{st.show=fs.value;pos=0;save();render();};
    fsh.onchange=()=>{st.shuffle=fsh.checked;pos=0;save();render();};
    const fr=document.getElementById('fr'); if(fr){fr.onclick=flip; fr.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip();}};}
    const bf=document.getElementById('bflip'); if(bf)bf.onclick=flip;
    const bp=document.getElementById('bprev'); if(bp)bp.onclick=()=>go(-1);
    const bn=document.getElementById('bnext'); if(bn)bn.onclick=()=>go(1);
    document.getElementById('breset').onclick=()=>{ if(confirm('Zerar acertos e erros de '+m.id.replace('M','Módulo ')+'?')){Object.keys(st.marks).forEach(k=>{if(k.startsWith(m.id+':'))delete st.marks[k];});save();pos=0;render();}};
  }
  main.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;save();render();});
}
document.addEventListener('keydown',e=>{
  if(st.view!=='study'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const card=document.getElementById('card'); if(!card)return;
  if(e.key===' '){e.preventDefault();flip();}
  else if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1);
  else if(card.classList.contains('flipped')&&e.key==='1')markIt('e');
  else if(card.classList.contains('flipped')&&e.key==='2')markIt('o');
});
render();
})();
</script>
