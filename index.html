e horas vira fração do dia.", "why": "", "ex": "-- SYSDATE = 15/10/2026 10:30\nSYSDATE - DATE '2026-10-14'          -- 1.4375\nTRUNC(SYSDATE) - DATE '2026-10-14'   -- 1\nTRUNC(SYSDATE - hire_date)           -- dias inteiros", "trap": "", "tag": ""}, {"id": "C24", "k": "c", "sec": "Datas", "f": "ADD_MONTHS(d, n): regras?", "a": "Soma n meses à data (n negativo subtrai). Se d é o último dia do mês, ou se o mês de destino tem menos dias, o resultado é o ÚLTIMO dia do mês de destino.", "why": "", "ex": "ADD_MONTHS(DATE '2026-01-15', 6)    -- 15/07/2026\nADD_MONTHS(DATE '2024-01-31', 1)    -- 29/02/2024\nADD_MONTHS(DATE '2024-04-30', 1)    -- 31/05/2024 (último → último)\nADD_MONTHS(SYSDATE, -60)            -- 5 anos atrás", "trap": "30/04 + 1 mês não é 30/05: é 31/05, porque 30/04 é o último dia de abril.", "tag": ""}, {"id": "C25", "k": "c", "sec": "Datas", "f": "MONTHS_BETWEEN(d1, d2): regras?", "a": "Meses entre d1 e d2. Positivo se d1 for posterior; negativo se anterior. Dá inteiro quando os dias do mês coincidem (ou ambos são último dia). Fora isso, a fração considera mês de 31 dias.", "why": "", "ex": "MONTHS_BETWEEN(DATE '2026-03-15', DATE '2026-01-15')   -- 2\nMONTHS_BETWEEN(DATE '2026-01-15', DATE '2026-03-15')   -- -2", "trap": "A ordem dos argumentos importa. Inverter dá número negativo e o filtro > 60 nunca é verdade.", "tag": ""}, {"id": "C26", "k": "c", "sec": "Datas", "f": "TRUNC e ROUND em datas?", "a": "TRUNC(data) zera a hora (meia-noite). Com formato: 'MM' = 1º dia do mês, 'YYYY' = 1º dia do ano. ROUND(data) arredonda para o dia mais próximo (meio-dia vira o dia seguinte).", "why": "", "ex": "TRUNC(SYSDATE)          -- 15/10/2026 00:00:00\nTRUNC(SYSDATE, 'MM')    -- 01/10/2026\nTRUNC(SYSDATE, 'YYYY')  -- 01/01/2026", "trap": "", "tag": "complemento: formatos e ROUND(data)"}, {"id": "C27", "k": "c", "sec": "Datas", "f": "O que significa \"datas não são texto\"?", "a": "Compare DATE com DATE. Use literal DATE 'AAAA-MM-DD' ou TO_DATE com máscara. Comparar com string depende do NLS_DATE_FORMAT da sessão.", "why": "", "ex": "WHERE hire_date >= DATE '2020-01-01'                  -- certo\nWHERE hire_date >= TO_DATE('01/01/2020','DD/MM/YYYY') -- certo\nWHERE hire_date >= '01/01/2020'                       -- depende da sessão", "trap": "Funciona no seu SQL Developer e quebra no job do cliente com outro NLS.", "tag": ""}, {"id": "C28", "k": "c", "sec": "Datas", "f": "Como calcular tempo de empresa em anos?", "a": "TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date) / 12, 1): meses entre as datas, divididos por 12, cortados com 1 casa.", "why": "É melhor que (SYSDATE - hire_date)/365, que erra por causa dos anos bissextos.", "ex": "SELECT hire_date,\n       TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1) AS anos_empresa\nFROM hr.employees;", "trap": "TRUNC aqui é o TRUNC numérico (o argumento já é número), não o de data.", "tag": ""}, {"id": "C29", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "Qual o impacto de função sobre coluna no WHERE?", "a": "Aplicar função na COLUNA impede o uso normal de um índice B-tree nela. O Oracle tende a fazer full table scan.", "why": "O índice guarda o valor original da coluna, não o resultado da função.", "ex": "WHERE TRUNC(hire_date) = DATE '2020-01-15'           -- não usa índice em hire_date\nWHERE hire_date >= DATE '2020-01-15'\n  AND hire_date <  DATE '2020-01-16'                  -- usa", "trap": "Regra prática: deixe a coluna \"limpa\" e aplique a função do lado do valor.", "tag": ""}, {"id": "C30", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "O que é índice baseado em função?", "a": "Índice criado sobre a expressão, não sobre a coluna. O WHERE com a mesma expressão passa a poder usar o índice.", "why": "", "ex": "CREATE INDEX emp_upper_ln_ix ON hr.employees (UPPER(last_name));\nSELECT * FROM hr.employees WHERE UPPER(last_name) = 'KING';   -- pode usar o índice", "trap": "A expressão no WHERE precisa ser idêntica à do índice.", "tag": "complemento"}, {"id": "C31", "k": "c", "sec": "Funções no WHERE e desempenho", "f": "Como reescrever o filtro do desafio para usar índice em hire_date?", "a": "Trocar <code>MONTHS_BETWEEN(SYSDATE, hire_date) &gt; 60<\/code> por <code>hire_date &lt; ADD_MONTHS(SYSDATE, -60)<\/code>. A função passa para o lado do valor e a coluna fica limpa.", "why": "", "ex": "WHERE hire_date < ADD_MONTHS(SYSDATE, -60)", "trap": "Na tabela HR (107 linhas) não faz diferença. Numa tabela de milhões de linhas de cliente, faz.", "tag": "complemento: visão de DBA"}, {"id": "C32", "k": "c", "sec": "Projeto RH (desafio da aula)", "f": "Qual função atende cada requisito do relatório de RH?", "a": "Nome formatado → INITCAP(first_name || ' ' || last_name)<br>E-mail resumido → SUBSTR(email, 1, 5) || '...'<br>Salário sem decimais → ROUND(salary, 0)<br>Anos de empresa com 1 casa → TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1)<br>Mais de 5 anos → WHERE MONTHS_BETWEEN(SYSDATE, hire_date) &gt; 60", "why": "", "ex": "SELECT INITCAP(first_name || ' ' || last_name)              AS nome,\n       SUBSTR(email, 1, 5) || '...'                        AS email_resumido,\n       ROUND(salary, 0)                                    AS salario,\n       TRUNC(MONTHS_BETWEEN(SYSDATE, hire_date) / 12, 1)   AS anos_empresa\nFROM hr.employees\nWHERE MONTHS_BETWEEN(SYSDATE, hire_date) > 60;", "trap": "", "tag": ""}, {"id": "C33", "k": "c", "sec": "Projeto RH (desafio da aula)", "f": "Por que o desafio repete o MONTHS_BETWEEN no WHERE em vez de usar anos_empresa?", "a": "Alias criado no SELECT não existe no WHERE: ORA-00904. O WHERE é avaliado antes da lista de seleção (Módulo 01).", "why": "", "ex": "WHERE anos_empresa > 5   -- ORA-00904: \"ANOS_EMPRESA\": invalid identifier", "trap": "Questão que junta os dois módulos.", "tag": ""}, {"id": "S01", "k": "s", "f": "SELECT ROUND(10.49,0), TRUNC(10.49,0) FROM dual;", "res": "10 | 10", "d": "Parte descartada 0,49 é menor que 0,5: os dois dão 10."}, {"id": "S02", "k": "s", "f": "SELECT ROUND(10.50,0), TRUNC(10.50,0) FROM dual;", "res": "11 | 10", "d": "0,50 sobe no ROUND; TRUNC só corta."}, {"id": "S03", "k": "s", "f": "SELECT ROUND(7.25,1), TRUNC(7.25,1) FROM dual;", "res": "7.3 | 7.2", "d": "1 casa decimal."}, {"id": "S04", "k": "s", "f": "SELECT ROUND(1250,-2), TRUNC(1250,-2) FROM dual;", "res": "1300 | 1200", "d": "d negativo age nas centenas."}, {"id": "S05", "k": "s", "f": "SELECT ROUND(-2.5), TRUNC(-2.7) FROM dual;", "res": "-3 | -2", "d": "ROUND afasta do zero; TRUNC aproxima."}, {"id": "S06", "k": "s", "f": "SELECT MOD(10,3), MOD(10,0), MOD(-7,3) FROM dual;", "res": "1 | 10 | -1", "d": "MOD por zero devolve o dividendo; sinal segue o dividendo."}, {"id": "S07", "k": "s", "f": "SELECT SUBSTR('ORACLE',2,3) FROM dual;", "res": "RAC", "d": "Da posição 2, 3 caracteres."}, {"id": "S08", "k": "s", "f": "SELECT SUBSTR('ORACLE',-3) FROM dual;", "res": "CLE", "d": "Negativo conta do fim; sem tamanho vai até o final."}, {"id": "S09", "k": "s", "f": "SELECT SUBSTR('ORACLE',0,2) FROM dual;", "res": "OR", "d": "Posição 0 é tratada como 1."}, {"id": "S10", "k": "s", "f": "SELECT INSTR('BANANA','A',1,2), INSTR('BANANA','X') FROM dual;", "res": "4 | 0", "d": "2ª ocorrência de A está na posição 4. Não achou = 0."}, {"id": "S11", "k": "s", "f": "SELECT INITCAP('joão da SILVA') FROM dual;", "res": "João Da Silva", "d": "Sobe a 1ª letra e desce o resto de cada palavra."}, {"id": "S12", "k": "s", "f": "SELECT LENGTH(' ab '), LENGTH('') FROM dual;", "res": "4 | NULL", "d": "Espaços contam. String vazia é NULL no Oracle."}, {"id": "S13", "k": "s", "f": "SELECT 'Ana' || NULL || 'Lima' FROM dual;", "res": "AnaLima", "d": "|| trata NULL como vazio."}, {"id": "S14", "k": "s", "f": "SELECT REPLACE('2026-10-15','-') FROM dual;", "res": "20261015", "d": "Sem 3º argumento, remove."}, {"id": "S15", "k": "s", "f": "SELECT TRIM('0' FROM '00120') FROM dual;", "res": "12", "d": "BOTH é o padrão: tira zeros dos dois lados."}, {"id": "S16", "k": "s", "f": "SELECT TRIM('ab' FROM 'abcab') FROM dual;", "res": "ORA-30001", "d": "TRIM só aceita um caractere de corte."}, {"id": "S17", "k": "s", "f": "SELECT SUBSTR('SKING',1,INSTR('SKING','@')-1) FROM dual;", "res": "NULL", "d": "INSTR = 0 → tamanho -1 → NULL. E-mail do HR não tem @."}, {"id": "S18", "k": "s", "f": "SELECT UPPER(SUBSTR('oracle',1,3)) FROM dual;", "res": "ORA", "d": "De dentro para fora: 'ora' → 'ORA'."}, {"id": "S19", "k": "s", "f": "SELECT DATE '2026-10-15' - DATE '2026-10-01' FROM dual;", "res": "14", "d": "DATE - DATE = dias."}, {"id": "S20", "k": "s", "f": "SELECT SYSDATE - DATE '2026-10-14' FROM dual;", "res": "1.4375", "d": "1 dia + 10h30 (10,5/24 = 0,4375)."}, {"id": "S21", "k": "s", "f": "SELECT SYSDATE + SYSDATE FROM dual;", "res": "ORA-00975", "d": "Não existe soma de duas datas."}, {"id": "S22", "k": "s", "f": "SELECT ADD_MONTHS(DATE '2024-01-31',1) FROM dual;", "res": "29/02/2024", "d": "Fevereiro de 2024 não tem dia 31: vai para o último dia."}, {"id": "S23", "k": "s", "f": "SELECT ADD_MONTHS(DATE '2024-04-30',1) FROM dual;", "res": "31/05/2024", "d": "30/04 é último dia do mês: o resultado também é último dia."}, {"id": "S24", "k": "s", "f": "SELECT MONTHS_BETWEEN(DATE '2026-03-15', DATE '2026-01-15'),\n       MONTHS_BETWEEN(DATE '2026-01-15', DATE '2026-03-15') FROM dual;", "res": "2 | -2", "d": "A ordem dos argumentos define o sinal."}, {"id": "S25", "k": "s", "f": "SELECT TRUNC(SYSDATE), TRUNC(SYSDATE,'MM') FROM dual;", "res": "15/10/2026 00:00 | 01/10/2026", "d": "TRUNC de data zera a hora; 'MM' vai ao 1º dia do mês."}, {"id": "S26", "k": "s", "f": "Funcionário contratado em 15/04/2020.\nTRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1) = ?\nEntra no WHERE ... > 60?", "res": "6.5 · entra", "d": "78 meses (mesmo dia do mês → inteiro) / 12 = 6,5. 78 > 60."}, {"id": "S27", "k": "s", "f": "Funcionário contratado em 15/11/2021.\nEntra no filtro do desafio (MONTHS_BETWEEN > 60)?", "res": "Não entra", "d": "59 meses."}, {"id": "S28", "k": "s", "f": "SELECT job_id FROM hr.employees\nWHERE UPPER(job_id) LIKE '%MAN%';\n-- quais cargos de gerente aparecem?", "res": "SA_MAN, PU_MAN, ST_MAN, MK_MAN", "d": "FI_MGR e AC_MGR também são gerentes, mas usam MGR e ficam de fora. O filtro da aula não pega todos os gerentes."}, {"id": "E01", "k": "e", "f": "SELECT SUBSTR(email 1, 5) FROM hr.employees;", "res": "Faltou vírgula (ORA-00907)", "fix": "SELECT SUBSTR(email, 1, 5) FROM hr.employees;", "d": "Argumentos de função são separados por vírgula."}, {"id": "E02", "k": "e", "f": "SELECT MONTHS_BETWEEN(SYSDATE AND hire_date)\nFROM hr.employees;", "res": "AND no lugar da vírgula (ORA-00909)", "fix": "SELECT MONTHS_BETWEEN(SYSDATE, hire_date)\nFROM hr.employees;", "d": "AND é operador lógico (e faz parte do BETWEEN). Dentro de função, vírgula."}, {"id": "E03", "k": "e", "f": "SELECT ADD_MONTH(SYSDATE, 6) FROM dual;", "res": "Nome da função errado (ORA-00904)", "fix": "SELECT ADD_MONTHS(SYSDATE, 6) FROM dual;", "d": "Função com nome digitado errado aparece como \"invalid identifier\"."}, {"id": "E04", "k": "e", "f": "SELECT SYSDATE() FROM dual;", "res": "SYSDATE não leva parênteses", "fix": "SELECT SYSDATE FROM dual;", "d": "SYSDATE é chamado sem ()."}, {"id": "E05", "k": "e", "f": "SELECT CONCAT(first_name, ' ', last_name)\nFROM hr.employees;", "res": "CONCAT com 3 argumentos (ORA-00909)", "fix": "SELECT first_name || ' ' || last_name\nFROM hr.employees;", "d": "CONCAT aceita só 2. Para mais, use || ou aninhe CONCAT."}, {"id": "E06", "k": "e", "f": "SELECT ROUND(salary, 2, 1) FROM hr.employees;", "res": "Argumentos demais (ORA-00909)", "fix": "SELECT ROUND(salary, 2) FROM hr.employees;", "d": "ROUND aceita no máximo 2 argumentos."}, {"id": "E07", "k": "e", "f": "SELECT TRIM('ab' FROM 'abcab') FROM dual;", "res": "TRIM com 2 caracteres (ORA-30001)", "fix": "SELECT RTRIM(LTRIM('abcab', 'ab'), 'ab') FROM dual;", "d": "TRIM corta só 1 caractere. Para conjunto, LTRIM/RTRIM."}, {"id": "E08", "k": "e", "f": "SELECT SYSDATE + hire_date FROM hr.employees;", "res": "Soma de duas datas (ORA-00975)", "fix": "SELECT SYSDATE - hire_date FROM hr.employees;", "d": "Data + data não existe. Data - data dá dias."}], "mm": {"ct": "Single-Row Functions", "cs": "1 linha entra → 1 linha sai", "branches": [{"t": "Conceito", "cards": "C01–C04", "col": "#002b5c", "leaves": ["Age linha a linha, não agrupa", "≠ agregação (SUM, COUNT: N → 1)", "Usa em SELECT e WHERE (+ ORDER BY)", "Aninhadas: de dentro para fora", "NULL entra → NULL sai (exceto ||)", "Teste rápido: FROM dual"]}, {"t": "String: caixa e tamanho", "cards": "C05–C07", "col": "#2f6db5", "leaves": ["UPPER · LOWER · INITCAP", "INITCAP desce o resto: SILVA → Silva", "UPPER no WHERE: busca sem caixa", "LENGTH conta espaços", "'' é NULL → LENGTH('') = NULL"]}, {"t": "String: extrair", "cards": "C08–C10", "col": "#7b4bb0", "leaves": ["SUBSTR(txt, pos [, tam])", "pos 0 = 1 · negativa conta do fim", "INSTR(txt, busca, pos, ocorrência)", "INSTR devolve posição; 0 se não achar", "SUBSTR + INSTR: antes do @", "HR: email sem @ → NULL"]}, {"t": "String: limpar e montar", "cards": "C11–C13", "col": "#c0392b", "leaves": ["REPLACE troca todas; sem 3º arg remove", "TRIM: LEADING / TRAILING / BOTH", "TRIM só 1 caractere (ORA-30001)", "|| N pedaços · CONCAT só 2", "|| trata NULL como vazio"]}, {"t": "Números", "cards": "C14–C19", "col": "#1f7a55", "leaves": ["ROUND arredonda · TRUNC corta", "10.49 → 10 | 10 · 10.50 → 11 | 10", "Diferença só se descartado ≥ 0,5", "d negativo: ROUND(1250,-2) = 1300", "ROUND(-2.5) = -3 · TRUNC(-2.7) = -2", "MOD = resto · MOD(x,0) = x", "MOD(id,2) = 0 → par"]}, {"t": "Datas", "cards": "C20–C28", "col": "#b06d00", "leaves": ["DATE guarda data E hora", "SYSDATE: hora do servidor, sem ()", "DATE ± n = dias · DATE - DATE = dias", "DATE + DATE → ORA-00975", "ADD_MONTHS: último dia → último dia", "MONTHS_BETWEEN(d1,d2): ordem = sinal", "TRUNC(data) zera a hora · 'MM' · 'YYYY'", "Anos: TRUNC(MONTHS_BETWEEN/12, 1)", "Datas não são texto: DATE '2026-01-01'"]}, {"t": "WHERE e desempenho", "cards": "C29–C31", "col": "#5d6d7e", "leaves": ["Função na coluna → sem índice B-tree", "Deixe a coluna limpa, função no valor", "TRUNC(dt) = X → dt >= X AND dt < X+1", "Índice baseado em função", "hire_date < ADD_MONTHS(SYSDATE,-60)"]}, {"t": "Projeto RH", "cards": "C32–C33", "col": "#00838f", "leaves": ["Nome: INITCAP(first || ' ' || last)", "Email: SUBSTR(email,1,5) || '...'", "Salário: ROUND(salary, 0)", "Anos: TRUNC(MONTHS_BETWEEN/12, 1)", "Filtro: MONTHS_BETWEEN > 60", "Alias não vale no WHERE (Mód. 01)"]}]}, "syn": [["UPPER / LOWER / INITCAP", "UPPER(texto)  ·  LOWER(texto)  ·  INITCAP(texto)", "SELECT INITCAP(first_name) FROM hr.employees;"], ["LENGTH", "LENGTH(texto)", "SELECT LENGTH(email) FROM hr.employees;"], ["SUBSTR", "SUBSTR(texto, início [, tamanho])", "SUBSTR(email, 1, 5)"], ["INSTR", "INSTR(texto, busca [, início [, ocorrência]])", "INSTR('BANANA', 'A', 1, 2)"], ["REPLACE", "REPLACE(texto, busca [, novo])", "REPLACE('2026-10-15', '-')"], ["TRIM", "TRIM([LEADING | TRAILING | BOTH] ['c' FROM] texto)", "TRIM(LEADING '0' FROM '00120')"], ["CONCAT", "CONCAT(texto1, texto2)   -- só 2 argumentos", "CONCAT(first_name, last_name)"], ["ROUND / TRUNC (número)", "ROUND(número [, casas])  ·  TRUNC(número [, casas])", "ROUND(salary / 3, 2)"], ["MOD", "MOD(dividendo, divisor)", "MOD(employee_id, 2)"], ["SYSDATE", "SYSDATE   -- sem parênteses", "SELECT SYSDATE FROM dual;"], ["Aritmética de data", "data + dias  ·  data - data (= dias)", "SYSDATE - hire_date"], ["ADD_MONTHS", "ADD_MONTHS(data, meses)", "ADD_MONTHS(hire_date, 6)"], ["MONTHS_BETWEEN", "MONTHS_BETWEEN(data_maior, data_menor)", "MONTHS_BETWEEN(SYSDATE, hire_date)"], ["TRUNC (data)", "TRUNC(data [, 'formato'])", "TRUNC(SYSDATE, 'MM')"]], "lab": [["INITCAP também abaixa letras", "SELECT INITCAP('JOÃO DA SILVA'), INITCAP('mcdonald') FROM dual;", "Sai 'João Da Silva' e 'Mcdonald'. O 'da' ganhou maiúscula e o 'D' de McDonald virou minúsculo.", "INITCAP sobe a 1ª letra e desce todas as outras de cada palavra."], ["SUBSTR com posição 0 e negativa", "SELECT SUBSTR('ORACLE', 0, 2), SUBSTR('ORACLE', 1, 2), SUBSTR('ORACLE', -3) FROM dual;", "Posição 0 e posição 1 dão o mesmo resultado (OR). A negativa conta do fim (CLE).", "Posição 0 é tratada como 1. Negativa começa do final."], ["ROUND e TRUNC só diferem a partir de 0,5", "SELECT ROUND(10.49), TRUNC(10.49), ROUND(10.50), TRUNC(10.50) FROM dual;", "Com 10.49 os dois dão 10. Com 10.50 o ROUND sobe para 11 e o TRUNC fica em 10.", "Ter casas decimais não basta: a diferença aparece quando a parte descartada é 0,5 ou mais."], ["A data tem uma fração que não aparece", "SELECT SYSDATE - TRUNC(SYSDATE) FROM dual;\nSELECT (SYSDATE - TRUNC(SYSDATE)) * 24 AS horas FROM dual;", "O primeiro resultado é uma fração (ex.: 0,58). Multiplicado por 24, vira a hora atual.", "DATE - DATE dá dias com fração. A fração é a parte do dia que já passou."], ["ADD_MONTHS no fim do mês", "SELECT ADD_MONTHS(DATE '2024-01-31', 1), ADD_MONTHS(DATE '2024-04-30', 1) FROM dual;", "31/01 + 1 mês vira 29/02. 30/04 + 1 mês vira 31/05, e não 30/05.", "Se a data é o último dia do mês, o resultado também é o último dia."]]}, {"id": "M03", "title": "Manipulando tabelas", "ref": "Referência para os cenários: tabela VENDAS da aula e tabela FORNECEDORES da prática", "reftxt": "CREATE TABLE vendas (           CREATE TABLE fornecedores (\n  data_venda DATE,                 id_fornecedor NUMBER PRIMARY KEY,\n  id_produto NUMBER,               nome          VARCHAR2(100) NOT NULL,\n  quantidade NUMBER                ... cidade, estado, cep, telefone,\n);                                 min_pedido    NUMBER(10,2)\n                                 );", "cards": [{"id": "V01", "k": "v", "f": "Heap-organized table", "pt": "Tabela organizada em heap", "d": "Tipo padrão. As linhas ficam onde houver espaço livre, sem ordem definida.", "ex": "CREATE TABLE t (id NUMBER) ORGANIZATION HEAP;   -- = sem a cláusula", "rel": "IOT"}, {"id": "V02", "k": "v", "f": "Index-organized table (IOT)", "pt": "Tabela organizada por índice", "d": "As linhas ficam DENTRO de um índice B-tree, ordenadas pela chave primária. Exige PK.", "ex": "CREATE TABLE t (id NUMBER PRIMARY KEY, d VARCHAR2(30))\nORGANIZATION INDEX;", "rel": "Primary key"}, {"id": "V03", "k": "v", "f": "Tablespace / Default tablespace", "pt": "Tablespace / Tablespace padrão", "d": "Área lógica onde os segmentos são gravados. Sem a cláusula TABLESPACE, a tabela vai para a tablespace padrão do usuário.", "ex": "SELECT default_tablespace FROM dba_users WHERE username = 'DBAOCM';", "rel": "Data file"}, {"id": "V04", "k": "v", "f": "CTAS (Create Table As Select)", "pt": "Criar tabela a partir de consulta", "d": "Cria a tabela e já carrega as linhas da consulta. Copia nomes, tipos e NOT NULL; não copia PK, FK, índices nem triggers.", "ex": "CREATE TABLE my_table AS SELECT table_name, status FROM user_tables;", "rel": "Constraints"}, {"id": "V05", "k": "v", "f": "Global temporary table (GTT)", "pt": "Tabela temporária global", "d": "Definição visível para todas as sessões e permanente; dados privados de cada sessão, gravados na tablespace temporária.", "ex": "CREATE GLOBAL TEMPORARY TABLE gtt (id NUMBER) ON COMMIT PRESERVE ROWS;", "rel": "PTT"}, {"id": "V06", "k": "v", "f": "Private temporary table (PTT)", "pt": "Tabela temporária privada", "d": "Definição E dados visíveis só para a sessão que criou; fica apenas em memória. Nome precisa do prefixo ORA$PTT_. Desde o 18c.", "ex": "CREATE PRIVATE TEMPORARY TABLE ora$ptt_x (id NUMBER)\nON COMMIT DROP DEFINITION;", "rel": "GTT"}, {"id": "V07", "k": "v", "f": "Transaction-specific / Session-specific", "pt": "Específica da transação / da sessão", "d": "Até quando a temporária guarda os dados: até o COMMIT (transação) ou até o fim da sessão.", "ex": "ON COMMIT DELETE ROWS       -- GTT, transação\nON COMMIT PRESERVE ROWS     -- GTT, sessão", "rel": "ON COMMIT"}, {"id": "V08", "k": "v", "f": "Unused column", "pt": "Coluna não utilizada", "d": "Coluna marcada com SET UNUSED: some para os usuários na hora, mas o espaço só é liberado no DROP UNUSED COLUMNS.", "ex": "ALTER TABLE vendas SET UNUSED (quantidade);", "rel": "DROP COLUMN"}, {"id": "V09", "k": "v", "f": "Recycle bin", "pt": "Lixeira", "d": "Para onde vai a tabela após DROP sem PURGE. Permite FLASHBACK TABLE ... TO BEFORE DROP.", "ex": "SELECT object_name, original_name FROM user_recyclebin;", "rel": "PURGE"}, {"id": "V10", "k": "v", "f": "Purge", "pt": "Expurgar", "d": "Apagar definitivamente, sem passar pela lixeira.", "ex": "DROP TABLE vendas PURGE;", "rel": "Recycle bin"}, {"id": "V11", "k": "v", "f": "Truncate", "pt": "Truncar", "d": "Remove TODAS as linhas de uma vez e libera o espaço. É DDL: não tem ROLLBACK.", "ex": "TRUNCATE TABLE vendas;", "rel": "DELETE"}, {"id": "V12", "k": "v", "f": "DDL / DML", "pt": "Linguagem de definição / de manipulação", "d": "DDL muda estrutura (CREATE, ALTER, DROP, TRUNCATE) e faz COMMIT implícito. DML muda dados (INSERT, UPDATE, DELETE) e aceita ROLLBACK.", "ex": "DELETE FROM vendas;     -- DML, volta com ROLLBACK\nTRUNCATE TABLE vendas;  -- DDL, não volta", "rel": "COMMIT implícito"}, {"id": "V13", "k": "v", "f": "Cascade constraints", "pt": "Remover restrições em cascata", "d": "No DROP TABLE, remove as FKs das tabelas filhas que apontam para a tabela dropada.", "ex": "DROP TABLE clientes CASCADE CONSTRAINTS;", "rel": "Foreign key"}, {"id": "V14", "k": "v", "f": "External / Partitioned / Clustered table", "pt": "Tabela externa / particionada / em cluster", "d": "Externa: dados num arquivo fora do banco. Particionada: dividida em partes por faixa, lista ou hash. Cluster: várias tabelas que compartilham blocos por uma chave comum.", "ex": "-- tipos citados no material; detalhados em módulos próprios", "rel": "Heap"}, {"id": "C01", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "O que é uma tabela e como se cria?", "a": "Unidade básica de armazenamento do Oracle: dados em linhas e colunas. CREATE TABLE com nome e, para cada coluna, nome e tipo de dado.", "why": "", "ex": "CREATE TABLE my_table (\n  id        NUMBER PRIMARY KEY,\n  nome      VARCHAR2(50),\n  sobrenome VARCHAR2(50),\n  idade     NUMBER\n);", "trap": "", "tag": ""}, {"id": "C02", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "O que são constraints (restrições de integridade)?", "a": "Regras aplicadas às colunas. Exemplo do material: NOT NULL obriga a coluna a ter valor em toda linha. Outras: PRIMARY KEY, UNIQUE, FOREIGN KEY, CHECK.", "why": "", "ex": "nome VARCHAR2(100) NOT NULL", "trap": "", "tag": ""}, {"id": "C03", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Tabela permanente vs temporária?", "a": "Permanente: dados ficam nos data files da tablespace e qualquer usuário com privilégio acessa. Temporária: dados duram só a sessão ou a transação e só a própria sessão vê.", "why": "", "ex": "CREATE TABLE vendas (...);                        -- permanente\nCREATE GLOBAL TEMPORARY TABLE tmp (...) ...;      -- temporária", "trap": "", "tag": ""}, {"id": "C04", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Em qual tablespace a tabela é criada?", "a": "Na indicada pela cláusula TABLESPACE. Sem a cláusula, na tablespace padrão (DEFAULT_TABLESPACE) do usuário dono.", "why": "", "ex": "CREATE TABLE my_table (...) TABLESPACE tbs1;\nSELECT tablespace_name FROM dba_tables WHERE table_name = 'MY_TABLE';", "trap": "O nome da tabela no dicionário é gravado em MAIÚSCULO: WHERE table_name = 'my_table' não acha nada.", "tag": ""}, {"id": "C05", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Quais os tipos de tabela permanente citados?", "a": "Heap Organized (padrão), Index Organized (IOT), Partitioned, External, Clustered e Hybrid Partitioned.", "why": "", "ex": "SELECT table_name, iot_type, partitioned, temporary FROM user_tables;", "trap": "", "tag": ""}, {"id": "C06", "k": "c", "sec": "Heap e CTAS", "f": "Como o Oracle armazena uma tabela heap?", "a": "Sem ordem específica: cada linha vai para onde houver espaço livre. É o padrão; ORGANIZATION HEAP é opcional.", "why": "", "ex": "CREATE TABLE dbaocm_heap (id NUMBER(5,2)) ORGANIZATION HEAP;\nCREATE TABLE dbaocm_heap (id NUMBER(5,2));   -- mesma coisa", "trap": "Por isso, sem ORDER BY a ordem do resultado não é garantida (Módulo 01).", "tag": ""}, {"id": "C07", "k": "c", "sec": "Heap e CTAS", "f": "O que o CTAS copia e o que NÃO copia?", "a": "Copia: nomes de coluna, tipos, dados e as constraints NOT NULL definidas explicitamente. Não copia: PRIMARY KEY, UNIQUE, FOREIGN KEY, CHECK, índices, triggers e grants.", "why": "", "ex": "CREATE TABLE my_table AS SELECT table_name, status FROM user_tables;\n-- constraints que faltarem: ALTER TABLE ... ADD CONSTRAINT", "trap": "Clonar tabela com CTAS e esquecer de recriar PK e índices é causa clássica de lentidão depois de migração.", "tag": "complemento: índices, triggers e grants"}, {"id": "C08", "k": "c", "sec": "Heap e CTAS", "f": "Como copiar só a estrutura, sem dados?", "a": "CTAS com uma condição sempre falsa.", "why": "", "ex": "CREATE TABLE vendas_bkp AS SELECT * FROM vendas WHERE 1 = 0;", "trap": "", "tag": "complemento"}, {"id": "C09", "k": "c", "sec": "IOT (Index Organized Table)", "f": "Como funciona uma IOT?", "a": "Os dados ficam armazenados dentro de um índice B-tree, ordenados pela chave primária. Não existe segmento de tabela separado.", "why": "", "ex": "CREATE TABLE dbaocm_iot (\n  id        NUMBER PRIMARY KEY,\n  descricao VARCHAR2(30)\n) ORGANIZATION INDEX;", "trap": "B-tree é árvore BALANCEADA (balanced tree), não árvore binária. O slide traduz como \"árvore binária\".", "tag": "correção do material: B-tree ≠ árvore binária"}, {"id": "C10", "k": "c", "sec": "IOT (Index Organized Table)", "f": "O que é obrigatório para criar uma IOT?", "a": "Cláusula ORGANIZATION INDEX e uma PRIMARY KEY.", "why": "", "ex": "CREATE TABLE dbaocm_iot (id NUMBER, descricao VARCHAR2(30)) ORGANIZATION INDEX;\n-- ORA-25175: no PRIMARY KEY constraint found", "trap": "O próprio script da aula mostra esse erro de propósito.", "tag": ""}, {"id": "C11", "k": "c", "sec": "IOT (Index Organized Table)", "f": "Para que tipo de aplicação a IOT é indicada?", "a": "Segundo o Administrator's Guide: aplicações OLTP que precisam de acesso rápido pela chave primária e alta disponibilidade. Também aparece em recuperação de informação, spatial e OLAP.", "why": "", "ex": "-- caso típico: tabela de lookup consultada sempre pela PK\nSELECT descricao FROM dbaocm_iot WHERE id = :id;", "trap": "", "tag": "correção do material: a frase \"acesso rápido à PK e alta disponibilidade\" na doc é sobre OLTP, não OLAP"}, {"id": "C12", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "Para que servem tabelas temporárias?", "a": "Guardar resultados intermediários que precisam persistir durante a sessão ou a transação, por exemplo DMLs que dependem do resultado uns dos outros.", "why": "", "ex": "-- carga em etapas: tmp recebe, processa, grava na definitiva", "trap": "", "tag": ""}, {"id": "C13", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "GTT: o que é global e o que é privado?", "a": "A DEFINIÇÃO (metadados) é global: todas as sessões veem a tabela. O CONTEÚDO é privado: cada sessão só enxerga as linhas que ela mesma inseriu.", "why": "", "ex": "-- sessão A insere 3 linhas e faz COMMIT\n-- sessão B: SELECT COUNT(*) FROM admin_work_area_session;  -- 0", "trap": "", "tag": ""}, {"id": "C14", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "ON COMMIT da GTT: quais as opções?", "a": "ON COMMIT DELETE ROWS → específica da transação: COMMIT apaga as linhas. É o padrão.<br>ON COMMIT PRESERVE ROWS → específica da sessão: linhas ficam até o fim da sessão.", "why": "", "ex": "CREATE GLOBAL TEMPORARY TABLE admin_work_area_trans (...) ON COMMIT DELETE ROWS;\nCREATE GLOBAL TEMPORARY TABLE admin_work_area_session (...) ON COMMIT PRESERVE ROWS;", "trap": "Sem a cláusula ON COMMIT, a GTT é DELETE ROWS.", "tag": "complemento: padrão DELETE ROWS"}, {"id": "C15", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "PTT: regras de criação?", "a": "Definição e dados visíveis só para a sessão criadora. Nome precisa começar com o valor de PRIVATE_TEMP_TABLE_PREFIX (padrão ORA$PTT_). Não pode ser criada pelo SYS. Fica só em memória. Disponível desde o 18c.", "why": "", "ex": "SHOW PARAMETER private_temp_table_prefix\nCREATE PRIVATE TEMPORARY TABLE ora$ptt_sales (...) ON COMMIT DROP DEFINITION;", "trap": "Sem o prefixo, o Oracle não aceita o nome. Como SYS, também falha.", "tag": ""}, {"id": "C16", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "ON COMMIT da PTT: quais as opções?", "a": "ON COMMIT DROP DEFINITION → específica da transação: o COMMIT apaga dados E a tabela. É o padrão.<br>ON COMMIT PRESERVE DEFINITION → específica da sessão: tabela e dados somem no fim da sessão.", "why": "", "ex": "CREATE PRIVATE TEMPORARY TABLE ora$ptt_sales_ptt_session (\n  id_tmp NUMBER, descricao VARCHAR2(20))\nON COMMIT PRESERVE DEFINITION;", "trap": "O slide de \"PTT específica de sessão\" mostra o código de uma GTT DELETE ROWS (erro de cópia). O código certo está no .sql da aula.", "tag": "correção do material: exemplo trocado no slide"}, {"id": "C17", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "Tabela-resumo GTT x PTT?", "a": "<b>Nome:<\/b> GTT segue regra normal; PTT exige prefixo ORA$PTT_.<br><b>Definição visível:<\/b> GTT todas as sessões; PTT só a criadora.<br><b>Armazenamento:<\/b> GTT em disco (tablespace temporária); PTT só memória.<br><b>Transação:<\/b> GTT DELETE ROWS; PTT DROP DEFINITION.<br><b>Sessão:<\/b> GTT PRESERVE ROWS; PTT PRESERVE DEFINITION.", "why": "", "ex": "-- memorize os pares:\n-- GTT → ROWS        (apaga linhas)\n-- PTT → DEFINITION  (apaga a tabela)", "trap": "Questão típica troca ROWS por DEFINITION. GTT nunca usa DEFINITION; PTT nunca usa ROWS.", "tag": ""}, {"id": "C18", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como adicionar uma coluna?", "a": "ALTER TABLE ... ADD (coluna tipo). Vários de uma vez separados por vírgula dentro dos parênteses.", "why": "", "ex": "ALTER TABLE vendas ADD (descricao VARCHAR2(20));\nALTER TABLE vendas ADD (obs VARCHAR2(50), ativo CHAR(1));", "trap": "A prática resolvida usa ADD COLUMN (...). Essa forma não é a sintaxe documentada no 19c e falha. Use ADD (...).", "tag": "correção do material: Pratica_Resolvida.sql"}, {"id": "C19", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como renomear uma coluna?", "a": "ALTER TABLE ... RENAME COLUMN antigo TO novo.", "why": "", "ex": "ALTER TABLE vendas RENAME COLUMN descricao TO descr;\nALTER TABLE fornecedores RENAME COLUMN registro TO cnpj;", "trap": "Renomear tabela é outro comando: RENAME vendas TO vendas_old; ou ALTER TABLE vendas RENAME TO vendas_old;", "tag": ""}, {"id": "C20", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Quais as regras do MODIFY?", "a": "Trocar o TIPO de dado: só com a coluna vazia (todos NULL).<br>Aumentar o tamanho: sempre pode.<br>Diminuir o tamanho: só se todos os valores couberem.<br>Colocar NOT NULL: só se não houver NULL na coluna.", "why": "", "ex": "ALTER TABLE vendas MODIFY (descr VARCHAR2(200) NOT NULL);   -- ok\nALTER TABLE vendas MODIFY (descr NUMBER NOT NULL);\n-- com 'teste' gravado: ORA-01439", "trap": "O slide diz \"apenas se a coluna estiver vazia, ou seja possível uma conversão\". A regra correta para tipo é: coluna vazia.", "tag": "correção do material: frase do slide truncada"}, {"id": "C21", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como remover colunas?", "a": "DROP COLUMN para uma; DROP (c1, c2) para várias. Reescreve os blocos da tabela, pode demorar e pesar no banco.", "why": "", "ex": "ALTER TABLE vendas DROP COLUMN descr;\nALTER TABLE vendas DROP (data_venda, quantidade);", "trap": "Não dá para remover todas as colunas: ORA-12983.", "tag": ""}, {"id": "C22", "k": "c", "sec": "SET UNUSED", "f": "Por que usar SET UNUSED em vez de DROP COLUMN?", "a": "SET UNUSED só altera o dicionário: é instantâneo e a coluna some para os usuários na hora. O DROP físico (DROP UNUSED COLUMNS) fica para uma janela de baixo uso.", "why": "", "ex": "ALTER TABLE vendas SET UNUSED (quantidade);      -- horário comercial\nALTER TABLE vendas DROP UNUSED COLUMNS;          -- janela noturna", "trap": "Visão de DBA: em tabela grande de produção, DROP COLUMN direto pode travar a aplicação por muito tempo.", "tag": ""}, {"id": "C23", "k": "c", "sec": "SET UNUSED", "f": "O que acontece com uma coluna UNUSED?", "a": "Ainda ocupa espaço até o DROP. Não pode ser restaurada via SQL: a única ação possível é dropar. Índices, constraints e estatísticas dela normalmente são removidos (exceção: índices de colunas LOB).", "why": "", "ex": "SELECT * FROM user_unused_col_tabs;   -- tabelas com colunas UNUSED e quantas", "trap": "SET UNUSED é sem volta. Não existe \"SET USED\".", "tag": ""}, {"id": "C24", "k": "c", "sec": "SET UNUSED", "f": "Como dropar as colunas marcadas como UNUSED?", "a": "ALTER TABLE ... DROP UNUSED COLUMNS.", "why": "", "ex": "ALTER TABLE vendas DROP UNUSED COLUMNS;", "trap": "O slide diz \"usamos o comando ALTER TABLE ... SET UNUSED\" para dropar. O comando certo é DROP UNUSED COLUMNS (o exemplo do slide está certo).", "tag": "correção do material: texto do slide"}, {"id": "C25", "k": "c", "sec": "Eliminar tabela e dados", "f": "DROP TABLE: o que acontece com o espaço?", "a": "Não é liberado na hora: a tabela vai para a RECYCLEBIN e pode voltar com FLASHBACK TABLE ... TO BEFORE DROP. Com PURGE, vai direto, sem lixeira.", "why": "", "ex": "DROP TABLE vendas;\nFLASHBACK TABLE vendas TO BEFORE DROP;   -- volta\nDROP TABLE vendas PURGE;                 -- sem volta", "trap": "A tabela na lixeira continua ocupando espaço na tablespace.", "tag": "complemento: comando FLASHBACK"}, {"id": "C26", "k": "c", "sec": "Eliminar tabela e dados", "f": "Para que serve CASCADE CONSTRAINTS no DROP?", "a": "Se a tabela tem PK ou UNIQUE referenciada por FK de outras tabelas, o DROP falha. CASCADE CONSTRAINTS remove essas FKs das filhas e permite o drop.", "why": "", "ex": "DROP TABLE clientes;                       -- ORA-02449\nDROP TABLE clientes CASCADE CONSTRAINTS;   -- ok, FKs das filhas somem", "trap": "Remove só as constraints das filhas, não os dados delas.", "tag": ""}, {"id": "C27", "k": "c", "sec": "Eliminar tabela e dados", "f": "DELETE x TRUNCATE x DROP + CREATE?", "a": "<b>DELETE sem WHERE:<\/b> DML, linha a linha, aceita ROLLBACK, mais lento.<br><b>TRUNCATE:<\/b> DDL, rápido, libera espaço, SEM rollback.<br><b>DROP + CREATE:<\/b> perde índices, triggers, constraints e grants; objetos dependentes ficam inválidos.", "why": "", "ex": "DELETE FROM vendas;    ROLLBACK;   -- dados voltam\nTRUNCATE TABLE vendas; ROLLBACK;   -- dados NÃO voltam", "trap": "", "tag": ""}, {"id": "C28", "k": "c", "sec": "Eliminar tabela e dados", "f": "TRUNCATE errado: como recuperar?", "a": "ROLLBACK e FLASHBACK TABLE não funcionam. Opções: restore/recover (RMAN), RMAN RECOVER TABLE (12c+), Flashback Database ou restore point, Data Pump de antes.", "why": "", "ex": "-- RMAN 12c+:\nRECOVER TABLE dbaocm.vendas UNTIL TIME \"SYSDATE-1/24\"\n  AUXILIARY DESTINATION '/u01/aux';", "trap": "O slide fala em restore do banco inteiro. Desde o 12c há caminhos menos drásticos.", "tag": "complemento: visão de DBA"}, {"id": "C29", "k": "c", "sec": "Eliminar tabela e dados", "f": "O que é o COMMIT implícito do DDL?", "a": "Todo comando DDL (CREATE, ALTER, DROP, TRUNCATE) faz COMMIT antes e depois. Qualquer DML pendente na sessão é confirmado.", "why": "", "ex": "INSERT INTO log_carga VALUES (1, 'inicio');\nTRUNCATE TABLE vendas;\nROLLBACK;   -- o INSERT em log_carga JÁ foi confirmado", "trap": "", "tag": "complemento"}, {"id": "S01", "k": "s", "f": "CREATE TABLE dbaocm_iot (id NUMBER, descricao VARCHAR2(30))\nORGANIZATION INDEX;", "res": "ORA-25175: no PRIMARY KEY constraint found", "d": "IOT exige PK."}, {"id": "S02", "k": "s", "f": "CREATE TABLE t1 (id NUMBER);\n-- sem TABLESPACE. Onde fica?", "res": "Tablespace padrão do usuário", "d": "DEFAULT_TABLESPACE em DBA_USERS."}, {"id": "S03", "k": "s", "f": "Tabela origem: id PK, nome NOT NULL.\nCREATE TABLE copia AS SELECT * FROM origem;\nO que vem junto?", "res": "Dados + NOT NULL de nome", "d": "PK (e o índice dela) não vem."}, {"id": "S04", "k": "s", "f": "GTT ON COMMIT PRESERVE ROWS:\nINSERT 3 linhas; COMMIT;\nSELECT COUNT(*) na MESMA sessão? E em OUTRA sessão?", "res": "3 · 0", "d": "Linhas sobrevivem ao COMMIT, mas são da sessão."}, {"id": "S05", "k": "s", "f": "GTT ON COMMIT DELETE ROWS:\nINSERT 3 linhas; SELECT COUNT(*); COMMIT; SELECT COUNT(*);", "res": "3 · 0", "d": "COMMIT apaga as linhas."}, {"id": "S06", "k": "s", "f": "PTT ON COMMIT DROP DEFINITION:\nINSERT 3 linhas; COMMIT; SELECT * FROM ora$ptt_...;", "res": "ORA-00942: table or view does not exist", "d": "COMMIT apagou a tabela."}, {"id": "S07", "k": "s", "f": "PTT ON COMMIT PRESERVE DEFINITION:\nINSERT 3; COMMIT; SELECT COUNT(*);\nDepois desconecta e reconecta.", "res": "3 · depois a tabela não existe", "d": "Some no fim da sessão."}, {"id": "S08", "k": "s", "f": "CREATE PRIVATE TEMPORARY TABLE tmp_vendas (id NUMBER)\nON COMMIT DROP DEFINITION;", "res": "Erro: nome inválido", "d": "Falta o prefixo ORA$PTT_."}, {"id": "S09", "k": "s", "f": "Conectado como SYS:\nCREATE PRIVATE TEMPORARY TABLE ora$ptt_x (id NUMBER);", "res": "Erro", "d": "PTT não pode ser criada pelo SYS."}, {"id": "S10", "k": "s", "f": "CREATE GLOBAL TEMPORARY TABLE g (id NUMBER);\n-- sem ON COMMIT. INSERT; COMMIT; SELECT COUNT(*);", "res": "0", "d": "Padrão da GTT é DELETE ROWS."}, {"id": "S11", "k": "s", "f": "ALTER TABLE fornecedores ADD COLUMN (registro VARCHAR2(20));\n-- Oracle 19c", "res": "Erro de sintaxe", "d": "Forma documentada: ADD (registro VARCHAR2(20))."}, {"id": "S12", "k": "s", "f": "vendas.descr VARCHAR2(200) com 'teste' gravado.\nALTER TABLE vendas MODIFY (descr NUMBER NOT NULL);", "res": "ORA-01439", "d": "Trocar tipo exige coluna vazia."}, {"id": "S13", "k": "s", "f": "vendas.descr contém 'testando' (8 caracteres).\nALTER TABLE vendas MODIFY (descr VARCHAR2(5));", "res": "ORA-01441", "d": "Não dá para diminuir: um valor não cabe."}, {"id": "S14", "k": "s", "f": "fornecedores com 2 linhas e cnpj NULL.\nALTER TABLE fornecedores MODIFY (cnpj VARCHAR2(14) NOT NULL);", "res": "ORA-02296: null values found", "d": "Na prática resolvida funciona porque a tabela está vazia."}, {"id": "S15", "k": "s", "f": "ALTER TABLE vendas MODIFY (descr VARCHAR2(500));\n-- descr era VARCHAR2(200) com dados", "res": "Sucesso", "d": "Aumentar tamanho sempre pode."}, {"id": "S16", "k": "s", "f": "ALTER TABLE vendas SET UNUSED (quantidade);\nSELECT quantidade FROM vendas;", "res": "ORA-00904: invalid identifier", "d": "A coluna sumiu para os usuários."}, {"id": "S17", "k": "s", "f": "Depois do SET UNUSED, como trazer a coluna de volta?", "res": "Não tem como (via SQL)", "d": "Só resta DROP UNUSED COLUMNS. Para recuperar: backup."}, {"id": "S18", "k": "s", "f": "Script da aula, em ordem:\nALTER TABLE vendas DROP (data_venda, quantidade);\nALTER TABLE vendas SET UNUSED (quantidade);", "res": "ORA-00904 no 2º comando", "d": "quantidade já foi dropada no comando anterior."}, {"id": "S19", "k": "s", "f": "Tabela com uma única coluna.\nALTER TABLE t DROP COLUMN c1;", "res": "ORA-12983", "d": "Não dá para dropar todas as colunas."}, {"id": "S20", "k": "s", "f": "Rodar o Manipulando_Tabelas.sql do início:\nsegundo CREATE TABLE my_table sem DROP antes.", "res": "ORA-00955: name is already used", "d": "O script supõe que você drope entre os blocos."}, {"id": "S21", "k": "s", "f": "DROP TABLE vendas;\nFLASHBACK TABLE vendas TO BEFORE DROP;", "res": "Tabela volta", "d": "Estava na RECYCLEBIN."}, {"id": "S22", "k": "s", "f": "DROP TABLE vendas PURGE;\nFLASHBACK TABLE vendas TO BEFORE DROP;", "res": "ORA-38305: object not in RECYCLE BIN", "d": "PURGE pula a lixeira."}, {"id": "S23", "k": "s", "f": "DROP TABLE clientes;\n-- pedidos.id_cliente é FK para clientes", "res": "ORA-02449", "d": "PK referenciada por FK. Use CASCADE CONSTRAINTS."}, {"id": "S24", "k": "s", "f": "DELETE FROM vendas; ROLLBACK; SELECT COUNT(*) FROM vendas;", "res": "Contagem original", "d": "DELETE é DML."}, {"id": "S25", "k": "s", "f": "TRUNCATE TABLE vendas; ROLLBACK; SELECT COUNT(*) FROM vendas;", "res": "0", "d": "TRUNCATE é DDL, sem rollback."}, {"id": "S26", "k": "s", "f": "INSERT INTO log_carga VALUES (1,'x');\nCREATE TABLE t9 (id NUMBER);\nROLLBACK;\nO INSERT ficou?", "res": "Ficou", "d": "DDL fez COMMIT implícito."}, {"id": "E01", "k": "e", "f": "ALTER TABLE fornecedores ADD COLUMN (registro VARCHAR2(20));", "res": "COLUMN sobrando no ADD", "fix": "ALTER TABLE fornecedores ADD (registro VARCHAR2(20));", "d": "No Oracle o ADD não leva a palavra COLUMN."}, {"id": "E02", "k": "e", "f": "ALTER TABLE vendas RENAME descr TO descricao;", "res": "Faltou COLUMN no RENAME", "fix": "ALTER TABLE vendas RENAME COLUMN descr TO descricao;", "d": "No RENAME a palavra COLUMN é obrigatória (o contrário do ADD)."}, {"id": "E03", "k": "e", "f": "CREATE TABLE iot (id NUMBER, d VARCHAR2(30))\nORGANIZATION INDEX;", "res": "IOT sem chave primária (ORA-25175)", "fix": "CREATE TABLE iot (id NUMBER PRIMARY KEY, d VARCHAR2(30))\nORGANIZATION INDEX;", "d": "IOT exige PRIMARY KEY."}, {"id": "E04", "k": "e", "f": "CREATE GLOBAL TEMPORARY TABLE g (id NUMBER)\nON COMMIT DROP DEFINITION;", "res": "GTT com opção de PTT", "fix": "CREATE GLOBAL TEMPORARY TABLE g (id NUMBER)\nON COMMIT DELETE ROWS;", "d": "GTT usa ROWS. DEFINITION é só da PTT."}, {"id": "E05", "k": "e", "f": "CREATE PRIVATE TEMPORARY TABLE tmp_x (id NUMBER)\nON COMMIT DROP DEFINITION;", "res": "PTT sem o prefixo", "fix": "CREATE PRIVATE TEMPORARY TABLE ora$ptt_x (id NUMBER)\nON COMMIT DROP DEFINITION;", "d": "O nome precisa começar com ORA$PTT_."}, {"id": "E06", "k": "e", "f": "ALTER TABLE vendas DROP COLUMN (data_venda, quantidade);", "res": "DROP COLUMN com várias colunas", "fix": "ALTER TABLE vendas DROP (data_venda, quantidade);", "d": "DROP COLUMN é para uma. Para várias: DROP (c1, c2)."}, {"id": "E07", "k": "e", "f": "TRUNCATE vendas;", "res": "Faltou TABLE (ORA-03290)", "fix": "TRUNCATE TABLE vendas;", "d": "O comando é TRUNCATE TABLE."}, {"id": "E08", "k": "e", "f": "DROP TABLE clientes CASCADE;", "res": "Faltou CONSTRAINTS", "fix": "DROP TABLE clientes CASCADE CONSTRAINTS;", "d": "A cláusula completa é CASCADE CONSTRAINTS."}], "mm": {"ct": "Manipulando Tabelas", "cs": "CREATE · ALTER · DROP", "branches": [{"t": "Conceito e armazenamento", "cards": "C01–C05", "col": "#002b5c", "leaves": ["Unidade básica: linhas e colunas", "Constraints: NOT NULL, PK, FK...", "Permanente x temporária", "TABLESPACE ou a padrão do usuário", "Nome no dicionário em MAIÚSCULO", "Tipos: heap, IOT, partitioned, external, clustered, hybrid"]}, {"t": "Heap e CTAS", "cards": "C06–C08", "col": "#2f6db5", "leaves": ["Heap = padrão, sem ordem", "ORGANIZATION HEAP é opcional", "CTAS copia dados + NOT NULL", "CTAS NÃO copia PK, FK, índices", "Só estrutura: WHERE 1 = 0"]}, {"t": "IOT", "cards": "C09–C11", "col": "#7b4bb0", "leaves": ["Dados dentro de um índice B-tree", "Ordenada pela chave primária", "ORGANIZATION INDEX + PK obrigatória", "Sem PK → ORA-25175", "B-tree = balanceada, não binária", "Doc: ideal para OLTP (acesso por PK)"]}, {"t": "Temporárias GTT x PTT", "cards": "C12–C17", "col": "#c0392b", "leaves": ["GTT: definição global, dados da sessão", "GTT: DELETE ROWS (padrão) · PRESERVE ROWS", "GTT em disco (tablespace temporária)", "PTT: tudo privado, só em memória", "PTT: prefixo ORA$PTT_ · não com SYS", "PTT: DROP DEFINITION (padrão) · PRESERVE DEFINITION", "GTT → ROWS · PTT → DEFINITION"]}, {"t": "ALTER TABLE", "cards": "C18–C21", "col": "#1f7a55", "leaves": ["ADD (col tipo) · não ADD COLUMN", "RENAME COLUMN a TO b", "MODIFY tipo: só coluna vazia (ORA-01439)", "Aumentar tamanho: sempre", "Diminuir: só se couber (ORA-01441)", "NOT NULL: só sem NULLs (ORA-02296)", "DROP COLUMN / DROP (c1, c2)", "Todas as colunas: ORA-12983"]}, {"t": "SET UNUSED", "cards": "C22–C24", "col": "#b06d00", "leaves": ["Só dicionário: instantâneo", "Some para o usuário na hora", "Espaço liberado só no DROP", "Sem volta via SQL", "USER_UNUSED_COL_TABS", "DROP UNUSED COLUMNS na janela"]}, {"t": "Eliminar tabela e dados", "cards": "C25–C29", "col": "#5d6d7e", "leaves": ["DROP → RECYCLEBIN (FLASHBACK volta)", "DROP ... PURGE → sem lixeira", "CASCADE CONSTRAINTS remove FKs filhas", "DELETE: DML, aceita ROLLBACK", "TRUNCATE: DDL, rápido, sem ROLLBACK", "DROP + CREATE perde índices e grants", "DDL faz COMMIT implícito", "TRUNCATE errado: RMAN RECOVER TABLE"]}]}, "syn": [["CREATE TABLE", "CREATE TABLE tabela (col tipo [NOT NULL] [PRIMARY KEY], ...) [TABLESPACE tbs];", "CREATE TABLE vendas (id NUMBER PRIMARY KEY, descr VARCHAR2(50));"], ["CTAS", "CREATE TABLE nova AS SELECT ... ;", "CREATE TABLE vendas_bkp AS SELECT * FROM vendas WHERE 1 = 0;"], ["IOT", "CREATE TABLE t (col tipo PRIMARY KEY, ...) ORGANIZATION INDEX;", "CREATE TABLE iot (id NUMBER PRIMARY KEY, d VARCHAR2(30)) ORGANIZATION INDEX;"], ["GTT", "CREATE GLOBAL TEMPORARY TABLE t (...) ON COMMIT {DELETE | PRESERVE} ROWS;", "CREATE GLOBAL TEMPORARY TABLE tmp (id NUMBER) ON COMMIT PRESERVE ROWS;"], ["PTT", "CREATE PRIVATE TEMPORARY TABLE ora$ptt_nome (...) ON COMMIT {DROP | PRESERVE} DEFINITION;", "CREATE PRIVATE TEMPORARY TABLE ora$ptt_x (id NUMBER) ON COMMIT DROP DEFINITION;"], ["ADD", "ALTER TABLE t ADD (col tipo [, col tipo]);", "ALTER TABLE vendas ADD (obs VARCHAR2(50));"], ["RENAME COLUMN", "ALTER TABLE t RENAME COLUMN antiga TO nova;", "ALTER TABLE vendas RENAME COLUMN obs TO observacao;"], ["MODIFY", "ALTER TABLE t MODIFY (col novo_tipo [NOT NULL]);", "ALTER TABLE vendas MODIFY (descr VARCHAR2(200) NOT NULL);"], ["DROP COLUMN", "ALTER TABLE t DROP COLUMN col;  ·  ALTER TABLE t DROP (c1, c2);", "ALTER TABLE vendas DROP (obs, descr);"], ["SET UNUSED", "ALTER TABLE t SET UNUSED (col);  ·  ALTER TABLE t DROP UNUSED COLUMNS;", "ALTER TABLE vendas SET UNUSED (quantidade);"], ["DROP TABLE", "DROP TABLE t [CASCADE CONSTRAINTS] [PURGE];", "DROP TABLE clientes CASCADE CONSTRAINTS;"], ["FLASHBACK TABLE", "FLASHBACK TABLE t TO BEFORE DROP;", "FLASHBACK TABLE vendas TO BEFORE DROP;"], ["TRUNCATE", "TRUNCATE TABLE t;", "TRUNCATE TABLE vendas;"]], "lab": [["CTAS não leva a chave primária", "CREATE TABLE lab_emp AS SELECT * FROM hr.employees;\nSELECT constraint_type, COUNT(*) FROM user_constraints\nWHERE table_name = 'LAB_EMP' GROUP BY constraint_type;\nDROP TABLE lab_emp PURGE;", "Só aparecem constraints do tipo C (os NOT NULL). Nenhuma P (primary key).", "Depois de um CTAS, recrie PK, índices e grants."], ["GTT apaga as linhas no COMMIT", "CREATE GLOBAL TEMPORARY TABLE lab_gtt (id NUMBER) ON COMMIT DELETE ROWS;\nINSERT INTO lab_gtt VALUES (1);\nSELECT COUNT(*) FROM lab_gtt;\nCOMMIT;\nSELECT COUNT(*) FROM lab_gtt;\nDROP TABLE lab_gtt;", "Antes do COMMIT a contagem é 1. Depois do COMMIT é 0, e a tabela continua existindo.", "DELETE ROWS apaga os dados, não a tabela. Na PTT com DROP DEFINITION, some a tabela."], ["DDL confirma o que estava pendente", "CREATE TABLE lab_t (id NUMBER);\nINSERT INTO lab_t VALUES (1);\nCREATE TABLE lab_x (id NUMBER);\nROLLBACK;\nSELECT COUNT(*) FROM lab_t;\nDROP TABLE lab_t PURGE; DROP TABLE lab_x PURGE;", "Mesmo com ROLLBACK, a contagem é 1. O INSERT ficou gravado.", "Todo DDL faz COMMIT implícito do que estava pendente."], ["A tabela dropada vai para a lixeira", "CREATE TABLE lab_lixo (id NUMBER);\nDROP TABLE lab_lixo;\nSELECT object_name, original_name FROM user_recyclebin;\nFLASHBACK TABLE lab_lixo TO BEFORE DROP;\nDROP TABLE lab_lixo PURGE;", "Depois do DROP a tabela aparece na lixeira com nome BIN$... e o FLASHBACK traz de volta.", "DROP sem PURGE não libera espaço na hora e permite desfazer."], ["Coluna UNUSED some na hora", "CREATE TABLE lab_u (a NUMBER, b NUMBER);\nALTER TABLE lab_u SET UNUSED (b);\nDESC lab_u\nSELECT * FROM user_unused_col_tabs;\nDROP TABLE lab_u PURGE;", "O DESC já não mostra a coluna b, mas a USER_UNUSED_COL_TABS indica 1 coluna não usada.", "SET UNUSED é instantâneo; o espaço só volta no DROP UNUSED COLUMNS."]]}, {"id": "M04", "title": "DML: INSERT, UPDATE e DELETE", "ref": "Referência para os cenários: tabelas da aula", "reftxt": "CREATE TABLE funcionarios (            CREATE TABLE bonus (\n  id              NUMBER PRIMARY KEY,      employee_id NUMBER,\n  nome            VARCHAR2(100),           bonus       NUMBER DEFAULT 100\n  cargo           VARCHAR2(50) NOT NULL,   );\n  salario         NUMBER(10,2),\n  departamento_id NUMBER                 -- t1 (c1 NUMBER, c2 VARCHAR2(1))\n);                                       -- t2 (c1 NUMBER)\nNa prática (Pratica.sql) a mesma tabela é criada SEM o NOT NULL em cargo, com 20 funcionários.", "cards": [{"id": "V01", "k": "v", "f": "DML (Data Manipulation Language)", "pt": "Linguagem de manipulação de dados", "d": "Comandos que leem e alteram DADOS: SELECT, INSERT, UPDATE, DELETE, MERGE. Aceitam ROLLBACK.", "ex": "UPDATE funcionarios SET salario = salario * 1.15;", "rel": "DDL"}, {"id": "V02", "k": "v", "f": "DDL (Data Definition Language)", "pt": "Linguagem de definição de dados", "d": "Comandos que mudam ESTRUTURA e privilégios: CREATE, ALTER, DROP, TRUNCATE, GRANT, REVOKE. Fazem COMMIT implícito.", "ex": "CREATE TABLE bonus (employee_id NUMBER, bonus NUMBER DEFAULT 100);", "rel": "DML"}, {"id": "V03", "k": "v", "f": "Transaction control", "pt": "Controle de transação", "d": "Comandos que confirmam ou desfazem o trabalho do DML: COMMIT, ROLLBACK, SAVEPOINT, SET TRANSACTION.", "ex": "SAVEPOINT antes_delete;\nROLLBACK TO antes_delete;", "rel": "Transação"}, {"id": "V04", "k": "v", "f": "Session control / System control", "pt": "Controle de sessão / de sistema", "d": "ALTER SESSION muda a sessão atual. ALTER SYSTEM muda a instância.", "ex": "ALTER SESSION SET nls_date_format = 'DD/MM/YYYY';\nALTER SYSTEM SWITCH LOGFILE;", "rel": ""}, {"id": "V05", "k": "v", "f": "Column list / Value list", "pt": "Lista de colunas / Lista de valores", "d": "No INSERT, cada coluna da lista recebe o valor na mesma posição da lista de valores.", "ex": "INSERT INTO funcionarios (id, nome, cargo)\nVALUES (1, 'Ana Silva', 'Analista');", "rel": "INSERT"}, {"id": "V06", "k": "v", "f": "Default value", "pt": "Valor padrão", "d": "Valor que a coluna recebe quando é omitida no INSERT ou quando se usa a palavra DEFAULT.", "ex": "bonus NUMBER DEFAULT 100", "rel": "DEFAULT"}, {"id": "V07", "k": "v", "f": "Implicit conversion", "pt": "Conversão implícita", "d": "Oracle converte o tipo sozinho se for possível: '1' vira 1. Se não der, erro.", "ex": "INSERT INTO t2 SELECT c2 FROM t1;   -- VARCHAR2 '1' → NUMBER 1", "rel": "ORA-01722"}, {"id": "V08", "k": "v", "f": "Statement-level atomicity", "pt": "Atomicidade por comando", "d": "Um comando DML é tudo ou nada: se uma linha falhar, nenhuma linha daquele comando fica.", "ex": "INSERT ... SELECT de 10 linhas; a 7ª viola a PK → 0 linhas inseridas", "rel": "Transação"}, {"id": "V09", "k": "v", "f": "Commit / Rollback", "pt": "Confirmar / Desfazer", "d": "COMMIT torna as alterações permanentes e visíveis às outras sessões. ROLLBACK desfaz o que não foi confirmado.", "ex": "UPDATE funcionarios SET salario = 2000;\nROLLBACK;   -- volta tudo", "rel": "SAVEPOINT"}, {"id": "V10", "k": "v", "f": "Row lock", "pt": "Bloqueio de linha", "d": "Linha alterada fica bloqueada para outras sessões até o COMMIT ou ROLLBACK. Leitura não é bloqueada.", "ex": "-- sessão B tenta UPDATE na mesma linha → espera", "rel": "Concorrência"}, {"id": "C01", "k": "c", "sec": "Tipos de comandos SQL", "f": "Quais são as categorias de comandos SQL no Oracle?", "a": "<b>DDL:<\/b> CREATE, ALTER, DROP, GRANT, REVOKE (e TRUNCATE).<br><b>DML:<\/b> SELECT, INSERT, UPDATE, DELETE, MERGE.<br><b>Controle de transação:<\/b> COMMIT, ROLLBACK, SAVEPOINT.<br><b>Controle de sessão:<\/b> ALTER SESSION.<br><b>Controle de sistema:<\/b> ALTER SYSTEM.", "why": "", "ex": "GRANT SELECT ON funcionarios TO rh;   -- DDL na classificação Oracle\nSELECT * FROM funcionarios;           -- DML na classificação Oracle", "trap": "Na documentação Oracle, GRANT/REVOKE são DDL e SELECT é DML. Muitos cursos chamam GRANT de \"DCL\", mas esse termo não aparece na classificação oficial.", "tag": ""}, {"id": "C02", "k": "c", "sec": "Tipos de comandos SQL", "f": "Qual a diferença prática entre DDL e DML?", "a": "DDL muda estrutura e faz COMMIT implícito (antes e depois). DML muda dados e fica pendente até COMMIT ou ROLLBACK.", "why": "", "ex": "UPDATE funcionarios SET salario = 1;\nCREATE TABLE x (id NUMBER);   -- confirma o UPDATE junto\nROLLBACK;                     -- não desfaz mais o UPDATE", "trap": "Visto no Módulo 03. Cai de novo aqui.", "tag": "complemento: COMMIT implícito"}, {"id": "C03", "k": "c", "sec": "INSERT com VALUES", "f": "Sintaxe do INSERT com VALUES?", "a": "INSERT INTO tabela (lista_de_colunas) VALUES (lista_de_valores). Cada coluna recebe o valor da mesma posição.", "why": "", "ex": "INSERT INTO funcionarios (id, nome, cargo, salario, departamento_id)\nVALUES (1, 'Ana Silva', 'Analista', 7000.00, 1);", "trap": "VALUES insere uma linha por comando (até o 19c). Para várias, um INSERT por linha, INSERT ALL ou INSERT ... SELECT.", "tag": ""}, {"id": "C04", "k": "c", "sec": "INSERT com VALUES", "f": "E se eu não informar a lista de colunas?", "a": "A lista de valores precisa ter valor para TODAS as colunas, na ordem em que foram definidas na tabela (a ordem do DESC).", "why": "", "ex": "INSERT INTO funcionarios VALUES (3, 'Carlos Eduardo', 'Gerente', 12000.00, 3);", "trap": "Se alguém fizer ALTER TABLE ADD em uma coluna, todo INSERT sem lista de colunas passa a falhar. Em código de produção, sempre liste as colunas.", "tag": ""}, {"id": "C05", "k": "c", "sec": "INSERT com VALUES", "f": "O que acontece com a coluna omitida no INSERT?", "a": "Recebe o DEFAULT da coluna, se houver; senão, NULL. Se for NOT NULL sem DEFAULT: ORA-01400.", "why": "", "ex": "INSERT INTO funcionarios (id, nome, salario, departamento_id)\nVALUES (2, 'Bruno Gomes', 8000.00, 2);\n-- ORA-01400: cannot insert NULL into (\"...\".\"FUNCIONARIOS\".\"CARGO\")", "trap": "O script da aula provoca esse erro de propósito: cargo é NOT NULL.", "tag": ""}, {"id": "C06", "k": "c", "sec": "INSERT com VALUES", "f": "Como descobrir quais colunas são obrigatórias antes do INSERT?", "a": "DESCRIBE: a coluna Null? mostra NOT NULL. Essas precisam de valor, a menos que tenham DEFAULT.", "why": "", "ex": "DESC funcionarios\n Name     Null?    Type\n ID       NOT NULL NUMBER\n CARGO    NOT NULL VARCHAR2(50)", "trap": "DESC não mostra o DEFAULT. Para ver: USER_TAB_COLUMNS.DATA_DEFAULT.", "tag": ""}, {"id": "C07", "k": "c", "sec": "INSERT com VALUES", "f": "DEFAULT x NULL explícito?", "a": "O DEFAULT vale quando a coluna é omitida ou quando se escreve a palavra DEFAULT. Se você passar NULL explicitamente, fica NULL.", "why": "", "ex": "INSERT INTO bonus (employee_id) VALUES (1);    -- bonus = 100\nINSERT INTO bonus VALUES (2, DEFAULT);         -- bonus = 100\nINSERT INTO bonus VALUES (3, NULL);            -- bonus = NULL", "trap": "", "tag": "complemento: palavra DEFAULT e NULL explícito"}, {"id": "C08", "k": "c", "sec": "INSERT com VALUES", "f": "Erros de quantidade de valores?", "a": "Menos valores que colunas: ORA-00947 (not enough values). Mais valores que colunas: ORA-00913 (too many values).", "why": "", "ex": "INSERT INTO funcionarios VALUES (3, 'Carlos', 'Gerente', 12000);   -- ORA-00947\nINSERT INTO funcionarios (id, nome) VALUES (30, 'X', 'Y');         -- ORA-00913", "trap": "", "tag": "complemento"}, {"id": "C09", "k": "c", "sec": "INSERT com VALUES", "f": "O que acontece com valor fora da precisão de NUMBER(p,s)?", "a": "Casas decimais a mais: arredonda para s, sem erro. Dígitos inteiros a mais (mais que p - s): ORA-01438.", "why": "", "ex": "-- salario NUMBER(10,2): até 8 dígitos inteiros\nINSERT ... salario = 1234.567      -- grava 1234.57\nINSERT ... salario = 123456789     -- ORA-01438", "trap": "", "tag": "complemento"}, {"id": "C10", "k": "c", "sec": "INSERT com VALUES", "f": "Como inserir várias linhas num comando só?", "a": "INSERT ALL (todas as versões) ou, no 23ai, VALUES com várias linhas separadas por vírgula.", "why": "", "ex": "INSERT ALL\n  INTO bonus VALUES (1, 100)\n  INTO bonus VALUES (2, 200)\nSELECT * FROM dual;\n\n-- 23ai:\nINSERT INTO bonus VALUES (1, 100), (2, 200);", "trap": "", "tag": "complemento: INSERT ALL e 23ai"}, {"id": "C11", "k": "c", "sec": "INSERT com SELECT", "f": "Como inserir a partir de uma consulta?", "a": "Troque VALUES por um SELECT. Não usa a palavra VALUES nem parênteses em volta do SELECT. Insere tantas linhas quantas o SELECT devolver.", "why": "", "ex": "INSERT INTO bonus\n  SELECT employee_id, salary * 1.1\n  FROM hr.employees\n  WHERE commission_pct > 0.25;", "trap": "INSERT INTO bonus VALUES (SELECT ...) está errado.", "tag": ""}, {"id": "C12", "k": "c", "sec": "INSERT com SELECT", "f": "Que regra de tipo vale no INSERT ... SELECT?", "a": "O tipo da origem precisa ser igual ou implicitamente conversível para o tipo do destino.", "why": "", "ex": "-- t1.c2 VARCHAR2 = '1' → t2.c1 NUMBER\nINSERT INTO t2 SELECT c2 FROM t1;   -- ok (converte)\n-- se t1.c2 = 'A' → ORA-01722", "trap": "Funciona hoje com '1' e quebra amanhã quando alguém gravar 'A'.", "tag": ""}, {"id": "C13", "k": "c", "sec": "INSERT com SELECT", "f": "Posso fazer INSERT ... SELECT da própria tabela?", "a": "Sim. O SELECT lê a tabela como estava no início do comando, então as linhas recém-inseridas não entram na leitura.", "why": "", "ex": "INSERT INTO funcionarios\n  SELECT id + 4, nome, cargo, salario + 500, departamento_id\n  FROM funcionarios;", "trap": "Se o novo id calculado já existir, ORA-00001 e NENHUMA linha entra (atomicidade do comando).", "tag": ""}, {"id": "C14", "k": "c", "sec": "UPDATE", "f": "Sintaxe do UPDATE?", "a": "UPDATE tabela SET coluna = valor [, coluna = valor ...] [WHERE condição]. Com WHERE, só as linhas que atendem são alteradas.", "why": "", "ex": "UPDATE funcionarios\nSET nome = 'Paulo Ferreira', cargo = 'Analista', salario = 9000\nWHERE id = 4;", "trap": "Várias colunas: um SET só, separadas por vírgula. SET a = 1 SET b = 2 é erro.", "tag": ""}, {"id": "C15", "k": "c", "sec": "UPDATE", "f": "Como usar o valor atual da coluna no UPDATE?", "a": "Referencie a própria coluna do lado direito do =.", "why": "", "ex": "UPDATE funcionarios SET salario = salario * 1.15;   -- +15% para todos", "trap": "Sem WHERE, atinge TODAS as linhas. Aqui é o que se quer; na maioria das vezes não é.", "tag": ""}, {"id": "C16", "k": "c", "sec": "UPDATE", "f": "UPDATE ou DELETE que não acha nenhuma linha dá erro?", "a": "Não. Retorna \"0 linhas atualizadas/excluídas\" e segue.", "why": "", "ex": "UPDATE funcionarios SET salario = 1 WHERE id = 999;   -- 0 rows updated\nDELETE FROM funcionarios WHERE nome = 'kleber oliveira';   -- 0 rows (caixa)", "trap": "Em script, sempre confira a contagem retornada. Zero linhas pode ser erro de digitação silencioso.", "tag": ""}, {"id": "C17", "k": "c", "sec": "DELETE", "f": "Sintaxe do DELETE?", "a": "DELETE FROM tabela [WHERE condição]. Com WHERE, só as linhas que atendem são eliminadas. A palavra FROM é opcional no Oracle.", "why": "", "ex": "DELETE FROM funcionarios WHERE departamento_id = 3;\nDELETE funcionarios WHERE id = 5;   -- também funciona", "trap": "", "tag": "complemento: FROM opcional"}, {"id": "C18", "k": "c", "sec": "DELETE", "f": "DELETE sem WHERE x TRUNCATE?", "a": "DELETE sem WHERE: DML, apaga linha a linha, gera undo, aceita ROLLBACK. TRUNCATE: DDL, rápido, sem ROLLBACK (Módulo 03).", "why": "", "ex": "DELETE FROM funcionarios;   ROLLBACK;   -- voltam\nTRUNCATE TABLE funcionarios; ROLLBACK;  -- não voltam", "trap": "", "tag": ""}, {"id": "C19", "k": "c", "sec": "Transações e segurança", "f": "Qual o risco de UPDATE/DELETE sem WHERE?", "a": "Altera ou apaga a tabela inteira. Antes do COMMIT, ROLLBACK resolve. Depois do COMMIT, só uma rotina de recuperação.", "why": "", "ex": "UPDATE funcionarios SET salario = 2000;   -- todos!\nROLLBACK;", "trap": "Boa prática da própria prática da aula: rodar um SELECT com o MESMO WHERE antes do UPDATE/DELETE e conferir as linhas.", "tag": ""}, {"id": "C20", "k": "c", "sec": "Transações e segurança", "f": "Quem enxerga minhas alterações antes do COMMIT?", "a": "Só a minha sessão. As outras sessões continuam vendo o valor anterior (consistência de leitura) e, se tentarem alterar a mesma linha, ficam esperando o lock.", "why": "", "ex": "-- sessão A: UPDATE funcionarios SET salario = 1 WHERE id = 2;  (sem commit)\n-- sessão B: SELECT salario ... WHERE id = 2;   -- vê o valor antigo\n-- sessão B: UPDATE ... WHERE id = 2;           -- fica esperando", "trap": "Visão de DBA: transação esquecida aberta é causa clássica de sessões travadas (enq: TX - row lock contention).", "tag": "complemento"}, {"id": "C21", "k": "c", "sec": "Transações e segurança", "f": "Para que serve SAVEPOINT?", "a": "Marca um ponto dentro da transação. ROLLBACK TO desfaz só o que veio depois dele.", "why": "", "ex": "INSERT INTO funcionarios ... ;\nSAVEPOINT a;\nDELETE FROM funcionarios WHERE cargo = 'Analista';\nROLLBACK TO a;   -- desfaz o DELETE, mantém o INSERT\nCOMMIT;", "trap": "", "tag": "complemento"}, {"id": "C22", "k": "c", "sec": "Transações e segurança", "f": "O que acontece com DML pendente quando a sessão termina?", "a": "SQL*Plus: EXIT normal faz COMMIT (EXITCOMMIT ON por padrão). Queda de conexão ou término anormal: ROLLBACK. SQL Developer pergunta se quer confirmar.", "why": "", "ex": "SQL> UPDATE funcionarios SET salario = 1;\nSQL> EXIT        -- confirmado!", "trap": "Muita gente acha que sair sem COMMIT desfaz. No SQL*Plus, não desfaz.", "tag": "complemento"}, {"id": "C23", "k": "c", "sec": "Transações e segurança", "f": "Fiz COMMIT de um UPDATE errado. E agora?", "a": "Se o undo ainda tiver os dados: Flashback Query (AS OF TIMESTAMP) para ver e restaurar o valor antigo. Senão: Flashback Table, RMAN ou Data Pump.", "why": "", "ex": "SELECT * FROM funcionarios\nAS OF TIMESTAMP SYSTIMESTAMP - INTERVAL '10' MINUTE\nWHERE id = 15;", "trap": "Depende do UNDO_RETENTION e do volume de undo gerado. Quanto antes, melhor.", "tag": "complemento: visão de DBA"}, {"id": "C24", "k": "c", "sec": "Prática da aula (funcionarios)", "f": "Por que a ordem dos passos da prática muda o resultado?", "a": "O passo 4 transforma em Gerente todo mundo com salário &gt; 10000. Gustavo e Paula eram Analistas e viram Gerentes. O passo 7 transforma Joana em Desenvolvedora. Por isso o passo 8 (apagar Analistas) remove só 4: Ana, Daniela, Marcos e Sergio.", "why": "", "ex": "-- confirme antes do DELETE:\nSELECT id, nome FROM funcionarios WHERE cargo = 'Analista';", "trap": "Em prova, questões de DML em sequência exigem que você acompanhe o estado da tabela passo a passo.", "tag": ""}, {"id": "C25", "k": "c", "sec": "Prática da aula (funcionarios)", "f": "Qual o problema do id + 21 no passo 6 da prática resolvida?", "a": "Só funciona porque, naquele momento, o maior id é 21. Se rodar de novo, ou com outros dados, o id calculado colide com um existente: ORA-00001 e nada é inserido. Em produção, use SEQUENCE ou IDENTITY.", "why": "", "ex": "-- 2ª execução do passo 6: linhas > 11000 são 2, 16, 23, 37\n-- novos ids: 23, 37, 44, 58 → 23 e 37 já existem → ORA-00001", "trap": "Chave gerada com conta (id + n) é gambiarra de exercício.", "tag": "correção do material: abordagem frágil na prática resolvida"}, {"id": "S01", "k": "s", "f": "INSERT INTO funcionarios (id, nome, salario, departamento_id)\nVALUES (2, 'Bruno Gomes', 8000.00, 2);", "res": "ORA-01400", "d": "cargo é NOT NULL e ficou de fora."}, {"id": "S02", "k": "s", "f": "INSERT INTO funcionarios (id, nome, cargo, departamento_id)\nVALUES (4, 'Daniela Rocha', 'Analista', 1);", "res": "Sucesso, salario = NULL", "d": "Coluna omitida sem DEFAULT vira NULL."}, {"id": "S03", "k": "s", "f": "INSERT INTO funcionarios VALUES (3, 'Carlos', 'Gerente', 12000);", "res": "ORA-00947: not enough values", "d": "5 colunas, 4 valores."}, {"id": "S04", "k": "s", "f": "INSERT INTO funcionarios (id, nome) VALUES (30, 'X', 'Y');", "res": "ORA-00913: too many values", "d": "2 colunas, 3 valores."}, {"id": "S05", "k": "s", "f": "INSERT INTO funcionarios VALUES (1, 'Novo', 'Analista', 5000, 1);\n-- id 1 já existe", "res": "ORA-00001: unique constraint violated", "d": "PK duplicada."}, {"id": "S06", "k": "s", "f": "INSERT INTO bonus (employee_id) VALUES (1);", "res": "bonus = 100", "d": "Coluna omitida recebe o DEFAULT."}, {"id": "S07", "k": "s", "f": "INSERT INTO bonus VALUES (2, NULL);", "res": "bonus = NULL", "d": "NULL explícito vence o DEFAULT."}, {"id": "S08", "k": "s", "f": "INSERT INTO bonus VALUES (3, DEFAULT);", "res": "bonus = 100", "d": "Palavra DEFAULT força o padrão."}, {"id": "S09", "k": "s", "f": "t1.c2 = '1'.\nINSERT INTO t2 SELECT c2 FROM t1;", "res": "Sucesso, c1 = 1", "d": "Conversão implícita VARCHAR2 → NUMBER."}, {"id": "S10", "k": "s", "f": "t1.c2 = 'A'.\nINSERT INTO t2 SELECT c2 FROM t1;", "res": "ORA-01722", "d": "'A' não converte para número."}, {"id": "S11", "k": "s", "f": "salario NUMBER(10,2) recebe 1234.567", "res": "1234.57", "d": "Arredonda as casas decimais excedentes."}, {"id": "S12", "k": "s", "f": "salario NUMBER(10,2) recebe 123456789", "res": "ORA-01438", "d": "Só cabem 8 dígitos inteiros (10 - 2)."}, {"id": "S13", "k": "s", "f": "UPDATE funcionarios SET salario = 2000;\nROLLBACK;\nSELECT salario FROM funcionarios;", "res": "Salários originais", "d": "Sem COMMIT, ROLLBACK desfaz."}, {"id": "S14", "k": "s", "f": "UPDATE funcionarios SET salario = 1 WHERE id = 999;", "res": "0 linhas, sem erro", "d": "Nenhuma linha atendeu ao WHERE."}, {"id": "S15", "k": "s", "f": "DELETE FROM funcionarios WHERE nome = 'kleber oliveira';", "res": "0 linhas", "d": "Comparação de texto é case-sensitive: o nome é 'Kleber Oliveira'."}, {"id": "S16", "k": "s", "f": "DELETE funcionarios WHERE id = 5;", "res": "Sucesso", "d": "FROM é opcional no Oracle."}, {"id": "S17", "k": "s", "f": "UPDATE funcionarios SET cargo = 'Gerente' SET salario = 1 WHERE id = 4;", "res": "Erro de sintaxe", "d": "Um SET só, colunas separadas por vírgula."}, {"id": "S18", "k": "s", "f": "Prática: depois dos passos 1 a 5, quantos funcionários restam?", "res": "14", "d": "20 + Vitor - Kleber - 6 do departamento 3 (ids 3, 6, 9, 12, 15, 18)."}, {"id": "S19", "k": "s", "f": "Prática, passo 6: quem é duplicado e com que ids?", "res": "Bruno → 23 (13200) e Paula → 37 (13750)", "d": "Gustavo tem 11000, que não é > 11000."}, {"id": "S20", "k": "s", "f": "Prática, passo 8: quantos Analistas são excluídos?", "res": "4: Ana, Daniela, Marcos, Sergio", "d": "Gustavo e Paula viraram Gerente no passo 4; Joana virou Desenvolvedor no 7."}, {"id": "S21", "k": "s", "f": "Prática: quantas linhas no final (após o passo 9)?", "res": "12", "d": "14 + 2 duplicados - 4 Analistas."}, {"id": "S22", "k": "s", "f": "Prática: rodar o passo 6 uma segunda vez.", "res": "ORA-00001, nenhuma linha inserida", "d": "Ids 23 e 37 calculados de novo já existem. O comando é tudo ou nada."}, {"id": "S23", "k": "s", "f": "Sessão A: UPDATE ... WHERE id = 2 (sem COMMIT).\nSessão B: SELECT salario WHERE id = 2. E depois UPDATE na mesma linha?", "res": "SELECT vê o valor antigo · UPDATE fica esperando", "d": "Leitura consistente e lock de linha."}, {"id": "S24", "k": "s", "f": "INSERT ...; SAVEPOINT a; DELETE ...; ROLLBACK TO a; COMMIT;", "res": "INSERT fica, DELETE desfeito", "d": "ROLLBACK TO desfaz só o que veio depois do savepoint."}, {"id": "S25", "k": "s", "f": "SQL*Plus: UPDATE funcionarios SET salario = 1;\nEXIT", "res": "Confirmado", "d": "EXITCOMMIT ON é o padrão do SQL*Plus."}, {"id": "E01", "k": "e", "f": "UPDATE funcionarios SET cargo = 'Gerente' AND salario = 1\nWHERE id = 4;", "res": "AND no lugar da vírgula no SET", "fix": "UPDATE funcionarios SET cargo = 'Gerente', salario = 1\nWHERE id = 4;", "d": "Mesmo erro do MONTHS_BETWEEN: colunas no SET são separadas por vírgula."}, {"id": "E02", "k": "e", "f": "UPDATE funcionarios SET cargo = 'Gerente' SET salario = 1\nWHERE id = 4;", "res": "Dois SET (ORA-00933)", "fix": "UPDATE funcionarios SET cargo = 'Gerente', salario = 1\nWHERE id = 4;", "d": "Um SET só, com as colunas separadas por vírgula."}, {"id": "E03", "k": "e", "f": "INSERT INTO funcionarios VALUES (3, 'Carlos', 'Gerente', 12000);", "res": "Faltou valor (ORA-00947)", "fix": "INSERT INTO funcionarios VALUES (3, 'Carlos', 'Gerente', 12000, 3);", "d": "Sem lista de colunas, é preciso valor para todas."}, {"id": "E04", "k": "e", "f": "INSERT INTO funcionarios (id, nome) VALUES (30, 'X', 'Y');", "res": "Valor sobrando (ORA-00913)", "fix": "INSERT INTO funcionarios (id, nome) VALUES (30, 'X');", "d": "Quantidade de valores = quantidade de colunas."}, {"id": "E05", "k": "e", "f": "INSERT INTO bonus VALUES\n(SELECT employee_id, salary FROM hr.employees);", "res": "VALUES com SELECT", "fix": "INSERT INTO bonus\nSELECT employee_id, salary FROM hr.employees;", "d": "Com SELECT não se usa VALUES nem parênteses em volta."}, {"id": "E06", "k": "e", "f": "DELETE * FROM funcionarios WHERE id = 5;", "res": "Asterisco no DELETE (ORA-00903)", "fix": "DELETE FROM funcionarios WHERE id = 5;", "d": "DELETE apaga a linha inteira: não tem lista de colunas."}, {"id": "E07", "k": "e", "f": "ROLLBACK TO a;\n-- sem ter criado o savepoint", "res": "Savepoint inexistente (ORA-01086)", "fix": "SAVEPOINT a;\n...\nROLLBACK TO a;", "d": "O SAVEPOINT precisa existir na transação atual."}], "mm": {"ct": "DML", "cs": "INSERT · UPDATE · DELETE", "branches": [{"t": "Tipos de comandos SQL", "cards": "C01–C02", "col": "#002b5c", "leaves": ["DDL: CREATE, ALTER, DROP, GRANT, REVOKE", "DML: SELECT, INSERT, UPDATE, DELETE, MERGE", "Transação: COMMIT, ROLLBACK, SAVEPOINT", "Sessão: ALTER SESSION", "Sistema: ALTER SYSTEM", "DDL faz COMMIT implícito"]}, {"t": "INSERT ... VALUES", "cards": "C03–C10", "col": "#2f6db5", "leaves": ["Coluna da lista ↔ valor na mesma posição", "Sem lista: todas, na ordem do DESC", "Omitida → DEFAULT ou NULL", "NOT NULL omitida → ORA-01400", "NULL explícito vence o DEFAULT", "Faltou valor ORA-00947 · sobrou ORA-00913", "NUMBER(10,2): decimal arredonda, inteiro demais ORA-01438"]}, {"t": "INSERT ... SELECT", "cards": "C11–C13", "col": "#7b4bb0", "leaves": ["Troca VALUES por SELECT", "Sem VALUES, sem parênteses", "Tipo igual ou conversível", "'1' → 1 ok · 'A' → ORA-01722", "Pode ler da própria tabela", "PK repetida: nada entra (ORA-00001)"]}, {"t": "UPDATE", "cards": "C14–C16", "col": "#1f7a55", "leaves": ["SET col = valor [, col = valor]", "Um SET só, vírgula entre colunas", "salario = salario * 1.15", "Sem WHERE: todas as linhas", "0 linhas não é erro"]}, {"t": "DELETE", "cards": "C17–C18", "col": "#c0392b", "leaves": ["DELETE FROM tab [WHERE]", "FROM é opcional no Oracle", "Sem WHERE: todas as linhas", "DELETE = DML, aceita ROLLBACK", "TRUNCATE = DDL, sem ROLLBACK"]}, {"t": "Transações e segurança", "cards": "C19–C23", "col": "#b06d00", "leaves": ["SELECT com o mesmo WHERE antes", "Antes do COMMIT: só minha sessão vê", "Outra sessão na mesma linha: espera", "SAVEPOINT + ROLLBACK TO", "SQL*Plus EXIT = COMMIT", "Commit errado: Flashback Query"]}, {"t": "Prática funcionarios", "cards": "C24–C25", "col": "#5d6d7e", "leaves": ["A ordem dos passos muda o resultado", "Passo 4 tira Gustavo e Paula de Analista", "Passo 8 apaga só 4", "id + 21 é frágil → SEQUENCE", "Final: 12 linhas"]}]}, "syn": [["INSERT com colunas", "INSERT INTO t (col1, col2) VALUES (valor1, valor2);", "INSERT INTO funcionarios (id, nome, cargo) VALUES (1, 'Ana', 'Analista');"], ["INSERT sem colunas", "INSERT INTO t VALUES (v1, v2, ... todas as colunas na ordem);", "INSERT INTO bonus VALUES (2, DEFAULT);"], ["INSERT com SELECT", "INSERT INTO t [(colunas)] SELECT ... ;   -- sem VALUES", "INSERT INTO bonus SELECT employee_id, salary * 1.1 FROM hr.employees;"], ["INSERT ALL", "INSERT ALL INTO t VALUES (...) INTO t VALUES (...) SELECT * FROM dual;", "INSERT ALL INTO bonus VALUES (1, 100) INTO bonus VALUES (2, 200) SELECT * FROM dual;"], ["UPDATE", "UPDATE t SET col1 = valor [, col2 = valor] [WHERE condição];", "UPDATE funcionarios SET cargo = 'Analista', salario = 9000 WHERE id = 4;"], ["DELETE", "DELETE [FROM] t [WHERE condição];", "DELETE FROM funcionarios WHERE departamento_id = 3;"], ["COMMIT / ROLLBACK", "COMMIT;  ·  ROLLBACK;", "ROLLBACK;"], ["SAVEPOINT", "SAVEPOINT nome;  ·  ROLLBACK TO [SAVEPOINT] nome;", "SAVEPOINT antes_delete; ... ROLLBACK TO antes_delete;"]], "lab": [["Outra sessão não vê o que não foi confirmado", "-- Janela 1 (SQL*Plus):\nUPDATE hr.employees SET salary = 1 WHERE employee_id = 100;\n-- Janela 2 (outro SQL*Plus, mesmo usuário):\nSELECT salary FROM hr.employees WHERE employee_id = 100;\n-- Janela 1:\nROLLBACK;", "A janela 2 continua vendo 24000 enquanto a janela 1 não faz COMMIT.", "Até o COMMIT, só a sua sessão enxerga a alteração. Se a janela 2 tentar alterar a mesma linha, fica esperando."], ["SAVEPOINT desfaz só uma parte", "CREATE TABLE lab_sp (id NUMBER);\nINSERT INTO lab_sp VALUES (1);\nSAVEPOINT a;\nINSERT INTO lab_sp VALUES (2);\nROLLBACK TO a;\nSELECT * FROM lab_sp;\nDROP TABLE lab_sp PURGE;", "Sobra só a linha 1. A linha 2 foi desfeita.", "ROLLBACK TO desfaz só o que veio depois do savepoint."], ["DEFAULT x NULL explícito", "CREATE TABLE lab_def (id NUMBER, bonus NUMBER DEFAULT 100);\nINSERT INTO lab_def (id) VALUES (1);\nINSERT INTO lab_def VALUES (2, NULL);\nINSERT INTO lab_def VALUES (3, DEFAULT);\nSELECT * FROM lab_def;\nDROP TABLE lab_def PURGE;", "Linhas 1 e 3 ficam com 100. A linha 2 fica vazia.", "O DEFAULT só vale quando a coluna é omitida ou com a palavra DEFAULT."], ["Comando com erro não grava nada", "CREATE TABLE lab_pk (id NUMBER PRIMARY KEY);\nINSERT INTO lab_pk VALUES (1);\nINSERT INTO lab_pk SELECT LEVEL FROM dual CONNECT BY LEVEL <= 3;\nSELECT COUNT(*) FROM lab_pk;\nDROP TABLE lab_pk PURGE;", "O INSERT de 3 linhas falha no id 1 (ORA-00001) e a contagem continua 1: nem o 2 nem o 3 entraram.", "Cada comando DML é tudo ou nada."], ["NUMBER(10,2) arredonda sem avisar", "CREATE TABLE lab_num (v NUMBER(10,2));\nINSERT INTO lab_num VALUES (1234.567);\nSELECT v FROM lab_num;\nDROP TABLE lab_num PURGE;", "Grava 1234,57. Nenhum aviso.", "Casas decimais a mais são arredondadas; dígitos inteiros a mais dão erro."]]}, {"id": "M05", "title": "Agrupando resultados e funções de agregação", "ref": "Referência para os cenários: tabelas dos scripts da aula e da prática", "reftxt": "T1 (C1)        T2 (C1, C2)        VENDAS_FRUTAS (script da aula)\n 1              1     1           1 Maçã    10\n 1              1     1           2 Banana  20\n 1              NULL  1           3 Maçã    15\n 3              3     3           4 Laranja 18\n                                  5 Banana  12\n                                  (6º INSERT repete VendaID 4: falha)\n\nLIVROS (prática): 20 livros, 2 com preço NULL\n Ficcao 8 · Fantasia 6 · Classico 5 · Nao-ficcao 1\n J.K. Rowling 3 livros · George Orwell 2 · J.R.R. Tolkien 2 · demais 1\n NULL: 'O Sol é para Todos' (Harper Lee) e 'Fahrenheit 451' (Ray Bradbury), ambos Ficcao", "cards": [{"id": "V01", "k": "v", "f": "Aggregate function / Group function", "pt": "Função de agregação / de grupo", "d": "Recebe um conjunto de linhas e devolve UMA linha de resultado: COUNT, SUM, AVG, MIN, MAX, LISTAGG.", "ex": "SELECT COUNT(*) FROM hr.employees;   -- 107 linhas → 1", "rel": "Single-row function"}, {"id": "V02", "k": "v", "f": "GROUP BY clause", "pt": "Cláusula de agrupamento", "d": "Divide as linhas em grupos pelo valor de uma ou mais expressões. A agregação é calculada por grupo.", "ex": "SELECT categoria, SUM(preco) FROM vendas GROUP BY categoria;", "rel": "HAVING"}, {"id": "V03", "k": "v", "f": "HAVING clause", "pt": "Cláusula de filtro de grupos", "d": "Filtra os GRUPOS depois da agregação. É o WHERE dos grupos.", "ex": "... GROUP BY produto HAVING SUM(quantidade) > 15;", "rel": "WHERE"}, {"id": "V04", "k": "v", "f": "Grouping expression", "pt": "Expressão de agrupamento", "d": "A coluna ou expressão listada no GROUP BY. Toda coluna não agregada do SELECT precisa estar entre elas.", "ex": "GROUP BY department_id", "rel": "ORA-00979"}, {"id": "V05", "k": "v", "f": "Distinct / All", "pt": "Distintos / Todos", "d": "Modificador dentro da função: DISTINCT (= UNIQUE) considera só valores diferentes; ALL considera todos e é o padrão.", "ex": "SELECT COUNT(DISTINCT c1), COUNT(ALL c1) FROM t2;", "rel": "Duplicatas"}, {"id": "V06", "k": "v", "f": "Average (AVG)", "pt": "Média", "d": "Soma dos valores não nulos dividida pela QUANTIDADE de valores não nulos.", "ex": "SELECT AVG(salary) FROM hr.employees;", "rel": "NVL"}, {"id": "V07", "k": "v", "f": "Row count (COUNT)", "pt": "Contagem", "d": "COUNT(*) conta linhas. COUNT(expr) conta valores não nulos da expressão.", "ex": "SELECT COUNT(*), COUNT(c1) FROM t2;   -- 4 | 3", "rel": "NULL"}, {"id": "V08", "k": "v", "f": "String aggregation (LISTAGG)", "pt": "Agregação de texto", "d": "Concatena os valores do grupo numa string, com separador e ordem definidos em WITHIN GROUP.", "ex": "LISTAGG(last_name, '; ') WITHIN GROUP (ORDER BY salary)", "rel": "WITHIN GROUP"}, {"id": "V09", "k": "v", "f": "Nested aggregate", "pt": "Agregação aninhada", "d": "Função de grupo dentro de outra. Máximo de 2 níveis e exige GROUP BY.", "ex": "SELECT AVG(MIN(salary)) FROM hr.employees GROUP BY department_id;", "rel": "ORA-00935"}, {"id": "V10", "k": "v", "f": "NVL", "pt": "Substituir nulo", "d": "NVL(expr, valor) devolve o valor quando expr é NULL. Usado para fazer a agregação considerar os nulos.", "ex": "SELECT AVG(NVL(preco, 0)) FROM livros;", "rel": "COALESCE"}, {"id": "C01", "k": "c", "sec": "GROUP BY", "f": "Para que serve o GROUP BY?", "a": "Agrupar as linhas da consulta pelo valor de uma ou mais colunas ou expressões. Cada grupo vira UMA linha no resultado, e as funções de agregação são calculadas por grupo.", "why": "", "ex": "SELECT categoria, SUM(preco)\nFROM vendas\nGROUP BY categoria;", "trap": "", "tag": ""}, {"id": "C02", "k": "c", "sec": "GROUP BY", "f": "Qual a regra de ouro entre SELECT e GROUP BY?", "a": "Toda coluna do SELECT que NÃO está dentro de função de agregação precisa estar no GROUP BY. O contrário não vale: o GROUP BY pode ter colunas que não aparecem no SELECT.", "why": "", "ex": "SELECT produto, categoria, SUM(preco) FROM vendas GROUP BY categoria;\n-- ORA-00979: not a GROUP BY expression (produto)\n\nSELECT SUM(preco) FROM vendas GROUP BY categoria;   -- válido", "trap": "ORA-00979 é o erro mais cobrado deste assunto.", "tag": "complemento"}, {"id": "C03", "k": "c", "sec": "GROUP BY", "f": "Agregação com coluna comum, sem GROUP BY?", "a": "Erro ORA-00937. Sem GROUP BY, a tabela inteira é um grupo só, e a coluna comum tem vários valores para uma linha de resultado.", "why": "", "ex": "SELECT department_id, AVG(salary) FROM hr.employees;\n-- ORA-00937: not a single-group group function", "trap": "", "tag": "complemento"}, {"id": "C04", "k": "c", "sec": "GROUP BY", "f": "Posso agrupar por mais de uma coluna?", "a": "Sim. Cada combinação distinta das colunas vira um grupo.", "why": "", "ex": "SELECT marca, cor, COUNT(*) FROM carros GROUP BY marca, cor;", "trap": "", "tag": ""}, {"id": "C05", "k": "c", "sec": "GROUP BY", "f": "O GROUP BY ordena o resultado?", "a": "Não garante ordem. Para ordenar, use ORDER BY.", "why": "", "ex": "SELECT categoria, SUM(preco) FROM vendas GROUP BY categoria ORDER BY 1;", "trap": "Em versões antigas o GROUP BY parecia ordenar (sort). Hoje usa hash e a ordem varia.", "tag": ""}, {"id": "C06", "k": "c", "sec": "GROUP BY", "f": "Como o GROUP BY trata NULL?", "a": "Todas as linhas com NULL na coluna agrupada formam UM grupo.", "why": "", "ex": "SELECT department_id, COUNT(*) FROM hr.employee
