@."}, {"id": "S18", "k": "s", "f": "SELECT UPPER(SUBSTR('oracle',1,3)) FROM dual;", "res": "ORA", "d": "De dentro para fora: 'ora' → 'ORA'."}, {"id": "S19", "k": "s", "f": "SELECT DATE '2026-10-15' - DATE '2026-10-01' FROM dual;", "res": "14", "d": "DATE - DATE = dias."}, {"id": "S20", "k": "s", "f": "SELECT SYSDATE - DATE '2026-10-14' FROM dual;", "res": "1.4375", "d": "1 dia + 10h30 (10,5/24 = 0,4375)."}, {"id": "S21", "k": "s", "f": "SELECT SYSDATE + SYSDATE FROM dual;", "res": "ORA-00975", "d": "Não existe soma de duas datas."}, {"id": "S22", "k": "s", "f": "SELECT ADD_MONTHS(DATE '2024-01-31',1) FROM dual;", "res": "29/02/2024", "d": "Fevereiro de 2024 não tem dia 31: vai para o último dia."}, {"id": "S23", "k": "s", "f": "SELECT ADD_MONTHS(DATE '2024-04-30',1) FROM dual;", "res": "31/05/2024", "d": "30/04 é último dia do mês: o resultado também é último dia."}, {"id": "S24", "k": "s", "f": "SELECT MONTHS_BETWEEN(DATE '2026-03-15', DATE '2026-01-15'),\n       MONTHS_BETWEEN(DATE '2026-01-15', DATE '2026-03-15') FROM dual;", "res": "2 | -2", "d": "A ordem dos argumentos define o sinal."}, {"id": "S25", "k": "s", "f": "SELECT TRUNC(SYSDATE), TRUNC(SYSDATE,'MM') FROM dual;", "res": "15/10/2026 00:00 | 01/10/2026", "d": "TRUNC de data zera a hora; 'MM' vai ao 1º dia do mês."}, {"id": "S26", "k": "s", "f": "Funcionário contratado em 15/04/2020.\nTRUNC(MONTHS_BETWEEN(SYSDATE, hire_date)/12, 1) = ?\nEntra no WHERE ... > 60?", "res": "6.5 · entra", "d": "78 meses (mesmo dia do mês → inteiro) / 12 = 6,5. 78 > 60."}, {"id": "S27", "k": "s", "f": "Funcionário contratado em 15/11/2021.\nEntra no filtro do desafio (MONTHS_BETWEEN > 60)?", "res": "Não entra", "d": "59 meses."}, {"id": "S28", "k": "s", "f": "SELECT job_id FROM hr.employees\nWHERE UPPER(job_id) LIKE '%MAN%';\n-- quais cargos de gerente aparecem?", "res": "SA_MAN, PU_MAN, ST_MAN, MK_MAN", "d": "FI_MGR e AC_MGR também são gerentes, mas usam MGR e ficam de fora. O filtro da aula não pega todos os gerentes."}], "mm": {"ct": "Single-Row Functions", "cs": "1 linha entra → 1 linha sai", "branches": [{"t": "Conceito", "cards": "C01–C04", "col": "#002b5c", "leaves": ["Age linha a linha, não agrupa", "≠ agregação (SUM, COUNT: N → 1)", "Usa em SELECT e WHERE (+ ORDER BY)", "Aninhadas: de dentro para fora", "NULL entra → NULL sai (exceto ||)", "Teste rápido: FROM dual"]}, {"t": "String: caixa e tamanho", "cards": "C05–C07", "col": "#2f6db5", "leaves": ["UPPER · LOWER · INITCAP", "INITCAP desce o resto: SILVA → Silva", "UPPER no WHERE: busca sem caixa", "LENGTH conta espaços", "'' é NULL → LENGTH('') = NULL"]}, {"t": "String: extrair", "cards": "C08–C10", "col": "#7b4bb0", "leaves": ["SUBSTR(txt, pos [, tam])", "pos 0 = 1 · negativa conta do fim", "INSTR(txt, busca, pos, ocorrência)", "INSTR devolve posição; 0 se não achar", "SUBSTR + INSTR: antes do @", "HR: email sem @ → NULL"]}, {"t": "String: limpar e montar", "cards": "C11–C13", "col": "#c0392b", "leaves": ["REPLACE troca todas; sem 3º arg remove", "TRIM: LEADING / TRAILING / BOTH", "TRIM só 1 caractere (ORA-30001)", "|| N pedaços · CONCAT só 2", "|| trata NULL como vazio"]}, {"t": "Números", "cards": "C14–C19", "col": "#1f7a55", "leaves": ["ROUND arredonda · TRUNC corta", "10.49 → 10 | 10 · 10.50 → 11 | 10", "Diferença só se descartado ≥ 0,5", "d negativo: ROUND(1250,-2) = 1300", "ROUND(-2.5) = -3 · TRUNC(-2.7) = -2", "MOD = resto · MOD(x,0) = x", "MOD(id,2) = 0 → par"]}, {"t": "Datas", "cards": "C20–C28", "col": "#b06d00", "leaves": ["DATE guarda data E hora", "SYSDATE: hora do servidor, sem ()", "DATE ± n = dias · DATE - DATE = dias", "DATE + DATE → ORA-00975", "ADD_MONTHS: último dia → último dia", "MONTHS_BETWEEN(d1,d2): ordem = sinal", "TRUNC(data) zera a hora · 'MM' · 'YYYY'", "Anos: TRUNC(MONTHS_BETWEEN/12, 1)", "Datas não são texto: DATE '2026-01-01'"]}, {"t": "WHERE e desempenho", "cards": "C29–C31", "col": "#5d6d7e", "leaves": ["Função na coluna → sem índice B-tree", "Deixe a coluna limpa, função no valor", "TRUNC(dt) = X → dt >= X AND dt < X+1", "Índice baseado em função", "hire_date < ADD_MONTHS(SYSDATE,-60)"]}, {"t": "Projeto RH", "cards": "C32–C33", "col": "#00838f", "leaves": ["Nome: INITCAP(first || ' ' || last)", "Email: SUBSTR(email,1,5) || '...'", "Salário: ROUND(salary, 0)", "Anos: TRUNC(MONTHS_BETWEEN/12, 1)", "Filtro: MONTHS_BETWEEN > 60", "Alias não vale no WHERE (Mód. 01)"]}]}}, {"id": "M03", "title": "Manipulando tabelas", "ref": "Referência para os cenários: tabela VENDAS da aula e tabela FORNECEDORES da prática", "reftxt": "CREATE TABLE vendas (           CREATE TABLE fornecedores (\n  data_venda DATE,                 id_fornecedor NUMBER PRIMARY KEY,\n  id_produto NUMBER,               nome          VARCHAR2(100) NOT NULL,\n  quantidade NUMBER                ... cidade, estado, cep, telefone,\n);                                 min_pedido    NUMBER(10,2)\n                                 );", "cards": [{"id": "V01", "k": "v", "f": "Heap-organized table", "pt": "Tabela organizada em heap", "d": "Tipo padrão. As linhas ficam onde houver espaço livre, sem ordem definida.", "ex": "CREATE TABLE t (id NUMBER) ORGANIZATION HEAP;   -- = sem a cláusula", "rel": "IOT"}, {"id": "V02", "k": "v", "f": "Index-organized table (IOT)", "pt": "Tabela organizada por índice", "d": "As linhas ficam DENTRO de um índice B-tree, ordenadas pela chave primária. Exige PK.", "ex": "CREATE TABLE t (id NUMBER PRIMARY KEY, d VARCHAR2(30))\nORGANIZATION INDEX;", "rel": "Primary key"}, {"id": "V03", "k": "v", "f": "Tablespace / Default tablespace", "pt": "Tablespace / Tablespace padrão", "d": "Área lógica onde os segmentos são gravados. Sem a cláusula TABLESPACE, a tabela vai para a tablespace padrão do usuário.", "ex": "SELECT default_tablespace FROM dba_users WHERE username = 'DBAOCM';", "rel": "Data file"}, {"id": "V04", "k": "v", "f": "CTAS (Create Table As Select)", "pt": "Criar tabela a partir de consulta", "d": "Cria a tabela e já carrega as linhas da consulta. Copia nomes, tipos e NOT NULL; não copia PK, FK, índices nem triggers.", "ex": "CREATE TABLE my_table AS SELECT table_name, status FROM user_tables;", "rel": "Constraints"}, {"id": "V05", "k": "v", "f": "Global temporary table (GTT)", "pt": "Tabela temporária global", "d": "Definição visível para todas as sessões e permanente; dados privados de cada sessão, gravados na tablespace temporária.", "ex": "CREATE GLOBAL TEMPORARY TABLE gtt (id NUMBER) ON COMMIT PRESERVE ROWS;", "rel": "PTT"}, {"id": "V06", "k": "v", "f": "Private temporary table (PTT)", "pt": "Tabela temporária privada", "d": "Definição E dados visíveis só para a sessão que criou; fica apenas em memória. Nome precisa do prefixo ORA$PTT_. Desde o 18c.", "ex": "CREATE PRIVATE TEMPORARY TABLE ora$ptt_x (id NUMBER)\nON COMMIT DROP DEFINITION;", "rel": "GTT"}, {"id": "V07", "k": "v", "f": "Transaction-specific / Session-specific", "pt": "Específica da transação / da sessão", "d": "Até quando a temporária guarda os dados: até o COMMIT (transação) ou até o fim da sessão.", "ex": "ON COMMIT DELETE ROWS       -- GTT, transação\nON COMMIT PRESERVE ROWS     -- GTT, sessão", "rel": "ON COMMIT"}, {"id": "V08", "k": "v", "f": "Unused column", "pt": "Coluna não utilizada", "d": "Coluna marcada com SET UNUSED: some para os usuários na hora, mas o espaço só é liberado no DROP UNUSED COLUMNS.", "ex": "ALTER TABLE vendas SET UNUSED (quantidade);", "rel": "DROP COLUMN"}, {"id": "V09", "k": "v", "f": "Recycle bin", "pt": "Lixeira", "d": "Para onde vai a tabela após DROP sem PURGE. Permite FLASHBACK TABLE ... TO BEFORE DROP.", "ex": "SELECT object_name, original_name FROM user_recyclebin;", "rel": "PURGE"}, {"id": "V10", "k": "v", "f": "Purge", "pt": "Expurgar", "d": "Apagar definitivamente, sem passar pela lixeira.", "ex": "DROP TABLE vendas PURGE;", "rel": "Recycle bin"}, {"id": "V11", "k": "v", "f": "Truncate", "pt": "Truncar", "d": "Remove TODAS as linhas de uma vez e libera o espaço. É DDL: não tem ROLLBACK.", "ex": "TRUNCATE TABLE vendas;", "rel": "DELETE"}, {"id": "V12", "k": "v", "f": "DDL / DML", "pt": "Linguagem de definição / de manipulação", "d": "DDL muda estrutura (CREATE, ALTER, DROP, TRUNCATE) e faz COMMIT implícito. DML muda dados (INSERT, UPDATE, DELETE) e aceita ROLLBACK.", "ex": "DELETE FROM vendas;     -- DML, volta com ROLLBACK\nTRUNCATE TABLE vendas;  -- DDL, não volta", "rel": "COMMIT implícito"}, {"id": "V13", "k": "v", "f": "Cascade constraints", "pt": "Remover restrições em cascata", "d": "No DROP TABLE, remove as FKs das tabelas filhas que apontam para a tabela dropada.", "ex": "DROP TABLE clientes CASCADE CONSTRAINTS;", "rel": "Foreign key"}, {"id": "V14", "k": "v", "f": "External / Partitioned / Clustered table", "pt": "Tabela externa / particionada / em cluster", "d": "Externa: dados num arquivo fora do banco. Particionada: dividida em partes por faixa, lista ou hash. Cluster: várias tabelas que compartilham blocos por uma chave comum.", "ex": "-- tipos citados no material; detalhados em módulos próprios", "rel": "Heap"}, {"id": "C01", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "O que é uma tabela e como se cria?", "a": "Unidade básica de armazenamento do Oracle: dados em linhas e colunas. CREATE TABLE com nome e, para cada coluna, nome e tipo de dado.", "why": "", "ex": "CREATE TABLE my_table (\n  id        NUMBER PRIMARY KEY,\n  nome      VARCHAR2(50),\n  sobrenome VARCHAR2(50),\n  idade     NUMBER\n);", "trap": "", "tag": ""}, {"id": "C02", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "O que são constraints (restrições de integridade)?", "a": "Regras aplicadas às colunas. Exemplo do material: NOT NULL obriga a coluna a ter valor em toda linha. Outras: PRIMARY KEY, UNIQUE, FOREIGN KEY, CHECK.", "why": "", "ex": "nome VARCHAR2(100) NOT NULL", "trap": "", "tag": ""}, {"id": "C03", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Tabela permanente vs temporária?", "a": "Permanente: dados ficam nos data files da tablespace e qualquer usuário com privilégio acessa. Temporária: dados duram só a sessão ou a transação e só a própria sessão vê.", "why": "", "ex": "CREATE TABLE vendas (...);                        -- permanente\nCREATE GLOBAL TEMPORARY TABLE tmp (...) ...;      -- temporária", "trap": "", "tag": ""}, {"id": "C04", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Em qual tablespace a tabela é criada?", "a": "Na indicada pela cláusula TABLESPACE. Sem a cláusula, na tablespace padrão (DEFAULT_TABLESPACE) do usuário dono.", "why": "", "ex": "CREATE TABLE my_table (...) TABLESPACE tbs1;\nSELECT tablespace_name FROM dba_tables WHERE table_name = 'MY_TABLE';", "trap": "O nome da tabela no dicionário é gravado em MAIÚSCULO: WHERE table_name = 'my_table' não acha nada.", "tag": ""}, {"id": "C05", "k": "c", "sec": "Tabelas: conceito e armazenamento", "f": "Quais os tipos de tabela permanente citados?", "a": "Heap Organized (padrão), Index Organized (IOT), Partitioned, External, Clustered e Hybrid Partitioned.", "why": "", "ex": "SELECT table_name, iot_type, partitioned, temporary FROM user_tables;", "trap": "", "tag": ""}, {"id": "C06", "k": "c", "sec": "Heap e CTAS", "f": "Como o Oracle armazena uma tabela heap?", "a": "Sem ordem específica: cada linha vai para onde houver espaço livre. É o padrão; ORGANIZATION HEAP é opcional.", "why": "", "ex": "CREATE TABLE dbaocm_heap (id NUMBER(5,2)) ORGANIZATION HEAP;\nCREATE TABLE dbaocm_heap (id NUMBER(5,2));   -- mesma coisa", "trap": "Por isso, sem ORDER BY a ordem do resultado não é garantida (Módulo 01).", "tag": ""}, {"id": "C07", "k": "c", "sec": "Heap e CTAS", "f": "O que o CTAS copia e o que NÃO copia?", "a": "Copia: nomes de coluna, tipos, dados e as constraints NOT NULL definidas explicitamente. Não copia: PRIMARY KEY, UNIQUE, FOREIGN KEY, CHECK, índices, triggers e grants.", "why": "", "ex": "CREATE TABLE my_table AS SELECT table_name, status FROM user_tables;\n-- constraints que faltarem: ALTER TABLE ... ADD CONSTRAINT", "trap": "Clonar tabela com CTAS e esquecer de recriar PK e índices é causa clássica de lentidão depois de migração.", "tag": "complemento: índices, triggers e grants"}, {"id": "C08", "k": "c", "sec": "Heap e CTAS", "f": "Como copiar só a estrutura, sem dados?", "a": "CTAS com uma condição sempre falsa.", "why": "", "ex": "CREATE TABLE vendas_bkp AS SELECT * FROM vendas WHERE 1 = 0;", "trap": "", "tag": "complemento"}, {"id": "C09", "k": "c", "sec": "IOT (Index Organized Table)", "f": "Como funciona uma IOT?", "a": "Os dados ficam armazenados dentro de um índice B-tree, ordenados pela chave primária. Não existe segmento de tabela separado.", "why": "", "ex": "CREATE TABLE dbaocm_iot (\n  id        NUMBER PRIMARY KEY,\n  descricao VARCHAR2(30)\n) ORGANIZATION INDEX;", "trap": "B-tree é árvore BALANCEADA (balanced tree), não árvore binária. O slide traduz como \"árvore binária\".", "tag": "correção do material: B-tree ≠ árvore binária"}, {"id": "C10", "k": "c", "sec": "IOT (Index Organized Table)", "f": "O que é obrigatório para criar uma IOT?", "a": "Cláusula ORGANIZATION INDEX e uma PRIMARY KEY.", "why": "", "ex": "CREATE TABLE dbaocm_iot (id NUMBER, descricao VARCHAR2(30)) ORGANIZATION INDEX;\n-- ORA-25175: no PRIMARY KEY constraint found", "trap": "O próprio script da aula mostra esse erro de propósito.", "tag": ""}, {"id": "C11", "k": "c", "sec": "IOT (Index Organized Table)", "f": "Para que tipo de aplicação a IOT é indicada?", "a": "Segundo o Administrator's Guide: aplicações OLTP que precisam de acesso rápido pela chave primária e alta disponibilidade. Também aparece em recuperação de informação, spatial e OLAP.", "why": "", "ex": "-- caso típico: tabela de lookup consultada sempre pela PK\nSELECT descricao FROM dbaocm_iot WHERE id = :id;", "trap": "", "tag": "correção do material: a frase \"acesso rápido à PK e alta disponibilidade\" na doc é sobre OLTP, não OLAP"}, {"id": "C12", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "Para que servem tabelas temporárias?", "a": "Guardar resultados intermediários que precisam persistir durante a sessão ou a transação, por exemplo DMLs que dependem do resultado uns dos outros.", "why": "", "ex": "-- carga em etapas: tmp recebe, processa, grava na definitiva", "trap": "", "tag": ""}, {"id": "C13", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "GTT: o que é global e o que é privado?", "a": "A DEFINIÇÃO (metadados) é global: todas as sessões veem a tabela. O CONTEÚDO é privado: cada sessão só enxerga as linhas que ela mesma inseriu.", "why": "", "ex": "-- sessão A insere 3 linhas e faz COMMIT\n-- sessão B: SELECT COUNT(*) FROM admin_work_area_session;  -- 0", "trap": "", "tag": ""}, {"id": "C14", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "ON COMMIT da GTT: quais as opções?", "a": "ON COMMIT DELETE ROWS → específica da transação: COMMIT apaga as linhas. É o padrão.<br>ON COMMIT PRESERVE ROWS → específica da sessão: linhas ficam até o fim da sessão.", "why": "", "ex": "CREATE GLOBAL TEMPORARY TABLE admin_work_area_trans (...) ON COMMIT DELETE ROWS;\nCREATE GLOBAL TEMPORARY TABLE admin_work_area_session (...) ON COMMIT PRESERVE ROWS;", "trap": "Sem a cláusula ON COMMIT, a GTT é DELETE ROWS.", "tag": "complemento: padrão DELETE ROWS"}, {"id": "C15", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "PTT: regras de criação?", "a": "Definição e dados visíveis só para a sessão criadora. Nome precisa começar com o valor de PRIVATE_TEMP_TABLE_PREFIX (padrão ORA$PTT_). Não pode ser criada pelo SYS. Fica só em memória. Disponível desde o 18c.", "why": "", "ex": "SHOW PARAMETER private_temp_table_prefix\nCREATE PRIVATE TEMPORARY TABLE ora$ptt_sales (...) ON COMMIT DROP DEFINITION;", "trap": "Sem o prefixo, o Oracle não aceita o nome. Como SYS, também falha.", "tag": ""}, {"id": "C16", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "ON COMMIT da PTT: quais as opções?", "a": "ON COMMIT DROP DEFINITION → específica da transação: o COMMIT apaga dados E a tabela. É o padrão.<br>ON COMMIT PRESERVE DEFINITION → específica da sessão: tabela e dados somem no fim da sessão.", "why": "", "ex": "CREATE PRIVATE TEMPORARY TABLE ora$ptt_sales_ptt_session (\n  id_tmp NUMBER, descricao VARCHAR2(20))\nON COMMIT PRESERVE DEFINITION;", "trap": "O slide de \"PTT específica de sessão\" mostra o código de uma GTT DELETE ROWS (erro de cópia). O código certo está no .sql da aula.", "tag": "correção do material: exemplo trocado no slide"}, {"id": "C17", "k": "c", "sec": "Tabelas temporárias: GTT e PTT", "f": "Tabela-resumo GTT x PTT?", "a": "<b>Nome:<\/b> GTT segue regra normal; PTT exige prefixo ORA$PTT_.<br><b>Definição visível:<\/b> GTT todas as sessões; PTT só a criadora.<br><b>Armazenamento:<\/b> GTT em disco (tablespace temporária); PTT só memória.<br><b>Transação:<\/b> GTT DELETE ROWS; PTT DROP DEFINITION.<br><b>Sessão:<\/b> GTT PRESERVE ROWS; PTT PRESERVE DEFINITION.", "why": "", "ex": "-- memorize os pares:\n-- GTT → ROWS        (apaga linhas)\n-- PTT → DEFINITION  (apaga a tabela)", "trap": "Questão típica troca ROWS por DEFINITION. GTT nunca usa DEFINITION; PTT nunca usa ROWS.", "tag": ""}, {"id": "C18", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como adicionar uma coluna?", "a": "ALTER TABLE ... ADD (coluna tipo). Vários de uma vez separados por vírgula dentro dos parênteses.", "why": "", "ex": "ALTER TABLE vendas ADD (descricao VARCHAR2(20));\nALTER TABLE vendas ADD (obs VARCHAR2(50), ativo CHAR(1));", "trap": "A prática resolvida usa ADD COLUMN (...). Essa forma não é a sintaxe documentada no 19c e falha. Use ADD (...).", "tag": "correção do material: Pratica_Resolvida.sql"}, {"id": "C19", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como renomear uma coluna?", "a": "ALTER TABLE ... RENAME COLUMN antigo TO novo.", "why": "", "ex": "ALTER TABLE vendas RENAME COLUMN descricao TO descr;\nALTER TABLE fornecedores RENAME COLUMN registro TO cnpj;", "trap": "Renomear tabela é outro comando: RENAME vendas TO vendas_old; ou ALTER TABLE vendas RENAME TO vendas_old;", "tag": ""}, {"id": "C20", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Quais as regras do MODIFY?", "a": "Trocar o TIPO de dado: só com a coluna vazia (todos NULL).<br>Aumentar o tamanho: sempre pode.<br>Diminuir o tamanho: só se todos os valores couberem.<br>Colocar NOT NULL: só se não houver NULL na coluna.", "why": "", "ex": "ALTER TABLE vendas MODIFY (descr VARCHAR2(200) NOT NULL);   -- ok\nALTER TABLE vendas MODIFY (descr NUMBER NOT NULL);\n-- com 'teste' gravado: ORA-01439", "trap": "O slide diz \"apenas se a coluna estiver vazia, ou seja possível uma conversão\". A regra correta para tipo é: coluna vazia.", "tag": "correção do material: frase do slide truncada"}, {"id": "C21", "k": "c", "sec": "ALTER TABLE: modificar colunas", "f": "Como remover colunas?", "a": "DROP COLUMN para uma; DROP (c1, c2) para várias. Reescreve os blocos da tabela, pode demorar e pesar no banco.", "why": "", "ex": "ALTER TABLE vendas DROP COLUMN descr;\nALTER TABLE vendas DROP (data_venda, quantidade);", "trap": "Não dá para remover todas as colunas: ORA-12983.", "tag": ""}, {"id": "C22", "k": "c", "sec": "SET UNUSED", "f": "Por que usar SET UNUSED em vez de DROP COLUMN?", "a": "SET UNUSED só altera o dicionário: é instantâneo e a coluna some para os usuários na hora. O DROP físico (DROP UNUSED COLUMNS) fica para uma janela de baixo uso.", "why": "", "ex": "ALTER TABLE vendas SET UNUSED (quantidade);      -- horário comercial\nALTER TABLE vendas DROP UNUSED COLUMNS;          -- janela noturna", "trap": "Visão de DBA: em tabela grande de produção, DROP COLUMN direto pode travar a aplicação por muito tempo.", "tag": ""}, {"id": "C23", "k": "c", "sec": "SET UNUSED", "f": "O que acontece com uma coluna UNUSED?", "a": "Ainda ocupa espaço até o DROP. Não pode ser restaurada via SQL: a única ação possível é dropar. Índices, constraints e estatísticas dela normalmente são removidos (exceção: índices de colunas LOB).", "why": "", "ex": "SELECT * FROM user_unused_col_tabs;   -- tabelas com colunas UNUSED e quantas", "trap": "SET UNUSED é sem volta. Não existe \"SET USED\".", "tag": ""}, {"id": "C24", "k": "c", "sec": "SET UNUSED", "f": "Como dropar as colunas marcadas como UNUSED?", "a": "ALTER TABLE ... DROP UNUSED COLUMNS.", "why": "", "ex": "ALTER TABLE vendas DROP UNUSED COLUMNS;", "trap": "O slide diz \"usamos o comando ALTER TABLE ... SET UNUSED\" para dropar. O comando certo é DROP UNUSED COLUMNS (o exemplo do slide está certo).", "tag": "correção do material: texto do slide"}, {"id": "C25", "k": "c", "sec": "Eliminar tabela e dados", "f": "DROP TABLE: o que acontece com o espaço?", "a": "Não é liberado na hora: a tabela vai para a RECYCLEBIN e pode voltar com FLASHBACK TABLE ... TO BEFORE DROP. Com PURGE, vai direto, sem lixeira.", "why": "", "ex": "DROP TABLE vendas;\nFLASHBACK TABLE vendas TO BEFORE DROP;   -- volta\nDROP TABLE vendas PURGE;                 -- sem volta", "trap": "A tabela na lixeira continua ocupando espaço na tablespace.", "tag": "complemento: comando FLASHBACK"}, {"id": "C26", "k": "c", "sec": "Eliminar tabela e dados", "f": "Para que serve CASCADE CONSTRAINTS no DROP?", "a": "Se a tabela tem PK ou UNIQUE referenciada por FK de outras tabelas, o DROP falha. CASCADE CONSTRAINTS remove essas FKs das filhas e permite o drop.", "why": "", "ex": "DROP TABLE clientes;                       -- ORA-02449\nDROP TABLE clientes CASCADE CONSTRAINTS;   -- ok, FKs das filhas somem", "trap": "Remove só as constraints das filhas, não os dados delas.", "tag": ""}, {"id": "C27", "k": "c", "sec": "Eliminar tabela e dados", "f": "DELETE x TRUNCATE x DROP + CREATE?", "a": "<b>DELETE sem WHERE:<\/b> DML, linha a linha, aceita ROLLBACK, mais lento.<br><b>TRUNCATE:<\/b> DDL, rápido, libera espaço, SEM rollback.<br><b>DROP + CREATE:<\/b> perde índices, triggers, constraints e grants; objetos dependentes ficam inválidos.", "why": "", "ex": "DELETE FROM vendas;    ROLLBACK;   -- dados voltam\nTRUNCATE TABLE vendas; ROLLBACK;   -- dados NÃO voltam", "trap": "", "tag": ""}, {"id": "C28", "k": "c", "sec": "Eliminar tabela e dados", "f": "TRUNCATE errado: como recuperar?", "a": "ROLLBACK e FLASHBACK TABLE não funcionam. Opções: restore/recover (RMAN), RMAN RECOVER TABLE (12c+), Flashback Database ou restore point, Data Pump de antes.", "why": "", "ex": "-- RMAN 12c+:\nRECOVER TABLE dbaocm.vendas UNTIL TIME \"SYSDATE-1/24\"\n  AUXILIARY DESTINATION '/u01/aux';", "trap": "O slide fala em restore do banco inteiro. Desde o 12c há caminhos menos drásticos.", "tag": "complemento: visão de DBA"}, {"id": "C29", "k": "c", "sec": "Eliminar tabela e dados", "f": "O que é o COMMIT implícito do DDL?", "a": "Todo comando DDL (CREATE, ALTER, DROP, TRUNCATE) faz COMMIT antes e depois. Qualquer DML pendente na sessão é confirmado.", "why": "", "ex": "INSERT INTO log_carga VALUES (1, 'inicio');\nTRUNCATE TABLE vendas;\nROLLBACK;   -- o INSERT em log_carga JÁ foi confirmado", "trap": "", "tag": "complemento"}, {"id": "S01", "k": "s", "f": "CREATE TABLE dbaocm_iot (id NUMBER, descricao VARCHAR2(30))\nORGANIZATION INDEX;", "res": "ORA-25175: no PRIMARY KEY constraint found", "d": "IOT exige PK."}, {"id": "S02", "k": "s", "f": "CREATE TABLE t1 (id NUMBER);\n-- sem TABLESPACE. Onde fica?", "res": "Tablespace padrão do usuário", "d": "DEFAULT_TABLESPACE em DBA_USERS."}, {"id": "S03", "k": "s", "f": "Tabela origem: id PK, nome NOT NULL.\nCREATE TABLE copia AS SELECT * FROM origem;\nO que vem junto?", "res": "Dados + NOT NULL de nome", "d": "PK (e o índice dela) não vem."}, {"id": "S04", "k": "s", "f": "GTT ON COMMIT PRESERVE ROWS:\nINSERT 3 linhas; COMMIT;\nSELECT COUNT(*) na MESMA sessão? E em OUTRA sessão?", "res": "3 · 0", "d": "Linhas sobrevivem ao COMMIT, mas são da sessão."}, {"id": "S05", "k": "s", "f": "GTT ON COMMIT DELETE ROWS:\nINSERT 3 linhas; SELECT COUNT(*); COMMIT; SELECT COUNT(*);", "res": "3 · 0", "d": "COMMIT apaga as linhas."}, {"id": "S06", "k": "s", "f": "PTT ON COMMIT DROP DEFINITION:\nINSERT 3 linhas; COMMIT; SELECT * FROM ora$ptt_...;", "res": "ORA-00942: table or view does not exist", "d": "COMMIT apagou a tabela."}, {"id": "S07", "k": "s", "f": "PTT ON COMMIT PRESERVE DEFINITION:\nINSERT 3; COMMIT; SELECT COUNT(*);\nDepois desconecta e reconecta.", "res": "3 · depois a tabela não existe", "d": "Some no fim da sessão."}, {"id": "S08", "k": "s", "f": "CREATE PRIVATE TEMPORARY TABLE tmp_vendas (id NUMBER)\nON COMMIT DROP DEFINITION;", "res": "Erro: nome inválido", "d": "Falta o prefixo ORA$PTT_."}, {"id": "S09", "k": "s", "f": "Conectado como SYS:\nCREATE PRIVATE TEMPORARY TABLE ora$ptt_x (id NUMBER);", "res": "Erro", "d": "PTT não pode ser criada pelo SYS."}, {"id": "S10", "k": "s", "f": "CREATE GLOBAL TEMPORARY TABLE g (id NUMBER);\n-- sem ON COMMIT. INSERT; COMMIT; SELECT COUNT(*);", "res": "0", "d": "Padrão da GTT é DELETE ROWS."}, {"id": "S11", "k": "s", "f": "ALTER TABLE fornecedores ADD COLUMN (registro VARCHAR2(20));\n-- Oracle 19c", "res": "Erro de sintaxe", "d": "Forma documentada: ADD (registro VARCHAR2(20))."}, {"id": "S12", "k": "s", "f": "vendas.descr VARCHAR2(200) com 'teste' gravado.\nALTER TABLE vendas MODIFY (descr NUMBER NOT NULL);", "res": "ORA-01439", "d": "Trocar tipo exige coluna vazia."}, {"id": "S13", "k": "s", "f": "vendas.descr contém 'testando' (8 caracteres).\nALTER TABLE vendas MODIFY (descr VARCHAR2(5));", "res": "ORA-01441", "d": "Não dá para diminuir: um valor não cabe."}, {"id": "S14", "k": "s", "f": "fornecedores com 2 linhas e cnpj NULL.\nALTER TABLE fornecedores MODIFY (cnpj VARCHAR2(14) NOT NULL);", "res": "ORA-02296: null values found", "d": "Na prática resolvida funciona porque a tabela está vazia."}, {"id": "S15", "k": "s", "f": "ALTER TABLE vendas MODIFY (descr VARCHAR2(500));\n-- descr era VARCHAR2(200) com dados", "res": "Sucesso", "d": "Aumentar tamanho sempre pode."}, {"id": "S16", "k": "s", "f": "ALTER TABLE vendas SET UNUSED (quantidade);\nSELECT quantidade FROM vendas;", "res": "ORA-00904: invalid identifier", "d": "A coluna sumiu para os usuários."}, {"id": "S17", "k": "s", "f": "Depois do SET UNUSED, como trazer a coluna de volta?", "res": "Não tem como (via SQL)", "d": "Só resta DROP UNUSED COLUMNS. Para recuperar: backup."}, {"id": "S18", "k": "s", "f": "Script da aula, em ordem:\nALTER TABLE vendas DROP (data_venda, quantidade);\nALTER TABLE vendas SET UNUSED (quantidade);", "res": "ORA-00904 no 2º comando", "d": "quantidade já foi dropada no comando anterior."}, {"id": "S19", "k": "s", "f": "Tabela com uma única coluna.\nALTER TABLE t DROP COLUMN c1;", "res": "ORA-12983", "d": "Não dá para dropar todas as colunas."}, {"id": "S20", "k": "s", "f": "Rodar o Manipulando_Tabelas.sql do início:\nsegundo CREATE TABLE my_table sem DROP antes.", "res": "ORA-00955: name is already used", "d": "O script supõe que você drope entre os blocos."}, {"id": "S21", "k": "s", "f": "DROP TABLE vendas;\nFLASHBACK TABLE vendas TO BEFORE DROP;", "res": "Tabela volta", "d": "Estava na RECYCLEBIN."}, {"id": "S22", "k": "s", "f": "DROP TABLE vendas PURGE;\nFLASHBACK TABLE vendas TO BEFORE DROP;", "res": "ORA-38305: object not in RECYCLE BIN", "d": "PURGE pula a lixeira."}, {"id": "S23", "k": "s", "f": "DROP TABLE clientes;\n-- pedidos.id_cliente é FK para clientes", "res": "ORA-02449", "d": "PK referenciada por FK. Use CASCADE CONSTRAINTS."}, {"id": "S24", "k": "s", "f": "DELETE FROM vendas; ROLLBACK; SELECT COUNT(*) FROM vendas;", "res": "Contagem original", "d": "DELETE é DML."}, {"id": "S25", "k": "s", "f": "TRUNCATE TABLE vendas; ROLLBACK; SELECT COUNT(*) FROM vendas;", "res": "0", "d": "TRUNCATE é DDL, sem rollback."}, {"id": "S26", "k": "s", "f": "INSERT INTO log_carga VALUES (1,'x');\nCREATE TABLE t9 (id NUMBER);\nROLLBACK;\nO INSERT ficou?", "res": "Ficou", "d": "DDL fez COMMIT implícito."}], "mm": {"ct": "Manipulando Tabelas", "cs": "CREATE · ALTER · DROP", "branches": [{"t": "Conceito e armazenamento", "cards": "C01–C05", "col": "#002b5c", "leaves": ["Unidade básica: linhas e colunas", "Constraints: NOT NULL, PK, FK...", "Permanente x temporária", "TABLESPACE ou a padrão do usuário", "Nome no dicionário em MAIÚSCULO", "Tipos: heap, IOT, partitioned, external, clustered, hybrid"]}, {"t": "Heap e CTAS", "cards": "C06–C08", "col": "#2f6db5", "leaves": ["Heap = padrão, sem ordem", "ORGANIZATION HEAP é opcional", "CTAS copia dados + NOT NULL", "CTAS NÃO copia PK, FK, índices", "Só estrutura: WHERE 1 = 0"]}, {"t": "IOT", "cards": "C09–C11", "col": "#7b4bb0", "leaves": ["Dados dentro de um índice B-tree", "Ordenada pela chave primária", "ORGANIZATION INDEX + PK obrigatória", "Sem PK → ORA-25175", "B-tree = balanceada, não binária", "Doc: ideal para OLTP (acesso por PK)"]}, {"t": "Temporárias GTT x PTT", "cards": "C12–C17", "col": "#c0392b", "leaves": ["GTT: definição global, dados da sessão", "GTT: DELETE ROWS (padrão) · PRESERVE ROWS", "GTT em disco (tablespace temporária)", "PTT: tudo privado, só em memória", "PTT: prefixo ORA$PTT_ · não com SYS", "PTT: DROP DEFINITION (padrão) · PRESERVE DEFINITION", "GTT → ROWS · PTT → DEFINITION"]}, {"t": "ALTER TABLE", "cards": "C18–C21", "col": "#1f7a55", "leaves": ["ADD (col tipo) · não ADD COLUMN", "RENAME COLUMN a TO b", "MODIFY tipo: só coluna vazia (ORA-01439)", "Aumentar tamanho: sempre", "Diminuir: só se couber (ORA-01441)", "NOT NULL: só sem NULLs (ORA-02296)", "DROP COLUMN / DROP (c1, c2)", "Todas as colunas: ORA-12983"]}, {"t": "SET UNUSED", "cards": "C22–C24", "col": "#b06d00", "leaves": ["Só dicionário: instantâneo", "Some para o usuário na hora", "Espaço liberado só no DROP", "Sem volta via SQL", "USER_UNUSED_COL_TABS", "DROP UNUSED COLUMNS na janela"]}, {"t": "Eliminar tabela e dados", "cards": "C25–C29", "col": "#5d6d7e", "leaves": ["DROP → RECYCLEBIN (FLASHBACK volta)", "DROP ... PURGE → sem lixeira", "CASCADE CONSTRAINTS remove FKs filhas", "DELETE: DML, aceita ROLLBACK", "TRUNCATE: DDL, rápido, sem ROLLBACK", "DROP + CREATE perde índices e grants", "DDL faz COMMIT implícito", "TRUNCATE errado: RMAN RECOVER TABLE"]}]}}, {"id": "M04", "title": "DML: INSERT, UPDATE e DELETE", "ref": "Referência para os cenários: tabelas da aula", "reftxt": "CREATE TABLE funcionarios (            CREATE TABLE bonus (\n  id              NUMBER PRIMARY KEY,      employee_id NUMBER,\n  nome            VARCHAR2(100),           bonus       NUMBER DEFAULT 100\n  cargo           VARCHAR2(50) NOT NULL,   );\n  salario         NUMBER(10,2),\n  departamento_id NUMBER                 -- t1 (c1 NUMBER, c2 VARCHAR2(1))\n);                                       -- t2 (c1 NUMBER)\nNa prática (Pratica.sql) a mesma tabela é criada SEM o NOT NULL em cargo, com 20 funcionários.", "cards": [{"id": "V01", "k": "v", "f": "DML (Data Manipulation Language)", "pt": "Linguagem de manipulação de dados", "d": "Comandos que leem e alteram DADOS: SELECT, INSERT, UPDATE, DELETE, MERGE. Aceitam ROLLBACK.", "ex": "UPDATE funcionarios SET salario = salario * 1.15;", "rel": "DDL"}, {"id": "V02", "k": "v", "f": "DDL (Data Definition Language)", "pt": "Linguagem de definição de dados", "d": "Comandos que mudam ESTRUTURA e privilégios: CREATE, ALTER, DROP, TRUNCATE, GRANT, REVOKE. Fazem COMMIT implícito.", "ex": "CREATE TABLE bonus (employee_id NUMBER, bonus NUMBER DEFAULT 100);", "rel": "DML"}, {"id": "V03", "k": "v", "f": "Transaction control", "pt": "Controle de transação", "d": "Comandos que confirmam ou desfazem o trabalho do DML: COMMIT, ROLLBACK, SAVEPOINT, SET TRANSACTION.", "ex": "SAVEPOINT antes_delete;\nROLLBACK TO antes_delete;", "rel": "Transação"}, {"id": "V04", "k": "v", "f": "Session control / System control", "pt": "Controle de sessão / de sistema", "d": "ALTER SESSION muda a sessão atual. ALTER SYSTEM muda a instância.", "ex": "ALTER SESSION SET nls_date_format = 'DD/MM/YYYY';\nALTER SYSTEM SWITCH LOGFILE;", "rel": ""}, {"id": "V05", "k": "v", "f": "Column list / Value list", "pt": "Lista de colunas / Lista de valores", "d": "No INSERT, cada coluna da lista recebe o valor na mesma posição da lista de valores.", "ex": "INSERT INTO funcionarios (id, nome, cargo)\nVALUES (1, 'Ana Silva', 'Analista');", "rel": "INSERT"}, {"id": "V06", "k": "v", "f": "Default value", "pt": "Valor padrão", "d": "Valor que a coluna recebe quando é omitida no INSERT ou quando se usa a palavra DEFAULT.", "ex": "bonus NUMBER DEFAULT 100", "rel": "DEFAULT"}, {"id": "V07", "k": "v", "f": "Implicit conversion", "pt": "Conversão implícita", "d": "Oracle converte o tipo sozinho se for possível: '1' vira 1. Se não der, erro.", "ex": "INSERT INTO t2 SELECT c2 FROM t1;   -- VARCHAR2 '1' → NUMBER 1", "rel": "ORA-01722"}, {"id": "V08", "k": "v", "f": "Statement-level atomicity", "pt": "Atomicidade por comando", "d": "Um comando DML é tudo ou nada: se uma linha falhar, nenhuma linha daquele comando fica.", "ex": "INSERT ... SELECT de 10 linhas; a 7ª viola a PK → 0 linhas inseridas", "rel": "Transação"}, {"id": "V09", "k": "v", "f": "Commit / Rollback", "pt": "Confirmar / Desfazer", "d": "COMMIT torna as alterações permanentes e visíveis às outras sessões. ROLLBACK desfaz o que não foi confirmado.", "ex": "UPDATE funcionarios SET salario = 2000;\nROLLBACK;   -- volta tudo", "rel": "SAVEPOINT"}, {"id": "V10", "k": "v", "f": "Row lock", "pt": "Bloqueio de linha", "d": "Linha alterada fica bloqueada para outras sessões até o COMMIT ou ROLLBACK. Leitura não é bloqueada.", "ex": "-- sessão B tenta UPDATE na mesma linha → espera", "rel": "Concorrência"}, {"id": "C01", "k": "c", "sec": "Tipos de comandos SQL", "f": "Quais são as categorias de comandos SQL no Oracle?", "a": "<b>DDL:<\/b> CREATE, ALTER, DROP, GRANT, REVOKE (e TRUNCATE).<br><b>DML:<\/b> SELECT, INSERT, UPDATE, DELETE, MERGE.<br><b>Controle de transação:<\/b> COMMIT, ROLLBACK, SAVEPOINT.<br><b>Controle de sessão:<\/b> ALTER SESSION.<br><b>Controle de sistema:<\/b> ALTER SYSTEM.", "why": "", "ex": "GRANT SELECT ON funcionarios TO rh;   -- DDL na classificação Oracle\nSELECT * FROM funcionarios;           -- DML na classificação Oracle", "trap": "Na documentação Oracle, GRANT/REVOKE são DDL e SELECT é DML. Muitos cursos chamam GRANT de \"DCL\", mas esse termo não aparece na classificação oficial.", "tag": ""}, {"id": "C02", "k": "c", "sec": "Tipos de comandos SQL", "f": "Qual a diferença prática entre DDL e DML?", "a": "DDL muda estrutura e faz COMMIT implícito (antes e depois). DML muda dados e fica pendente até COMMIT ou ROLLBACK.", "why": "", "ex": "UPDATE funcionarios SET salario = 1;\nCREATE TABLE x (id NUMBER);   -- confirma o UPDATE junto\nROLLBACK;                     -- não desfaz mais o UPDATE", "trap": "Visto no Módulo 03. Cai de novo aqui.", "tag": "complemento: COMMIT implícito"}, {"id": "C03", "k": "c", "sec": "INSERT com VALUES", "f": "Sintaxe do INSERT com VALUES?", "a": "INSERT INTO tabela (lista_de_colunas) VALUES (lista_de_valores). Cada coluna recebe o valor da mesma posição.", "why": "", "ex": "INSERT INTO funcionarios (id, nome, cargo, salario, departamento_id)\nVALUES (1, 'Ana Silva', 'Analista', 7000.00, 1);", "trap": "VALUES insere uma linha por comando (até o 19c). Para várias, um INSERT por linha, INSERT ALL ou INSERT ... SELECT.", "tag": ""}, {"id": "C04", "k": "c", "sec": "INSERT com VALUES", "f": "E se eu não informar a lista de colunas?", "a": "A lista de valores precisa ter valor para TODAS as colunas, na ordem em que foram definidas na tabela (a ordem do DESC).", "why": "", "ex": "INSERT INTO funcionarios VALUES (3, 'Carlos Eduardo', 'Gerente', 12000.00, 3);", "trap": "Se alguém fizer ALTER TABLE ADD em uma coluna, todo INSERT sem lista de colunas passa a falhar. Em código de produção, sempre liste as colunas.", "tag": ""}, {"id": "C05", "k": "c", "sec": "INSERT com VALUES", "f": "O que acontece com a coluna omitida no INSERT?", "a": "Recebe o DEFAULT da coluna, se houver; senão, NULL. Se for NOT NULL sem DEFAULT: ORA-01400.", "why": "", "ex": "INSERT INTO funcionarios (id, nome, salario, departamento_id)\nVALUES (2, 'Bruno Gomes', 8000.00, 2);\n-- ORA-01400: cannot insert NULL into (\"...\".\"FUNCIONARIOS\".\"CARGO\")", "trap": "O script da aula provoca esse erro de propósito: cargo é NOT NULL.", "tag": ""}, {"id": "C06", "k": "c", "sec": "INSERT com VALUES", "f": "Como descobrir quais colunas são obrigatórias antes do INSERT?", "a": "DESCRIBE: a coluna Null? mostra NOT NULL. Essas precisam de valor, a menos que tenham DEFAULT.", "why": "", "ex": "DESC funcionarios\n Name     Null?    Type\n ID       NOT NULL NUMBER\n CARGO    NOT NULL VARCHAR2(50)", "trap": "DESC não mostra o DEFAULT. Para ver: USER_TAB_COLUMNS.DATA_DEFAULT.", "tag": ""}, {"id": "C07", "k": "c", "sec": "INSERT com VALUES", "f": "DEFAULT x NULL explícito?", "a": "O DEFAULT vale quando a coluna é omitida ou quando se escreve a palavra DEFAULT. Se você passar NULL explicitamente, fica NULL.", "why": "", "ex": "INSERT INTO bonus (employee_id) VALUES (1);    -- bonus = 100\nINSERT INTO bonus VALUES (2, DEFAULT);         -- bonus = 100\nINSERT INTO bonus VALUES (3, NULL);            -- bonus = NULL", "trap": "", "tag": "complemento: palavra DEFAULT e NULL explícito"}, {"id": "C08", "k": "c", "sec": "INSERT com VALUES", "f": "Erros de quantidade de valores?", "a": "Menos valores que colunas: ORA-00947 (not enough values). Mais valores que colunas: ORA-00913 (too many values).", "why": "", "ex": "INSERT INTO funcionarios VALUES (3, 'Carlos', 'Gerente', 12000);   -- ORA-00947\nINSERT INTO funcionarios (id, nome) VALUES (30, 'X', 'Y');         -- ORA-00913", "trap": "", "tag": "complemento"}, {"id": "C09", "k": "c", "sec": "INSERT com VALUES", "f": "O que acontece com valor fora da precisão de NUMBER(p,s)?", "a": "Casas decimais a mais: arredonda para s, sem erro. Dígitos inteiros a mais (mais que p - s): ORA-01438.", "why": "", "ex": "-- salario NUMBER(10,2): até 8 dígitos inteiros\nINSERT ... salario = 1234.567      -- grava 1234.57\nINSERT ... salario = 123456789     -- ORA-01438", "trap": "", "tag": "complemento"}, {"id": "C10", "k": "c", "sec": "INSERT com VALUES", "f": "Como inserir várias linhas num comando só?", "a": "INSERT ALL (todas as versões) ou, no 23ai, VALUES com várias linhas separadas por vírgula.", "why": "", "ex": "INSERT ALL\n  INTO bonus VALUES (1, 100)\n  INTO bonus VALUES (2, 200)\nSELECT * FROM dual;\n\n-- 23ai:\nINSERT INTO bonus VALUES (1, 100), (2, 200);", "trap": "", "tag": "complemento: INSERT ALL e 23ai"}, {"id": "C11", "k": "c", "sec": "INSERT com SELECT", "f": "Como inserir a partir de uma consulta?", "a": "Troque VALUES por um SELECT. Não usa a palavra VALUES nem parênteses em volta do SELECT. Insere tantas linhas quantas o SELECT devolver.", "why": "", "ex": "INSERT INTO bonus\n  SELECT employee_id, salary * 1.1\n  FROM hr.employees\n  WHERE commission_pct > 0.25;", "trap": "INSERT INTO bonus VALUES (SELECT ...) está errado.", "tag": ""}, {"id": "C12", "k": "c", "sec": "INSERT com SELECT", "f": "Que regra de tipo vale no INSERT ... SELECT?", "a": "O tipo da origem precisa ser igual ou implicitamente conversível para o tipo do destino.", "why": "", "ex": "-- t1.c2 VARCHAR2 = '1' → t2.c1 NUMBER\nINSERT INTO t2 SELECT c2 FROM t1;   -- ok (converte)\n-- se t1.c2 = 'A' → ORA-01722", "trap": "Funciona hoje com '1' e quebra amanhã quando alguém gravar 'A'.", "tag": ""}, {"id": "C13", "k": "c", "sec": "INSERT com SELECT", "f": "Posso fazer INSERT ... SELECT da própria tabela?", "a": "Sim. O SELECT lê a tabela como estava no início do comando, então as linhas recém-inseridas não entram na leitura.", "why": "", "ex": "INSERT INTO funcionarios\n  SELECT id + 4, nome, cargo, salario + 500, departamento_id\n  FROM funcionarios;", "trap": "Se o novo id calculado já existir, ORA-00001 e NENHUMA linha entra (atomicidade do comando).", "tag": ""}, {"id": "C14", "k": "c", "sec": "UPDATE", "f": "Sintaxe do UPDATE?", "a": "UPDATE tabela SET coluna = valor [, coluna = valor ...] [WHERE condição]. Com WHERE, só as linhas que atendem são alteradas.", "why": "", "ex": "UPDATE funcionarios\nSET nome = 'Paulo Ferreira', cargo = 'Analista', salario = 9000\nWHERE id = 4;", "trap": "Várias colunas: um SET só, separadas por vírgula. SET a = 1 SET b = 2 é erro.", "tag": ""}, {"id": "C15", "k": "c", "sec": "UPDATE", "f": "Como usar o valor atual da coluna no UPDATE?", "a": "Referencie a própria coluna do lado direito do =.", "why": "", "ex": "UPDATE funcionarios SET salario = salario * 1.15;   -- +15% para todos", "trap": "Sem WHERE, atinge TODAS as linhas. Aqui é o que se quer; na maioria das vezes não é.", "tag": ""}, {"id": "C16", "k": "c", "sec": "UPDATE", "f": "UPDATE ou DELETE que não acha nenhuma linha dá erro?", "a": "Não. Retorna \"0 linhas atualizadas/excluídas\" e segue.", "why": "", "ex": "UPDATE funcionarios SET salario = 1 WHERE id = 999;   -- 0 rows updated\nDELETE FROM funcionarios WHERE nome = 'kleber oliveira';   -- 0 rows (caixa)", "trap": "Em script, sempre confira a contagem retornada. Zero linhas pode ser erro de digitação silencioso.", "tag": ""}, {"id": "C17", "k": "c", "sec": "DELETE", "f": "Sintaxe do DELETE?", "a": "DELETE FROM tabela [WHERE condição]. Com WHERE, só as linhas que atendem são eliminadas. A palavra FROM é opcional no Oracle.", "why": "", "ex": "DELETE FROM funcionarios WHERE departamento_id = 3;\nDELETE funcionarios WHERE id = 5;   -- também funciona", "trap": "", "tag": "complemento: FROM opcional"}, {"id": "C18", "k": "c", "sec": "DELETE", "f": "DELETE sem WHERE x TRUNCATE?", "a": "DELETE sem WHERE: DML, apaga linha a linha, gera undo, aceita ROLLBACK. TRUNCATE: DDL, rápido, sem ROLLBACK (Módulo 03).", "why": "", "ex": "DELETE FROM funcionarios;   ROLLBACK;   -- voltam\nTRUNCATE TABLE funcionarios; ROLLBACK;  -- não voltam", "trap": "", "tag": ""}, {"id": "C19", "k": "c", "sec": "Transações e segurança", "f": "Qual o risco de UPDATE/DELETE sem WHERE?", "a": "Altera ou apaga a tabela inteira. Antes do COMMIT, ROLLBACK resolve. Depois do COMMIT, só uma rotina de recuperação.", "why": "", "ex": "UPDATE funcionarios SET salario = 2000;   -- todos!\nROLLBACK;", "trap": "Boa prática da própria prática da aula: rodar um SELECT com o MESMO WHERE antes do UPDATE/DELETE e conferir as linhas.", "tag": ""}, {"id": "C20", "k": "c", "sec": "Transações e segurança", "f": "Quem enxerga minhas alterações antes do COMMIT?", "a": "Só a minha sessão. As outras sessões continuam vendo o valor anterior (consistência de leitura) e, se tentarem alterar a mesma linha, ficam esperando o lock.", "why": "", "ex": "-- sessão A: UPDATE funcionarios SET salario = 1 WHERE id = 2;  (sem commit)\n-- sessão B: SELECT salario ... WHERE id = 2;   -- vê o valor antigo\n-- sessão B: UPDATE ... WHERE id = 2;           -- fica esperando", "trap": "Visão de DBA: transação esquecida aberta é causa clássica de sessões travadas (enq: TX - row lock contention).", "tag": "complemento"}, {"id": "C21", "k": "c", "sec": "Transações e segurança", "f": "Para que serve SAVEPOINT?", "a": "Marca um ponto dentro da transação. ROLLBACK TO desfaz só o que veio depois dele.", "why": "", "ex": "INSERT INTO funcionarios ... ;\nSAVEPOINT a;\nDELETE FROM funcionarios WHERE cargo = 'Analista';\nROLLBACK TO a;   -- desfaz o DELETE, mantém o INSERT\nCOMMIT;", "trap": "", "tag": "complemento"}, {"id": "C22", "k": "c", "sec": "Transações e segurança", "f": "O que acontece com DML pendente quando a sessão termina?", "a": "SQL*Plus: EXIT normal faz COMMIT (EXITCOMMIT ON por padrão). Queda de conexão ou término anormal: ROLLBACK. SQL Developer pergunta se quer confirmar.", "why": "", "ex": "SQL> UPDATE funcionarios SET salario = 1;\nSQL> EXIT        -- confirmado!", "trap": "Muita gente acha que sair sem COMMIT desfaz. No SQL*Plus, não desfaz.", "tag": "complemento"}, {"id": "C23", "k": "c", "sec": "Transações e segurança", "f": "Fiz COMMIT de um UPDATE errado. E agora?", "a": "Se o undo ainda tiver os dados: Flashback Query (AS OF TIMESTAMP) para ver e restaurar o valor antigo. Senão: Flashback Table, RMAN ou Data Pump.", "why": "", "ex": "SELECT * FROM funcionarios\nAS OF TIMESTAMP SYSTIMESTAMP - INTERVAL '10' MINUTE\nWHERE id = 15;", "trap": "Depende do UNDO_RETENTION e do volume de undo gerado. Quanto antes, melhor.", "tag": "complemento: visão de DBA"}, {"id": "C24", "k": "c", "sec": "Prática da aula (funcionarios)", "f": "Por que a ordem dos passos da prática muda o resultado?", "a": "O passo 4 transforma em Gerente todo mundo com salário &gt; 10000. Gustavo e Paula eram Analistas e viram Gerentes. O passo 7 transforma Joana em Desenvolvedora. Por isso o passo 8 (apagar Analistas) remove só 4: Ana, Daniela, Marcos e Sergio.", "why": "", "ex": "-- confirme antes do DELETE:\nSELECT id, nome FROM funcionarios WHERE cargo = 'Analista';", "trap": "Em prova, questões de DML em sequência exigem que você acompanhe o estado da tabela passo a passo.", "tag": ""}, {"id": "C25", "k": "c", "sec": "Prática da aula (funcionarios)", "f": "Qual o problema do id + 21 no passo 6 da prática resolvida?", "a": "Só funciona porque, naquele momento, o maior id é 21. Se rodar de novo, ou com outros dados, o id calculado colide com um existente: ORA-00001 e nada é inserido. Em produção, use SEQUENCE ou IDENTITY.", "why": "", "ex": "-- 2ª execução do passo 6: linhas > 11000 são 2, 16, 23, 37\n-- novos ids: 23, 37, 44, 58 → 23 e 37 já existem → ORA-00001", "trap": "Chave gerada com conta (id + n) é gambiarra de exercício.", "tag": "correção do material: abordagem frágil na prática resolvida"}, {"id": "S01", "k": "s", "f": "INSERT INTO funcionarios (id, nome, salario, departamento_id)\nVALUES (2, 'Bruno Gomes', 8000.00, 2);", "res": "ORA-01400", "d": "cargo é NOT NULL e ficou de fora."}, {"id": "S02", "k": "s", "f": "INSERT INTO funcionarios (id, nome, cargo, departamento_id)\nVALUES (4, 'Daniela Rocha', 'Analista', 1);", "res": "Sucesso, salario = NULL", "d": "Coluna omitida sem DEFAULT vira NULL."}, {"id": "S03", "k": "s", "f": "INSERT INTO funcionarios VALUES (3, 'Carlos', 'Gerente', 12000);", "res": "ORA-00947: not enough values", "d": "5 colunas, 4 valores."}, {"id": "S04", "k": "s", "f": "INSERT INTO funcionarios (id, nome) VALUES (30, 'X', 'Y');", "res": "ORA-00913: too many values", "d": "2 colunas, 3 valores."}, {"id": "S05", "k": "s", "f": "INSERT INTO funcionarios VALUES (1, 'Novo', 'Analista', 5000, 1);\n-- id 1 já existe", "res": "ORA-00001: unique constraint violated", "d": "PK duplicada."}, {"id": "S06", "k": "s", "f": "INSERT INTO bonus (employee_id) VALUES (1);", "res": "bonus = 100", "d": "Coluna omitida recebe o DEFAULT."}, {"id": "S07", "k": "s", "f": "INSERT INTO bonus VALUES (2, NULL);", "res": "bonus = NULL", "d": "NULL explícito vence o DEFAULT."}, {"id": "S08", "k": "s", "f": "INSERT INTO bonus VALUES (3, DEFAULT);", "res": "bonus = 100", "d": "Palavra DEFAULT força o padrão."}, {"id": "S09", "k": "s", "f": "t1.c2 = '1'.\nINSERT INTO t2 SELECT c2 FROM t1;", "res": "Sucesso, c1 = 1", "d": "Conversão implícita VARCHAR2 → NUMBER."}, {"id": "S10", "k": "s", "f": "t1.c2 = 'A'.\nINSERT INTO t2 SELECT c2 FROM t1;", "res": "ORA-01722", "d": "'A' não converte para número."}, {"id": "S11", "k": "s", "f": "salario NUMBER(10,2) recebe 1234.567", "res": "1234.57", "d": "Arredonda as casas decimais excedentes."}, {"id": "S12", "k": "s", "f": "salario NUMBER(10,2) recebe 123456789", "res": "ORA-01438", "d": "Só cabem 8 dígitos inteiros (10 - 2)."}, {"id": "S13", "k": "s", "f": "UPDATE funcionarios SET salario = 2000;\nROLLBACK;\nSELECT salario FROM funcionarios;", "res": "Salários originais", "d": "Sem COMMIT, ROLLBACK desfaz."}, {"id": "S14", "k": "s", "f": "UPDATE funcionarios SET salario = 1 WHERE id = 999;", "res": "0 linhas, sem erro", "d": "Nenhuma linha atendeu ao WHERE."}, {"id": "S15", "k": "s", "f": "DELETE FROM funcionarios WHERE nome = 'kleber oliveira';", "res": "0 linhas", "d": "Comparação de texto é case-sensitive: o nome é 'Kleber Oliveira'."}, {"id": "S16", "k": "s", "f": "DELETE funcionarios WHERE id = 5;", "res": "Sucesso", "d": "FROM é opcional no Oracle."}, {"id": "S17", "k": "s", "f": "UPDATE funcionarios SET cargo = 'Gerente' SET salario = 1 WHERE id = 4;", "res": "Erro de sintaxe", "d": "Um SET só, colunas separadas por vírgula."}, {"id": "S18", "k": "s", "f": "Prática: depois dos passos 1 a 5, quantos funcionários restam?", "res": "14", "d": "20 + Vitor - Kleber - 6 do departamento 3 (ids 3, 6, 9, 12, 15, 18)."}, {"id": "S19", "k": "s", "f": "Prática, passo 6: quem é duplicado e com que ids?", "res": "Bruno → 23 (13200) e Paula → 37 (13750)", "d": "Gustavo tem 11000, que não é > 11000."}, {"id": "S20", "k": "s", "f": "Prática, passo 8: quantos Analistas são excluídos?", "res": "4: Ana, Daniela, Marcos, Sergio", "d": "Gustavo e Paula viraram Gerente no passo 4; Joana virou Desenvolvedor no 7."}, {"id": "S21", "k": "s", "f": "Prática: quantas linhas no final (após o passo 9)?", "res": "12", "d": "14 + 2 duplicados - 4 Analistas."}, {"id": "S22", "k": "s", "f": "Prática: rodar o passo 6 uma segunda vez.", "res": "ORA-00001, nenhuma linha inserida", "d": "Ids 23 e 37 calculados de novo já existem. O comando é tudo ou nada."}, {"id": "S23", "k": "s", "f": "Sessão A: UPDATE ... WHERE id = 2 (sem COMMIT).\nSessão B: SELECT salario WHERE id = 2. E depois UPDATE na mesma linha?", "res": "SELECT vê o valor antigo · UPDATE fica esperando", "d": "Leitura consistente e lock de linha."}, {"id": "S24", "k": "s", "f": "INSERT ...; SAVEPOINT a; DELETE ...; ROLLBACK TO a; COMMIT;", "res": "INSERT fica, DELETE desfeito", "d": "ROLLBACK TO desfaz só o que veio depois do savepoint."}, {"id": "S25", "k": "s", "f": "SQL*Plus: UPDATE funcionarios SET salario = 1;\nEXIT", "res": "Confirmado", "d": "EXITCOMMIT ON é o padrão do SQL*Plus."}], "mm": {"ct": "DML", "cs": "INSERT · UPDATE · DELETE", "branches": [{"t": "Tipos de comandos SQL", "cards": "C01–C02", "col": "#002b5c", "leaves": ["DDL: CREATE, ALTER, DROP, GRANT, REVOKE", "DML: SELECT, INSERT, UPDATE, DELETE, MERGE", "Transação: COMMIT, ROLLBACK, SAVEPOINT", "Sessão: ALTER SESSION", "Sistema: ALTER SYSTEM", "DDL faz COMMIT implícito"]}, {"t": "INSERT ... VALUES", "cards": "C03–C10", "col": "#2f6db5", "leaves": ["Coluna da lista ↔ valor na mesma posição", "Sem lista: todas, na ordem do DESC", "Omitida → DEFAULT ou NULL", "NOT NULL omitida → ORA-01400", "NULL explícito vence o DEFAULT", "Faltou valor ORA-00947 · sobrou ORA-00913", "NUMBER(10,2): decimal arredonda, inteiro demais ORA-01438"]}, {"t": "INSERT ... SELECT", "cards": "C11–C13", "col": "#7b4bb0", "leaves": ["Troca VALUES por SELECT", "Sem VALUES, sem parênteses", "Tipo igual ou conversível", "'1' → 1 ok · 'A' → ORA-01722", "Pode ler da própria tabela", "PK repetida: nada entra (ORA-00001)"]}, {"t": "UPDATE", "cards": "C14–C16", "col": "#1f7a55", "leaves": ["SET col = valor [, col = valor]", "Um SET só, vírgula entre colunas", "salario = salario * 1.15", "Sem WHERE: todas as linhas", "0 linhas não é erro"]}, {"t": "DELETE", "cards": "C17–C18", "col": "#c0392b", "leaves": ["DELETE FROM tab [WHERE]", "FROM é opcional no Oracle", "Sem WHERE: todas as linhas", "DELETE = DML, aceita ROLLBACK", "TRUNCATE = DDL, sem ROLLBACK"]}, {"t": "Transações e segurança", "cards": "C19–C23", "col": "#b06d00", "leaves": ["SELECT com o mesmo WHERE antes", "Antes do COMMIT: só minha sessão vê", "Outra sessão na mesma linha: espera", "SAVEPOINT + ROLLBACK TO", "SQL*Plus EXIT = COMMIT", "Commit errado: Flashback Query"]}, {"t": "Prática funcionarios", "cards": "C24–C25", "col": "#5d6d7e", "leaves": ["A ordem dos passos muda o resultado", "Passo 4 tira Gustavo e Paula de Analista", "Passo 8 apaga só 4", "id + 21 é frágil → SEQUENCE", "Final: 12 linhas"]}]}}, {"id": "M05", "title": "Agrupando resultados e funções de agregação", "ref": "Referência para os cenários: tabelas dos scripts da aula e da prática", "reftxt": "T1 (C1)        T2 (C1, C2)        VENDAS_FRUTAS (script da aula)\n 1              1     1           1 Maçã    10\n 1              1     1           2 Banana  20\n 1              NULL  1           3 Maçã    15\n 3              3     3           4 Laranja 18\n                                  5 Banana  12\n                                  (6º INSERT repete VendaID 4: falha)\n\nLIVROS (prática): 20 livros, 2 com preço NULL\n Ficcao 8 · Fantasia 6 · Classico 5 · Nao-ficcao 1\n J.K. Rowling 3 livros · George Orwell 2 · J.R.R. Tolkien 2 · demais 1\n NULL: 'O Sol é para Todos' (Harper Lee) e 'Fahrenheit 451' (Ray Bradbury), ambos Ficcao", "cards": [{"id": "V01", "k": "v", "f": "Aggregate function / Group function", "pt": "Função de agregação / de grupo", "d": "Recebe um conjunto de linhas e devolve UMA linha de resultado: COUNT, SUM, AVG, MIN, MAX, LISTAGG.", "ex": "SELECT COUNT(*) FROM hr.employees;   -- 107 linhas → 1", "rel": "Single-row function"}, {"id": "V02", "k": "v", "f": "GROUP BY clause", "pt": "Cláusula de agrupamento", "d": "Divide as linhas em grupos pelo valor de uma ou mais expressões. A agregação é calculada por grupo.", "ex": "SELECT categoria, SUM(preco) FROM vendas GROUP BY categoria;", "rel": "HAVING"}, {"id": "V03", "k": "v", "f": "HAVING clause", "pt": "Cláusula de filtro de grupos", "d": "Filtra os GRUPOS depois da agregação. É o WHERE dos grupos.", "ex": "... GROUP BY produto HAVING SUM(quantidade) > 15;", "rel": "WHERE"}, {"id": "V04", "k": "v", "f": "Grouping expression", "pt": "Expressão de agrupamento", "d": "A coluna ou expressão listada no GROUP BY. Toda coluna não agregada do SELECT precisa estar entre elas.", "ex": "GROUP BY department_id", "rel": "ORA-00979"}, {"id": "V05", "k": "v", "f": "Distinct / All", "pt": "Distintos / Todos", "d": "Modificador dentro da função: DISTINCT (= UNIQUE) considera só valores diferentes; ALL considera todos e é o padrão.", "ex": "SELECT COUNT(DISTINCT c1), COUNT(ALL c1) FROM t2;", "rel": "Duplicatas"}, {"id": "V06", "k": "v", "f": "Average (AVG)", "pt": "Média", "d": "Soma dos valores não nulos dividida pela QUANTIDADE de valores não nulos.", "ex": "SELECT AVG(salary) FROM hr.employees;", "rel": "NVL"}, {"id": "V07", "k": "v", "f": "Row count (COUNT)", "pt": "Contagem", "d": "COUNT(*) conta linhas. COUNT(expr) conta valores não nulos da expressão.", "ex": "SELECT COUNT(*), COUNT(c1) FROM t2;   -- 4 | 3", "rel": "NULL"}, {"id": "V08", "k": "v", "f": "String aggregation (LISTAGG)", "pt": "Agregação de texto", "d": "Concatena os valores do grupo numa string, com separador e ordem definidos em WITHIN GROUP.", "ex": "LISTAGG(last_name, '; ') WITHIN GROUP (ORDER BY salary)", "rel": "WITHIN GROUP"}, {"id": "V09", "k": "v", "f": "Nested aggregate", "pt": "Agregação aninhada", "d": "Função de grupo dentro de outra. Máximo de 2 níveis e exige GROUP BY.", "ex": "SELECT AVG(MIN(salary)) FROM hr.employees GROUP BY department_id;", "rel": "ORA-00935"}, {"id": "V10", "k": "v", "f": "NVL", "pt": "Substituir nulo", "d": "NVL(expr, valor) devolve o valor quando expr é NULL. Usado para fazer a agregação considerar os nulos.", "ex": "SELECT AVG(NVL(preco, 0)) FROM livros;", "rel": "COALESCE"}, {"id": "C01", "k": "c", "sec": "GROUP BY", "f": "Para que serve o GROUP BY?", "a": "Agrupar as linhas da consulta pelo valor de uma ou mais colunas ou expressões. Cada grupo vira UMA linha no resultado, e as funções de agregação são calculadas por grupo.", "why": "", "ex": "SELECT categoria, SUM(preco)\nFROM vendas\nGROUP BY categoria;", "trap": "", "tag": ""}, {"id": "C02", "k": "c", "sec": "GROUP BY", "f": "Qual a regra de ouro entre SELECT e GROUP BY?", "a": "Toda coluna do SELECT que NÃO está dentro de função de agregação precisa estar no GROUP BY. O contrário não vale: o GROUP BY pode ter colunas que não aparecem no SELECT.", "why": "", "ex": "SELECT produto, categoria, SUM(preco) FROM vendas GROUP BY categoria;\n-- ORA-00979: not a GROUP BY expression (produto)\n\nSELECT SUM(preco) FROM vendas GROUP BY categoria;   -- válido", "trap": "ORA-00979 é o erro mais cobrado deste assunto.", "tag": "complemento"}, {"id": "C03", "k": "c", "sec": "GROUP BY", "f": "Agregação com coluna comum, sem GROUP BY?", "a": "Erro ORA-00937. Sem GROUP BY, a tabela inteira é um grupo só, e a coluna comum tem vários valores para uma linha de resultado.", "why": "", "ex": "SELECT department_id, AVG(salary) FROM hr.employees;\n-- ORA-00937: not a single-group group function", "trap": "", "tag": "complemento"}, {"id": "C04", "k": "c", "sec": "GROUP BY", "f": "Posso agrupar por mais de uma coluna?", "a": "Sim. Cada combinação distinta das colunas vira um grupo.", "why": "", "ex": "SELECT marca, cor, COUNT(*) FROM carros GROUP BY marca, cor;", "trap": "", "tag": ""}, {"id": "C05", "k": "c", "sec": "GROUP BY", "f": "O GROUP BY ordena o resultado?", "a": "Não garante ordem. Para ordenar, use ORDER BY.", "why": "", "ex": "SELECT categoria, SUM(preco) FROM vendas GROUP BY categoria ORDER BY 1;", "trap": "Em versões antigas o GROUP BY parecia ordenar (sort). Hoje usa hash e a ordem varia.", "tag": ""}, {"id": "C06", "k": "c", "sec": "GROUP BY", "f": "Como o GROUP BY trata NULL?", "a": "Todas as linhas com NULL na coluna agrupada formam UM grupo.", "why": "", "ex": "SELECT department_id, COUNT(*) FROM hr.employees GROUP BY department_id;\n-- aparece uma linha com department_id NULL (Grant, sem departamento)", "trap": "", "tag": "complemento"}, {"id": "C07", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "O que caracteriza uma função de agregação?", "a": "Devolve UMA linha para um grupo de linhas. Com GROUP BY, uma por grupo. Sem GROUP BY, a função age sobre todas as linhas da consulta.", "why": "", "ex": "SELECT AVG(salary) FROM hr.employees;                              -- 1 linha\nSELECT AVG(salary) FROM hr.employees GROUP BY department_id;       -- 1 por depto", "trap": "", "tag": ""}, {"id": "C08", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "Quais as principais funções de agregação da aula?", "a": "AVG, COUNT, MIN, MAX, SUM e LISTAGG.", "why": "", "ex": "SELECT COUNT(*), SUM(salary), AVG(salary), MIN(salary), MAX(salary)\nFROM hr.employees;", "trap": "", "tag": ""}, {"id": "C09", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "DISTINCT, UNIQUE e ALL dentro da função?", "a": "DISTINCT e UNIQUE são iguais: a função considera só valores diferentes. ALL considera todos, inclusive duplicatas, e é o padrão.", "why": "", "ex": "-- T1: 1, 1, 1, 3\nSELECT AVG(c1) FROM t1;            -- 1.5  (6/4)\nSELECT AVG(DISTINCT c1) FROM t1;   -- 2    ((1+3)/2)", "trap": "", "tag": ""}, {"id": "C10", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "Como as funções de agregação tratam NULL?", "a": "Ignoram. A única exceção é COUNT(*), que conta linhas. Para considerar os nulos, troque o NULL por um valor com NVL.", "why": "", "ex": "-- T2.c1: 1, 1, NULL, 3\nSUM(c1) = 5 · AVG(c1) = 1.67 (5/3) · COUNT(c1) = 3\nAVG(NVL(c1,0)) = 1.25 (5/4)", "trap": "AVG ignora o NULL tanto na soma quanto na divisão. Por isso o resultado muda com NVL.", "tag": "complemento: AVG com NVL"}, {"id": "C11", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "Agregação sobre conjunto vazio ou só de NULLs?", "a": "COUNT devolve 0. SUM, AVG, MIN e MAX devolvem NULL.", "why": "", "ex": "SELECT COUNT(*), SUM(salary) FROM hr.employees WHERE 1 = 0;   -- 0 | NULL", "trap": "Relatório que soma valores pode mostrar vazio em vez de 0. Use NVL(SUM(x), 0).", "tag": "complemento"}, {"id": "C12", "k": "c", "sec": "Funções de agregação: regras gerais", "f": "Posso usar função de agregação no WHERE?", "a": "Não. O WHERE filtra linhas antes do agrupamento. Erro ORA-00934. Filtro sobre agregação vai no HAVING.", "why": "", "ex": "SELECT produto FROM vendas_frutas WHERE SUM(quantidade) > 15 GROUP BY produto;\n-- ORA-00934: group function is not allowed here", "trap": "", "tag": "complemento"}, {"id": "C13", "k": "c", "sec": "COUNT", "f": "COUNT(*) x COUNT(coluna) x COUNT(DISTINCT coluna)?", "a": "COUNT(*): conta LINHAS, inclusive linhas com NULL em todas as colunas.<br>COUNT(coluna): conta valores NÃO nulos.<br>COUNT(DISTINCT coluna): conta valores não nulos e diferentes.", "why": "", "ex": "-- T2.c1: 1, 1, NULL, 3\nCOUNT(*)          -- 4\nCOUNT(c1)         -- 3\nCOUNT(DISTINCT c1)-- 2", "trap": "O slide diz que COUNT(*) conta linhas \"que contenham algum valor em qualquer coluna\". Errado: conta todas as linhas, mesmo as totalmente nulas.", "tag": "correção do material: COUNT(*)"}, {"id": "C14", "k": "c", "sec": "COUNT", "f": "Como fazer o COUNT contar os NULL?", "a": "Usar NVL para trocar o NULL por um valor, ou simplesmente COUNT(*).", "why": "", "ex": "COUNT(NVL(c1, 0))            -- 4\nCOUNT(DISTINCT NVL(c1, 0))   -- 3 (0, 1, 3)", "trap": "COUNT(DISTINCT NVL(c1,0)) passa a tratar o NULL como mais um valor distinto.", "tag": ""}, {"id": "C15", "k": "c", "sec": "AVG, SUM, MIN e MAX", "f": "Quais tipos de dado AVG e SUM aceitam?", "a": "Numérico, ou tipo que o Oracle consiga converter implicitamente para número.", "why": "", "ex": "SELECT AVG(salary), SUM(salary) FROM hr.employees;", "trap": "AVG/SUM em coluna de texto com valor não numérico: ORA-01722.", "tag": ""}, {"id": "C16", "k": "c", "sec": "AVG, SUM, MIN e MAX", "f": "MIN e MAX funcionam com quais tipos?", "a": "Número, texto e data. Texto compara em ordem alfabética (binária); data compara cronologicamente.", "why": "", "ex": "SELECT MIN(produto), MAX(produto) FROM vendas_frutas;   -- Banana | Maçã\nSELECT MIN(data_venda) FROM vendas;                      -- 01/01/2023", "trap": "Em texto, maiúscula vem antes de minúscula na ordem binária: 'Zebra' < 'abacaxi'.", "tag": ""}, {"id": "C17", "k": "c", "sec": "AVG, SUM, MIN e MAX", "f": "Posso aplicar expressão dentro da agregação?", "a": "Sim. A expressão é calculada linha a linha e depois agregada.", "why": "", "ex": "SELECT MIN(salary - 1000), MAX(salary + 500) FROM hr.employees;", "trap": "", "tag": ""}, {"id": "C18", "k": "c", "sec": "LISTAGG", "f": "Sintaxe e uso do LISTAGG?", "a": "LISTAGG(coluna, 'separador') WITHIN GROUP (ORDER BY expr). Junta os valores de cada grupo numa string, na ordem definida.", "why": "", "ex": "SELECT department_id \"DEPT\",\n       LISTAGG(last_name, '; ') WITHIN GROUP (ORDER BY salary) \"FUNCIONARIOS\"\nFROM hr.employees\nGROUP BY department_id\nORDER BY department_id;", "trap": "O ORDER BY de dentro (WITHIN GROUP) ordena os nomes na lista. O de fora ordena as linhas.", "tag": ""}, {"id": "C19", "k": "c", "sec": "LISTAGG", "f": "Qual o limite do LISTAGG?", "a": "O resultado é VARCHAR2: até 4000 bytes (ou 32767 com MAX_STRING_SIZE=EXTENDED). Passou: ORA-01489. Desde o 12.2 existe ON OVERFLOW TRUNCATE. Desde o 19c, LISTAGG(DISTINCT ...).", "why": "", "ex": "LISTAGG(last_name, ', ' ON OVERFLOW TRUNCATE '...' WITH COUNT)\n  WITHIN GROUP (ORDER BY last_name)", "trap": "Visão de DBA: relatório que funciona em homologação e quebra em produção com ORA-01489 quando o grupo cresce.", "tag": "complemento"}, {"id": "C20", "k": "c", "sec": "Aninhamento", "f": "Quantos níveis de agregação posso aninhar?", "a": "No máximo 2. O aninhamento exige GROUP BY: a função interna calcula por grupo e a externa agrega os resultados dos grupos.", "why": "", "ex": "SELECT AVG(MIN(salary)) FROM hr.employees GROUP BY department_id;   -- ok\nSELECT MAX(AVG(MIN(salary))) FROM hr.employees GROUP BY department_id;\n-- ORA-00935: group function is nested too deeply", "trap": "Com 2 níveis o resultado é UMA linha: não dá para pôr department_id no SELECT.", "tag": ""}, {"id": "C21", "k": "c", "sec": "Aninhamento", "f": "Aninhamento sem GROUP BY?", "a": "Erro. Sem GROUP BY não há grupos para a função interna, e o Oracle devolve ORA-00978.", "why": "", "ex": "SELECT AVG(MIN(salary)) FROM hr.employees;\n-- ORA-00978: nested group function without GROUP BY", "trap": "", "tag": "complemento"}, {"id": "C22", "k": "c", "sec": "HAVING", "f": "Para que serve o HAVING?", "a": "Filtrar GRUPOS, normalmente pelo resultado de uma função de agregação.", "why": "", "ex": "SELECT produto, SUM(quantidade) FROM vendas_frutas\nWHERE quantidade > 11\nGROUP BY produto\nHAVING SUM(quantidade) > 15;", "trap": "", "tag": ""}, {"id": "C23", "k": "c", "sec": "HAVING", "f": "WHERE x HAVING?", "a": "WHERE filtra LINHAS antes de agrupar e não aceita agregação. HAVING filtra GRUPOS depois de agrupar.", "why": "Ordem lógica: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY (Módulo 01).", "ex": "-- 1. WHERE quantidade > 11 tira a Maçã de 10\n-- 2. GROUP BY: Banana 32, Laranja 18, Maçã 15\n-- 3. HAVING SUM > 15: Banana 32, Laranja 18", "trap": "Filtro que não depende de agregação rende mais no WHERE: menos linhas para agrupar.", "tag": ""}, {"id": "C24", "k": "c", "sec": "HAVING", "f": "Ordem das cláusulas e alias no GROUP BY/HAVING?", "a": "WHERE vem antes do GROUP BY e do HAVING. Alias de coluna NÃO pode ser usado no GROUP BY nem no HAVING antes da 23ai.", "why": "", "ex": "SELECT produto, SUM(quantidade) FROM vendas_frutas GROUP BY produto WHERE quantidade > 11;\n-- erro: WHERE fora de lugar (ORA-00933)\n\nSELECT produto, SUM(quantidade) total FROM vendas_frutas\nGROUP BY produto HAVING total > 15;   -- erro antes da 23ai", "trap": "O primeiro comando está no script da aula de propósito.", "tag": ""}, {"id": "C25", "k": "c", "sec": "HAVING", "f": "Posso usar HAVING sem GROUP BY?", "a": "Sim. A tabela inteira vira um grupo; se a condição for falsa, o resultado é vazio.", "why": "", "ex": "SELECT COUNT(*) FROM livros HAVING COUNT(*) > 100;   -- 0 linhas", "trap": "", "tag": "complemento"}, {"id": "C26", "k": "c", "sec": "Prática da livraria", "f": "Q2: por que usar AVG(NVL(preco, 0)) para \"levar em conta os nulos\"?", "a": "Porque AVG ignora NULL. Com NVL, o livro sem preço entra como 0 na soma E na quantidade, puxando a média para baixo.", "why": "", "ex": "-- Ficcao: 6 preços somam 54,17; 2 são NULL\nAVG(preco)          -- 54,17 / 6 = 9,03\nAVG(NVL(preco, 0))  -- 54,17 / 8 = 6,77", "trap": "Harper Lee e Ray Bradbury: AVG(preco) = NULL; AVG(NVL(preco,0)) = 0.", "tag": ""}, {"id": "C27", "k": "c", "sec": "Prática da livraria", "f": "Q7: qual o risco do FETCH FIRST 1 ROWS ONLY para achar o autor com mais livros?", "a": "Se dois autores empatarem no topo, um some do resultado sem aviso. Com WITH TIES todos os empatados aparecem.", "why": "", "ex": "SELECT autor, COUNT(*) FROM livros\nGROUP BY autor\nORDER BY COUNT(*) DESC\nFETCH FIRST 1 ROWS WITH TIES;", "trap": "Com os dados atuais funciona (Rowling tem 3, ninguém empata). Basta cadastrar mais um livro de Orwell e Tolkien para quebrar.", "tag": "complemento: ajuste na prática resolvida"}, {"id": "S01", "k": "s", "f": "SELECT COUNT(*), COUNT(c1), COUNT(DISTINCT c1) FROM t2;", "res": "4 | 3 | 2", "d": "COUNT(*) conta linhas; COUNT(c1) ignora o NULL; DISTINCT fica com 1 e 3."}, {"id": "S02", "k": "s", "f": "SELECT COUNT(NVL(c1,0)), COUNT(DISTINCT NVL(c1,0)) FROM t2;", "res": "4 | 3", "d": "O NULL vira 0 e passa a ser contado (0, 1, 3)."}, {"id": "S03", "k": "s", "f": "SELECT SUM(c1), AVG(c1), MIN(c1), MAX(c1) FROM t2;", "res": "5 | 1,67 | 1 | 3", "d": "Todas ignoram o NULL: AVG = 5/3."}, {"id": "S04", "k": "s", "f": "SELECT AVG(c1), AVG(DISTINCT c1) FROM t1;", "res": "1,5 | 2", "d": "Todos: 6/4. Distintos: (1+3)/2."}, {"id": "S05", "k": "s", "f": "SELECT MIN(produto), MAX(produto) FROM vendas_frutas;", "res": "Banana | Maçã", "d": "Ordem alfabética: Banana < Laranja < Maçã."}, {"id": "S06", "k": "s", "f": "Script da aula: 6 INSERTs em vendas_frutas.\nSELECT COUNT(*) FROM vendas_frutas;", "res": "5", "d": "O 6º INSERT repete VendaID 4: ORA-00001. A linha Laranja 11 do slide não existe na tabela."}, {"id": "S07", "k": "s", "f": "SELECT produto, SUM(quantidade) FROM vendas_frutas\nWHERE quantidade > 11 GROUP BY produto;", "res": "Banana 32 · Laranja 18 · Maçã 15", "d": "WHERE tira a Maçã de 10 antes de agrupar."}, {"id": "S08", "k": "s", "f": "... WHERE quantidade > 11 GROUP BY produto\nHAVING SUM(quantidade) > 15;", "res": "Banana 32 · Laranja 18", "d": "HAVING tira o grupo Maçã (15)."}, {"id": "S09", "k": "s", "f": "SELECT produto, SUM(quantidade) FROM vendas_frutas\nGROUP BY produto WHERE quantidade > 11;", "res": "Erro de sintaxe (ORA-00933)", "d": "WHERE precisa vir antes do GROUP BY."}, {"id": "S10", "k": "s", "f": "SELECT produto FROM vendas_frutas\nWHERE SUM(quantidade) > 15 GROUP BY produto;", "res": "ORA-00934", "d": "Agregação não é permitida no WHERE."}, {"id": "S11", "k": "s", "f": "SELECT produto, loja, SUM(quantidade) FROM vendas_frutas\nGROUP BY produto;", "res": "ORA-00979", "d": "loja não está no GROUP BY nem agregada."}, {"id": "S12", "k": "s", "f": "SELECT department_id, AVG(salary) FROM hr.employees;", "res": "ORA-00937", "d": "Coluna comum + agregação exige GROUP BY."}, {"id": "S13", "k": "s", "f": "SELECT AVG(MIN(salary)) FROM hr.employees GROUP BY department_id;", "res": "1 linha", "d": "Média dos menores salários de cada departamento."}, {"id": "S14", "k": "s", "f": "SELECT MAX(AVG(MIN(salary))) FROM hr.employees\nGROUP BY department_id;", "res": "ORA-00935", "d": "3 níveis de aninhamento."}, {"id": "S15", "k": "s", "f": "SELECT AVG(MIN(salary)) FROM hr.employees;", "res": "ORA-00978", "d": "Aninhamento exige GROUP BY."}, {"id": "S16", "k": "s", "f": "Script da aula (tabela VENDAS):\nSELECT categoria, SUM(preco) FROM vendas GROUP BY categoria;", "res": "Maquiagem 114 · Cuidado com a pele 97 · Fragrância 90 · Cabelo 34 · Corpo 13", "d": "Os dados do slide (Fragrância 210, Corpo 113...) são outros: o script cria uma tabela diferente da mostrada."}, {"id": "S17", "k": "s", "f": "SELECT COUNT(*), SUM(preco) FROM livros WHERE 1 = 0;", "res": "0 | NULL", "d": "Conjunto vazio: COUNT dá 0, SUM dá NULL."}, {"id": "S18", "k": "s", "f": "Prática Q1: SELECT COUNT(*) FROM livros;", "res": "20", "d": ""}, {"id": "S19", "k": "s", "f": "Prática Q3: livros por gênero?", "res": "Ficcao 8 · Fantasia 6 · Classico 5 · Nao-ficcao 1", "d": ""}, {"id": "S20", "k": "s", "f": "Prática Q4: MAX e MIN do gênero Ficcao?", "res": "9,99 | 7,99", "d": "MAX e MIN já ignoram os 2 preços NULL."}, {"id": "S21", "k": "s", "f": "Prática Q5: autores com mais de 1 livro?", "res": "3: Rowling (3), Orwell (2), Tolkien (2)", "d": "HAVING COUNT(*) > 1."}, {"id": "S22", "k": "s", "f": "Prática Q6: gêneros com mais de 5 livros?", "res": "Ficcao (8) e Fantasia (6)", "d": "Classico tem 5: não é > 5."}, {"id": "S23", "k": "s", "f": "Prática Q7: autor com mais livros?", "res": "J.K. Rowling · 3", "d": ""}, {"id": "S24", "k": "s", "f": "Prática Q8: autores com média de preço > 10?", "res": "9 autores", "d": "Tolkien, Rowling, Cervantes, Melville, Dostoevsky, Hugo, Austen, Rothfuss, Musashi. Harper Lee e Bradbury têm média NULL e ficam fora."}, {"id": "S25", "k": "s", "f": "Prática Q9: SUM(preco) do gênero Ficcao?", "res": "54,17", "d": "Os 2 NULL são ignorados."}, {"id": "S26", "k": "s", "f": "Prática Q2: AVG(NVL(preco,0)) de Harper Lee? E AVG(preco)?", "res": "0 | NULL", "d": "Único livro dela não tem preço."}, {"id": "S27", "k": "s", "f": "Prática Q10: primeiro e último título da lista de Ficcao (ORDER BY preco)?", "res": "O Grande Gatsby ... os 2 sem preço no fim", "d": "ASC deixa NULL por último; entre os dois nulos a ordem não é garantida."}], "mm": {"ct": "GROUP BY", "cs": "agrupar · agregar · filtrar grupos", "branches": [{"t": "GROUP BY", "cards": "C01–C06", "col": "#002b5c", "leaves": ["Cada grupo vira 1 linha no resultado", "Coluna fora de agregação → no GROUP BY", "Senão ORA-00979", "Agregação + coluna sem GROUP BY → ORA-00937", "Pode agrupar por várias colunas", "Não garante ordem: use ORDER BY", "NULLs formam 1 grupo"]}, {"t": "Regras gerais da agregação", "cards": "C07–C12", "col": "#2f6db5", "leaves": ["N linhas → 1 resultado por grupo", "Sem GROUP BY: a tabela toda é 1 grupo", "DISTINCT = UNIQUE · ALL é o padrão", "Ignoram NULL (exceto COUNT(*))", "Vazio: COUNT 0 · SUM/AVG/MIN/MAX NULL", "Agregação no WHERE → ORA-00934"]}, {"t": "COUNT", "cards": "C13–C14", "col": "#7b4bb0", "leaves": ["COUNT(*) conta linhas, até as nulas", "COUNT(col) conta valores não nulos", "COUNT(DISTINCT col): não nulos e diferentes", "Contar nulos: NVL(col, 0)", "T2: 4 | 3 | 2"]}, {"t": "AVG, SUM, MIN, MAX", "cards": "C15–C17", "col": "#1f7a55", "leaves": ["AVG/SUM: número ou conversível", "AVG ignora NULL na soma e na divisão", "AVG(NVL(x,0)) muda a média", "MIN/MAX: número, texto e data", "Aceitam expressão: MIN(salary - 1000)"]}, {"t": "LISTAGG", "cards": "C18–C19", "col": "#b06d00", "leaves": ["LISTAGG(col, 'sep')", "WITHIN GROUP (ORDER BY ...) ordena a lista", "Limite VARCHAR2 → ORA-01489", "12.2: ON OVERFLOW TRUNCATE", "19c: LISTAGG(DISTINCT ...)"]}, {"t": "Aninhamento", "cards": "C20–C21", "col": "#5d6d7e", "leaves": ["Máximo 2 níveis: AVG(MIN(x))", "3 níveis → ORA-00935", "Exige GROUP BY (senão ORA-00978)", "Resultado: 1 linha só"]}, {"t": "HAVING", "cards": "C22–C25", "col": "#c0392b", "leaves": ["Filtra GRUPOS, depois de agrupar", "WHERE filtra LINHAS, antes de agrupar", "Ordem: WHERE → GROUP BY → HAVING", "Alias no GROUP BY/HAVING só na 23ai", "HAVING sem GROUP BY: tabela = 1 grupo"]}, {"t": "Prática livraria", "cards": "C26–C27", "col": "#00838f", "leaves": ["AVG(NVL(preco,0)) considera os nulos", "MAX/MIN já ignoram nulos", "HAVING COUNT(*) > 1 / > 5", "Top autor: WITH TIES evita perder empate", "LISTAGG por gênero ordenado por preço"]}]}}, {"id": "M06", "title": "Manipulando texto", "ref": "Referência para os cenários: tabelas dos scripts da aula e da prática ElecShop", "reftxt": "TEXTO (COLCHAR CHAR(2), COLVARCHAR2 VARCHAR2(5))\n 'A'  'TESTE'     -- CHAR guarda 'A ' (completa com espaço)\n 'AA' 'TESTE'\n 'AB' 'TEST'\n\nElecShop (prática):\n CLIENTES: 20 linhas · PrimeiroNome com espaços (' Lucas', ' Joao ', 'Carla ')\n           e-mails terminando em .con (gmail 7 · yahoo 7 · outlook 6)\n PRODUTOS: 20 linhas · preços de 100 a 5200\n FORNECEDORES: 15 linhas (Nome, Telefone)", "cards": [{"id": "V01", "k": "v", "f": "CHAR", "pt": "Caractere de tamanho fixo", "d": "Guarda sempre o tamanho definido, completando com espaços à direita. Máximo 2000 bytes por valor.", "ex": "colchar CHAR(2)   -- 'A' é gravado como 'A '", "rel": "VARCHAR2"}, {"id": "V02", "k": "v", "f": "VARCHAR2", "pt": "Caractere de tamanho variável", "d": "Guarda só o que foi informado, até o máximo definido. 4000 bytes (MAX_STRING_SIZE = STANDARD) ou 32767 (EXTENDED).", "ex": "colvarchar2 VARCHAR2(5)", "rel": "MAX_STRING_SIZE"}, {"id": "V03", "k": "v", "f": "Blank-padding", "pt": "Preenchimento com brancos", "d": "Espaços que o CHAR acrescenta à direita para completar o tamanho fixo.", "ex": "SELECT LENGTH(colchar) FROM texto;   -- 2, mesmo para 'A'", "rel": "CHAR"}, {"id": "V04", "k": "v", "f": "Concatenation operator", "pt": "Operador de concatenação", "d": "|| junta textos e valores de colunas numa string só.", "ex": "SELECT 'O produto ' || produto || ' custa R$' || preco FROM vendas;", "rel": "CONCAT"}, {"id": "V05", "k": "v", "f": "Text literal", "pt": "Literal de texto", "d": "Texto fixo escrito no comando, entre aspas simples.", "ex": "'DBAOCM Education'", "rel": "Aspas"}, {"id": "V06", "k": "v", "f": "Alternative quoting mechanism", "pt": "Mecanismo de citação alternativo", "d": "q'<delim> texto <delim>': permite escrever aspas simples dentro do texto sem duplicá-las.", "ex": "SELECT q'[It's finished]' FROM dual;", "rel": "q-quote"}, {"id": "V07", "k": "v", "f": "Delimiter", "pt": "Delimitador", "d": "Caractere que abre e fecha o texto no q-quote. Qualquer um, menos espaço, tab ou enter. [ { < ( fecham com ] } > ).", "ex": "q'!...!'  q'<...>'  q'{...}'", "rel": "Alternative quoting"}, {"id": "V08", "k": "v", "f": "Padding (LPAD / RPAD)", "pt": "Preenchimento", "d": "Completar uma string até um tamanho, à esquerda (LPAD) ou à direita (RPAD).", "ex": "SELECT LPAD('7', 3, '0') FROM dual;   -- 007", "rel": "Truncar"}, {"id": "V09", "k": "v", "f": "Trim set", "pt": "Conjunto de corte", "d": "Lista de caracteres que LTRIM/RTRIM removem, em qualquer ordem e quantidade.", "ex": "SELECT RTRIM('abc==><', '><=') FROM dual;   -- abc", "rel": "TRIM"}, {"id": "V10", "k": "v", "f": "Occurrence / Position", "pt": "Ocorrência / Posição", "d": "No INSTR: de onde começar a busca (negativo = de trás para frente) e qual aparição procurar.", "ex": "INSTR('CORPORATE FLOOR', 'OR', 3, 2)   -- 14", "rel": "INSTR"}, {"id": "V11", "k": "v", "f": "Byte / Char semantics", "pt": "Semântica de byte / caractere", "d": "VARCHAR2(5) por padrão são 5 BYTES. Em AL32UTF8, acento ocupa 2 bytes. VARCHAR2(5 CHAR) são 5 caracteres.", "ex": "nome VARCHAR2(50 CHAR)", "rel": "NLS_LENGTH_SEMANTICS"}, {"id": "C01", "k": "c", "sec": "Tipos de dado texto: CHAR e VARCHAR2", "f": "Qual a diferença entre CHAR e VARCHAR2?", "a": "<b>CHAR(n):<\/b> tamanho fixo. Valor menor é completado com espaços à direita. Máximo 2000 bytes.<br><b>VARCHAR2(n):<\/b> tamanho variável, guarda só o que foi informado. Máximo 4000 bytes com MAX_STRING_SIZE = STANDARD, ou 32767 com EXTENDED.", "why": "", "ex": "CREATE TABLE texto (colchar CHAR(2), colvarchar2 VARCHAR2(5));\nINSERT INTO texto VALUES ('A', 'TEST');\nSELECT LENGTH(colchar), LENGTH(colvarchar2) FROM texto;   -- 2 | 4", "trap": "O slide fala em \"2000 bytes por linha\". O limite é por VALOR da coluna, não por linha.", "tag": "correção do material: limite por valor, não por linha"}, {"id": "C02", "k": "c", "sec": "Tipos de dado texto: CHAR e VARCHAR2", "f": "O que acontece ao inserir texto maior que a coluna?", "a": "Erro ORA-12899: value too large for column. O Oracle não corta o texto sozinho.", "why": "", "ex": "INSERT INTO texto VALUES ('ABC', 'X');      -- ORA-12899 (CHAR(2))\nINSERT INTO texto VALUES ('A', 'TESTES');   -- ORA-12899 (VARCHAR2(5))", "trap": "", "tag": "complemento"}, {"id": "C03", "k": "c", "sec": "Tipos de dado texto: CHAR e VARCHAR2", "f": "VARCHAR2(5) cabe 5 caracteres?", "a": "Depende. Por padrão (NLS_LENGTH_SEMANTICS = BYTE) são 5 BYTES. Em banco AL32UTF8, letra acentuada ocupa 2 bytes. Para garantir caracteres, declare VARCHAR2(5 CHAR).", "why": "", "ex": "-- AL32UTF8, VARCHAR2(5):\nINSERT ... 'AÇÃO'   -- 4 caracteres, 6 bytes → ORA-12899\n-- VARCHAR2(5 CHAR): cabe", "trap": "Visão de DBA: migração de base WE8ISO8859P1 para AL32UTF8 quebra cargas por isso.", "tag": "complemento: visão de DBA"}, {"id": "C04", "k": "c", "sec": "Tipos de dado texto: CHAR e VARCHAR2", "f": "Comparação de CHAR com espaços?", "a": "CHAR com literal usa comparação com preenchimento: 'A ' e 'A' são considerados iguais. Entre VARCHAR2 os espaços contam.", "why": "", "ex": "SELECT * FROM texto WHERE colchar = 'A';   -- acha a linha gravada como 'A '", "trap": "Comparar CHAR com variável VARCHAR2 em PL/SQL pode não achar a linha. Por isso CHAR é pouco usado.", "tag": "complemento"}, {"id": "C05", "k": "c", "sec": "Concatenação", "f": "Como concatenar textos e colunas?", "a": "Com o operador ||, juntando literais (entre aspas simples) e colunas, em quantos pedaços quiser.", "why": "", "ex": "SELECT modelo || ' e um modelo da marca ' || marca FROM carros;", "trap": "", "tag": ""}, {"id": "C06", "k": "c", "sec": "Concatenação", "f": "Concatenar número ou NULL?", "a": "Número é convertido implicitamente para texto. NULL é tratado como texto vazio.", "why": "", "ex": "SELECT 'custa R$' || 10.5 FROM dual;    -- custa R$10.5\nSELECT 'A' || NULL || 'B' FROM dual;    -- AB", "trap": "Para formatar o número (casas, separador) use TO_CHAR: TO_CHAR(preco, 'FM999G990D00').", "tag": "complemento: TO_CHAR"}, {"id": "C07", "k": "c", "sec": "Concatenação", "f": "CONCAT x ||?", "a": "CONCAT aceita exatamente 2 argumentos. Para mais, é preciso aninhar. O || aceita quantos pedaços quiser.", "why": "", "ex": "SELECT CONCAT(CONCAT(modelo, ' e um modelo da marca '), marca) FROM carros;\nSELECT CONCAT(modelo, ' - ', marca) FROM carros;   -- ORA-00909", "trap": "", "tag": ""}, {"id": "C08", "k": "c", "sec": "Literais e mecanismo de citação alternativo", "f": "Como escrever aspas simples dentro de um texto?", "a": "Duas formas: duplicar a aspa ('It''s') ou usar o mecanismo alternativo q'[It's]'.", "why": "", "ex":
